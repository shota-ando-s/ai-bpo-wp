# data/subsidies/nagano.yml は data/area/nagano/subsidy_a.yml（県・県域の機関と19市、37制度）と subsidy_b.yml（23町、11制度）・subsidy_c.yml（35村、15制度）を結合した63制度（すべて confidence: official）。2026-10-30確認
# 【下書き】D4（補助金）の案の直しを入れてある（各制度の「# 案」のコメントと note）。親が決めたら「# 案」の行を消す
# 県域で今申請できて AI に使えるのは、県の賃上げ環境整備支援事業の補助金（事業場内最低賃金を50円以上引き上げることが条件）。人材育成追加型（10/10・22万〜30万円）は申請マニュアルの研修例に「生成AI活用」がある。基本型（3/4〜10/10）は設備・システム・委託費も対象だが AI の語はない。申請期限は2027-01-20（業務改善助成金上乗せ補助は県への提出2027-02-26、国への申請は10/1で締切済み）
# 県域で AI を名指しした補助は、宿泊事業者のDX支援事業補助金（宿泊事業者、2/3・1施設300万円、4/20〜8/31で終了）と Shinshu AI GEARS（申請者は AI 開発者、10/10・800万円、5組採択で終了）だけで、どちらも今は申請できない。公益財団法人長野県産業振興機構（NICE）には中小企業の IT・AI 導入の補助金はない
# 市町村で AI を名指しした制度は、諏訪市 AI・IoT導入支援事業補助金（製造業・ソフトウェア業だけ、1/2・50万円、導入後に2027-03-10までに申請）と塩尻市 中小企業デジタル化促進事業補助金（IoT/AI/RPA、2026年度は予算到達で終了）だけ。町村には AI を名指しした制度はない（原村 中小企業活性化緊急支援補助金の「DX推進活動」が最も近い）
# 国の補助金への上乗せ（addon）は県・77市町村とも計算できる形では該当なし。県の業務改善助成金上乗せ補助は国の業務改善助成金（national.yml にない）への上乗せで、計算方法も README の kind で表せないため addon を書いていない。佐久穂町の持続化補助金の町の上乗せ・宮田村商工会の応援枠は率・対象の補助金が分からず入れていない
# 国の制度（national.yml）への addon・addon_to はない。デジタル化・AI導入補助金は fuenn_available_from: 2027-04 で「来年度」扱い
# 市町村の制度が1件もない39市町村（小諸市・大町市・佐久市と13町・23村）は areas.yml で none: true にした
# 入れていないもの: 立地・融資・利子補給・固定資産税相当額・創業・空き店舗・店舗改修・展示会出展だけの制度、研究開発・新製品開発の補助、AI 向けでない設備投資（県のエネルギーコスト削減助成金など）、前年度の制度（松本市 社会変革対応促進）、長野地域振興局の DX専門家派遣（無料の派遣で補助金ではない。令和8年度の申込みは締切済み）、中東情勢物価高騰対応の県の支援金（中身が未公表）。確認したページは subsidy_a_areas.md・subsidy_b_areas.md・subsidy_c_areas.md
# 結合で直した点（案）: 県の賃上げ基本型の training を △（研修費の上限50万円を max_yen で表せない）、駒ヶ根市 設備投資等支援・千曲市 デジタル・人材育成の max_yen を加算前の額に、茅野市 人材育成の training を △（1人1万円まで）、伊那市 人材育成の period の start を外した（2026年中の受講が対象で「来年度」に出るため）、原村 緊急支援の efficiency を △（定額のため「定額の助成で、費用の補助ではありません」と誤った理由が出る）、山形村チャレンジ・木祖村 源気くん型の推測の next_expected を外した
# 期間の status は data/subsidies/README.md の値（open / closed / rolling / unknown）を使う。随時受付は rolling
#
# 以下は data/area/nagano/subsidy_a.yml（県・県域の機関と19市）の冒頭のコメント
# 長野県（県・公益財団法人長野県産業振興機構〔NICE〕・長野県プロフェッショナル人材戦略拠点）と19市（2026年度）。2026-10-30に公式ページ・要綱・要領・マニュアルで確認
# 県域で今も申請できるのは、県の「賃上げ環境整備支援事業」の補助金（事業場内最低賃金を50円以上上げることが条件。基本型〔3/4〜10/10、補助対象経費の上限53.3万〜960万円〕・経過措置分・人材育成追加型〔10/10、22万〜30万円。申請マニュアルの研修例に「生成AI活用」〕は申請期限2027-01-20、業務改善助成金上乗せ補助は県への申請期限2027-02-26）と、副業・兼業人材活用促進事業補助金（プロ拠点経由のプロ人材、8/10・50万円〔2回目以降は2/3・42万円〕、2026-12-28まで）
# 県域でAIを名指しした補助は、宿泊事業者のDX支援事業補助金（AI・RPA・BI・ERP・CRM等、2/3・1施設300万円、4/20〜8/31で終了）と信州型サンドボックス事業「Shinshu AI GEARS」（申請者はAI開発者、10/10・800万円、5組採択で終了）。業務共同化モデル実証補助金（連携体、1/2・500万円、7/17締切）も終了。長野県産業振興機構（NICE）には中小企業のIT・AI導入の補助金はない（専門家派遣は有料で事業者負担1/2〜1/4）
# 市でAIを名指しした補助は、諏訪市 AI・IoT導入支援事業補助金（製造業・ソフトウェア業、1/2・50万円、2027-03-10まで）と塩尻市 中小企業デジタル化促進事業補助金（IoT/AI/RPA、1/2・30万円、2026年度は予算到達で終了）。デジタル化・DXの補助は、岡谷市（製造業、デジタル技術活用等1/2・30万円、クラウド利用料・IT研修も対象）・駒ヶ根市（生産性向上コース〔DX〕1/2・100万円）・安曇野市（2/10・50万円、クラウドは年度分）・千曲市（1/4・50万円、クラウド型ITツール）・飯山市（1/2・10万円、クラウド使用料も対象）・諏訪市（ウェルビーイング経営推進のデジタル化導入、1/2・20万円）・茅野市（小規模の生産性向上設備、2/3・10万円）・上田市（省力化・効率化、ICT業務システム、予算到達で終了）・長野市（DXモデル、5/29で終了）
# 市の研修補助: 長野市・松本市・上田市・諏訪市（e-ラーニング1/2・20万円）・須坂市・伊那市・駒ヶ根市・中野市・茅野市（DX研修は2/3）・千曲市・安曇野市。外部人材（副業・兼業）の補助: 長野市・松本市・飯田市
# 市独自のAI・IT導入・研修向けの補助が見つからない市: 小諸市、大町市、佐久市、東御市（近代化モデル事業所育成事業補助金〔コンサル委託4/10・30万円〕だけ）。確認したページは subsidy_a_areas.md
# 国の補助金への上乗せ（addon）: 県の中小企業賃上げ・生産性向上サポート補助金は国の業務改善助成金への上乗せだが、業務改善助成金は national.yml にないので addon・addon_to は書いていない（note 参照）。市の上乗せは見つからない
# 期間の status は data/subsidies/README.md の値（open / closed / rolling / unknown）を使う。随時受付は rolling。今年度の受付期間・予算がページで確かめられないものは unknown

