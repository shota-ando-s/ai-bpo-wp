  org: 白馬村（観光課 観光商工係）
  area: nagano/hakuba
  max_yen: null
  rate: 定額（要領では補助対象経費の10/10以内）。1施設1回
  targets: {efficiency: △, consulting: ×, training: ×}
  expenses: 宿泊税の導入に伴う既存の予約管理・精算システム（レジシステム・ホテル管理システム〔PMS〕など）の改修。課税免除の判別、宿泊者ごとの税額の算定、申告帳票の作成・出力、帳簿の電磁的保存、領収書への税額表示などの機能追加。新規導入は対象外
  conditions: 村内の宿泊施設（簡易宿所・住宅宿泊事業を含む）の経営者で、宿泊税の特別徴収義務者の登録申請を行う予定の者。原則ながの電子申請またはメールで申請
  period: {status: unknown}
  url: https://www.vill.hakuba.lg.jp/gyosei/keikan_kankyo_kanko/kanko/13084.html
  checked: 2026-10-30
  confidence: official
  note: 村のページ（更新日2026-03-25）に「令和8年度も『白馬村宿泊税対応システム改修事業補助金』を実施します」とあるが、申請期間は「令和7年8月1日 金曜日から 令和8年4月1（水曜日）から」と書かれていて、令和8年度の終わりの日が読み取れない。ページの概要 PDF・申請要領 PDF（10ページ、作成2025-10-15）は令和7年度のもの（申請 2025-08-01〜2026-02-06、要領の別表では2026-02-20まで、事業は2026-03-20まで）。新しいシステムの導入やAIは対象外。問い合わせは観光課観光商工係 0261-85-0722
  fuenn_note: 白馬村の宿泊施設は、宿泊税に対応するための予約管理・精算システムの改修費を村が補助する制度があります。令和8年度の受付期間は観光課に確認してください。

