# 県の補助金で「AI」を名前に掲げたものはない。今申請できる県のデジタル化の補助は「中小企業等生産性向上推進事業補助金」だけ（専門家派遣・生産性向上支援センターの支援を受けた事業者は2026-11-27まで）。いきいき支援事業（6/30終了）・DX推進補助金・中小企業DX伴走支援事業（R7で終了）は今年度は使えない
# 福島イノベーション・コースト構想関連の地域復興実用化開発等促進事業費補助金・自立・帰還支援雇用創出企業立地補助金は、研究開発・企業立地向けで中小企業のAI導入には使えず、令和8年度の公募も終了
# 市でAIを名指ししているのは喜多方市 ものづくり企業DX推進事業（受付中、製造業のみ）、いわき市 産業DX推進事業・会津若松市 先端サービス実装化支援事業（どちらも6/30終了）
# 国の補助金への上乗せ（addon）は、いわき市 省力化投資補助金（shoryokuka-ippan の自己負担の1/2・上限50万円）の1件だけ。県の業務改善応援補助金（国の業務改善助成金への上乗せ）・天栄村の持続化補助金への上乗せは、国の制度が national.yml にないので note に書いた。郡山市の省力化投資補助金への上乗せは令和7年度の制度で、今年度の実施を確認できず入れていない
# 県の「12市町村起業支援金」（3/4・最大400万円、令和8年度の追加募集は10月23日で終了）は入れていない（docs/area-todo.md）

