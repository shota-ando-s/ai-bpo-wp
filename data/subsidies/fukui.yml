# 福井県（県・公益財団法人ふくい産業支援センター〔FISC〕・県の委託事務局）と福井市・敦賀市・小浜市・大野市・勝山市・鯖江市・あわら市・越前市・坂井市（2026年度）。2026-10-27に公式ページ・募集要領・交付要領で確認
# 県のIT・AIツール導入の補助は2本。ふくいDX加速化補助金（IoT・AI・RPA・クラウド等。1/2〔小規模2/3〕・上限400万円・下限30万円、サブスク・クラウド使用料も対象〔従量課金は対象外〕。令和8年度は4/10〜6/30〔要領の6/10から延長〕で終了、2次募集なし）と、ふくいデジタル導入チャレンジ補助金（県のカタログ掲載の21ツールだけが対象、従業員100名以下、1/2・上限50万円、クラウド使用料も対象。第5次受付が「10月末締切」で、2026-10-27時点で受付中）。どちらも主たる業種が情報通信業の事業者は対象外
# 県のその他: 企業活動分析による収益力強化事業補助金（システム構築費・研修費も対象、2/3〜4/5・100〜500万円）と中小企業設備投資補助金（ソフトウェア・情報システムも対象、2/3・1,000万円〔製造業1,500万円〕・下限500万円）はどちらも第9回・第3回の申請期間が7/15〜8/28で終了（商工会議所・商工会が窓口、重点支援地方交付金）。受付中は、国の業務改善助成金への県の上乗せ（ふくい業務改善・賃上げ応援事業(A)、支給決定額の1/5、2027-02-26まで）と「人への投資」支援事業補助金（10時間未満の短期の教育訓練、1/2〔賃上げ等要件で2/3〕・上限10万円〔15万円〕＋賃金1,000円/時間、2027-02-26まで）
# 市でDX・デジタル化を名指しした補助は、福井市 企業価値向上推進補助金（デジタル技術を用いた取組、1/2・50万円/年。FISCのDX専門家派遣などの支援を受けてDX推進計画を作っていることが条件、2027-02-26まで）、越前市 小規模事業者未来開拓サポート補助金の生産性向上枠（DX・脱炭素・デザイン経営などで生産性向上、小規模事業者のみ、1/2・30万円、第7回 10/1〜10/30 受付中）、敦賀チャレンジ企業応援補助金（ITツール・システム構築も対象、1/2・100万円、8/17〜10/16で終了）。AIを名指しした市の制度はない
# 市の研修補助: 鯖江市 人材育成支援補助金（国・県・FISC等の公的セミナーの受講料、1/2・10万円、2027-02-26まで）、大野市 中小企業者等人材育成事業補助（デジタル資格・研修は2/3、1人3.5万円・3人まで、「働く人にやさしい企業」認定が条件）、坂井市 中小企業人材育成支援事業補助金（FISC等の公的機関の講座・委託研修、1/2・年10万円）、勝山市 中小企業人材育成助成金（FISC等の講座、1/2・1申請5万円・年10万円。ページ更新日2018-09-19で年度の記載なし）
# 鯖江市 生産性向上設備等導入支援補助金（先端設備等導入計画の認定が条件、2/3・100万円、ソフトウェアは1台70万円以上で対象、顧客管理システムも例示、2026-12-28まで予定）
# 市独自のAI・IT導入向けの補助がない市: 小浜市、あわら市。敦賀市のデジタルマーケティング展開支援事業（ECサイトの初回登録料・月額固定利用料10/10・30万円、随時）はEC出店向けで AI 導入向けではないため yml に入れず md に書いた。確認したページは subsidy_a_areas.md
