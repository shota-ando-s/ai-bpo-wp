#   - 永平寺町 チャレンジ企業支援事業補助金（新商品・新製品の開発。対象経費に「機械設備等（パソコン等の事務機器を含む。）の購入及びリース料」「職員研修費」。対象経費60万円以上、1/2・上限50万〜100万円）。例規集の要綱だけで、町の募集ページは見つからず、受付状況は分からない（unknown）
