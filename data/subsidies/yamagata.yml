# 山形県（県・公益財団法人やまがた産業支援機構・公益財団法人庄内地域産業振興センター）と県内市町村（2026年度）。2026-10-24に公式ページ・公募要領・要綱で確認。元データは data/area/yamagata/subsidy_a.yml / subsidy_b.yml
# confidence: secondary の制度は入れていない。大石田町のおおいしだ未来づくり支援事業補助金は、地区・団体の公益的な活動向け（個人・企業の業務のデジタル化には使えない）なので入れていない
# 県の補助金で「AI」を名前に掲げたものはない。県のデジタル化向けの中小企業まるっとサポート補助金（小規模事業者枠・通常枠）は第2次（2026-09-04）で今年度の受付を終えた。XR実証補助金・100億宣言企業応援補助金も締め切られた
# 市でAIを名指ししているのは酒田市 DX化推進補助金と寒河江市 販売促進事業費補助金のAI活用事業（どちらも受付中）。山形市の企業DX推進事業費補助金でAIの語が出るのは「OCR（AI OCRを含む）」だけ
# 国の補助金への上乗せ（addon）は書いていない。村山市の企業DX推進補助金は他の公的補助金を差し引いた額に1/2の形だが今年度の受付状況が分からない（status: unknown）。大蔵村の持続化補助金は国の小規模事業者持続化補助金への上乗せを含むが、持続化補助金が national.yml にない
# 22町村は、AIを名指しする独自の補助金も、国のデジタル化・AI導入補助金・省力化投資補助金への上乗せもない（舟形町は町のページが開けず確認しきれていない）

