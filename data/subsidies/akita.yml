  fuenn_note: 秋田県内の非製造業の中小企業が、会計・顧客管理・RPAなどのクラウドサービスやソフトウェアを導入する費用を2/3（30万〜100万円）補助する県の制度です。4次募集は2026年10月23日で締め切りました。製造業や医療・介護などは対象外です。

