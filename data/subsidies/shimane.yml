- id: shimane-digital-model
  name: 令和8年度 デジタル導入モデル支援助成金
  org: 公益財団法人しまね産業振興財団 ITイノベーションセンター（ITOC。島根県 しまねDX推進事業）
  area: shimane
  max_yen: 4000000
  rate: ハード事業1/3、ソフト事業1/2（千円未満切捨て）。助成額の上限400万円・下限40万円
  rate_num: 0.333
  min_cost_yen: 1200000  # 案: 助成額の下限40万円をハード事業の1/3で割った対象経費の下限
  targets: {efficiency: ○, consulting: △, training: △}
  expenses: ハード事業（1/3）はシステム構築費（システム等の開発の委託費・購入費・導入支援費）、機器等整備費、システム運用関連費（クラウドサービス利用費・導入支援費・修繕費・専門家委託費）、専門家委託費（システム要件など開発・導入の助言・指導）。ソフト事業（1/2）はデジタル導入後活用経費（謝金・旅費・委託費・会場使用料・教材費・研修参加費・印刷製本費など、導入したシステムの利用者向け研修会・講習会）。ソフト事業だけの申請は不可。県内で設置・運用するシステム・設備に限る。汎用品は原則対象外（申請する場合は別紙4が必要）
  conditions: 県内に主たる事業所を有する中小企業者（農業・林業・漁業を除く。みなし大企業も申請可）で、事業成果の公開と県下への波及の広報活動に協力できること。デジタル技術を活用して新たなサービス開発や生産性向上を図る取組で、デジタル化のモデル事例として県内中小企業のデジタル導入の促進に寄与すると判断される事業。交付決定後、事業完了までに IPA の SECURITY ACTION の宣言事業者として登録。審査委員会でのプレゼンテーションあり。申請書提出前に必ず財団へ相談
  period: {status: open, start: 2026-04-17, end: 2027-01-29}
  url: https://www.s-itoc.jp/news/digital-model-subsidy
  checked: 2026-10-31
  confidence: official
  note: 財団のページ（2026-09-25）と県のチラシ https://www.pref.shimane.lg.jp/industry/syoko/sangyo/digitalinnovation/index.data/r8digital_model.pdf で公募期間2026-04-17〜2027-01-29、締切は第1回5/29・第2回7/31・第3回9/25・第4回11/27・第5回2027-01-29。「予算の状況により早期に公募を終了する場合がある」。ページに終了・予算到達の告知はない（2026-10-31時点）。事業期間は1年以内（第1回締切分は2027年6月頃まで）。AI・生成AI の語はページ・チラシにない（県の「ものづくり産業総合支援事業」のページでは、デジタル技術導入促進事業の説明に「IoT、AI技術等のデジタル技術を導入し」とある https://www.pref.shimane.lg.jp/industry/syoko/sangyo/kyousou_project/monodukuri_henkaku_pj/sogoshien_manufacturing_Industry/ ）。県のページでは「デジタル導入モデル支援補助金」と書く箇所もある（財団・チラシは「助成金」）。max_yen は助成額の上限。rate_num はハード事業の1/3。問い合わせは ITOC 0852-61-2225、itoc@s-itoc.jp（松江市北陵町1番地 テクノアークしまね2F）
  fuenn_note: 島根県内の中小企業が、モデル事例となるデジタル技術の導入（システム構築・クラウド利用・専門家の助言など）を行う費用を1/3（導入後の研修は1/2）、最大400万円助成する、しまね産業振興財団の制度です。次の締切は2026年11月27日と2027年1月29日で、プレゼンテーション審査があります。

