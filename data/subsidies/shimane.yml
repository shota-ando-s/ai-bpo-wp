# data/subsidies/shimane.yml は data/area/shimane/subsidy_a.yml（県・県域の機関と8市、18制度）と subsidy_b.yml（10町1村、2制度）を結合した20制度（すべて confidence: official）。2026-10-31確認
# 【下書き】D34（行政＋補助金）の案の直しを入れてある（各制度の「# 案」のコメント）。親が決めたら「# 案」の行を消す
# 県域で今申請できて AI に使えるのは、公益財団法人しまね産業振興財団 ITイノベーションセンター（ITOC）の「デジタル導入モデル支援助成金」（ハード1/3・ソフト1/2、上限400万円・下限40万円、第4回締切2026-11-27・第5回2027-01-29、プレゼン審査、モデル事例となる取組が対象。AI の語は財団のページ・チラシにない）。県の「中小企業デジタル導入加速化補助金」（中央会が事務局、1/3〜1/2・150万円）は第4回締切2026-10-16で今年度の受付を終えた（D34 が 2026-10-31 に中央会のページ・ITOC のページを開き直して両方を確かめた）
# 県域で AI を名指しした補助金はない（見つからなかった）。市で AI を名指ししたのは安来市 中小企業者等デジタル化支援事業費補助金（1/2・100万円）だけで、2026-10-30で受付終了。町村には AI を名指しした制度はない
# 国の補助金への上乗せ（addon）は県・19市町村とも該当なし。出雲市・安来市・雲南市のデジタル化補助は国の物価高騰対応重点支援地方創生臨時交付金を財源とする市の単独制度。松江市・大田市には県の補助金（生産プロセス変革・エネルギーコスト削減）への市の上乗せがあるが、国の制度（national.yml）への addon ではなく、AI・IT 導入向けでもないので入れていない
# 市町村の制度が1件もない10市町村（大田市・川本町・美郷町・邑南町・津和野町・吉賀町・海士町・西ノ島町・知夫村・隠岐の島町）は areas.yml で none: true にする案（D34.md の末尾）
# 大田市: subsidy_a は市のサイト（www.city.ohda.lg.jp）に接続できず未確認としたが、D34 が 2026-10-31 に https://www.city.oda.lg.jp/ を curl で開き、「事業者の方へ」の4つの一覧（地場産業支援等・特産品・販路拡大支援・起業、経営支援等支援・研修、その他案内〔情報なし〕）と産業企画課の「中小企業等支援」を見た。AI・IT 導入・研修向けの市独自の補助金はなかった。中小企業等活性化総合支援事業（新商品開発2/3・50万円〔研修費を含む。第1・2回とも募集終了〕、販路開拓・販売促進2/3・30万円〔通販サイト立ち上げ委託費を含む、随時〕、産業財産権1/2・5万円、外国人市内消費拡大1/2・5万円）は新商品開発・販路開拓の制度で、長野と同じく入れていない。産業支援人材バンク（アドバイザー派遣、相談無料）は補助金ではないので入れていない
# 入れていないもの: 専門家派遣（しまねデジタル推進事業 専門家派遣〔ITOC、無料、支援領域に「AI・データ利活用」、2026-12-31まで〕、デジタル導入支援者による伴走支援〔中央会、無料〕、松江市 IT活用アドバイザー派遣〔無料、製造業〕、ものづくりアドバイザー派遣、大田市 産業支援人材バンク）、講座（Pythonプログラミング・AI構築入門講座 2026-12-15 ほか）、立地・融資・利子補給・創業・空き店舗・店舗改修・展示会・研究開発・新商品開発だけの制度、AI 向けでない設備投資（エネルギーコスト削減）、隠岐の4町村の雇用機会拡充事業補助金（雇用増を伴う創業・事業拡大）、津和野町の個別商業包括的支援事業補助金・IT系企業誘致促進補助金（要綱が開けず中身が確かめられない）、災害・原子力関係の支援。確認したページは data/area/shimane/subsidy_a_areas.md・subsidy_b_areas.md
# 結合で直した点（案）: ITOC デジタル導入モデル支援助成金に min_cost_yen 120万円（助成額の下限40万円÷1/3）、副業・兼業人材活用促進と専門人材確保推進（DX人材）に exclusive_with（併用不可とページにある）、浜田市の労働生産性向上と人材育成に exclusive_with（7事業から1年度1事業）、出雲市の電子化と省力化に exclusive_with（いずれかを選択）
# 期間の status は data/subsidies/README.md の値（open / closed / rolling / unknown）を使う。随時受付は rolling
