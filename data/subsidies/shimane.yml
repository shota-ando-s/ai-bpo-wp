# 以下は data/area/shimane/subsidy_a.yml（県・県域の機関と8市）の冒頭のコメント
# 島根県（県・公益財団法人しまね産業振興財団〔ITイノベーションセンター＝ITOC を含む〕・島根県中小企業団体中央会・島根県プロフェッショナル人材戦略拠点）と8市（2026年度）。2026-10-31に公式ページ・要綱・公募要領・FAQ・チラシで確認
# 県域で今申請できて AI に使えるのは、しまね産業振興財団 ITOC の「令和8年度 デジタル導入モデル支援助成金」（ハード1/3・ソフト1/2、上限400万円・下限40万円、第4回締切2026-11-27・第5回2027-01-29、プレゼン審査あり、モデル事例となる取組が対象）と、県の「在職者リスキリング支援事業」（Udemy Business のライセンスを受講者負担1/2〔8,800円〕で提供、随時受付・後期は2027-03-31まで）、財団の「ウェブを活用した販路拡大支援助成金」（機械金属・樹脂・電気電子部品の製造業、営業支援ツールの導入・利用料を含む、1/2・100万円、随時）、プロ人材拠点の副業・兼業人材の補助（8/10・50万円、DX人材の交通費等は2/3・40万円）
# 県の中小企業デジタル導入加速化補助金（中央会が事務局、ハード1/3・ソフト1/2、上限150万円、クラウド利用料も対象）は第4回締切（2026-10-16）で今年度の受付を終えた。ものづくり産業生産プロセス変革等支援事業補助金（製造業、省人化・自動化、1/2〜2/3・2,000万円）も2026-09-30で終了
# 県域で AI を名指しした補助金は見つからなかった。AI の語があるのは、しまねデジタル推進事業 専門家派遣（無料、支援領域に「AI・データ利活用」、募集は2026-12-31まで）と、財団・産業技術センターの講座（Pythonプログラミング・AI構築入門講座 2026-12-15、無料）で、どちらも補助金ではないので yml に入れていない（subsidy_a_areas.md に記載）
# 市で AI を名指ししているのは、安来市 中小企業者等デジタル化支援事業費補助金（取組事例に「AI【人工知能】」「AI 画像認識カメラ」、1/2・100万円）だけで、2026-10-30で受付終了。デジタル化の補助は松江市（製造業、製造現場デジタル化1/2・80万円、省力化実践1/2・20万円、IT活用アドバイザーの助言に基づけば2/3、クラウド利用料も対象、2027-03-31まで随時）が受付中。出雲市（電子化1/2・50万円、省力化1/2・100万円）は10/30、雲南市（物価高騰対策の設備投資枠、2/3・40万円）は10/16で終了
# 市の研修補助: 松江市 人材育成支援事業補助金（製造業・情報通信業、2/3・30万円、随時）、浜田市 活力あるもの・ひとづくり支援事業補助金の人材育成事業（10万円、第2次募集2026-11-13まで）、益田市 IT資格取得支援補助金（市内在住の個人のITパスポート受験料、7,500円まで）
# 市独自のAI・IT導入・研修向けの補助が見つからない市: 大田市（市のサイトが接続できず、公式で確認できなかった）。江津市は中小企業等競争力強化支援事業（1/2・50万円、インボイス対応のシステム改修などが対象。ページは2022-04-01のまま）だけ
# 国の補助金への上乗せ（addon）: 該当なし。出雲市・安来市・雲南市のデジタル化補助は国の物価高騰対応重点支援地方創生臨時交付金を財源とする市の単独制度で、国の補助金への上乗せではない。県の業務改善助成金の上乗せは見つからなかった
# 期間の status は data/subsidies/README.md の値（open / closed / rolling / unknown）を使う。随時受付は rolling。今年度の受付期間・予算がページで確かめられないものは unknown
#
