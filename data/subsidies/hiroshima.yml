# 市でAIを名指ししているのは、呉市 中小企業等賃上げ応援奨励金（賃上げ＋市のAIシンポジウム・セミナーへの参加が要件。1人5万円・最大50万円、AI導入等の研修〔概ね10時間以上〕の受講などで同額を上乗せ・最大100万円、受付2026-09-11〜12-28）、尾道市 中小企業等臨時特別支援事業（生産性向上枠の例に「生成AIによる自動受注システムの導入費」、1/2・250万円。2026-07-29に予算到達で締切）、福山市 グリーンな企業賃上げ環境整備支援事業補助金（例に「AI在庫管理システム」、2/3・80万円。2026-10-23に予算到達で締切）。福山市「ものづくり大学」（受講料の半額）の対象講座に生成AI・組込みAIの講座がある
# 市独自のAI・IT導入・研修向けの補助が見つからない市: 竹原市・安芸高田市（市のサイトの事業者向けの一覧で確認）、三原市（賃上げ支援事業補助金は賃上げの定額補助でIT向けではない）。江田島市は公式サイトが緊急メンテナンス中で確認できなかった（subsidy_a_areas.md）
