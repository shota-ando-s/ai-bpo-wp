#
# 以下は data/area/hiroshima/subsidy_a.yml（県・県域の機関と14市）の冒頭のコメント
# 広島県（県・公益財団法人ひろしま産業振興機構・広島県中小企業団体中央会〔県の補助金の事務局〕・県の人的資本経営促進課ほか）と14市（2026年度）。2026-11-01に県の公式ページ・公募要領・交付要綱、県の「広島県DX推進コミュニティ」の支援メニュー検索（https://dx-hiroshima.jp/shien/ 、補助金・融資47件）、市の公式ページ（商工担当課の記事一覧を全件見た）で確認
# 県で「デジタル」を名指しした中小企業向けの補助金は「中小・小規模事業者等の計画的経営改善応援補助金」のデジタル枠（経営革新課、事務局は広島県中小企業団体中央会。2/3〔小規模3/4〕、一般型150万円・経営革新計画活用型500万円）。令和8年度の申請受付は2026-05-11〜08-31で終わり、9月末で審査も完了した（交付決定192者）
