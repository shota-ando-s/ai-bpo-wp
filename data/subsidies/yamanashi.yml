# 【下書き】D4（補助金）の案の直しを入れてある（「# 案」のコメント）。親が決めたら「# 案」の行を消す
# 県域で AI を名指しした補助は、やまなし産業支援機構（YISO）の次世代技術活用支援事業（AI・IoT等の先進技術を使う新事業、2/3・200万円、4件程度）だけで、2026年度の募集は2026-10-30 17時必着で終了（closed・next_expected なし＝診断に出ない）
# 県の IT 導入・研修に使える補助（生産性向上設備整備等支援補助金〔7/31終了〕・スキルアップ研修推進事業費補助金〔予算上限で8/25受付分まで〕）は2026年度はどちらも終了。今申請できる県の制度は、補助金の申請代理を行政書士・社労士に頼んだ費用の補助（中小企業等生産性向上補助金活用サポート事業費補助金、10/10・1申請10万円、2027-02-10まで。対象にデジタル化・AI導入補助金を明記）だけで、AI 導入そのものの補助ではないため targets はすべて ×（診断に出ない）
# 市町村で AI を名指しした制度はない。今申請できる市の制度は甲府市 IT関連研修受講補助金（ポリテクセンター山梨の指定研修だけ）・上野原市 生産性向上及び賃上げ環境整備（先端設備等導入計画の認定設備）・甲州市 持続化 後期（11/27まで）・大月市 県補助への上乗せ（随時）。韮崎市 ビジネスチャレンジは unknown
# 国の補助金（national.yml）への県・市町村の上乗せ（addon）はない。大月市の上乗せは県の設備補助金（yamanashi-seisansei-setsubi、closed）への addon（efficiency △ のため診断の組み合わせには出ず、カードだけ）
# 市町村の制度が1件もない20市町村（富士吉田・都留・山梨・南アルプス・北杜・笛吹・中央の7市と昭和町以外の13町村）は areas.yml で none: true にする（data/area/yamanashi/_areas_snippet.yml）
# 入れていないもの: 立地・融資・利子補給・保証料・創業・空き店舗・展示会出展だけの制度、研究開発・新製品開発の補助（県のやまなしイノベーション創出・地場産業チャレンジ、YISO のほかの助成）、AI 向けでない設備投資（南アルプス市 ものづくり企業成長投資）、商工業団体向けの制度（甲府市 新入社員等人材育成）、鳴沢村 情報ハイウェイ接続事業費補助金（県の一覧にだけ載り、村のページで確かめられない）、県の賃上げ加速化緊急支援金（経費の補助ではなく、県のページ未確認）、無料の支援（やまなしデジタル×コネクト・YISO DX推進応援隊・よろず支援拠点）。確認したページは subsidy_a_areas.md・subsidy_b_areas.md
# 結合で直した点（案）: 甲府市 IT関連研修受講補助金の training を × → △（松本市など指定機関の研修だけの補助と同じ扱い。カードに出し、組み合わせには出さない）
# 期間の status は data/subsidies/README.md の値（open / closed / rolling / unknown）を使う。随時受付は rolling。来年度の見込み（next_expected）は書かない
