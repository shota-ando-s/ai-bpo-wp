# 以下は data/area/yamanashi/subsidy_a.yml（県・県域の機関と13市）の冒頭のコメント
# 山梨県（県・公益財団法人やまなし産業支援機構〔YISO〕）と13市の AI・IT・DX・研修向け補助金（2026年度）。2026-10-31に公式ページ・要領・要綱・チラシで確認
# 県域でAIを名指しした補助は、YISO「山梨みらいファンド 次世代技術活用支援事業」（AI・IoT・ロボット等の先進技術を使う新事業、2/3・200万円、4件程度）だけで、募集は2026-09-01〜10-30 17時必着で終了（審査・採択は11月中旬予定）
# 県の中小企業等生産性向上設備整備等支援補助金（設備〔システム機器・ソフトウェアを含む〕2/3・300万円、会計ソフト15万円、税理士顧問20万円）は7/31で受付終了。賃金アップ環境改善事業費補助金とスキルアップ研修推進事業費補助金（研修10/10・30万円）は予算上限で8/25受付分までで終了（J-Net21 の記事は11/30までのままで、県のページと食い違う）
# 今も申請できる県の制度は、中小企業生産性向上補助金活用サポート事業費補助金（国・県の補助金の申請代理を行政書士・社労士に委任した費用 10/10・1申請10万円、2026-06-15〜2027-02-10。対象の補助制度にデジタル化・AI導入補助金を明記）だけ。補助金ではない無料の支援は、県DX課「やまなしデジタル×コネクト」（相談窓口・専門アドバイザーの伴走支援・研修）と YISO「ものづくり企業DX推進支援専門家派遣事業」（DX推進応援隊、IoT・AI等、製造業・情報通信業・医療福祉・宿泊業・サービス業、1社12回程度・無料）
# 市でAI・ITに使えて今申請できるのは、甲府市 IT関連研修受講補助金（ポリテクセンター山梨の指定コース〔IT業務改善〕の受講料1/2・1人2,000円・5人まで、年度末まで）、上野原市 生産性向上及び賃上げ環境整備支援事業補助金（先端設備等導入計画の認定設備＋賃上げ表明、1/4〜1/2・200万円、申請2027-01-31まで）、甲州市 小規模企業者持続化補助金 後期（販路開拓と併せた業務効率化、HP作成・業務システム開発の外注・顧客管理ソフト等、2/3・15万円、2026-10-19〜11-27、最大3件）、大月市 生産性向上設備整備等支援事業費補助金（県補助金の自己負担額を15万円まで上乗せ、県の額確定後随時）
# 甲斐市 小規模企業者持続化補助金（IT利活用・管理業務効率化ソフト等、1/2・50万円）は6/15〜7/31で終了。韮崎市 ビジネスチャレンジ支援事業補助金（新商品開発事業のウェブサイト関連費等 1/2・40万円）は令和8年度の受付期間をページで確かめられず unknown
# 独自のAI・IT導入・研修向けの補助が見つからなかった市: 富士吉田市、都留市、山梨市、南アルプス市、北杜市、笛吹市、中央市（確認したページは subsidy_a_areas.md）
# 国の補助金（national.yml）への県・市の上乗せ（addon）は見つからない。大月市の上乗せは県の設備補助金（yamanashi-seisansei-setsubi）への上乗せで、addon_to に県の id を書いた。県のサポート事業は申請代理の報酬の補助で、国の補助額に連動しないので addon は書いていない
# 期間の status は data/subsidies/README.md の値（open / closed / rolling / unknown）。来年度の見込み（next_expected）は書かない

