# data/subsidies/yamaguchi.yml（2026-11-01。案は D34 が作り、親が D4 判断6〔防府市 賃金引上げ応援 efficiency △〕以外を案どおりに決めた）。data/area/yamaguchi/subsidy_a.yml（県・やまぐち産業振興財団・13市、19制度）と subsidy_b.yml（6町、0制度）を結合した19制度。親が areas.yml の山口県の行（_areas_snippet.yml）と同じコミットで data/subsidies/yamaguchi.yml として入れる
# 【下書き】D34 の案の直しを入れてある（各制度の「# 案」のコメント）。親が決めたら「# 案」の行を消す
# 状況の内訳（2026-11-01）: open 7（財団 デジタル人材等育成支援、県 採用活動効率化支援、山口市 省人化・省力化、萩市 持続的成長・賃金引き上げ促進、萩市 雇用課題DX、防府市 賃金引上げ応援、岩国市 交通事業者デジタル機器等整備）・rolling 2（山口市 人材育成応援、光市 人財定着）・closed 9（財団 中小企業DX推進補助金の4型、県 介護テクノロジー定着支援、宇部市 DX推進2枠、防府市 生産性向上設備、長門市 省力化機器等）・unknown 1（下関市 中小企業大学校研修生派遣）
# 県域のAI・DX向けの中心だった、やまぐち産業振興財団の「中小企業DX推進補助金」4型（DXツール導入型〔2026-06-04 予算上限で終了〕・情報処理システム構築型〔2次 07-17〕・先駆型通常枠〔2次 08-18〕・先駆型ロボティクス枠〔05-29〕）は、2026-11-01時点ですべて受付を終えた。closed・next_expected なし＝診断に出ない（鳥取県の生成AI補助金2類型、島根県の加速化補助金と同じ扱い。来年度の見込みは書かない）
# 県域で今申請できるのは、財団の「デジタル人材等育成支援補助金」（IoT・AI・RPA等の研修、3/10・1社15万円、2027-01-31まで。D34 が 2026-11-01 に https://www.ymg-hrd.jp/subsidy/ を開き直し「令和８年４月２４日～令和９年１月末日まで随時募集」を確認）と、県の「採用活動効率化支援補助金」（エントリーシート選考へのAIツール導入費などを例示、1/2・10万円、2027-02-10まで。D34 が 315774.html を開き直し確認）。県域で今申請できる一般の AI・IT 導入の補助（ソフトウェア・クラウドの導入費）はない
# 市町で AI を名指ししたのは萩市 中小企業者持続的成長・賃金引き上げ促進補助金（対象事業「デジタル化・ＤＸによる業務改善・効率化への取組（ＡＩ活用、生産管理システムの導入等）」、別表に「AI解析ソフト」。D34 が 2026-11-01 にページを開き直し、申請期間「令和８年４月１日～令和８年11月30日」を確認）だけ。県の採用活動効率化支援補助金は経費の例に「AIツール」がある（採用業務に限る）
# D34 が 2026-11-01 に開き直したほかのページ: 防府市 賃金引上げ応援（受付「令和8年9月1日～令和8年11月30日」必着、コネクト22の支援、事業場内最低賃金5％以上の引上げ）、山口市 省人化・省力化（申請期間〜令和9年1月15日、「10月26日（月曜日）時点の予算到達状況が90％を超えました」）、岩国市 交通事業者デジタル機器等整備（「令和８年１０月１日から同年１２月１８日まで」）
# 国の補助金への上乗せ（addon）: 県・19市町とも現行の制度はない（周防大島町の持続化補助金への上乗せは2024-03-31で終了）。萩市・防府市・山口市・長門市の制度は国の重点支援地方交付金を財源とする市の単独制度で、国の補助金への上乗せではない
# 市町の制度が1件もない11市町（下松市・柳井市・美祢市・周南市・山陽小野田市と6町）は areas.yml で none: true にする案（_areas_snippet.yml）。下関市（時期未定の研修補助）・宇部市・長門市（今年度終了の制度だけ）は yml に制度があるので none にせず、note の一文目で状況を書く
# 結合で直した点（案）: (1) 岩国市 交通事業者デジタル機器等整備の efficiency を ○→△（旅客運送の事業者だけが対象）、(2) 下関市 中小企業大学校研修生派遣の next_expected を外した（来年度の見込みは書かない）、(3) 萩市 賃金引き上げ促進の max_yen は100万円のまま（コメントだけ足した）。exclusive_with は入れていない（財団のデジタル人材等育成支援と山口市・光市の研修補助は「同じ経費に他の公的な補助を受けない」条件で、別の研修なら両方使えるため。conditions にある）
# 期間の status は data/subsidies/README.md の値（open / closed / rolling / unknown）を使う。随時受付は rolling。来年度の見込み（next_expected）は書かない
