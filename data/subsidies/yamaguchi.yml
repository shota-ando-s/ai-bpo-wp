# 以下は data/area/yamaguchi/subsidy_a.yml（県・県域の機関と13市）の冒頭のコメント
# 山口県（県・公益財団法人やまぐち産業振興財団・山口県介護生産性向上総合相談センター）と13市（2026年度）。2026-11-01に県の公式ページ・財団（https://yipf.or.jp/ 、人材創造拠点 https://www.ymg-hrd.jp/ ）の募集ページ・募集要領・交付要綱・13市の公式サイトの事業者向け・補助金のページで確認
# 県域のAI・DX向けの中心は、やまぐち産業振興財団の「中小企業DX推進補助金」（DXツール導入型1/2・75万円、情報処理システム構築型1/2・150万円、先駆型通常枠1/2・500万円、先駆型ロボティクス枠1/2・1,000万円〔AIの機能を有する機器設備費〕）。2026-11-01時点ですべて受付を終えた（DXツール導入型は2026-06-04に予算上限で終了。システム構築型は2次が07-17、先駆型通常枠は2次が08-18で締切）
# 県域で今申請できるのは、財団の「デジタル人材等育成支援補助金」（IoT・AI・ビッグデータ・RPA等の研修、3/10・1人3万円・1社15万円、2027-01-31まで、業種の限定あり）と、県の「採用活動効率化支援補助金」（エントリーシート選考へのAIツール導入費などを例示、1/2・10万円、2027-02-10まで）
# 市で今申請できるAI・IT導入の補助: 萩市 中小企業者持続的成長・賃金引き上げ促進補助金（「AI活用」を明記、1/2・25万〜100万円、2026-11-30まで）、萩市 事業拡大補助金の雇用課題DX促進事業（ITツール1/2・10万円）、防府市 賃金引上げ応援事業補助金（2/3・50万円、2026-11-30まで、コネクト22の支援が必要）、山口市 省人化・省力化機器等導入支援補助金（1/2・購入50万円、2027-01-15まで、予算90％超）、岩国市 交通事業者デジタル機器等整備事業費補助金（バス・タクシー・地域鉄道のみ、1/2・150万円、2026-12-18まで）
# 研修（リスキリング）の市の補助: 山口市 中小企業人材育成応援補助金（1/2・1人5万円・1社20万円）、光市 中小企業等人財定着・定住支援補助金【定着】（リスキリング等の研修1/2・1社20万円）、下関市 中小企業大学校研修生派遣事業補助金（1/2・5万円、令和8年度の受付は未告知）
# 宇部市 中小企業等DX推進事業費補助金（Y-BASE宇部ブランチと連動、一般枠2/3・100万円、DXモデル枠2/3・400万円）は2026-08-31で締切。長門市 省力化機器等導入支援補助金（ソフトウェアを含む、2/3・50万円）は2026-06-01で締切。防府市 生産性向上設備導入支援事業補助金（2/3・100万円）は2次が2026-06-30で締切
# 市独自のAI・IT導入・研修向けの補助が見つからない市: 下松市・柳井市・美祢市・周南市・山陽小野田市（確認したページは subsidy_a_areas.md）。周南市 経営課題解決支援補助金（1/2・100万円、6/30締切）はIT・AIの明記がなく入れていない
# 国の補助金への上乗せ（addon）: 県・13市には該当なし。萩市・防府市・山口市・長門市の制度は国の物価高騰対応重点支援地方創生臨時交付金を財源とする市の単独制度で、国の補助金への上乗せではない。山口市 省人化補助金は国の省力化投資補助金のカタログ登録製品を対象外としている（併用ではなく、カタログ外の製品向け）。山口市 経営改善支援補助金（国の経営改善計画策定支援の自己負担1/2）は上乗せ先が national.yml になく、AI向けでもないため md に書いた
# 期間の status は data/subsidies/README.md の値（open / closed / rolling / unknown）を使う。随時受付は rolling
