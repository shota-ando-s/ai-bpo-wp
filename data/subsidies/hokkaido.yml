  org: 一般財団法人旭川産業創造プラザ（企業支援グループ）
  area: hokkaido/shimokawa
  max_yen: 100000
  rate: 対象経費の原則1/2以内、助成限度額10万円以内（1,000円未満切り捨て。財団の予算の範囲で調整する場合あり）。採択件数5件程度
  rate_num: 0.5
  stacking: {exclusive_with: [jinzai-reskilling]}
  targets: {efficiency: ×, consulting: ×, training: ○}
  expenses: ①派遣研修事業（技術者等を先進企業・試験研究機関等へ派遣し研修を受ける）の交通費・滞在費・受講費など、②自主研修事業（専門家等の招へいによる技術者等の研修・技術指導）の講師等招へい費（講師謝礼・旅費）・機材等賃借料・会場使用料など。年度内に支出する経費。自社の役員または常時使用する従業員が受講するもの（外国人技能実習生・期間の定めのある従業員・パート・アルバイトは対象外）
  conditions: 道北地域（上川・留萌・宗谷）に主たる事業所を有し、6か月以上事業を行っている中小企業等・小規模事業者等と中小企業者等によるグループ。自社の製品・サービスの向上、又は新技術等の開発に必要な先進的かつ技術的要素の高い研修事業。ものづくり技術に係わらない研修の受講・開催、各種資格の取得・更新の経費は対象外。一次産業者（法人を含む）・協同組合等は対象外。事業を開始しようとする日の1か月前までに申請。同一事業者による同一技能の取得の申請は1者1回まで。助成対象期限 2027年2月末日
  period: {status: open, start: 2026-07-13, end: 2026-12-29}
  url: https://www.arc-net.or.jp/16009/
  checked: 2026-11-11
  confidence: official
  note: プラザのページ（2026-07-14 掲載）「道北地域（上川・留萌・宗谷）における地域企業が行う派遣研修事業及び自主研修事業に対し、その経費の一部を助成します」「募集期間 2026年7月13日（月）から2026年12月29日（火）まで ※予算がなくなり次第、終了」「過去の実施例 …プログラミングの講師の招聘（自主研修）」。募集要領（https://www.arc-net.or.jp/data/jin/jin_72_boshuyoryo_2026.pdf 、2026年7月）p.2「期間内随時受付、随時審査」、p.3「【助成対象となる場合の例】AI、IOT、ロボティクス分野、又はそれらに係るものづくり・セキュリティ関連の技能取得のための研修等」「同一内容の事業で、国等が補助（国以外の機関が、国から受けた補助金等により実施する場合を含む）する他の制度（補助金、委託費等）を重複して利用する事業については対象外」（exclusive_with jinzai-reskilling）。問い合わせ 企業支援グループ 0166-73-9210、kigyoshien@arc-net.or.jp。**対象は上川の23市町村すべて**（留萌・宗谷も）。研修の中身が「ものづくり技術に係わらない」と判断されると対象外になるため、生成AIの事務向け研修が当たるかは事前にプラザに確かめる
  fuenn_note: 上川・留萌・宗谷に事業所のある中小企業が、社員をAI・IoT・セキュリティなどの技術研修に派遣したり、講師を招いて社内研修をしたりする費用の1/2（最大10万円）を、旭川産業創造プラザが助成する制度です。2026年12月29日まで随時受け付けています（予算がなくなり次第終了、事業開始の1か月前までに申請）。国の助成金と同じ研修には使えません。


