  fuenn_note: 函館市内の中小企業が、市の専門家派遣で受けた助言に基づいてITツール・ソフトウェア・クラウドサービス（上限250万円）や生産設備（上限1,000万円）を導入する費用を1/2補助する市の制度でした。前の年度までに専門家派遣を受けた企業だけが申請できます。2026年度の募集は6月30日で終わりました。国の補助金と同じ経費には使えません。


