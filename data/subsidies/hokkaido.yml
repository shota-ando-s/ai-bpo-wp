# 北海道の補助金（段階1: 道・道域の機関と石狩振興局の8市町村。2026-11-05〜06 のデータ）。data/area/hokkaido/subsidy_a.yml の11制度から、二次情報（補助金ポータルの要約だけ）の恵庭市 中小企業者等DX推進・労働環境改善支援事業補助金を除いた10制度（すべて official）
# 段階2以降で振興局ごとに市町村の制度を足す。足すときは areas.yml の北海道の cities と同じコミットで入れる（yml だけ先に入ると build_shindan_data.py が止まる）
# id は hokkaido- の接頭辞。area は hokkaido と hokkaido/<slug>
#
# 以下は data/area/hokkaido/subsidy_a.yml の冒頭のコメント
# 北海道（道・公益財団法人北海道中小企業総合支援センター〔HSC〕・道の事業の事務局）と石狩振興局の8市町村（札幌市・江別市・千歳市・恵庭市・北広島市・石狩市・当別町・新篠津村）（2026年度）。2026-11-05〜06に道の公式ページ（経済部 地域経済局 中小企業課の「補助金・助成金・支援金」一覧、労働政策局 産業人材課、AI・DX推進局 DX推進課）・交付要綱・運用、HSC のサイト・公募ページ・公募カレンダー、札幌市の公式ページと事業の専用サイト（sapporocity-dx.jp）・交付要綱、7市町村の公式ページ（商工担当課の記事一覧・事業者向けの分類ページ）で確認
# 道で「デジタル技術の導入」を対象にした中小企業向けの補助金は「中小・小規模企業賃上げ環境整備等支援事業費補助金」（中小企業課。事務局 賃上げ環境整備補助金2026事務局。1/2・200万円／3/4・300万円、パートナーシップ構築宣言の登録が要件）。2026-06-15〜08-10 の電子申請で予算上限に達して受付終了。前年度の「中小・小規模企業デジタル技術導入等緊急支援事業費補助金」（R7、2025-03-19〜05-19）は終了済みで、R8 はこの賃上げの補助金に引き継がれた（道のページ）
# HSC の中小企業競争力強化促進事業（コンサルタント等招へい 1/2・100万円、産業人材育成〔派遣・招へい〕1/2・50万円、テレワーク導入 1/2・60万円ほか）は1次 2026-05-07〜06-19・2次 08-19〜09-16 で終了。2次の後の予算残額は「約270万円程度」（HSC のページ）
# 道域で今申請できるのは、副業・兼業人材活用促進補助金（道。北海道プロフェッショナル人材センターを通じて副業・兼業人材を初めて使う費用の8/10・上限50万円、2027-01-31まで）だけ。HSC の専門家派遣（無料・原則3回）は補助金ではないので yml に入れていない（subsidy_a_areas.md）
# 市町村で今受け付けているAI・IT向けの補助: 札幌市 デジタル化・AI導入促進補助金（国のデジタル化・AI導入補助金の自己負担の1/2・上限225万円の上乗せ。市の無料伴走支援で DX推進計画を作ることが要件。交付申請は2027-01月末まで）、札幌市 先端設備等導入促進補助金（先端設備等導入計画の認定が要件。ソフトウェアを含む1台160万円以上の設備の20%・500万円、2026-12-28まで）、札幌市 賃上げ応援補助金（国の業務改善助成金の1/5・120万円、2027-02-26まで）
# 札幌市 DX・賃上げ加速化補助金（2/3〔市内中小IT企業と契約〕／1/2・500万円）は「予定していた募集枠が埋まったため現在は受付を一時停止」（枠の拡大は未定）。closed にした
# 市町村独自のAI・IT導入・研修向けの補助が見つからない: 江別市・千歳市・北広島市・石狩市・当別町・新篠津村。恵庭市の「中小企業者等DX推進・労働環境改善支援事業補助金」は公式ページが見つからず、補助金ポータルの要約だけ（secondary、closed）。詳細は subsidy_a_areas.md
# 国の補助金への上乗せ（addon）: 札幌市 デジタル化・AI導入促進補助金だけ（remaining ratio 0.5、上限225万円、addon_to digital-ai-donyu）。札幌市 賃上げ応援補助金は国の業務改善助成金への上乗せ（助成額の1/5）だが、業務改善助成金は national.yml にないので addon・addon_to は書いていない（福井県と同じ）。札幌市 DX・賃上げ加速化補助金は「いかなる補助金（国・地方自治体含む）との併用もできません」
# 期間の status は data/subsidies/README.md の値（open / closed / rolling / unknown）を使う。closed には next_expected を書かない（来年度の見込みは書かない）

