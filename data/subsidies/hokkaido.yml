- id: hokkaido-hakodate-dx-senmonka
  name: 令和8年度 函館市DX・生産性向上支援事業（専門家派遣事業）
  org: 函館市（経済部 工業振興課）
  area: hokkaido/hakodate
  max_yen: null
  rate: 無料（チラシに「完全無料」）。生産性向上支援型は最大2日（1日×2回又は半日×4回）、DX推進支援型は最大5日（1日×5回又は半日×10回）
  targets: {efficiency: ×, consulting: ○, training: ×}
  expenses: 専門家（市が登録した専門家派遣機関に所属する専門家）による診断助言。生産性向上支援型は「主に工場などの生産現場において労働生産性を高めるため」、DX推進支援型は「ＤＸによる中小企業等の全体最適化に向けたDX戦略の策定を支援するため」
  conditions: 函館市内に事業所を有する中小企業等（中小企業、小規模事業者、個人事業主）。企業グループでの申請も可。派遣希望日の2週間以上前を目安に専門家派遣申請書・決算書類の写し（直近2期分）・会社概要・市税の納税証明書を提出。最終派遣後30日以内に診断助言受入報告書。予算上限に達する見込みとなった場合は早期に募集を終了することがある
  period: {status: open, start: 2026-04-20, end: 2026-12-25}
  url: https://www.city.hakodate.hokkaido.jp/docs/2026042100025/
  checked: 2026-11-11
  confidence: official
  note: 市のページ（公開 2026-04-21、更新 2026-06-30）「募集期間 令和8年(2026年) 4月20日(月曜日) ～ 令和8年(2026年) 12月25日(金曜日)」「派遣期間 …～ 令和9年(2027年) 2月26日(金曜日)」。チラシ（DXseisan_chirashi.pdf）「完全無料」。函館市専門家派遣型ＤＸ・生産性向上支援事業実施要綱（令和8年4月1日施行の附則あり）第4条(4)「生産性向上支援型専門家派遣事業は延べ２日間を限度とし、ＤＸ推進支援型専門家派遣事業は、延べ３日間以上５日間を限度とする」。AI の語はページにないが、DX戦略の策定の助言に AI 活用の検討を含めるかは専門家との相談による。**この派遣を受けることが、翌年度以降の函館市DX・生産性向上補助金の申請要件**（2026年度の補助金は「令和7年度(2025年度)までに専門家派遣事業…を受けていること」）。問い合わせはチラシで 0138-21-3350、市の工業振興課のページの電話は 0138-21-3316（kougyou1@city.hakodate.hokkaido.jp）
  fuenn_note: 函館市内の中小企業・個人事業主が、DX戦略の策定や生産現場の生産性向上について、市が手配する専門家の診断・助言を無料で受けられる制度です（DX推進支援型は最大5日）。2026年12月25日まで受け付けています（予算に達し次第終了）。この派遣を受けておくと、次の年度以降の市のDX・生産性向上補助金（ITツール導入など）に申請できるようになります。


