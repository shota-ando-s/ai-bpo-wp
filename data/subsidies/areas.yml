# none: true は「市町独自の制度」が _subsidies_mie.yml に1件もない19市町（桑名市・いなべ市・鈴鹿市・亀山市・伊勢市・鳥羽市・熊野市の7市と、木曽岬町・東員町・菰野町・朝日町・川越町・多気町・明和町・玉城町・度会町・大紀町・紀北町・御浜町の12町）。熊野市以外は公式サイトの事業者向け・商工業のページで確かめて見つからなかった（subsidy_a_areas.md・subsidy_b_areas.md）。callout は「独自の補助金が見つかりませんでした。三重県と国の制度を使います」と出る
# 熊野市は市のサイトに接続できず確かめられなかった（gov・subsidy・cases2 が 2026-11-11 に計5回以上試した。curl 接続リセット・503、WebFetch 503）。shindan.js は city.note を none の callout の中でしか出さないので、none: true にして note で「確かめられなかった」と書いた（岐阜県東白川村と同じ。判断 D4-8）
# 伊勢市は個人向けの ITパスポート取得支援補助金だけで、事業者の補助ではないので _subsidies_mie.yml に入れていない＝none: true（note で触れる。判断 D4-4）
# 津市・松阪市・名張市は今年度の受付を終えた制度しかないが、yml に制度があるので none にせず、note の一文目で状況を書いた（滋賀県草津市・湖南市と同じ）。大台町・紀宝町（空き店舗の改修・家賃、受付期間の記載なし）も none なし。四日市市・志摩市・尾鷲市・南伊勢町・伊賀市（第4期は 2026-11-12 16時まで）は受付中の制度がある
# 並びは県の9地域の順（桑名〔桑名・いなべ・木曽岬・東員〕→ 四日市〔四日市・菰野・朝日・川越〕→ 鈴鹿〔鈴鹿・亀山〕→ 津 → 松阪〔松阪・多気・明和・大台〕→ 伊勢〔伊勢・鳥羽・志摩・玉城・度会・大紀・南伊勢〕→ 伊賀〔名張・伊賀〕→ 尾鷲〔尾鷲・紀北〕→ 熊野〔熊野・御浜・紀宝〕）。県 統計課の推計人口の地域別の区分（D125.md「県の地域区分」の案。29市町が1回ずつ入る）。地域の中は市→町、自治体コード順
# none の callout は「AI・IT導入向けの独自の補助金が見つかりませんでした」と出るので、none の note は確かめ方・相談先（商工会議所・商工会は gov_ai.md の名簿、電話は日商 Assist Biz・県商工会連合会の名簿）・取り違えの注意を書く
# 「無料」と書いたのは資料に無料とあるものだけ: 松阪市産業支援センターの IT・AI相談と専門家派遣（市のページ「相談等はすべて無料です」）、名張市の事業者支援ネットワーク TEOTORU（市のページ「相談無料」）。みえDXセンターの相談は無料の記載がない＝書いていない
# 県の制度（副業・兼業人材活用促進補助金など）は mie の行で全地域に出るので、市町の note には書いていない。市町の制度は市町内に事業所がある事業者が対象で、近くの町の事業者は使えない
# セミナー（朝明商工会の生成AIセミナー 12-07・12-14 など）は日付で終わるので note に入れていない（記事の H2 9 で書く）
