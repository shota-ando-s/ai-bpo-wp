    - {code: niigata/yuzawa-town, name: 湯沢町, note: 町独自の制度は町内で起業する人向けの起業サポート補助金（1/2・上限50万円）で、AI・IT導入や研修に使える補助金はありません（2026-10-24確認）}
    - {code: niigata/tsunan, name: 津南町, note: 中小企業人材育成事業補助金（研修受講料の1/3・1人3万円）のページが2020年のままで、今年度の受付は町に確認が必要です。AI・IT導入の補助金はありません}
