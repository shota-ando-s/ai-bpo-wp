# 「無料」と書いたのは資料に無料とあるものだけ: 沖縄県よろず支援拠点（拠点のサイト「国（中小企業庁）が全国に設置している 無料の経営相談所 です。」、098-851-8460）。商工会のない粟国村・渡名喜村・北大東村・多良間村と、サイトを確かめられない伊是名村の note にだけ入れた（県域の窓口は県ページと記事本文の H2 9 で書く）
# 取り違えの注意: 沖縄市（okinawa-city）は沖縄県と別、西原町（nishihara-town、中頭郡）は熊本県西原村と別、東村（higashi-village、国頭郡）、を note に入れた。竹富町商工会の事務所は石垣市美崎町（町役場と同じ番地）にある
# 市の制度（那覇市・うるま市）は市内に事業所がある事業者が対象で、近くの町村の事業者は使えない。県の制度（プロフェッショナル人材確保支援）は okinawa の行で全地域に出るので、市町村の note には書いていない
# 台風（第13号・第18号・9月5日大雨と第26号・第30号）の県のセーフティネット資金（融資）は note に入れない（AI 導入の補助ではない。docs の【D4】「災害の制度」）
