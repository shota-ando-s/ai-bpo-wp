    - {code: aichi/obu, name: 大府市, note: 大府市のがんばる事業者応援補助金（課題解決事業）は、市内の中小企業が STATION Ai の会員企業のサービス・システムを新しく使って受発注・品質管理などのデジタル化に取り組むとき、利用料（12か月分まで）や導入費を1/2、上限50万円補助します（2026〜2028年度に1回。2026-11-11確認）。STATION Ai の会員企業以外のサービスは対象になりません。窓口は市の商工業ウェルネスバレー推進課（0562-45-6227）と大府商工会議所（0562-47-5000）}
    - {code: aichi/chita, name: 知多市, note: 知多市のがんばる中小企業応援補助金は、市内に本社がある中小企業の従業員が中小企業大学校かポリテクセンター中部の研修を受ける受講料を1/2（年度10万円まで）補助します。ネットショップの開設の初期費用などのメニューもあります（3月20日までに事業と支払いを完了。2026-11-11確認）。AI・IT導入の費用を補助する市独自の制度はありません。窓口は市の商工振興課（0562-36-2662）と知多市商工会（0562-55-0700）}
    - {code: aichi/agui, name: 阿久比町, none: true, note: 愛知県知多郡阿久比町の事業者向け・企業・経営支援のページで確かめた範囲で、町独自のAI・IT導入や研修の補助金は見つかりませんでした（2026-11-11確認。創業チャレンジ支援補助金は創業向け）。町のサイトは要約でしか読めなかったので、町の産業観光課 商工観光係（0569-48-1111）にも確かめてください。阿久比町商工会（0569-48-7085）に相談できます}
    - {code: aichi/higashiura, name: 東浦町, note: 東浦町の小規模事業者設備投資等補助金は、町内の小規模企業者が新しく取得した機械・装置・器具備品（1台10万円以上、償却資産として町に申告したもの）の取得価格の1/4、上限50万円を補助します（2026-11-11確認。ページの表記は「令和7年度分の申請を受付中」）。ソフトウェアやクラウドの利用料が対象かはページにないので、町の商工農政課 商工労政係（0562-83-6118）に確かめてください。東浦町商工会（0562-83-6123）にも相談できます。東栄町とは別の町です}
    - {code: aichi/minamichita, name: 南知多町, none: true, note: 愛知県知多郡南知多町の観光・産業（商工）のページで確かめた範囲で、町独自のAI・IT導入や研修の補助金は見つかりませんでした（2026-11-11確認。中小企業者等応援補助金は人材採用とECサイトの活用が対象）。町のサイトは要約でしか読めなかったので、町の産業振興課（0569-65-0711）にも確かめてください。町内の内海商工会・豊浜商工会・師崎商工会に相談できます}
    - {code: aichi/mihama-town-aichi, name: 美浜町, none: true, note: 愛知県知多郡美浜町の産業振興・中小企業等支援のページで確かめた範囲で、町独自のAI・IT導入や研修の補助金は見つかりませんでした（2026-11-11確認）。町のサイトは要約でしか読めなかったので、町にも確かめてください。美浜町商工会（0569-82-3951）に相談できます。福井県・和歌山県の美浜町とは別の町です}
    - {code: aichi/taketoyo, name: 武豊町, note: 武豊町の中小企業者等応援補助金は、町内の中小企業が新技術・新商品・新サービスの開発や販路開拓に取り組むときの外部専門家への謝金・委託外注費・機械の購入費などを補助します（町内に発注すると上限が2倍。2026-11-11確認）。補助率・受付期間はページの図表の中で読めず、業務効率化だけのAI導入が対象になるかも書かれていないので、事前相談で町の産業課（0569-72-1111）に確かめてください。武豊町商工会（0569-73-1100）にも相談できます}
    - {code: aichi/okazaki, name: 岡崎市, none: true, note: 岡崎市の商工労政課の各種支援策のページで確かめた範囲で、市独自のAI・IT導入や研修の補助金は見つかりませんでした（2026-11-11確認）。岡崎ものづくり推進協議会（岡崎市・岡崎商工会議所）の岡崎ものづくり支援補助金は共同研究・依頼試験・見本市出展・知的財産などが対象で、国・県の補助金を使う事業には申請できません。市の商工労政課（0564-23-6210）、協議会（0564-53-6191）、岡崎商工会議所（0564-53-6161）に相談できます}
    - {code: aichi/hekinan, name: 碧南市, none: true, note: 碧南市の企業支援ナビで確かめた範囲で、市独自のAI・IT導入や研修の補助金は見つかりませんでした（2026-11-11確認。工場の新増設・設備投資・出展料・創業など）。市の商工課 企業応援係（0566-95-9895）と碧南商工会議所（0566-41-1100）に相談できます}
    - {code: aichi/kariya, name: 刈谷市, none: true, note: 刈谷市の中小企業向け融資・助成のページで確かめた範囲で、市独自のAI・IT導入や研修の補助金は見つかりませんでした（2026-11-11確認）。市の登録専門家を中小企業に派遣するビジネスサポート刈谷（補助金ではありません。費用はページにありません）を刈谷商工会議所（0566-21-0370）で申し込めます。市の商工業振興課（0566-62-1016）にも相談できます}
    - {code: aichi/toyota, name: 豊田市, note: 豊田市の働き方改革推進支援補助金は、市内の中小企業が勤怠管理・社内SNSなどのシステムの導入・改修、テレワーク機器、人事制度のコンサルなどにかかる費用を1/2（建設業・運輸業・医療福祉などは2/3）、上限50万円補助します（システムの月額利用料は対象外、2027-02-28まで）。従業員の研修の受講料を1/2・上限20万円補助する人材活躍支援補助金（人材育成）もあります（2026-11-11確認）。AIを名指しした市の補助金はありません。検索で出る「AI促進補助金」は大阪府豊中市の制度です。窓口は市の産業人材活躍課（0565-34-6774）と豊田商工会議所（0565-32-4567）}
    - {code: aichi/anjo, name: 安城市, note: 安城市のがんばる中小企業応援事業補助金は、市内の中小企業の社外研修や社外講師の社内研修の費用を50%（年度15万円まで）、製造業のデジタル化について専門家のコンサルを受ける費用を年度40万円まで補助します。そのコンサルを受けた製造業者が機器・システムを入れる費用を1/2・上限100万円補助するものづくりデジタル化推進事業補助金もありますが、申請期間はページにありません（2026-11-11確認）。窓口は市の商工課 工業労政係（0566-93-3341）、安城ビジネスコンシェルジュ、安城商工会議所（0566-76-5175）}
    - {code: aichi/nishio, name: 西尾市, none: true, note: 西尾市の産業振興・支援のページ（24件）で確かめた範囲で、市独自のAI・IT導入や研修の補助金は見つかりませんでした（2026-11-11確認）。市の商工観光課と西尾商工会議所（0563-56-5151）・西尾みなみ商工会・一色町商工会に相談できます}
    - {code: aichi/chiryu, name: 知立市, none: true, note: 知立市の事業者向けのページで確かめた範囲で、市独自のAI・IT導入や研修の補助金は見つかりませんでした（2026-11-11確認。デジタル化・AI導入補助金のページは国の制度の案内です）。市の産業振興課 商工振興係（0566-95-0125）と知立市商工会（0566-81-0904）に相談できます}
    - {code: aichi/takahama-city, name: 高浜市, none: true, note: 高浜市の事業者向け情報・産業振興のページで確かめた範囲で、市独自のAI・IT導入や研修の補助金は見つかりませんでした（2026-11-11確認）。市の経済環境グループと高浜市商工会（0566-53-1827）に相談できます。福井県高浜町とは別の市です}
    - {code: aichi/miyoshi-city, name: みよし市, none: true, note: 愛知県みよし市の産業振興・中小企業等支援のページ（22件）で確かめた範囲で、市独自のAI・IT導入や研修の補助金は見つかりませんでした（2026-11-11確認）。中小企業者等経営相談事業として、市の委託相談員による無料の経営相談（市役所4階、1社90分以内）と、専門家の相談料の補助（1回3万円・同じ年度に2回まで）があります（2026-11-12確認。AIの相談に使えるかは市に確認）。市の産業振興課（0561-32-8015）とみよし商工会（0561-34-1234）に相談できます。徳島県三好市・広島県三次市とは別の市です}
    - {code: aichi/kota, name: 幸田町, none: true, note: 愛知県額田郡幸田町の企業・経営・中小企業支援のページで確かめた範囲で、町独自のAI・IT導入や研修の補助金は見つかりませんでした（2026-11-11確認。町の幸田ものづくり研究センターのデジタル塾は有料の研修で、2026年度の回は終了）。町のサイトは要約でしか読めなかったので、町の企業立地課にも確かめてください。幸田町商工会（0564-62-0120）に相談できます}
    - {code: aichi/toyohashi, name: 豊橋市, note: 豊橋市の新ビジネスチャレンジ応援補助金（デジタル化）は、市内に本店がある中小企業が在庫管理やセルフオーダーなど生産性を上げるソフトウェアと連携する専用の機器を入れる費用を1/2、上限50万円補助します。DX推進の枠は、専門家に業務分析・計画づくり・仕様書作成を頼む費用を1/2・上限25万円補助します。どちらも事業を始める前に、年度の2月末日までに申請します（2026-11-11確認。ページに年度の表記がないので、市の商工業振興課〔0532-51-2425〕に確かめてください）。愛知県よろず支援拠点の豊橋サテライト（0532-39-7111）は県域の無料の経営相談所です}
    - {code: aichi/toyokawa, name: 豊川市, none: true, note: 豊川市の産業振興・中小企業者向け補助金のページで確かめた範囲で、市独自のAI・IT導入や研修の補助金は見つかりませんでした（2026-11-11確認）。市の商工観光課、豊川商工会議所（0533-86-4101）、音羽・一宮・小坂井・御津町の商工会に相談できます。市内の一宮商工会は一宮市の一宮商工会議所とは別の団体です}
    - {code: aichi/gamagori, name: 蒲郡市, note: 蒲郡市のがんばる中小企業者応援事業費補助金（IT導入事業）は、市内の中小企業が販売・在庫・会計・労務などの業務を改善するITツールやホームページ・通販サイトを導入する費用を1/2、上限10万円補助します（事業を始める前に申請、2027-01-29まで。予算に達し次第終了。2026-11-11確認）。ハードウェアとITツール導入のコンサル費は対象外です。窓口は市の産業政策課（0533-66-1118）と蒲郡商工会議所（0533-68-7171）}
    - {code: aichi/shinshiro, name: 新城市, none: true, note: 新城市の補助金・助成金（事業者向け）のページで確かめた範囲で、市独自のAI・IT導入や研修の補助金は見つかりませんでした（2026-11-11確認。中小企業者事業基盤強化等奨励金がソフトウェアを含むかは確かめていません）。市の商工政策課と新城市商工会（0536-22-1778）に相談できます}
    - {code: aichi/tahara, name: 田原市, note: 田原市の中小企業者総合支援事業補助金は、市内の中小企業が副業・兼業の専門人材を受け入れる費用を1/2、上限25万円補助します（インターネット接続環境の整備などのメニューもあります。2027-03-31までに完了、予算がなくなり次第締め切り。2026-11-11確認）。AI・ITツールの導入費は対象にありません。窓口は市の商工課（0531-27-7331）と田原市商工会（0531-22-6666）・渥美商工会（0531-33-0441）}
    - {code: aichi/shitara, name: 設楽町, none: true, note: 愛知県北設楽郡設楽町の地域振興のページで確かめた範囲で、町独自のAI・IT導入や研修の補助金は見つかりませんでした（2026-11-11確認。商工業活性化補助金は創業・新商品開発・販路拡大・事業承継が対象）。町のサイトは要約でしか読めなかったので、町の産業課（0536-62-0527）にも確かめてください。設楽町商工会（0536-62-0004）・津具商工会（0536-83-2114）に相談できます}
    - {code: aichi/toei, name: 東栄町, none: true, note: 愛知県北設楽郡東栄町の商工業のページで確かめた範囲で、町独自のAI・IT導入や研修の補助金は見つかりませんでした（2026-11-11確認。起業家支援補助金は創業の借入向け）。町のサイトは一部のページが開けなかったので、町の経済課（0536-76-1812）にも確かめてください。東栄町商工会（0536-76-0530）に相談できます。東浦町とは別の町です}
    - {code: aichi/toyone, name: 豊根村, none: true, note: 愛知県北設楽郡豊根村のしごと・産業と観光関係の補助金のページで確かめた範囲で、村独自のAI・IT導入や研修の補助金は見つかりませんでした（2026-11-11確認。村の総合戦略にある観光事業者のウェブサイトのリニューアルの補助は補助金のページで見つかりません）。村のサイトは要約でしか読めなかったので、村の産業課 商工観光係（0536-85-1314）にも確かめてください。豊根村商工会（0536-85-1033）に相談できます}
