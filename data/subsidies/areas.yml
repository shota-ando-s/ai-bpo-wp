- code: chiba
  name: 千葉県
  cities:
    # 千葉地域
    - {code: chiba/chiba-city, name: 千葉市, note: 千葉市産業振興財団のICT活用等生産性向上支援事業（タイプA）は、市内に本社か事業所がある中小企業がクラウドサービスやソフトウェアを導入する費用（利用料が必須）と、あわせて行う専門家への相談・研修の費用を2/3（上限50万円）補助します（随時、2027-03-31まで、予算に達し次第終了。2026-11-13確認）。財団のコーディネーターへの事前相談が要り、審査まで5週間ほどかかります。大規模型のタイプB（上限300万円）は5/29で締め切りました。財団の専門家派遣（謝金の1/2）もあります。窓口は財団の産業創造課（043-201-9506）。市内にある千葉県産業振興センター・千葉県よろず支援拠点は県の機関で、千葉市の窓口ではありません}
    - {code: chiba/ichihara, name: 市原市, none: true, note: 市原市の公式サイトはJavaScriptだけで描かれていて本文を読み取れず、市独自のAI・IT導入や研修の補助金を確かめられませんでした（2026-11-13）。「ない」と決まったわけではないので、市の商工業振興課か市原商工会議所（0436-22-4305）に確かめてください}
    # 葛南地域
    - {code: chiba/ichikawa-city, name: 市川市, none: true, note: 市川市の「法人・個人事業主向け補助金」と起業・経営支援のページで確かめた範囲で、市独自のAI・IT導入や研修の補助金は見つかりませんでした（2026-11-12確認）。市の経済観光部 商工課と市川商工会議所（047-377-1011）に相談できます。兵庫県市川町とは別の市です}
    - {code: chiba/funabashi, name: 船橋市, none: true, note: 船橋市にAI・IT導入の費用そのものの補助はありませんが、賃上げ補助制度活用支援補助金で、国のデジタル化・AI導入補助金などの申請を中小企業診断士などの専門家に頼む費用の3/4（上限15万円）を補助しています（2026-12-31まで。2026-11-12確認）。窓口は市の経済部 商工振興課 経営労政係と船橋商工会議所（047-432-0211）}
    - {code: chiba/narashino, name: 習志野市, none: true, note: 習志野市の産業・創業・融資のページと事業者向け情報の一覧で確かめた範囲で、市独自のAI・IT導入や研修の補助金は見つかりませんでした（2026-11-12確認）。市の協働経済部 産業振興課と習志野商工会議所（047-452-6700）に相談できます}
    - {code: chiba/yachiyo-city, name: 八千代市, none: true, note: 八千代市の事業者向けの助成・支援の一覧で確かめた範囲で、市独自のAI・IT導入や研修の補助金は見つかりませんでした（2026-11-12確認）。市の経済環境部 商工観光課（047-421-6761）と八千代商工会議所（047-483-1771）に相談できます。茨城県八千代町とは別の市で、八街市とも別です}
    - {code: chiba/urayasu, name: 浦安市, none: true, note: 浦安市の事業者向けのページ（融資・雇用・起業創業など）で確かめた範囲で、市独自のAI・IT導入や研修の補助金は見つかりませんでした（2026-11-12確認）。市の市民経済部 商工観光課と浦安商工会議所（047-351-3000）に相談できます}
    # 東葛飾地域
    - {code: chiba/matsudo, name: 松戸市, note: 松戸市中小企業デジタル化チャレンジ補助金は、市内で1年以上営業している中小企業が、まつどビジネスBASEの専門家の支援を受けて、業務を改善するソフトウェアの利用料・購入費・開発費や講座の受講費などを2/3（機器は1/2、上限50万円）補助します（2027-02-27まで。2026-11-13確認）。国のデジタル化・AI導入補助金とは併用できません。国などの補助金の申請書類の作成を専門家に頼む費用の1/2（上限30万円）の補助金もあります（受付期間は市に確認）。窓口は市の商工振興課（047-711-6377）}
    - {code: chiba/noda-city, name: 野田市, none: true, note: 野田市の事業者向け情報（雇用の奨励金・中小企業の経営支援）のページで確かめた範囲で、市独自のAI・IT導入や研修の補助金は見つかりませんでした（2026-11-12確認）。野田商工会議所（04-7122-3585）・野田市関宿商工会（04-7198-0161）に相談できます。岩手県野田村とは別の市です}
    - {code: chiba/kashiwa, name: 柏市, none: true, note: 柏市のチャレンジ支援補助金（令和8年度はイベント開催とゼロカーボンの2件）と中小企業向け情報のページで確かめた範囲で、市独自のAI・IT導入や研修の補助金は見つかりませんでした（2026-11-12確認）。補助金ではありませんが、市は柏商工会議所（04-7162-3311）・柏市沼南商工会（04-7191-2803）で中小企業診断士などの無料の個別相談会を開いていて、相談の内容に「IT化（生成AI）」があります}
    - {code: chiba/nagareyama, name: 流山市, none: true, note: 流山市の支援制度・補助金の一覧で確かめた範囲で、市独自のAI・IT導入や研修の補助金は見つかりませんでした（2026-11-12確認）。国の小規模事業者持続化補助金を受けた小規模事業者には、国の確定額の1/4を上乗せする市の制度があります（受付期間は市に確認）。窓口は市の経済振興部 商工振興課と流山商工会議所（04-7158-6111）}
    - {code: chiba/abiko, name: 我孫子市, none: true, note: 我孫子市の中小企業向けのページで確かめた範囲で、市独自のAI・IT導入や研修の補助金は見つかりませんでした（2026-11-12確認。業務効率化のページは千葉県の制度の案内です）。市の環境経済部 商工観光課と我孫子市商工会（04-7182-3131）に相談できます}
    - {code: chiba/kamagaya, name: 鎌ケ谷市, none: true, note: 鎌ケ谷市の「事業者向けの支援制度について（補助金等）」（2026-10-28更新）で確かめた範囲で、市独自のAI・IT導入や研修の補助金は見つかりませんでした（2026-11-12確認）。市の商工観光課 商工観光係（047-445-1240）と鎌ケ谷市商工会（047-443-5565）に相談できます}
    # 印旛地域
    - {code: chiba/narita, name: 成田市, none: true, note: 成田市の産業・ビジネスの補助金・事業者支援のページで確かめた範囲で、市独自のAI・IT導入や研修の補助金は見つかりませんでした（2026-11-12確認）。市の経済部 商工課、成田商工会議所（0476-22-2101）、成田市東商工会（0476-73-2205）に相談できます}
    - {code: chiba/sakura-city, name: 佐倉市, none: true, note: 佐倉市の商工振興課のページ（中小企業・商店街の支援情報）で確かめた範囲で、市独自のAI・IT導入や研修の補助金は見つかりませんでした（2026-11-12確認）。市の商工振興課と佐倉商工会議所（043-486-2331）に相談できます。栃木県さくら市とは別の市です}
    - {code: chiba/yotsukaido, name: 四街道市, none: true, note: 四街道市の「市からの補助金など」と中小企業向け融資・助成のページで確かめた範囲で、市独自のAI・IT導入や研修の補助金は見つかりませんでした（2026-11-12確認）。市の経済振興課と四街道市商工会（043-422-2037）に相談できます}
