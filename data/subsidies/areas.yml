# 並びは県の3県民局（stats.md の region_kenmin。県 税務課「県税を扱う県の事務所と管轄区域」2024-12-16更新）の順: 備前（7）→ 備中（10）→ 美作（10）。県民局の中は市（自治体コード順）→ 町村（自治体コード順）
# 15市は市の商工担当課の記事一覧、10町2村は町村のサイトの事業者向けページ・商工担当課の記事一覧を開いて確かめた（subsidy_a_areas.md・subsidy_b_areas.md。県の補助金リストだけでは判断していない）。新庄村は https では開けないが http で開けた（2026-11-03、執筆担当 W2）。事業者向けページの商工業の支援は起業家支援資金（貸付）だけで、補助金は見つからなかった
# none の callout は「AI・IT導入向けの独自の補助金が見つかりませんでした」と出るので、none の note は確かめ方・相談先（商工会議所・商工会は gov_ai.md の対応表）・使える近隣の制度・取り違えの注意を書く
# 岡山市（okayama-city）は岡山県と別、新庄村（shinjo-village）は山形県新庄市（yamagata/shinjo）と別、備北商工会（高梁市）は広島県庄原市の同名の団体と別、の注意を note に入れた
