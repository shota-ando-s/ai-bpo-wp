- code: kanagawa
  name: 神奈川県
  cities:
    - {code: kanagawa/yokohama, name: 横浜市, none: true, note: 横浜市の2026年度の中小企業向けのデジタル化支援は補助金ではなく、無料のデジタル人材育成講座と専門家の伴走支援で、募集は6月23日で終わりました（2026-11-13確認）。IDEC横浜（横浜企業経営支援財団）の情報・デジタル化相談は年度内3回まで無料で、ワンストップ経営相談には毎週火曜のIT活用相談があります}
    - {code: kanagawa/kawasaki, name: 川崎市, note: 川崎市の中小企業成長環境支援補助金のリスキリング支援（AI活用などのデジタル人材の研修に2/3・上限30万円）は申請書の締切が2026年11月13日で、10月30日までにエントリーシートを出した事業者だけが申請できます（2026-11-13確認）。ソフトウェアやクラウドの導入に使える生産性向上支援は予算に達して募集を終えました。事務局は川崎市産業振興財団（044-548-4141）}
    - {code: kanagawa/sagamihara, name: 相模原市, note: 相模原市の中小企業生産性向上支援補助金（設備やソフトウェアに2/3・上限1000万円）は2026年度の事前申請を9月16日で終え、本申請は抽選で選ばれた事業者だけです（2026-11-13確認）。ロボットの動作・判断にAIを使う場合に上限1000万円となるロボット導入補助金も7月3日で締め切られました。今申請できる市独自のAI・IT導入の補助金は見つかりませんでした。窓口は市の産業支援・雇用対策課（042-707-7154）}
    - {code: kanagawa/yokosuka, name: 横須賀市, note: 横須賀市と横須賀商工会議所の小規模事業者ICT支援補助金「はじめの一歩」は、開業6か月以上の小規模事業者が生成AIの活用などのICTを入れる費用を3/4（上限30万円）補助し、商工会議所とICT専門家が計画づくりから伴走します（2026-11-13確認）。申込の締切は公表されておらず実績報告の締切が2027-01-29なので、受付状況を横須賀商工会議所（046-823-0402）に確認してください}
    - {code: kanagawa/hiratsuka, name: 平塚市, note: 平塚市の中小企業等DX支援補助金は、自社の業務に合わせてIoT・AIのシステムを開発・導入する費用（100万円以上）を1/2（上限200万円）補助し、2027-02-28まで受け付けています（2026-11-13確認）。市が指定するITコーディネータの事前確認が必要で、既存の生成AIサービスを入れるだけの場合や国の補助と同じ内容の場合は対象外です。DX人材の育成計画を作ると10万円が出る奨励金もあります}
    - {code: kanagawa/kamakura, name: 鎌倉市, note: 鎌倉市の中小企業経営基盤強化事業費補助金は、市内で1年以上営む中小企業が会計・受発注などの業務ソフトの利用料やPOSレジを入れる費用を1/3（上限15万円）と、公的機関の研修や外部講師の社内研修の費用を1/2（上限15万円）補助し、2027-02-26まで受け付けています（2026-11-13確認）。事業を始める前の申請が必要で、予算に達すると終わります。窓口は市の産業課}
    - {code: kanagawa/fujisawa, name: 藤沢市, none: true, note: 藤沢市の商工業・産業振興のページで確かめた範囲で、市独自のAI・IT導入や研修の補助金は見つかりませんでした（2026-11-13確認。融資の利子補給や先端設備等導入計画はあります）。藤沢商工会議所か神奈川県よろず支援拠点に相談できます}
    - {code: kanagawa/odawara, name: 小田原市, none: true, note: 小田原市の地域経済・中小企業対策のページで確かめた範囲で、市独自のAI・IT導入や研修の補助金は見つかりませんでした（2026-11-13確認。販路開拓や空き店舗の補助はあります）。小田原箱根商工会議所か小田原市橘商工会に相談できます}
    - {code: kanagawa/chigasaki, name: 茅ヶ崎市, none: true, note: 茅ヶ崎市の事業者支援情報と補助金情報の一覧で確かめた範囲で、市独自のAI・IT導入や研修の補助金は見つかりませんでした（2026-11-13確認。展示会の出展などの販路開拓の補助はあります）。茅ヶ崎商工会議所に相談できます}
    - {code: kanagawa/zushi, name: 逗子市, none: true, note: 逗子市の事業者向けの商工振興・助成金のページで確かめた範囲で、市独自のAI・IT導入や研修の補助金は見つかりませんでした（2026-11-13確認）。逗子市商工会に相談できます（逗子市に商工会議所はありません）}
    - {code: kanagawa/miura, name: 三浦市, none: true, note: 三浦市の中小企業助成制度の案内（2026年9月更新）で確かめた範囲で、市独自のAI・IT導入や研修の補助金は見つかりませんでした（2026-11-13確認。利子補給や信用保証料の補助はあります）。三浦商工会議所に相談できます}
    - {code: kanagawa/hadano, name: 秦野市, note: 秦野市の中小企業人材育成事業補助金は、市内の中小企業が社員に研修を受けさせたり講師を招いて社内研修をしたりする費用を1/2（1企業年10万円まで）補助します（随時。研修に申し込む時点で市に申請。2026-11-13確認）。分野の限定はなくAIの研修に使えるかは市の産業振興課に確認してください。AI・ITツールの導入に使える市独自の補助金は見つかりませんでした}
    - {code: kanagawa/atsugi, name: 厚木市, note: 厚木市のロボット関連産業等促進事業補助金は、市内で1年以上営む中小企業がロボット・IoT・AIを導入した費用（50万円以上）の1/2（AI導入は上限50万円。ソフトだけのIT導入は上限10万円）を、導入の後に補助します（2027-03-15まで。2026-11-13確認）。設備の引渡しの前に事業計画概要書を出す必要があり、クラウドの利用料は対象外です。国の補助金を使った場合はその額を引いた残りが対象です。窓口は市の産業振興課}
    - {code: kanagawa/yamato-city, name: 大和市, none: true, note: 神奈川県大和市の補助金等のページで確かめた範囲で、市独自のAI・IT導入や研修の補助金は見つかりませんでした（2026-11-13確認）。自動化セミナー等受講支援補助金は補助率や今年度の受付がページに書かれていないので、市の産業活性課 企業活動サポート係（046-260-5135）に確認してください。大和商工会議所に相談できます}
    - {code: kanagawa/isehara, name: 伊勢原市, none: true, note: 伊勢原市の事業者向けのページで確かめた範囲で、市独自のAI・IT導入や研修の補助金は見つかりませんでした（2026-11-13確認。製造業の機械装置の導入に1/5を補助する設備投資支援はありますが、ソフトウェアは対象として書かれていません）。伊勢原市商工会に相談できます}
    - {code: kanagawa/ebina, name: 海老名市, note: 海老名市の中小企業振興支援事業の人材育成事業は、自治体や公益法人が主催する3日以上の研修の受講料を1/2（上限5万円）補助します（2026年4月からの先着順で予算に達すると終了。2026-11-13確認）。民間の研修会社の講座は対象外で、AI・ITツールの導入に使える市独自の補助金は見つかりませんでした。窓口は市の商工課で、海老名商工会議所にも相談できます}
    - {code: kanagawa/zama, name: 座間市, note: 座間市の生産性向上設備導入事業（製造業の設備とそれを動かすシステムに2/3・上限400万円）は、2026年度の予算額に達する見込みとなり受付を終えました（2026-11-13確認）。今申請できる市独自のAI・IT導入の補助金は見つかりませんでした。座間市商工会に相談できます（座間市に商工会議所はありません）}
    - {code: kanagawa/minamiashigara, name: 南足柄市, none: true, note: 南足柄市の事業者向けと商工業・企業情報のページで確かめた範囲で、市独自のAI・IT導入や研修の補助金は見つかりませんでした（2026-11-13確認。融資や工場緑化の補助はあります）。南足柄市商工会に相談できます}
    - {code: kanagawa/ayase, name: 綾瀬市, note: 綾瀬市の中小企業強靭化推進補助金の第3次公募（製造業のAI・IoTシステムやソフトウェアの導入に2/3・上限150万円）は、10月30日までに事前相談を受けた事業者の本申請が2026年11月13日締切です（2026-11-13確認）。製造業の社員がKISTECなど市が指定する機関の研修を受ける受講料の1/2（年20万円まで）を補助するものづくり人材育成補助金もあります（今年度の受付は市の商工振興課に確認）}
    - {code: kanagawa/hayama, name: 葉山町, none: true, note: 神奈川県三浦郡葉山町の産業振興関連の町補助金一覧で確かめた範囲で、事業者向けのAI・IT導入や研修の町の補助金は見つかりませんでした（2026-11-13確認。商工業の補助は住宅リフォームだけです）。葉山町商工会か町の産業振興課に相談できます}
    - {code: kanagawa/samukawa, name: 寒川町, none: true, note: 神奈川県高座郡寒川町の補助金・支援策のページで確かめた範囲で、町独自のAI・IT導入や研修の補助金は見つかりませんでした（2026-11-13確認。商業団体向けのにぎわい創出の補助などはあります）。寒川町商工会か町の産業振興課 商工労政担当（0467-37-5184）に相談できます}
    - {code: kanagawa/oiso, name: 大磯町, none: true, note: 神奈川県中郡大磯町の商工のページで確かめた範囲で、町独自のAI・IT導入や研修の補助金は見つかりませんでした（2026-11-13確認。特産品の開発の補助のページは2024年度の内容のままです）。大磯町商工会に相談できます}
    - {code: kanagawa/ninomiya, name: 二宮町, none: true, note: 神奈川県中郡二宮町の企業・創業支援のページで確かめた範囲で、町独自のAI・IT導入や研修の補助金は見つかりませんでした（2026-11-13確認。融資の利子補助や信用保証料の補助はあります）。二宮町商工会か町の産業振興課 商工観光班（0463-71-5914）に相談できます}
    - {code: kanagawa/nakai, name: 中井町, note: 神奈川県足柄上郡中井町には、空き家を買って新しく事業を始める人に取得費の1/2（上限30万円）を補助する制度がありますが、AI・IT導入や研修に使える町独自の補助金は見つかりませんでした（2026-11-13確認）。中井町の経営相談は足柄上商工会が受け持っています}
    - {code: kanagawa/oi, name: 大井町, note: 神奈川県足柄上郡大井町の中小企業ビジネスDX応援事業費補助金は、町内で1年以上営む中小企業がキャッシュレス決済・POSレジやホームページ・ECサイトなどのデジタル化を進める費用を1/2（上限15万円）補助し、事業を始める前に申請します（期間の表示なし。2026-11-13確認）。AIツールが対象になるかは事前に町の地域振興課（0465-85-5013）に相談してください。足柄上商工会にも相談できます}
    - {code: kanagawa/matsuda, name: 松田町, note: 神奈川県足柄上郡松田町には店舗の改装や空き店舗への出店を1/2（上限50万円）補助する店舗リノベーション支援補助金がありますが、AI・IT導入や研修に使える町独自の補助金は見つかりませんでした（2026-11-13確認）。足柄上商工会か町の観光経済課 商工農林係（0465-83-1228）に相談できます}
    - {code: kanagawa/yamakita, name: 山北町, note: 神奈川県足柄上郡山北町の中小企業・小規模事業者等持続化補助金は、山北町商工会などの推薦を受けて行う商品開発や事業転換の費用（専門家・委託・外注・ホームページ作成など）を1/2（上限20万円）補助し、2026年度の申請は11月30日までです（2026-11-13確認）。AIの活用が対象になるかは町の商工観光課（0465-75-3646）か山北町商工会に確認してください}
    - {code: kanagawa/kaisei, name: 開成町, none: true, note: 神奈川県足柄上郡開成町の中小企業支援のページで確かめた範囲で、町独自のAI・IT導入や研修の補助金は見つかりませんでした（2026-11-13確認。再エネ導入の補助や利子補給はあります）。開成町の経営相談は足柄上商工会が受け持っています}
    - {code: kanagawa/hakone, name: 箱根町, note: 神奈川県足柄下郡箱根町の人材確保等支援事業補助金は、顧客管理・在庫管理・セルフオーダーなどの省人化のシステム、従業員の研修受講料や専門家謝礼、採用の広報の費用を、それぞれ1/2（各上限20万円・合計60万円）補助します（期間の表示なし。2026-11-13確認）。始める前に町の観光課 産業振興係（0460-85-7410）へ事前相談票を出し、3月31日までに支払いを終える必要があります。AIツールが省人化の対象になるかも事前相談で確かめてください}
    - {code: kanagawa/manazuru, name: 真鶴町, none: true, note: 神奈川県足柄下郡真鶴町の中小企業・勤労者支援のページで確かめた範囲で、事業者向けのAI・IT導入や研修の町の補助金は見つかりませんでした（2026-11-13確認。利子補給はあります）。真鶴町商工会か町の産業観光課 産業振興係に相談できます}
    - {code: kanagawa/yugawara, name: 湯河原町, none: true, note: 神奈川県足柄下郡湯河原町で今申請できる事業者向けのAI・IT導入や研修の町の補助金は見つかりませんでした（2026-11-13確認。宿泊税の特別徴収義務者向けのシステム整備の補助は2026年2月2日で申請期間を終えています）。湯河原町商工会か町の観光課 商工係に相談できます}
    - {code: kanagawa/aikawa, name: 愛川町, note: 神奈川県愛甲郡愛川町には町内で起業する人（テレワークでの起業を含む）の経費を1/5（上限10万円〜15万円）補助する制度がありますが、既存の会社のAI・IT導入や研修に使える町独自の補助金は見つかりませんでした（2026-11-13確認）。愛甲商工会か町の商工観光課 商工労政班（046-285-6948）に相談できます}
    - {code: kanagawa/kiyokawa, name: 清川村, none: true, note: 神奈川県愛甲郡清川村の商工事業者向けのページで確かめた範囲で、事業者向けのAI・IT導入や研修の村の補助金は見つかりませんでした（2026-11-13確認。利子補給や信用保証料の助成はあります）。清川村の経営相談は愛甲商工会が受け持っています}
- code: saitama
  name: 埼玉県
  cities:
    - {code: saitama/saitama-city, name: さいたま市, note: さいたま市産業創造財団のDX推進補助金（AI・チャットボットを含むシステムやクラウドの導入費の2/3・上限40万円）は2026年度の公募を5/20で終えました。市の第3回設備導入応援補助金（システム・ソフトウェアも対象の2/3・上限500万円）も9/1〜9/11の受付で終わっています。今受け付けているのは財団の副業人材活用推進補助金（マッチングサービスの支払いの40%・上限28.8万円）で締切は11/30（11/2時点で残り1枠。2026-11-12確認）。財団の無料の窓口相談会に「販売促進・IT活用」の日があります（窓口相談 048-851-6391）。市内にある埼玉県産業振興公社や埼玉県よろず支援拠点は県域の窓口です}
    - {code: saitama/kawaguchi, name: 川口市, note: 川口市のDX推進補助金は、市内の中小企業が国のデジタル化・AI導入補助金などで入れたAIやバックオフィスのシステムについて、国の補助を引いた自己負担分の1/2（上限50万円）を上乗せします。令和8年4月1日以降に国の補助金の交付確定を受けていることが条件で、申請は2027-02-26まで（予算に達し次第終了。2026-11-12確認）。川口商工会議所の独自の奨励金は令和6年度で終わりました。窓口は市の経営支援課 経営支援係（048-258-1647）と川口商工会議所（048-228-2220）です}
