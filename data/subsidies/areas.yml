# 佐賀県（2026-11-04、D34 の _areas_snippet.yml から。data/subsidies/saga.yml と同じコミットで入れた）
# none: true は _subsidies_saga.yml にその市町の制度が1件もない16市町（鳥栖市・多久市・武雄市・鹿島市・小城市・嬉野市・神埼市と、吉野ヶ里町・上峰町・みやき町・玄海町・有田町・大町町・江北町・白石町・太良町）。佐賀市・唐津市・伊万里市・基山町は制度があるので none にしない（佐賀市は受付中の働きがい×企業力アップがある）
# 並びは県の保健福祉事務所の5区分（stats.md の region_hoken。厚生労働省「保健所所管区域案内 佐賀県」）の順: 佐賀中部（5）→ 鳥栖（4）→ 唐津（2）→ 伊万里（2）→ 杵藤（7）。区分の中は市（自治体コード順）→ 町（自治体コード順）。判断 D4-6
# 10市は市の商工担当課の記事一覧・事業者向けの分類ページ（subsidy_a_areas.md。鹿島市は D34 が www.city.saga-kashima.lg.jp で 2026-11-04 に確認）、10町は町のサイトの事業者向けページ・商工担当課の記事一覧（subsidy_b_areas.md）を開いて確かめた。県の補助制度一覧だけでは判断していない
# none の callout は「AI・IT導入向けの独自の補助金が見つかりませんでした」と出るので、none の note は確かめ方・相談先（商工会議所・商工会は gov_ai.md の対応表）・無料と資料にある窓口・取り違えの注意を書く
# 「無料」と書いたのは資料に無料とあるものだけ: 佐賀県よろず支援拠点（拠点のサイト「無料で、何度でも」）、みやき町サテライト（町のページ「費用: 無料」）、鳥栖市産業支援相談室〔鳥栖ビズ〕（市のページ「無料で行います」、D34確認）。佐賀県産業スマート化センター・かしまビジネスサポートセンターは無料の記載がない＝無料と書かない
# 佐賀市（saga-city）は佐賀県と別、大町町（omachi-town）は長野県大町市と別、白石町（shiroishi-town）は宮城県白石市と別、鹿島市は茨城県鹿嶋市と別、鳥栖市は鳥取県と別、の注意を note に入れた
