    - {code: kyoto/fukuchiyama, name: 福知山市, note: 福知山市の先端設備等導入支援金は、先端設備等導入計画の認定を受けた市内の中小企業がソフトウェアやシステム、機械を入れる費用の1/10（上限150万円。市の伴走支援を受けた会社は2/10・上限300万円）を支援し、2027-01-31まで受け付けています（事前の申請が必要で、国や他の自治体の同じ種類の補助とは併用できません。2026-11-11確認）。市の産業課（0773-24-7075）か福知山商工会議所（0773-22-2108）・福知山市商工会（0773-56-5151）に確認してください}
