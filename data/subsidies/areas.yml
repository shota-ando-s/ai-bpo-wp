    - {code: shizuoka/yaizu, name: 焼津市, note: 焼津市の中小企業等DX促進モデル事業補助金は、デジタル技術で新しい製品・サービスを作ったり既存のシステムを使って業務の進め方を見直したりする事業の費用を1/2（上限250万円）補助し、交付申請は2027-01-29までです（予算に達すると終了。2026-11-11確認）。事前に市の商工観光課（054-626-1175）への相談が必要で、国やほかの自治体の補助と同じ事業では受けられません。市の事業者デジタル支援窓口（無料）でも相談できます}
    - {code: shizuoka/kakegawa, name: 掛川市, note: 掛川市の新たなビジネススタイル整備支援事業費補助金（小規模企業者のペーパーレス化・EC・会計ソフトなどに1/2・上限5万円）は、予算に達して2026年度の受付を終えました（2026-11-11確認）。今申請できる市独自のAI・IT導入の補助金は見つかりませんでした。窓口は市の産業観光課（0537-21-1125）}
    - {code: shizuoka/fujieda, name: 藤枝市, note: 藤枝市のIT導入事業費補助金は、市内の中小企業が国のデジタル化・AI導入補助金（旧IT導入補助金）を使ったとき、国の補助を引いた自己負担の1/2（上限10万円）を市が上乗せする制度で、国の補助事業が終わってから市に申請します（締切の記載なし。2026-11-11確認）。窓口は市の産業政策課（054-643-3165）}
    - {code: shizuoka/gotemba, name: 御殿場市, none: true, note: 御殿場市の中小企業者支援のページ（助成・補助・融資）で確かめた範囲で、市独自のAI・IT導入や研修の補助金は見つかりませんでした（2026-11-11確認。大規模な設備投資の補助はあります）。御殿場市商工会に相談できます（御殿場市に商工会議所はありません）}
