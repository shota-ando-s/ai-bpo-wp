    - {code: tochigi/nogi, name: 野木町, note: 野木町のスタートアップ支援補助金は、町内で新しく事業を始める人の設備・備品・ホームページ作成・経営相談などの初期費用を1/2（上限50万円）補助する制度で、すでに事業をしている人のIT導入には使えません（随時受付、予算に達するまで。2026-11-06確認）。AI・ITの導入費を補助する町独自の制度は見つかりませんでした。野木町商工会（0280-55-2233）か町の産業振興課 商工観光係（0280-57-4153）に確認してください}
    - {code: tochigi/shioya, name: 塩谷町, note: "塩谷町のローカル10,000プロジェクトは、地域の金融機関の融資を受けて地域の資源を使う新しいビジネスを始める初期投資を、総務省の交付金とあわせて支援する制度で、AI・ITの導入費の補助ではありません（随時受付。2026-11-06確認）。AI・ITの導入費を補助する町独自の制度は見つかりませんでした。塩谷町商工会（0287-45-0511）か町の産業振興課（0287-45-2211）に確認してください。塩谷郡塩谷町の制度で、同じ塩谷郡の高根沢町とは別です"}
    - {code: tochigi/takanezawa, name: 高根沢町, none: true, note: 栃木県塩谷郡高根沢町の産業・ビジネスのページと補助・助成・支援事業一覧で確かめた範囲で、町独自のAI・IT導入や研修の補助金は見つかりませんでした（2026-11-06確認。創業者支援補助金は賃借料の補助です）。県の産業振興センターのAI・IoTソリューション試験導入助成（2/3・上限100万円、2026-12-15 17時まで）は高根沢町の中小企業も対象です。高根沢町商工会（028-675-0337）か町の商工観光課（028-675-8108）に確認してください}
    - {code: tochigi/nasu, name: 那須町, none: true, note: 栃木県那須郡那須町の商工業のページとサイト内検索で確かめた範囲で、町独自のAI・IT導入や研修の補助金は見つかりませんでした（2026-11-06確認。中小企業等エネルギー価格高騰対策支援金は定額の支援金です）。那須町商工会（0287-72-0231）か町の観光商工課 商工係（0287-72-6918）に確認してください。那須塩原市・那須烏山市とは別の町です}
