# 取り違えの注意: 鹿児島市（kagoshima-city）は鹿児島県と別、大崎町（osaki-town、曽於郡）は宮城県大崎市と別、瀬戸内町（setouchi-town、大島郡）は岡山県瀬戸内市と別、大和村（yamato-village、大島郡）は他県の大和町・山都町と別、十島村（toshima-village、鹿児島郡）は東京都の利島村と別、三島村（mishima-village、鹿児島郡）は静岡県三島市と別、を note に入れた
