# 名古屋市・犬山市は今年度の受付を終えた制度しかないが、yml に制度があるので none にせず、note の一文目で状況を書いた（奈良県桜井市・茨城県水戸市と同じ）
# 並びは県の地域ブロック（愛知県人口ビジョンの6区分。spec/D1.md「県の地域区分」の案）: 名古屋（1）→ 尾張北東部（13）→ 尾張中西部・海部（12）→ 知多（10）→ 西三河（10）→ 東三河（8）。区分の中は県の資料（kokucho_pref p.2）の並び（判断 D4-9）
# none の callout は「AI・IT導入向けの独自の補助金が見つかりませんでした」と出るので、none の note は確かめたページ・相談先（商工会議所は日商の一覧、商工会は全国商工会連合会の名簿。gov_ai.md・gov_ai_b.md・gov_ai_c.md）・取り違えの注意を書く
# 「無料」と書いたのは資料に無料とあるものだけ: 愛知県よろず支援拠点（「国が全国に設置している無料の経営相談所」）、あいちデジタル技術活用相談窓口（「無料で 何回でも」、2027-03-18まで）、犬山市の中小企業診断士の無料相談（事業継続支援補助金の要件）。県の AI＆デジタル活用法ワークショップ（参加費無料）は日付が過ぎるので note に入れていない
# 町村の note（subsidy_c の16町村）は町村のサイトを WebFetch の要約でしか読めなかったので「町（村）にも確かめてください」を入れた（奈良の判断 D4-6 と同じ。判断 D4-8）
# 市町村の制度は市町村内に事業所がある事業者が対象で、近くの市町村の事業者は使えない。県の制度で今申請できるのは建設業DX推進支援事業費補助金（建設業者だけ）
- code: aichi
  name: 愛知県
  cities:
    - {code: aichi/nagoya, name: 名古屋市, note: 名古屋市の中小企業デジタル活用支援補助金（ソフトウェア・クラウド・IoT機器などの1/2、通常枠100万円・賃上げ枠150万円）は、2026年度の申請を6/1で締め切りました（ロボット枠も9/30で終了。2026-11-11確認）。来年度の申請には名古屋市新事業支援センター（052-735-0808）か名古屋商工会議所（052-223-5756）でのデジタル活用の相談が要件でした。市内にある愛知県よろず支援拠点・あいち産業振興機構は県内のどの事業者も使える県域の窓口で、名古屋市の窓口ではありません。北名古屋市とは別の市です}
    - {code: aichi/seto, name: 瀬戸市, note: 瀬戸市地域産業振興会議の外部人材活用・専門家派遣事業補助金は、市内の中小企業が中小機構・あいち産業振興機構の専門家派遣や民間の人材サービスを使う費用を1/2（専門家派遣は上限20万円、外部人材は上限10万円）補助します（2026-11-11確認）。補助率・上限は市の事業者支援ガイド2026の図表の値です。業務改善ITツールを補助した職場環境づくり応援補助金は募集を終えました。窓口は市の商工観光課 商工金融係（0561-88-2651）と瀬戸商工会議所}
    - {code: aichi/kasugai, name: 春日井市, note: 春日井市のデジタル化事業助成金は、春日井商工会議所の専門家派遣で診断を受けた市内の中小企業が業務システムを導入・改修する費用を、アナログ業務のデジタル化なら50%（上限10万円）、デジタル化済みの業務の見直しなら20%（上限50万円）助成します。研修事業助成金（公的研修50%・民間研修20%、年30万円まで）もあります。どちらも事業が終わってから90日以内に申請し、国・県の補助と同じ経費には使えません（2026-11-11確認）。窓口は市の企業活動支援課（0568-85-6247）}
