# none: true は _subsidies_kagoshima.yml にその市町村の制度が1件もない31市町村。30は公式サイトの事業者向け・商工業のページで確かめて見つからなかった市町村（日置市・指宿市・南さつま市・出水市・伊佐市・姶良市・垂水市・曽於市・志布志市・西之表市と20町村）、阿久根市は公式サイトに接続できず確かめられなかった市で、note の一文目で「確かめられませんでした」と書いた（断定しない。広島県江田島市・熊本県玉名市と同じ）
# 霧島市・南九州市・大和村は今年度の受付を終えた制度しかないが、yml に制度があるので none にせず、note の一文目で状況を書いた（岡山県玉野市と同じ）。いちき串木野市（副業人材、受付状況不明）・大崎町（企業価値向上、受付状況不明）も none なし
# 並びは県の地域振興局・支庁の7区分（stats.md の region。各局・支庁の「所管区域」のページ。大隅は局のトップの「4市5町」と残りからの当てはめ）の順: 鹿児島（5）→ 南薩（4）→ 北薩（5）→ 姶良・伊佐（4）→ 大隅（9）→ 熊毛（4）→ 大島（12）。区分の中は市（自治体コード順）→ 町村（自治体コード順）
# none の callout は「AI・IT導入向けの独自の補助金が見つかりませんでした」と出るので、none の note は確かめ方・相談先（商工会議所・商工会は gov_ai.md の対応表）・無料と資料にある窓口・取り違えの注意を書く
# 「無料」と書いたのは資料に無料とあるものだけ: 鹿児島県よろず支援拠点（拠点のサイト「経営者の皆さまのあらゆるご相談に無料で応じます」）とそのサテライト（大隅よろず〔鹿屋市産業支援センター〕・指宿よろず〔指宿商工会議所〕・北薩よろず〔川内商工会議所〕・霧島よろず〔霧島市ウェルビーイングセンター〕・奄美大島よろず〔奄美大島商工会議所〕）
# 取り違えの注意: 鹿児島市（kagoshima-city）は鹿児島県と別、大崎町（osaki-town、曽於郡）は宮城県大崎市と別、瀬戸内町（setouchi-town、大島郡）は岡山県瀬戸内市と別、大和村（yamato-village、大島郡）は他県の大和町・山都町と別、十島村（toshima-village、鹿児島郡）は東京都の利島村と別、三島村（mishima-village、鹿児島郡）は静岡県三島市と別、を note に入れた
# 市の制度（鹿児島市・鹿屋市・奄美市など）は市内に本店・事業所がある事業者が対象で、近くの町村の事業者は使えない。県の制度（地域外副業・兼業人材、KISC ＩＴ資格取得支援）は kagoshima の行で全地域に出るので、市町村の note には書いていない
# 令和8年熊本地震のセーフティネット保証4号（19市町村）・県の融資は note に入れない（AI 導入の補助ではない。docs の【D4】「災害の制度」）
