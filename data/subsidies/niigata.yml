# 新潟県（県・公益財団法人にいがた産業創造機構〔NICO〕）と県内市町村（2026年度）。2026-10-24に公式ページ・申請要領・公募要領・交付要綱で確認。元データは data/area/niigata/subsidy_a.yml（20制度）/ subsidy_b.yml（44制度）
# confidence: secondary の制度はない（65制度すべて official。上越市 製造業人材育成支援事業等補助金は subsidy_a.yml になく、市のページで確認して足した）。二次情報だけで見た値（ビジネス変革応援事業の第1回の期間、湯沢町 起業サポート補助金の研修費）は note・expenses から外した。団体向けで企業が使えない制度（NICO 支援機関連携DXセミナー開催事業費助成金、県 若手社員社外ネットワーク構築支援事業補助金、弥彦村 地域振興事業補助金、関川村 むらおこしグループ活動支援補助金、粟島浦村 離島人材育成基金助成事業〔二次情報〕）は元データの段階で入っていない。阿賀町 地域チャレンジ支援事業は、町内事業者が使える特産品開発・魅力向上支援の値で入れた
# 柏崎市・刈羽村の「F補助金」（原子力発電施設等周辺地域企業立地支援給付金）は、AI・IT導入の補助金ではなく中身も確かめていないので入れていない（docs/area-writing-spec-niigata.md の決めたこと13）
# 県の補助金で「AI」を名前に掲げ、一般の中小企業が自社の業務効率化に使えるものはない。AIを名指しした県のAI活用推進ラボ事業補助金（申請者はAI開発者、2次公募2026-09-30で終了）とNICOのDX先端技術活用サービス等開発支援事業（生成AIなどを使った新製品の開発、二次募集2026-06-19で終了）は、どちらも開発・実証向けで今年度の受付は終わっている
# 受付中の県の制度は「ビジネス変革応援事業補助金」第2回だけ（2026-10-29必着、商工会・商工会議所の確認が必要、売上等の減少要件あり）。DX対応枠の補助率は申請要領 p14 の2/3（佐渡市のサイトの県資料の表を文字で取り出すと1/2に見えるのは読み違い）。生産性向上枠は1/2
# 市町村でAIを名指ししているのは、燕市 スマートファクトリー加速化補助金（国の補助金の説明の引用）、新潟市 人材育成助成金（対象研修の例にマナビDX「AI・デジタル基礎講座」。締切は制度のページの2027年2月末）、十日町市 デジタル人材育成支援事業補助金、阿賀野市 中小企業人材育成支援事業補助金（中小企業大学校の生成AI講座を例示）。十日町市 デジタル技術導入支援はチラシの例にAI-OCRがあるだけ
# 国の補助金への上乗せ（addon）は燕市 スマートファクトリー加速化補助金だけ（remaining ratio 0.5。国の交付決定が前提）。十日町市の2制度は他の公的補助金を差し引いた額が対象だが、上乗せの制度とは書かれていないので addon は書いていない。県 ビジネス変革応援事業、新潟市 省力化・省エネ化、三条市 デジタル化推進、新発田市 市内産業DX推進、刈羽村 生産性向上促進は国・県などの補助を受ける事業・経費を対象外にしている
# 佐渡市 雇用機会拡充事業補助金は、雇用増を伴う創業・事業拡大の補助（国境離島の交付金）で、AI導入の補助金ではない（令和9年度事業の公募、上限額は予定額）。note に明記した
# 受付状況が分からない制度（長岡市 EC出店、十日町市 地場産品開発販売支援、田上町の2制度、出雲崎町 キャッシュレス、津南町 人材育成、関川村 研修）は status: unknown。市町村に確認が要る
# 粟島浦村は事業者向けの独自の制度が見つからない（areas.yml で none）

