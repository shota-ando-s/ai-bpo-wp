# data/subsidies/areas.yml の末尾に足す広島県の部分（D34、2026-11-01）。親が最後に areas.yml に入れる（data/subsidies/hiroshima.yml〔案は data/area/hiroshima/_subsidies_hiroshima.yml〕と同じコミット。areas.yml は直接編集していない）
# none: true は _subsidies_hiroshima.yml にその市町の制度が1件もない13市町（竹原市・三原市・安芸高田市・江田島市と9町）。広島市・尾道市・府中市は今年度の受付を終えた制度しかないが、yml に制度があるので none にせず、note の一文目で状況を書いた
# 並びは県の7つの二次保健医療圏（stats.md の region。県「広島県保健医療計画 5 救急医療の連携体制」令和6年4月1日現在）の順: 広島 → 広島西 → 呉 → 広島中央 → 尾三 → 福山・府中 → 備北。圏域の中は市→郡の町（広島圏域は 広島市・安芸高田市 → 安芸郡4町 → 山県郡2町）
# 9町は町のサイトの事業者向けページ・商工担当課の記事一覧を開いて確かめた（subsidy_b_areas.md。県の DB だけでは判断していない）。熊野町は組織一覧を開けず、分類ページ・サイトマップで判断した。江田島市は市の公式サイトが緊急メンテナンスで閲覧停止中のため「確かめられなかった」と書く（断定しない）
# none の callout は「AI・IT導入向けの独自の補助金が見つかりませんでした」と出るので、none の note は確かめ方・相談先・使える近隣の制度・取り違えの注意を書く
# 府中市（備後、hiroshima/fuchu-city）と府中町（安芸郡、hiroshima/fuchu-town）、三原市（高知県三原村と別）、三次市（徳島県三好市と別）の取り違えの注意を note に入れた
- code: hiroshima
  name: 広島県
  cities:
    - {code: hiroshima/hiroshima-city, name: 広島市, note: 生産性向上の取組（顧客管理システムの導入など）に3/4（上限200万円）を支給する生産性向上等チャレンジ応援金は、2026年度の申請が2026-06-19で終わりました（2026-11-01確認）。ものづくり企業向けのIT導入アドバイザー派遣も令和8年度は募集を終えています。広島市中小企業支援センターか広島商工会議所に相談してください}
    - {code: hiroshima/akitakata, name: 安芸高田市, none: true, note: 市の商工観光と事業者向けのページで確かめた範囲で、市独自のAI・IT導入や研修の補助金は見つかりませんでした（2026-11-01確認）。安芸高田市商工会か市の商工観光課に確認してください}
    - {code: hiroshima/fuchu-town, name: 府中町, none: true, note: 町の事業者向けの助成金のページで確かめた範囲で、町独自のAI・IT導入や研修の補助金は見つかりませんでした（2026-11-01確認）。府中町商工会か町の自治振興課 商工観光係に確認してください。安芸郡の府中町で、備後の府中市とは別の町です（府中市の補助金は使えません）}
    - {code: hiroshima/kaita, name: 海田町, none: true, note: 町の事業者向け支援のページで確かめた範囲で、町独自のAI・IT導入や研修の補助金は見つかりませんでした（2026-11-01確認）。広島安芸商工会か町の資産活用課に確認してください}
    - {code: hiroshima/kumano, name: 熊野町, none: true, note: 町の事業者向けのページとサイトマップで確かめた範囲で、町独自のAI・IT導入や研修の補助金は見つかりませんでした（2026-11-01時点）。熊野町商工会か町役場に確認してください}
    - {code: hiroshima/saka, name: 坂町, none: true, note: 町の事業者支援のページと記事の検索で確かめた範囲で、町独自のAI・IT導入や研修の補助金は見つかりませんでした（2026-11-01確認）。広島安芸商工会か町役場に確認してください}
    - {code: hiroshima/akiota, name: 安芸太田町, none: true, note: 町の事業者支援のページで確かめた範囲で、町独自のAI・IT導入や研修の補助金は見つかりませんでした（2026-11-01確認）。新分野進出などを1/2（上限100万円）補助するがんばるビジネス応援補助金は、令和8年度の申請が2026-06-19で終わっています。安芸太田町商工会に確認してください}
    - {code: hiroshima/kitahiroshima, name: 北広島町, none: true, note: 町の事業者支援制度の一覧で確かめた範囲で、町独自のAI・IT導入や研修の補助金は見つかりませんでした（2026-11-01確認）。北広島町商工会か町の商工観光課、広島県よろず支援拠点（無料）に相談してください}
    - {code: hiroshima/otake, name: 大竹市, note: 中小企業人材育成事業は、市内の中小企業の従業員が中小企業大学校広島校の研修や技能講習を受けた費用の半額（年20万円まで）を助成します。受講後、2027-03-31までに申請します（2026-11-01確認）。AIの講座が対象になるかは講座ごとに市の産業振興課に確認してください}
    - {code: hiroshima/hatsukaichi, name: 廿日市市, note: 中小企業大学校広島校研修受講補助金は、市内の中小企業が同校の研修を受ける受講料を1/2（1事業者5万円まで）補助します（2026-11-01確認）。市の産業振興課に確認してください}
    - {code: hiroshima/kure, name: 呉市, note: 中小企業等賃上げ応援奨励金は、従業員の賃上げをして従業員が市のAIシンポジウムかAI等セミナーに参加した市内の中小企業に、1人5万円（最大50万円）を支給し、AI導入などの研修（約10時間以上）の受講などで同額を上乗せします（最大100万円）。申請は2026-12-28までです（2026-11-01確認）。中小企業大学校広島校などのセミナーの受講料を1/2（1事業所20万円まで）補助する中小企業人材育成研修費補助金もあります}
    - {code: hiroshima/etajima, name: 江田島市, none: true, note: 市の公式サイトが緊急メンテナンスで閲覧を停止していたため、市独自の制度を確かめられませんでした（2026-11-01時点）。江田島市商工会か市役所（0823-43-1111）に確認してください}
    - {code: hiroshima/higashihiroshima, name: 東広島市, note: 人材育成等支援事業補助金は、市内の中小企業が従業員のリスキリングのために受ける研修の受講料や、専門家を招く社内研修の費用を1/2（上限20万円。研修の受講は1人5万円まで）補助し、2027-02-26まで申請できます（2026-11-01確認）。広島テクノプラザの指定研修（生成AIやデータ分析の講座を含む）を中小企業は受講料の2/3引きで受けられるものづくり技術高度化研修事業もあります}
    - {code: hiroshima/takehara, name: 竹原市, none: true, note: 市の補助金・助成金の一覧と中小企業等支援のページで確かめた範囲で、市独自のAI・IT導入や研修の補助金は見つかりませんでした（2026-11-01確認）。備後圏域の事業者として福山市「ものづくり大学」の指定講座（生成AIの講座を含む）を受講料の半額で受けられます。竹原商工会議所に確認してください}
    - {code: hiroshima/osakikamijima, name: 大崎上島町, none: true, note: 町の産業・労働と手当・助成のページで確かめた範囲で、町独自のAI・IT導入や研修の補助金は見つかりませんでした（2026-11-01確認）。大崎上島町商工会か町の地域経営課に確認してください}
    - {code: hiroshima/mihara, name: 三原市, none: true, note: 市の商工振興課の記事一覧で確かめた範囲で、市独自のAI・IT導入や研修の補助金は見つかりませんでした（2026-11-01確認。賃上げ支援事業補助金は賃上げの定額補助です）。備後圏域の事業者として福山市「ものづくり大学」の指定講座を受講料の半額で受けられます。三原商工会議所か三原臨空商工会に確認してください。広島県の三原市で、高知県三原村とは別の市です}
    - {code: hiroshima/onomichi, name: 尾道市, note: 生成AIによる自動受注システムなどの導入やDXの研修に1/2（上限250万円）を補助した中小企業等臨時特別支援事業は、2026-07-29に予算に達して受付を終えました（2026-11-01確認）。備後圏域の事業者として福山市「ものづくり大学」の指定講座を受講料の半額で受けられます。尾道商工会議所・因島商工会議所・尾道しまなみ商工会か市の商工課に確認してください}
    - {code: hiroshima/sera, name: 世羅町, none: true, note: 町の商工観光課の記事一覧で確かめた範囲で、町独自のAI・IT導入や研修の補助金は見つかりませんでした（2026-11-01確認）。備後圏域の事業者として福山市「ものづくり大学」の指定講座（生成AIの講座を含む）を受講料の半額で受けられます。世羅町商工会に確認してください}
    - {code: hiroshima/fukuyama, name: 福山市, note: 経営環境対応支援事業補助金は、物価高騰や調達難に対応する取組（原価管理・在庫管理・受発注管理のシステム導入など）の費用を1/2（上限30万円）補助し、2027-03-12まで申請できます（2026-11-01確認）。AI在庫管理システムなどを例に挙げたグリーンな企業賃上げ環境整備支援事業補助金は2026-10-23に予算に達して終わりました。生成AIの講座を含む「ものづくり大学」の指定講座は受講料の半額で受けられます}
    - {code: hiroshima/fuchu-city, name: 府中市, note: ITツールやIoT機器の導入に4/5（上限200万円）を補助する業務効率化支援補助金は、2026年度は受付初日の2026-05-11に予算に達して終わりました（2026-11-01確認）。備後圏域の事業者として福山市「ものづくり大学」の指定講座を受講料の半額で受けられます。府中商工会議所か上下町商工会に確認してください。備後の府中市で、安芸郡の府中町とは別の市です}
    - {code: hiroshima/jinsekikogen, name: 神石高原町, none: true, note: 町の事業者向けの企業支援と産業課のページで確かめた範囲で、町独自のAI・IT導入や研修の補助金は見つかりませんでした（2026-11-01確認）。備後圏域の事業者として福山市「ものづくり大学」の指定講座（生成AIの講座を含む）を受講料の半額で受けられ、びんごデジタルラボのICT相談も使えます。神石高原商工会に確認してください}
    - {code: hiroshima/miyoshi, name: 三次市, note: 外部人材活用支援事業補助金は、製造業・卸売業・小売業・建設業・宿泊業・飲食サービス業の市内の中小企業が、DXなどの課題で外部の専門人材に業務を委託する費用を1/2（1人20万円まで）補助します（2026-11-01確認）。市の商工観光課か三次商工会議所・三次広域商工会に確認してください。広島県の三次市（みよしし）で、徳島県三好市とは別の市です}
    - {code: hiroshima/shobara, name: 庄原市, note: 外部人材活用支援事業補助金は、市内の中小企業が人材紹介会社を通じて市外の専門人材に業務を委託する費用を1/2（上限20万円。県内在住の人材は10万円）補助します（2026-11-01確認）。市の商工振興課か庄原商工会議所・備北商工会・東城町商工会に確認してください}
