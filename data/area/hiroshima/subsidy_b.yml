# 広島県の9町（府中町・海田町・熊野町・坂町・安芸太田町・北広島町・大崎上島町・世羅町・神石高原町）の AI・IT・DX・研修向けの補助金（2026年度）。2026-11-01に各町の公式サイトの事業者向けのページ・商工担当課の記事一覧（坂町は WordPress の検索 API で「補助金」「DX」「研修」の記事も）と、県の「広島県DX推進コミュニティ」の支援メニュー検索（https://dx-hiroshima.jp/shien/ 、町で絞り込み）で確認
