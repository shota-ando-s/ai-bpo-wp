# areas.yml に足す群馬県の行（D345 の下書き、2026-11-06。data/subsidies/areas.yml は編集していない。親が最後に areas.yml の末尾に足す。先頭のコメント5行は areas.yml に入れなくてよい）
# none: true は data/area/gunma/_subsidies_gunma.yml にその市町村の制度が1件もない23市町村（渋川市・安中市と、東吾妻町・嬬恋村以外の21町村）。伊勢崎市・みどり市は今年度終わった制度しかないが、yml に制度があるので none にせず note の一文目で状況を書いた
# 並びは団体コードの順（12市→北群馬郡→多野郡→甘楽郡→吾妻郡→利根郡→佐波郡→邑楽郡）。県の9振興局の並びにするかは D345 の判断（D4 判断 9）
# 上野村の note は D345 が2026-11-06に村の公式サイト（uenomura.jp）の事業者向けのページを開いて確かめた結果。subsidy_b の「サイト503で確かめられなかった」から変えた（D4 判断 8。親が「確かめられなかった」に戻すなら note を差し替える）
# note に ASCII のコンマ・コロン・URL を入れない（flow の書き方で yaml.safe_load が壊れるため）。県の制度（今申請できる AI・IT 向けはない）は市町村の note に書いていない
- code: gunma
  name: 群馬県
  cities:
    - {code: gunma/maebashi, name: 前橋市, note: 前橋市の人財スキルアップ補助金は、2026年12月31日までに従業員が受けて支払いを済ませた研修・セミナー（オンライン可）の費用を1/2（小規模企業者2/3。上限7万円、DXの人材育成を含むと12万円）補助し、2027-01-04〜01-29に申請します（2026-11-06確認）。ソフトウェア・システムの導入に使える前橋市DX推進補助金は、2026年度の受付を5月22日で終えました。窓口は市の産業政策課 産業政策係（027-898-6983）}
    - {code: gunma/takasaki, name: 高崎市, note: 高崎市の中小企業等機械設備導入支援助成金は、生産用の機械設備をリースで入れたときにリース料の一部を最長5年助成する制度で、事前申請は2026-12-31までです（2026-11-06確認）。パソコンなどの事務機器は対象外で、AIツールなどソフトウェアだけの導入に使える市独自の補助金は見つかりませんでした。窓口は市の商工振興課（027-321-1256）}
    - {code: gunma/kiryu, name: 桐生市, note: 桐生市の中小企業人材養成事業は、経営者・従業員が受ける研修（通信教育・オンラインを含む）の費用を1/2（5万〜10万円まで）補助し、随時受け付けています（研修開始の10日前までに申請。2026-11-06確認）。パソコン研修は対象外のため、AI研修が対象になるかは市の商工振興課に確認してください。AI・ITツールの導入に使える市独自の補助金は見つかりませんでした}
    - {code: gunma/isesaki, name: 伊勢崎市, note: IT・IoT化の設備やホームページの作成、DX講座の受講などに1/2（上限50万円）を補助する伊勢崎市小規模事業者サポート補助金は、2026年度の申請を7月10日で締め切りました（2026-11-06確認）。今申請できる市独自のAI・IT導入の補助金は見つかりませんでした。伊勢崎商工会議所か群馬伊勢崎商工会に確認してください}
    - {code: gunma/ota, name: 太田市, note: 太田市DX推進補助金は、市内の建設業・製造業・運輸業などの中小企業（法人）が業務効率化のソフトウェアやシステムを買い切りで入れる費用を1/2（上限100万円、対象経費50万円以上）補助し、2026-12-28の17時まで受け付けています（先着順で予算に達すると終了。2026-11-06確認）。クラウドの月額利用料・サブスクリプションは対象外で、国などの補助金と同じ経費には使えません。窓口は市の産業ミライ推進課（0276-47-1850）}
    - {code: gunma/numata, name: 沼田市, note: 沼田市の人材活用支援金は、県のプロフェッショナル人材戦略拠点に登録された紹介会社を通じてDXなどの副業人材を使った費用（紹介手数料と委託料）を10/10（上限10万円）支援します。副業人材と契約する前に事業計画書を出します（2026-11-06確認）。AI・ITツールの導入に使える市独自の補助金は見つかりませんでした。窓口は市の産業振興課 商工振興係（0278-23-2111）}
    - {code: gunma/tatebayashi, name: 館林市, note: 館林市の中小企業人材養成事業助成金は、中小機構・ポリテクセンター・群馬県立産業技術センター・県立産業技術専門校の研修に従業員を派遣した受講料を1/2（年3万円まで）助成します。民間のAI研修は対象外です。市のページの更新が2021年のため、今年度の受付は市の商工課 工業振興係（0276-47-5148）に確認してください（2026-11-06確認）}
    - {code: gunma/shibukawa, name: 渋川市, none: true, note: 渋川市の中小企業向け支援・経営支援のページで確かめた範囲で、市独自のAI・IT導入や研修の補助金は見つかりませんでした（2026-11-06確認。展示会出展・店舗改装・職場環境づくりの補助はあります）。渋川商工会議所かしぶかわ商工会に確認してください}
    - {code: gunma/fujioka, name: 藤岡市, note: 藤岡市の小規模事業者省エネルギー・効率化支援補助金は、POSレジや在庫・予約管理システムなどの業務効率化設備に4/5（上限20万円、対象経費10万円以上）を補助し、2026-11-30の17時必着で受け付けています（2026-11-06確認）。小規模事業者だけが対象で、国・県の補助金を使う設備・経費には使えません。窓口は市の商業観光課（0274-40-2318）}
    - {code: gunma/tomioka, name: 富岡市, note: 富岡市の副業人材活用事業補助金は、県のプロ人材戦略拠点の連携先を通じてDXなどの副業人材を使ったときの紹介手数料を全額（上限10万円）、報酬を1/2（上限15万円）補助します（2026-11-06確認。市のページの更新は2024年）。ECサイトの開設の補助もありますが、AI・ITツールの導入に使える市独自の補助金は見つかりませんでした。窓口は市の産業振興課（0274-62-1511）}
    - {code: gunma/annaka, name: 安中市, none: true, note: 安中市の企業・経営・中小企業支援と雇用・労働支援のページで確かめた範囲で、市独自のAI・IT導入や研修の補助金は見つかりませんでした（2026-11-06確認。創業者サポート補助金などはあります）。安中市商工会か安中市松井田商工会に確認してください（安中市に商工会議所はありません）}
    - {code: gunma/midori, name: みどり市, note: ソフトウェアやIoT機器の導入に2/3（一般枠100万円・製造業の重点枠500万円まで）を補助するみどり市生産性向上等設備投資支援補助金は、予算に達して2026年度の新規受付を終えました（2026-11-06確認）。みどり市商工会か笠懸町商工会、市の商工課 商工労政係（0277-76-1938）に確認してください}
    - {code: gunma/shinto, name: 榛東村, none: true, note: 北群馬郡榛東村の商工業のページ（商業・工業の支援制度と地域企業支援）で確かめた範囲で、村独自のAI・IT導入や研修の補助金は見つかりませんでした（2026-11-06確認）。榛東村商工会か村の産業振興課 商工観光係（0279-54-2211）に確認してください}
    - {code: gunma/yoshioka, name: 吉岡町, none: true, note: 北群馬郡吉岡町の商工業のページ（企業版ふるさと納税・プレミアム商品券・事業承継など）で確かめた範囲で、町独自の事業者向けの補助金は見つかりませんでした（2026-11-06確認）。吉岡町商工会に確認してください}
    - {code: gunma/ueno-village, name: 上野村, none: true, note: 群馬県多野郡上野村の公式サイトの事業者向けのページ（税・入札・制度資金・農林業）で確かめた範囲で、村独自のAI・IT導入や研修の補助金は見つかりませんでした（2026-11-06確認）。上野村役場2階の上野村商工会に確認してください}
    - {code: gunma/kanna, name: 神流町, none: true, note: 多野郡神流町のしごと・産業のページに商工業・事業者向けの補助金の案内がなく、町独自のAI・IT導入や研修の補助金は見つかりませんでした（2026-11-06確認）。神流町商工会に確認してください}
    - {code: gunma/shimonita, name: 下仁田町, none: true, note: 甘楽郡下仁田町の産業・事業者のページで確かめた範囲で、町独自のAI・IT導入や研修の補助金は見つかりませんでした（2026-11-06確認。創業の支援やねぎ・こんにゃくの食材料費の支援はあります）。下仁田町商工会か町の商工観光課 商工観光係（0274-64-8805）に確認してください}
    - {code: gunma/nanmoku, name: 南牧村, none: true, note: 群馬県甘楽郡南牧村（なんもく）の各種補助金と産業情報のページで確かめた範囲で、事業者向けの村の補助金は見つかりませんでした（2026-11-06確認）。南牧村商工会に確認してください。長野県南佐久郡の南牧村とは別の村です}
    - {code: gunma/kanra, name: 甘楽町, none: true, note: 甘楽郡甘楽町の産業課 商工観光係のお知らせで確かめた範囲で、町独自のAI・IT導入や研修の補助金は見つかりませんでした（2026-11-06確認。店舗の器具購入・改装の補助はあります）。甘楽町商工会か町の産業課 商工観光係（0274-64-8320）に確認してください}
    - {code: gunma/nakanojo, name: 中之条町, none: true, note: 吾妻郡中之条町の起業・経営・事業者支援のページで確かめた範囲で、町独自のAI・IT導入や研修の補助金は見つかりませんでした（2026-11-06確認。サテライトオフィスの開設や起業の支援はあります）。中之条町商工会に確認してください}
    - {code: gunma/naganohara, name: 長野原町, none: true, note: 吾妻郡長野原町の商工業に係る各種制度（小口資金の融資と利子補給）などのページで確かめた範囲で、町独自のAI・IT導入や研修の補助金は見つかりませんでした（2026-11-06確認）。長野原町商工会に確認してください}
    - {code: gunma/tsumagoi, name: 嬬恋村, note: 嬬恋村の売上アップ事業補助金は、村内の小規模企業者が販売促進や業務効率化のために使う機械装置・開発費・委託外注費・専門家の謝金などに1/2（上限50万円、事業費10万円以上）を補助します。事業を始める前に嬬恋村商工会を通じて申請します。村のページに受付期間の記載がないため、今年度の受付と予算は村の観光商工課 商工係に確認してください（2026-11-06確認）。AIを名指しした制度ではありません}
    - {code: gunma/kusatsu, name: 草津町, none: true, note: 群馬県吾妻郡草津町（滋賀県草津市とは別）のサイトの各分類の一覧で確かめた範囲で、事業者向けの町の補助金は見つかりませんでした（2026-11-06確認）。草津町商工会に確認してください}
    - {code: gunma/takayama-village-gunma, name: 高山村, none: true, note: 群馬県吾妻郡高山村（長野県上高井郡の高山村とは別）の産業のページで確かめた範囲で、商工業の事業者向けの村の補助金は見つかりませんでした（2026-11-06確認）。高山村商工会に確認してください}
    - {code: gunma/higashiagatsuma, name: 東吾妻町, note: 東吾妻町の中小事業者持続化及びSDGs推進補助金は、販路拡大や新製品開発のためのレジ・設計用CADソフト・WEBサイトの作成・ネット販売システムなどの費用を50%（町外の業者は30%、上限20万〜30万円）補助します。2026-12-31までに実施した事業を2027-01-29必着で申請でき、予算に達すると終わります（2026-11-06確認）。窓口は町のまちづくり推進課（0279-68-2111）}
    - {code: gunma/katashina, name: 片品村, none: true, note: 利根郡片品村の商工観光係と産業と労働のページで確かめた範囲で、事業者のAI・IT導入や研修の補助金は見つかりませんでした（2026-11-06確認。合宿の誘致や起業の支援はあります）。片品村商工会に確認してください}
    - {code: gunma/kawaba, name: 川場村, none: true, note: 利根郡川場村の産業のページ（山村振興計画・先端設備等導入計画など）で確かめた範囲で、事業者向けの村の補助金は見つかりませんでした（2026-11-06確認）。川場村商工会に確認してください}
    - {code: gunma/showa-village-gunma, name: 昭和村, none: true, note: 群馬県利根郡昭和村（福島県大沼郡の昭和村とは別）の産業のページで確かめた範囲で、事業者向けの村の補助金は見つかりませんでした（2026-11-06確認）。昭和村商工会に確認してください}
    - {code: gunma/minakami, name: みなかみ町, none: true, note: 利根郡みなかみ町の補助金・支援制度のページで確かめた範囲で、個々の事業者のAI・IT導入や研修に使える町の補助金は見つかりませんでした（2026-11-06確認。観光団体向けの補助や融資の利子補給はあります）。みなかみ町商工会か町の観光商工課 商工振興係（0278-25-5018）に確認してください}
    - {code: gunma/tamamura, name: 玉村町, none: true, note: 佐波郡玉村町の事業者向け情報と産業・労働のページで確かめた範囲で、町独自のAI・IT導入や研修の補助金は見つかりませんでした（2026-11-06確認。企業立地の奨励金や制度資金はあります）。玉村町商工会に確認してください}
    - {code: gunma/itakura, name: 板倉町, none: true, note: 邑楽郡板倉町の商工業のページで確かめた範囲で、町独自のAI・IT導入や研修の補助金は見つかりませんでした（2026-11-06確認。国の持続化補助金の紹介はありますが町の上乗せはありません）。板倉町商工会に確認してください}
    - {code: gunma/meiwa, name: 明和町, none: true, note: 群馬県邑楽郡明和町（三重県の明和町とは別）の事業者向けの商工のページで確かめた範囲で、町独自のAI・IT導入や研修の補助金は見つかりませんでした（2026-11-06確認）。明和町商工会に確認してください}
    - {code: gunma/chiyoda, name: 千代田町, none: true, note: 群馬県邑楽郡千代田町の事業者向け・商工のページで確かめた範囲で、AI・IT導入や研修に使える町独自の補助金は見つかりませんでした（2026-11-06確認。店舗の改装と設備の導入に1/2（上限20万円）を補助する店舗リニューアル補助金はありますがITの明記はありません）。千代田町商工会に確認してください}
    - {code: gunma/oizumi, name: 大泉町, none: true, note: 邑楽郡大泉町の融資・助成のページと令和8年度の各種補助制度の案内で確かめた範囲で、AI・IT導入や研修に使える町独自の補助金は見つかりませんでした（2026-11-06確認。製造業の設備の固定資産税額をもとにした設備導入奨励金はあります）。大泉町商工会に確認してください}
    - {code: gunma/ora, name: 邑楽町, none: true, note: 邑楽郡邑楽町の産業・企業のページで確かめた範囲で、町独自のAI・IT導入や研修の補助金は見つかりませんでした（2026-11-06確認）。邑楽町商工会に確認してください}
