# 群馬県 15町（吉岡町・神流町・下仁田町・甘楽町・中之条町・長野原町・草津町・東吾妻町・みなかみ町・玉村町・板倉町・明和町・千代田町・大泉町・邑楽町）8村（榛東村・上野村・南牧村・嬬恋村・高山村・片品村・川場村・昭和村）2026年度
# 確認日 2026-11-06。根拠は subsidy_b_areas.md
# 生成AI・AI導入・IT導入・DX・研修を名指しで補助する町村独自の制度は、23町村とも確認できなかった
# IT・業務効率化・ホームページに使える町村独自の制度は2件: 東吾妻町 中小事業者持続化及びSDGs推進補助金（キャッシュレス・インボイス対応レジ、設計用CADソフト、WEBサイト作成・ネット販売システムの委託など、町内業者50%・町外30%、上限20万〜30万円、事業期間 2026-04-01〜12-31・申請 2027-01-29 必着まで、国の持続化補助金と重複可〔確定後の残りの経費が対象〕）と、嬬恋村 売上アップ事業補助金（小規模企業者の販売促進・業務効率化、機械装置・開発費・委託外注費・専門家謝金など1/2・50万円、受付期間の記載なし）
# ぐんま技術革新チャレンジ補助金（県と市町村の共同、令和8年度は5/15で終了）の実施町村は 榛東村・下仁田町・甘楽町・東吾妻町・みなかみ町・玉村町・板倉町・明和町・千代田町・大泉町・邑楽町（県の制度として subsidy_a.yml の gunma-gijutsu-kakushin-challenge に入れた）
# 国の補助金（national.yml）への町村の上乗せ（addon）は見つからない。東吾妻町は国・県等の補助額を差し引いた後の経費を対象にする形だが、持続化補助金は national.yml になく、補助率も上乗せ先に連動しないので addon は書いていない
# 上野村の公式サイト（www.vill.ueno.gunma.jp）は2026-11-06に503（Internet Archive も403）で確かめられていない
# 県の制度・県域の機関・12市は subsidy_a 担当
# 期間の status は data/subsidies/README.md の値（open / closed / rolling / unknown）。来年度の見込み（next_expected）は書かない

# ---- 東吾妻町 ----
- id: gunma-higashiagatsuma-jizokuka-sdgs
  name: 令和8年度 東吾妻町中小事業者持続化及びSDGs推進補助金
  org: 東吾妻町（まちづくり推進課）
  area: gunma/higashiagatsuma
  max_yen: 300000
  rate: 町内事業者が施工・町内事業者から購入は対象経費の50%、町外事業者は30%。上限は町税（法人町民税・住民税）を東吾妻町に納めている場合30万円、それ以外20万円
  rate_num: 0.5
  min_cost_yen: 100000
  targets: {efficiency: △, consulting: ×, training: ×}
  expenses: 別表の経費区分 1 機械装置等費（設計用CADソフト・3Dプリンター等を例示、中古可）2 備品等購入費（キャッシュレス決済端末・キャッシュレス対応レジ・セルフレジ・インボイス対応レジ、生産性向上のための備品。スマートフォン・タブレット・パソコン本体、PC周辺機器、家庭用ソフト、既存ソフトの更新料は対象外）3 改修費 4 広報費（新たなネット販売システムの構築やWEBサイト作成の委託等を含む。ネット通信費は対象外）5 展示会等出展費 6 旅費 7 借料（新規事業の機器リース料など）8 車両費（キッチンカー等）。補助対象品の単価5万円以上
  conditions: 町内に事業所がある中小企業基本法の中小企業者（個人事業者を含む。社会福祉法人・医療法人・一般社団財団法人・NPO法人も対象）で町税完納、今後1年以上事業継続。SDGsの目標8・9・11・12をターゲットとする販路拡大か新製品開発の事業。農林水産業（6次産業の加工・販売は可）・フランチャイズ店などは対象外。交付は1事業者につき年1回で、交付年度の末日から1年経過しないと再申請できない。国・県等から同様の経費に補助がある場合は、その交付額を差し引いた後の金額が対象（商工会連合会の小規模事業者持続化補助金等との重複も可能と明記）
  period: {status: open, start: 2026-06-01, end: 2027-01-29}
  url: https://www.town.higashiagatsuma.gunma.jp/www/contents/1774511247401/index.html
  checked: 2026-11-06
  confidence: official
  note: 町のページで「令和8年6月１日（月）から申請開始し、受領順で審査」「申請期限 令和9年１月29日（金）〈必着〉（予算の範囲内での補助であるため、申請期間内であっても本事業を終了とする場合があります）」。補助対象期間は 2026-04-01〜2026-12-31 に実施する（した）事業。別表 https://www.town.higashiagatsuma.gunma.jp/www/contents/1774511247401/files/beppyou3.pdf （5ページ、PDF作成2026-06-12）p1〜p2。別表の広報費の欄に「令和６年度内なら○」と古い年度の記載が残っている。予算残額は回答しないとページにある。問い合わせは 0279-68-2111（内線2242）、t-shinko@town.higashiagatsuma.gunma.jp
  fuenn_note: 東吾妻町の中小事業者が、販路拡大・新製品開発のためのレジ・CADソフト・WEBサイト作成・ネット販売システムなどの費用を50%（町外業者は30%、最大20万〜30万円）補助する町の制度です。2026年12月31日までに実施した事業を、2027年1月29日必着まで申請できます（予算に達すると終了）。国の持続化補助金と重ねる場合は、国の補助額を引いた残りが対象です。

# ---- 嬬恋村 ----
- id: gunma-tsumagoi-uriage-up
  name: 嬬恋村売上アップ事業補助金
  org: 嬬恋村（観光商工課 商工係。申請・実績報告は嬬恋村商工会を経由）
  area: gunma/tsumagoi
  max_yen: 500000
  rate: 補助対象経費の1/2、1事業者あたり交付限度額50万円（千円未満切り捨て）
  rate_num: 0.5
  min_cost_yen: 100000
  small_only: true
  targets: {efficiency: △, consulting: △, training: ×}
  expenses: 交付要綱第4条の機械装置等購入費、広告費、旅費（専門家の招へい）、開発費、資料購入費、雑役務費、借料、専門家に係る謝金、委託・外注費、店舗等改修費。ソフトウェア・クラウド利用料の個別の記載はない
  conditions: 村内に事業所がある小規模企業者（中小企業基本法第2条第5項）で村税等完納、個人事業主は住民登録。販売促進か業務効率化の事業で1事業10万円以上。原則として村内業者に工事等を発注。他の補助金の交付を受けている事業は対象外。事業開始前に申請（嬬恋村商工会経由）
  period: {status: rolling}
  url: https://www.vill.tsumagoi.gunma.jp/www/contents/1000000000246/index.html
  checked: 2026-11-06
  confidence: official
  note: 村のページに受付期間・更新日の記載がない。交付要綱 https://www.vill.tsumagoi.gunma.jp/www/contents/1000000000246/simple/uriageappu.pdf （4ページ、PDF作成2025-03-03）p1〜p2。実績報告は完了の翌日から30日か交付決定年度の末日の早い日まで。今年度の予算・残額は確かめていない（村に確認が要る）。目的に「業務効率化」が明記されている
  fuenn_note: 嬬恋村の小規模企業者が、販売促進や業務効率化のための機械装置・開発・外注・専門家の謝金などに使う費用を1/2（最大50万円、事業費10万円以上）補助する村の制度です。事業を始める前に嬬恋村商工会を通じて申請します。国・県の補助金とは併用できません。
