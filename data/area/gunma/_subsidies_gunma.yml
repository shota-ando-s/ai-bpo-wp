# data/subsidies/gunma.yml は data/area/gunma/subsidy_a.yml（県・群馬県産業支援機構と12市、16制度）と subsidy_b.yml（15町8村、2制度）を結合した18制度（すべて confidence: official）。2026-11-06確認
# 【下書き】D345（補助金）の案の直しを入れてある（「# 案」のコメント）。親が決めたら「# 案」の行を消す
# 県域で AI・デジタルを名指しした補助（ぐんまDX技術革新補助金 1/2・1,000万円、ぐんま技術革新チャレンジ補助金 1/2〔小規模4/5〕・80万円）は、どちらも製品・サービスの「開発」の補助で、2026年度の募集は2026-05-15で終了（closed・next_expected なし＝診断に出ない）。既存のソフトウェアの自社への導入が主な目的の申請は対象外
# 県の交通運輸事業者DX推進補助金（バス・タクシー・トラックの配車・点呼システム 1/2・10万円）も2次が2026-10-30で終了。今申請できる県の AI・IT 向けの補助はない
# 今申請できる市町村の制度（2026-11-06）: 太田市 DX推進補助金（2026-12-28 17時）・藤岡市 小規模事業者省エネルギー・効率化支援（2026-11-30 17時必着）・高崎市 機械設備導入支援助成金（リース、事前申請 2026-12-31）・前橋市 人財スキルアップ（申請 2027-01-04〜01-29）・東吾妻町 持続化及びSDGs推進（2027-01-29必着）。随時: 前橋市 経営計画実行・桐生市 人材養成・館林市 人材養成・沼田市 人材活用・富岡市 副業人材・富岡市 ECサイト・嬬恋村 売上アップ
# 終了: 前橋市 DX推進補助金（5/22）・伊勢崎市 小規模事業者サポート（7/10）・みどり市 生産性向上等設備投資（予算到達、9/3更新）
# 国の補助金（national.yml）への県・市町村の上乗せ（addon）は0件。前橋市・太田市・藤岡市の制度は国・県の補助金と同じ経費で併用できない。東吾妻町は国の補助額を差し引いた残りを対象にするが、上乗せ先に連動する補助率ではないので addon にしていない。shindan.js・README の変更は要らない
# 市町村の制度が1件もない23市町村（渋川市・安中市と東吾妻町・嬬恋村以外の21町村）は areas.yml で none: true にする（data/area/gunma/_areas_snippet.yml）
# 入れていないもの: 立地・融資・利子補給・保証料・創業・空き店舗・展示会出展・店舗改装だけの制度、研究開発・新製品開発の市の補助、県の未来共創トライアル・地域課題解決実証（終了、コンソーシアム・市町村連携の実証）、県の副業・兼業人材活用促進事業補助金（予算上限で終了）、前橋市 設備投資支援補助金（終了）、高崎市 中小企業アドバイザー導入支援（製造業の診断士等の謝金、終了）、千代田町 店舗リニューアル補助金・甘楽町 店舗継続・拡大サポート・大泉町 設備導入奨励金（IT の明記なし）、県の DX推進・AI活用リスキリング事業（補助金ではない）、無料の支援（よろず支援拠点・生産性向上支援センター・産業技術センター）。確認したページは subsidy_a_areas.md・subsidy_b_areas.md
# 結合で直した点（案）: (1) 前橋市 人財スキルアップ補助金の period から start を外した（診断で「来年度の見込み」に出ないように）、(2) 太田市 DX推進補助金の efficiency を ○ → △（クラウド利用料が対象外）
# 上野村: subsidy_b.yml は公式サイトを www.vill.ueno.gunma.jp（503）としているが、県の「県内市町村等ホームページ外部リンク集」の上野村は https://www.uenomura.jp/ （gov_ai_b.md）。D345 が2026-11-06に uenomura.jp の「事業者向け」（税関係・入札・制度資金〔小口資金〕・農林業）を curl で開き、事業者向けの補助金の案内がないことを確かめた
# 期間の status は data/subsidies/README.md の値（open / closed / rolling / unknown）を使う。随時受付は rolling。来年度の見込み（next_expected）は書かない
#
# 以下は data/area/gunma/subsidy_a.yml（県・県域の機関と12市）の冒頭のコメント
# 群馬県（県・公益財団法人群馬県産業支援機構）と12市の AI・IT・DX・研修・設備向け補助金（2026年度）。2026-11-06に公式ページ・募集案内・応募要領・Q&Aで確認（根拠は subsidy_a_areas.md）
# 県のDX・AIの補助（ぐんまDX技術革新補助金 1/2・1,000万円、ぐんま技術革新チャレンジ補助金 1/2〔小規模4/5〕・80万円〔県・市町村 各40万円〕）は、どちらも令和8年度の募集が 2026-04-01〜05-15 17時で終了。どちらも「開発」の補助で、既存のソフトウェア・アプリの自社への導入が主な目的の申請は対象外（募集ページの補助対象外事業）
# 県の未来共創トライアル補助金（二次募集 10/6〜10/30、空モビリティ・3者以上のコンソーシアム限定）、地域課題解決実証補助金（8/31〜9/30）、交通運輸事業者DX推進補助金（バス・タクシー・トラック、2次 9/1〜10/30）、副業・兼業人材活用促進事業補助金（予算上限で終了、2026-08-24更新）も今日（2026-11-06）は受付していない
# 今申請できる市の制度（2026-11-06）: 太田市 DX推進補助金（建設業・製造業・運輸業・郵便業等の法人、1/2・100万円、2026-12-28 17時まで、先着・予算到達で終了）、藤岡市 小規模事業者省エネルギー・効率化支援補助金（メニューB 業務効率化設備〔POSレジ・在庫・予約管理システム等〕4/5・20万円、2026-10-13〜11-30 17時必着）、前橋市 人財スキルアップ補助金（2026年1〜12月の研修・資格、1/2〔小規模2/3〕・7万円〔DX人材育成を含めば12万円〕、申請 2027-01-04〜01-29）、前橋市 経営計画実行補助金（2/3・20万円、随時〜2027-01-29）、高崎市 中小企業等機械設備導入支援助成金（リース、事前申請 2026-08-01〜12-31）、桐生市 中小企業人材養成事業（研修 1/2・5万〜10万円、随時）、館林市 中小企業人材養成事業助成金（指定機関の研修 1/2・3万円）、沼田市 人材活用支援金（DX等の副業人材 10/10・10万円）、富岡市 副業人材活用事業補助金・ECサイト開設等サポート事業補助金
# 終了: 前橋市 DX推進補助金（2026-05-11〜05-22）、前橋市 設備投資支援補助金（生産性向上設備導入枠 第2期まで終了・省エネ枠 予算到達）、伊勢崎市 小規模事業者サポート補助金（6/15〜7/10）、みどり市 生産性向上等設備投資支援補助金（予算到達、2026-09-03更新）
# 国の「デジタル化・AI導入補助金」（national.yml の digital-ai-donyu。6次は2026-10-30締切、7次は2026-12-01 17時締切）への県・市の上乗せ（addon）は見つからない。前橋市 DX推進補助金は「国や県等、他の補助金との併用はできません」、太田市 DX推進補助金は「同一の対象経費について、複数の補助金を利用することができません」（Q&A A3-4）、藤岡市は「国・県・市等の他の補助金・助成金を利用する（利用した）設備・経費は、本補助金の対象外」
# 独自のAI・IT導入・研修向けの補助が見つからなかった市: 渋川市、安中市（確認したページは subsidy_a_areas.md）。沼田市は副業人材の支援金だけ、富岡市は副業人材・ECサイトだけ
# 期間の status は data/subsidies/README.md の値（open / closed / rolling / unknown）。来年度の見込み（next_expected）は書かない

