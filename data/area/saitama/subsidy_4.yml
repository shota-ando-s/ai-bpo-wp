  targets: {efficiency: ○, consulting: ○, training: ○}
  expenses: 人件費、報償費（専門家謝金等）、旅費（専門家）、印刷製本費、修繕費、通信運搬費、広告費、消耗品費、役務費、委託料（システム構築に係る委託費・外注加工費・市場調査の委託費等）、使用料及び賃借料（機械装置や備品のリース・レンタル費等）、原材料費、備品購入費（機械装置、サーバー等）。令和8年4月1日以降かつ事業実施期間開始以降の契約によるもの
  conditions: 市内に事業所を設置済み・設置予定で補助金交付完了後3年を越えて設置し続ける個人・法人。市内事業者のDXを促進する事業または自社のDXを推進する事業で、第2次熊谷市総合振興計画後期基本計画の方向性と経済産業省「デジタルガバナンス・コード3.0」に沿うもの。1事業者1事業。事前相談→産業DX審査会のプレゼンテーション審査・市長の認定→市がクラウドファンディング（90日以内、ALL-in 方式）を実施→補助金交付申請。目標額に届かない場合も自己資金で遂行を確約できること。市税の滞納がないこと
  period: {status: open, end: 2026-12-31}
  stacking: {exclusive_with: [digital-ai-donyu]}
  url: https://www.city.kumagaya.lg.jp/kurashi/service/keieisya/kumagaya_sangyoDX.html
  checked: 2026-11-13
  confidence: official
  note: 市のページ（更新 2026-04-30、curl で原文）「令和8年12月31日（木曜日）まで 随時募集・要事前相談」。募集要項 PDF（令和8年4月、/kumagaya_sangyoDX.files/r8bosyuyoko.pdf、pdftotext）p.6「集めた寄附総額から必要経費を控除した額を上限に、補助金として交付」、p.8「補助対象経費は、国、県又は市等の他の補助金等の補助対象経費でないものとします。ただし…経費配分や割当の考え方が十分に整理され、その根拠を示すことができる場合は対象とすることができます。」→ 同じ経費で国のデジタル化・AI導入補助金と重ねられない（exclusive_with は当社の判断。経費を分ければ併用できる余地あり）。**補助率の定めはなく、補助額は寄附の集まり方次第**（max_yen は書かない）。AI の名指しはない。審査・クラウドファンディングを経るので、認定から交付まで時間がかかる。県DX推進支援ネットワークの資金補助の一覧にも「熊谷市産業ＤＸ推進補助金」が載る。過去の実施例「日本一アツいDX人材育成プロジェクト」「TEAM ROBOくまがやDXラボ」（受付終了）
  fuenn_note: 熊谷市内の事業者が自社のDX（システム構築の委託・専門家謝金・機器の購入など）を進める計画を市に認めてもらい、ふるさと納税型クラウドファンディングで集まった寄附をもとに経費を補助してもらう制度です。2026年度は12月31日まで募集しています（事前相談が必要）。補助額は寄附の集まり方で決まります。

