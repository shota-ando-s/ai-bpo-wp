# 埼玉県（県・公益財団法人埼玉県産業振興公社・県域の機関）の2026年度の中小企業向け補助金。2026-11-12に県のサイト（www.pref.saitama.lg.jp）の産業労働部 イノベーション創造課「DX推進・事業者支援」、経営・金融支援課「埼玉県中小企業省力化支援事業」、DX導入支援補助金の特設サイト（dxdounyushienhozyo.pref.saitama.lg.jp）、公社のサイト（www.saitama-j.or.jp）、埼玉県DX推進支援ネットワークのポータル（www.saitamadx.com）の資金補助の一覧で確認（すべて curl で取得）
# 県で今申請できる、IT・AIの導入費を補助する中小企業向けの補助金はない。今年度の柱だった「埼玉県中小企業DX導入支援補助金」（DXツール、3/4・上限300万円）は第1期 7/1〜7/31・第2期 8/3〜8/31・第3期 9/1〜9/30・追加募集 10/1〜10/30（各16時）で受付を終えた（パイロットの saitama-dx-donyu を確かめ直した。追加募集の次の募集の告知はない）
# 「埼玉県中小企業省力化支援事業補助金」（機器、2/3・上限1,000万円）は 7/17 で受付終了、9/18 に254件を交付決定。「本補助金では、DXツールは補助対象外」
# 受付中は公社の「県内企業DX推進人材育成講座補助金」（経済団体・業界団体などの団体が開く講座の講師謝金、1団体20万円上限、2027-01-12まで・予算に達したら終了）だけ。企業が直接申請するものではない
# 国の補助金への上乗せ（addon）: 県・公社とも、国のデジタル化・AI導入補助金・省力化投資補助金・ものづくり補助金への上乗せは見つからない。DX導入支援補助金は「国・県・市町村等の他補助金と重複する事業」を対象外、省力化支援事業補助金も「国や県及び公的制度からの二重受給である事業」を対象外（併用できない）。市の上乗せ（川口市）は govsub_1
# 県域の無料の支援（補助金ではない。yml に入れていない。subsidy_pref_areas.md・gov_ai.md）: 埼玉県DX推進支援ネットワークのＤＸコンシェルジュ（無料相談）、SAITEC の AI・IoT化相談（無料）、埼玉県よろず支援拠点（無料）、公社の DX推進セミナー（12/4、無料）・DX先進事例視察研修（2027/2/3、無料）
# 市町村の補助金は govsub_1〜4 の subsidy_1〜4.yml
# 期間の status は data/subsidies/README.md の値（open / closed / rolling / unknown）を使う

- id: saitama-dx-donyu
  name: 埼玉県中小企業DX導入支援補助金（令和8年度。第1期〜第3期・追加募集）
  org: 埼玉県（産業労働部 イノベーション創造課 創業支援・DX推進担当。コールセンターは 埼玉県中小企業DX導入支援補助金コールセンター）
  area: saitama
  max_yen: 3000000
  rate: 補助対象経費の3/4以内。補助額は7万5千円以上300万円以下（補助対象事業費 10万円以上400万円以下）
  rate_num: 0.75
  max_months: 12
  min_cost_yen: 100000
  targets: {efficiency: ○, consulting: △, training: ×}
  expenses: 労働生産性向上に資するDXツール（システム及びITツール〔ソフトウェア〕）の購入費（リース・サブスクリプション等の利用料を含む、最大1年間分）、ツールの運用に必要なデジタル機器購入費、設置・運搬・動作確認・設定等の導入に要する経費（補助対象経費総額の1/2以下）。導入例の表に「AI（画像認識）」。一般的なDXに関するセミナー・研修費用、DX全般のコンサルティング費用（導入サポートとして必要な場合は対象となり得る）、ハードウェア導入が主体の事業、AI搭載ロボットなどハード主体の導入、フルスクラッチでのシステム開発、既存システムの単純更新、セキュリティ対策ソフト導入費（特別な場合を除く）、新規事業に要する経費、消費税は対象外。交付決定後に着手したものに限る
  conditions: 交付要綱 別表1の中小企業者等（製造業・建設業・運輸業 資本金3億円以下又は常勤従業員300人以下、卸売業 1億円・100人、サービス業 5,000万円・100人、小売業 5,000万円・50人、ソフトウェア業・情報処理サービス業 3億円・300人、旅館業 5,000万円・200人、ゴム製品製造業 3億円・900人ほか。企業組合等の組合、一定のNPO法人・社会福祉法人も可。みなし大企業は除く）で、県内に登記簿上の本店又は主たる事業所を有し（個人事業主は県内に住民票上の住所地又は主たる事務所）、補助事業を県内の自社の事業所で実施し、県税の滞納がないこと。DXツールの導入日以降の決算期に労働生産性を向上させる計画が必要。決算期を迎えていない創業者、県外移転予定の事業者、国・県・市町村等の他補助金と重複する事業、同一事業者の複数申請、関連会社・親族の会社への発注は対象外。審査制（先着順ではない）
  period: {status: closed, start: 2026-10-01, end: 2026-10-30}
  next_expected: 2027-07
  url: https://www.pref.saitama.lg.jp/a0803/dx_jigyousyashien/dx_index.html
  checked: 2026-11-12
  confidence: official
  note: 県のページ（ページ番号239815、掲載日 2026年10月30日、curl）で「【申請受付終了】埼玉県中小企業DX導入支援補助金」「令和8年10月30日　埼玉県中小企業DX導入支援補助金【追加募集】の申請受付を終了しました。」。募集は第1期 2026-07-01〜07-31、第2期 08-03〜08-31、第3期 09-01〜09-30、追加募集 10-01〜10-30（各16時。period は追加募集）。**追加募集のあとの募集（第4期など）の告知はページ・特設サイトにない**。特設サイト https://dxdounyushienhozyo.pref.saitama.lg.jp/ （対象者・対象外・導入例の表・コールセンター 050-1744-2272〔2027-03-31まで〕）、交付要綱 PDF（令和8年4月17日施行、別表1 PDF p.7〜9 の中小企業者等の定義）。パイロットの「県内に本店がある」は「本店又は主たる事業所」が正しい。AI の語は導入例の「AI（画像認識）」と対象外の「AI搭載ロボットなどハード主体の導入」だけで、生成AIの名指しはない（AIツールが「DXツール」に当たるかは事務局に確認）。next_expected は2026年度の第1期の時期からの推測（来年度の実施は未発表）。DXツール導入事例集 /documents/239815/zireisyuu.pdf（開いていない）。県の担当 048-830-3763
  fuenn_note: 埼玉県内に本店か主たる事業所がある中小企業が、業務の効率化に役立つソフトウェアやクラウドサービス（DXツール）を入れる費用を3/4、最大300万円補助する県の制度でした。2026年度の申請は10月30日の追加募集で終わりました。

- id: saitama-shoryokuka
  name: 令和8年度 埼玉県中小企業省力化支援事業補助金（新規導入・設備更新）
  org: 埼玉県（産業労働部 経営・金融支援課 経営革新支援担当）
  area: saitama
  max_yen: 10000000
  rate: 補助対象経費の2/3以内（賃上げ要件に該当する場合は4/5以内）。補助額15万円以上1,000万円以下（賃上げ要件に該当する場合は1,200万円以下）
  rate_num: 0.667
  targets: {efficiency: ×, consulting: ×, training: ×}
  expenses: 【新規導入】県が策定した省力化製品カテゴリリストに掲載された製品カテゴリの機器（例 産業用ドローン、無人搬送車、協働ロボット、自動券売機、自動調理補助機）の購入費（中古、リース・レンタル・クラウド・サブスクリプション等の利用料を含む）、設置・運搬・動作確認・設定等の導入経費（補助対象経費総額の1/2の範囲内）。【設備更新】専門家等が作成した支援カルテに基づき省力化が見込まれる新型機器に更新する経費。「本補助金では、DXツールは補助対象外」
  conditions: 県内に登記簿上の本店又は主たる事業所を有する中小企業者等（みなし大企業は除く）で、人手不足の状態にあること又は賃上げを実施すること（いずれか又は両方）。新規導入は、補助事業実施事業所の役員・従業員数に応じて労働時間を削減する計画（9人まで 8時間×従業員数以上、10人以上 80時間以上）。1次産業（農業・林業・漁業）の省力化、既存機器の置き換え（新規導入の場合）、新規事業、交付決定前の着手、国・県等の他制度との二重受給は対象外。審査制、予算額（補助金総額約20億円）の範囲内
  period: {status: closed, start: 2026-05-25, end: 2026-07-17}
  next_expected: 2027-05
  url: https://www.pref.saitama.lg.jp/a0805/shoryokuka/index.html
  checked: 2026-11-12
  confidence: official
  note: 県のページ（ページ番号280178、掲載日 2026年9月29日、curl）で「令和8年7月17日　補助金の申請受付を終了しました。」「令和8年9月18日　本日付けで補助金の交付決定をしました。」「申請件数561件（新規導入290件、設備更新271件）のうち、審査の結果254件（新規導入133件、設備更新121件）の事業者について交付決定」。専門家派遣（公募期間 2026-05-25〜2027-02-19）は「予定件数に達したため、受付を終了しました」（2026-07-06）。新規導入のページ https://www.pref.saitama.lg.jp/a0805/shoryokuka/sinnkidounyu_20260525.html （補助総額約20億円、対象・対象外）。**DXツール（ソフトウェア）は対象外なので AI の業務効率化ツールには使えない**（記事ではAI向けとして書かない。県の DX導入支援補助金へ案内されている）。next_expected は今年度の公募開始の時期からの推測。問い合わせ 048-830-3903
  fuenn_note: 埼玉県内の中小企業が、人手不足の解消や賃上げのために、協働ロボットや無人搬送車などの省力化機器を入れる費用を2/3（賃上げをすれば4/5）、最大1,000万円（1,200万円）補助する県の制度でした。2026年度の申請は7月17日で終わりました。ソフトウェア（DXツール）は対象外です。

