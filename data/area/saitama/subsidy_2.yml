# 埼玉県 東部・利根の16市町（春日部市・草加市・越谷市・八潮市・三郷市・吉川市・松伏町・行田市・加須市・羽生市・久喜市・蓮田市・幸手市・白岡市・宮代町・杉戸町）の AI・IT・DX・研修・省力化・生産性向上に使える市町独自の補助金（2026年度）。2026-11-12に16市町の公式サイトの事業者向けの分類ページ・補助金のページを開いて確認（curl で原文）
# 受付状況は 2026-11-12 時点。期間の status は data/subsidies/README.md の値（open / closed / rolling / unknown）を使う
