    - {code: saitama/kumagaya, name: 熊谷市, note: 熊谷市の産業DX推進補助金は、市内の事業者が自社のDX（システム構築の委託や専門家謝金・機器の購入など）を進める計画を市に認めてもらい、ふるさと納税型クラウドファンディングで集まった寄附をもとに経費を補助する制度で、2026年度は12/31まで募集しています（事前相談が必要。補助額は寄附の集まり方で決まります。2026-11-13確認）。経営革新計画に取り組む中小企業への10万円の奨励金（2027-01-29まで）もあります。窓口は市の企業活動支援課（048-524-1470）と熊谷商工会議所（048-521-4600）・くまがや市商工会（048-588-0140）です}
    - {code: saitama/honjo, name: 本庄市, none: true, note: 本庄市の事業者向けのページで確かめた範囲で、市独自のAI・IT導入や研修の補助金は見つかりませんでした（2026-11-13確認。創業向けの補助はあります）。市の商工観光課と本庄商工会議所（0495-22-5241）・児玉商工会（0495-72-1556）に相談できます}
    - {code: saitama/fukaya, name: 深谷市, note: 深谷市には、経営革新計画を作り県の承認を受けた市内の中小企業に5万円を出す奨励金があります（年度内の随時受付。2026-11-13確認）。AI・IT導入の費用を補助する市独自の制度は見つかりませんでした。窓口は市の商工振興課と深谷商工会議所（048-571-2145）・ふかや市商工会（048-584-2325）です}
    - {code: saitama/misato-town-saitama, name: 美里町, none: true, note: 埼玉県児玉郡美里町の事業者向けのページで確かめた範囲で、町独自のAI・IT導入や研修の補助金は見つかりませんでした（2026-11-13確認）。美里町商工会（0495-76-0144）に相談できます。三郷市（みさと）や宮城県美里町・島根県美郷町とは別の町です}
