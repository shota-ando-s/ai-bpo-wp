    - {code: saitama/yorii, name: 寄居町, note: 寄居町の町独自のIT向け補助金は見つかりませんでしたが、寄居町商工会のビジネスパワーアップ事業補助金が受付中です（2026-11-13確認）。町内の中小・小規模事業者が経営革新計画などに沿ってウェブサイトや外注・機械の導入で生産性を上げる費用を1/2（上限15万円）補助し、事業を始める前に商工会（048-581-2161）へ申請します。同じ経費で国などの補助と重ねられません}
    - {code: saitama/chichibu, name: 秩父市, note: 秩父市の生産性向上サポート補助金は、市内の中小企業が経営革新計画などに沿ってソフトウェアや設備を入れる費用を1/2（上限30万〜50万円）補助します。申請は12/25まで（市は「予算の残りわずか」としています。2026-11-13確認）。ロボット・AIなど先端分野の製品開発の費用を2/3（上限100万円）補助する先端産業育成補助金もあります（業務へのAIツール導入向けではありません）。窓口は市の先端技術推進課（0494-21-5522）と秩父商工会議所（0494-22-4411）です}
    - {code: saitama/yokoze, name: 横瀬町, none: true, note: 埼玉県秩父郡横瀬町の事業者向けのページで確かめた範囲で、町独自のAI・IT導入や研修の補助金で今年度受け付けているものは見つかりませんでした（2026-11-13確認）。町の振興課（0494-25-0114）と秩父商工会議所（0494-22-4411。横瀬町は会議所の地区です）に相談できます}
    - {code: saitama/minano, name: 皆野町, note: 皆野町の中小企業おうえん補助金は、町内の中小企業が販路拡大や新しい事業に取り組むときの機器の購入・リースや外注の費用を1/2（上限50万円）補助します（2027-02-26まで先着順。2026-11-13確認）。AI・ITの名指しはなく、申請書は皆野町商工会（0494-62-1311）へ出します。町の産業観光課（0494-62-1462）にも相談できます}
