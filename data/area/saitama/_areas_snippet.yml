    - {code: saitama/sayama, name: 狭山市, note: 狭山市の中小企業等専門家活用補助金は、市内の中小企業がDXの専門家に相談・研修・コンサルを頼む費用の3/4（上限50万円）を補助します（2026-11-13確認）。予算は150万円でDXとGXは2件の予定なので、申請前に市の商工観光課（04-2937-7538）に残りを確かめてください。狭山市ビジネスサポートセンター（Saya-Biz、04-2946-8751）では無料で相談できます}
