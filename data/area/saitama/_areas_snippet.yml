    - {code: saitama/kawagoe, name: 川越市, none: true, note: 川越市の事業者向けのページで確かめた範囲で、市独自のAI・IT導入や研修の補助金は見つかりませんでした（2026-11-13確認）。市は中小企業診断士による無料の経営相談（Web・IT活用も対象・予約制）を開いています。川越商工会議所（049-229-1810）にも相談できます}
    - {code: saitama/higashimatsuyama, name: 東松山市, note: 東松山市のがんばる中小企業等応援補助金は、県の承認を受けた経営革新計画にもとづく新商品の開発や新しい販売方式の導入などの費用を1/2（上限30万円）補助し、ソフトウェアも対象経費に入ります（先着順・予算に達し次第終了。2026-11-13確認）。申請前に東松山市商工会（0493-22-0761）の確認が要り、同じ経費で国などの補助と併用できません}
