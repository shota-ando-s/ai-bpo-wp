# 案（D34、2026-11-12〜13 のデータ）。data/subsidies/areas.yml の埼玉県の行（パイロット 2026-10-14 の7市）を置き換える63市町村の行。親が data/subsidies/saitama.yml（案は data/area/saitama/_subsidies_saitama.yml）と同じコミットで areas.yml に入れる（areas.yml は直接編集していない）
# パイロットの7行の code（saitama/saitama-city・kawaguchi・koshigaya・ageo・toda・kawagoe・tokorozawa）は残した。所沢市はパイロットで none: true だったが、IT 専用でない地域資源活用・ものづくり総合支援補助金（efficiency △）が yml にあるので none を外した。川越市は none: true のまま
# none: true は _subsidies_saitama.yml にその市町村の制度が1件もない42市町村（22市・19町・1村）。どれも市町村の公式サイトの事業者向けのページ・補助金の一覧で確かめて見つからなかった（subsidy_1〜4_areas.md）。小鹿野町だけは町のサイトが停止中で確かめられなかった（note の一文目にそう書いた。千葉県市原市・御宿町と同じ扱い）
# 今年度の受付を終えた制度しかない越谷市・三郷市は、yml に制度があるので none にせず note の一文目で状況を書いた（愛知県名古屋市・犬山市と同じ）
# 並びは県の地域振興センターの所管（spec/D1.md「県の地域区分」）: さいたま市（1）→ 南部（3）→ 南西部（7）→ 県央（5）→ 東部（7）→ 利根（9）→ 西部（5）→ 川越比企（14）→ 北部（7）→ 秩父（5）。区分の中は D1 の表の並び（判断 D4-9）
# none の callout は「AI・IT導入向けの独自の補助金が見つかりませんでした」と出るので、none の note は確かめたページ・相談先（商工会議所は日商の一覧、商工会は全国商工会連合会の名簿。gov_ai.md）・取り違えの注意を書く
# 「無料」と書いたのは資料に無料とあるものだけ: さいたま市産業創造財団の無料の窓口相談会、三郷市のよろず経営相談会（無料）、小川町役場のよろず支援拠点の出張相談（無料）、Saya-Biz（「伴奏支援を無料で」）、川越市の経営相談（相談料無料）。商工会議所・商工会は「無料」と書いていない
# 市町村の制度は市町村内に事業所がある事業者が対象で、近くの市町村の事業者は使えない。県の制度で今申請できる企業向けの IT・AI 導入の補助金はない
