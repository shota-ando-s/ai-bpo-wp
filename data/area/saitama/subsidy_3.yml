# 埼玉県 西部・川越比企の19市町村（所沢市・飯能市・狭山市・入間市・日高市・川越市・東松山市・坂戸市・鶴ヶ島市・毛呂山町・越生町・滑川町・嵐山町・小川町・川島町・吉見町・鳩山町・ときがわ町・東秩父村）の AI・IT・DX・研修・省力化・生産性向上に使える市町村独自の補助金（2026年度）。2026-11-13に19市町村の公式サイトの事業者向けの分類ページ・補助金のページを開いて確認（curl で原文）
# 受付状況は 2026-11-13 時点（要領・ページの日付で判断）。期間の status は data/subsidies/README.md の値（open / closed / rolling / unknown）を使う
# 市町村ごとの確認したページ・制度がない市町村は subsidy_3_areas.md
# 要約は subsidy_3_areas.md の冒頭
# パイロット（2026-10-14、data/subsidies/areas.yml）は川越市・所沢市を none: true（独自の制度なし）としていた。確かめ直した結果は subsidy_3_areas.md の各節

- id: saitama-tokorozawa-monodukuri
  name: 所沢市地域資源活用・ものづくり総合支援補助金
  org: 所沢市（産業経済部 産業振興課の見込み。ページの担当課は確かめていない）
  area: saitama/tokorozawa
  max_yen: 1500000
  rate: 補助対象経費の1/2以内。事業ごとの限度額は産業財産権取得30万円、販路開拓（宣伝等・連携事業）30万円、新規取引先の需要に応える設備の改修等100万円（経営革新計画承認事業者150万円）、展示商談会出展10万円（海外50万円）、新製品・技術・サービスの開発30万円（設備の改修・更新・新設を含むと100万円、経営革新計画承認事業者150万円）、人材育成（研究会等・連携事業）30万円
  rate_num: 0.5
  targets: {efficiency: △, consulting: ×, training: △}
  expenses: 産業財産権の出願費用、ホームページ作成・広告・市場調査・翻訳・規格認証（販路開拓・連携事業）、新規取引のための設備の改修・更新・新設と店舗・工場の増改築、展示商談会の小間料など、新製品の研究委託・試作・設備・コンピュータプログラムの著作権登録、経営を担う人材がグループで行う研究会の講師謝礼・会場借料・教材費（連携事業）。IT・AI の導入そのものを対象とする区分はない
  conditions: 市内に本店の登記がある法人または市内に住民登録がある個人の中小企業者。事業を1年以上営むこと。連携事業でない場合は製造業または農業（農業は地域資源を使った加工品の事業）。連携事業は市内の製造業・農業の中小企業者が参加し、参加者の1/2以上が市内事業者で2者以上。申請日以降に実施し、令和9年3月末までに支出・実績報告を終えること。複数の事業をまとめて申請できる
  period: {status: open, start: 2026-10-01, end: 2027-02-26}
  next_expected: 2027-04
  url: https://www.city.tokorozawa.saitama.jp/kurashi/shigotojyoho/sangyo/kogyo/chiikishigen-monodukuri.html
  checked: 2026-11-13
  confidence: official
  note: 市のページ（更新日 2026年10月1日。curl で原文）「3次募集：令和8年10月1日(木曜)から令和9年2月26日(金曜)まで 随時受付・審査を行い、予算額に達した時点で受付を終了します。」。令和8年度募集要領 https://www.city.tokorozawa.saitama.jp/kurashi/shigotojyoho/sangyo/kogyo/chiikishigen-monodukuri.files/R8_bosyu.pdf（1次 4/10〜6/30、2次 7/22〜9/18、3次 10/1〜2027-02-26「予算がなくなり次第、受付を終了」）。国・県の補助金との併用は、要領 PDF p.4「補助対象事業が国又は埼玉県の定める補助金交付要綱等の適用を受け、当該要綱等に基づき市を通じて交付されるときは、その補助金の額を…併せて交付します」（市を通じて交付される国・県の補助の場合の扱い）だけで、国のデジタル化・AI導入補助金と同じ経費の併用の可否は書いていない（stacking は書かない）。市の融資制度を使うと利子補給率を10%上乗せ。製品開発・販路開拓の補助で、AI・IT の導入が主目的の事業は当たりにくい（efficiency △）。パイロット（2026-10-14）は所沢市を「独自の制度なし」としていたが、IT 専用ではないこの制度があるので記録した
  fuenn_note: 所沢市内の製造業・農業の中小企業が、新製品の開発や販路開拓、設備の改修などに使える補助金です（1/2、上限30万〜150万円）。AIやITの導入そのものを対象とする区分はありません。3次募集は2027年2月26日まで（予算に達し次第終了）です。

- id: saitama-sayama-senmonka
  name: 狭山市中小企業等専門家活用補助金（DX・GX）
  org: 狭山市（環境経済部 商工観光課）
  area: saitama/sayama
  max_yen: 500000
  rate: DX・GX は補助対象経費（税抜）の3/4、上限50万円（1,000円未満切捨て）。中小企業向けSBT認定は10/10・上限50万円。令和8年度予算150万円（DX・GX 2件、SBT 1件の予定）
  rate_num: 0.75
  targets: {efficiency: ×, consulting: ◎, training: ○}
  expenses: 専門家に対する謝金（報償費）・旅費、専門家によるコンサルティング費用（委託料）、SBT認定の申請費用。2026-04-01〜2027-03-15 に行う事業のために新たに生じた経費。システムやソフトの購入費は対象経費にない
  conditions: 市内に本社または事業所がある中小企業者・小規模企業者。市税の滞納がないこと。自社の課題解決のために専門家のサポートを使い、DX・GX・SBT認定取得を進める取組。実績報告は2027-03-22まで
  period: {status: open, start: 2026-04-01}
  next_expected: 2027-04
  url: https://www.city.sayama.saitama.jp/kankou/kigyoshien/sesaku/senmonkahojyokin.html
  checked: 2026-11-13
  confidence: official
  note: 市のページ（更新日 2026年6月3日。curl で原文）「募集期間 2026年4月1日（水曜日）から」（終わりの日の記載なし。予算150万円の範囲内で DX・GX は2件の予定なので、すでに埋まっている可能性がある。予算の残りはページにない → 申請前に商工観光課 04-2937-7538 に確認）。「同一年度に、同一の措置内容に対して、国、県から他の助成金の交付を受けている場合は、他の補助金の額を減じた額が補助金額となります。」（国・県の補助と併用はできるが、その額を差し引く。上乗せの計算式ではないので addon は書かない）。活用イメージ（DX枠）「ITベンダーの専門家を招へいし、プログラミング未経験者でもアプリケーションを作成できる「ノーコードツール」の使い方を学ぶ社内研修を実施」。AI の名指しはないが、AI 導入のコンサル・社内研修の専門家謝金に使える
  fuenn_note: 狭山市内の中小企業が、DXの専門家に相談・研修・コンサルを頼む費用の3/4（上限50万円）を補助する制度です。2026年4月1日から受け付けていますが、予算は150万円でDX・GXは2件の予定なので、申請前に市の商工観光課に残りを確かめてください。

- id: saitama-higashimatsuyama-ganbaru
  name: 東松山市がんばる中小企業等応援補助金
  org: 東松山市（東松山市商工会と連携）
  area: saitama/higashimatsuyama
  max_yen: 300000
  rate: 補助対象経費の1/2以内、上限30万円（千円未満切捨て）
  rate_num: 0.5
  targets: {efficiency: △, consulting: ×, training: ×}
  expenses: 機械装置等費（募集要項の例「機械装置、ソフトウェア、工具、器具備品等」）、広報費、展示会等出展費、開発費、賃借料、外注費（「業務システム開発の外注（試作品用に限る）」）。消費税は除く
  conditions: 市内に主たる事業所があり、埼玉県知事の承認を受けた「経営革新計画」に記載された事業（新商品・新サービスの開発、新たな生産・販売・提供の方式の導入など）を行う中小企業者。東松山市商工会で申請書類の確認を受けてから申請。1経営革新計画につき1申請（1年度1回）。市税の滞納がないこと
  period: {status: rolling}
  next_expected: 2027-04
  stacking: {exclusive_with: [digital-ai-donyu]}
  url: https://www.city.higashimatsuyama.lg.jp/soshiki/18/1571.html
  checked: 2026-11-13
  confidence: official
  note: 市のページ（更新日 2026年5月11日。curl で原文）「申込みは先着順です。予算額に達した時点で受付は終了となります。」「同一経費について、他の補助制度等との併用はできません。」（exclusive_with は「同一経費」の併用不可から当社が付けた。経費を分ければ国の補助と別に使える）。受付の始まり・終わりの日はページ・募集要項 PDF https://www.city.higashimatsuyama.lg.jp/uploaded/attachment/14597.pdf にない（先着・予算まで → rolling。予算が残っているかは商工会か市に確認）。経営革新計画の承認が前提なので、AI・ソフトの導入だけの申請には使いにくい（efficiency △）
  fuenn_note: 東松山市内の中小企業が、県の承認を受けた経営革新計画にもとづく新商品・新サービスの開発や新しい販売方式の導入に使える補助金です（1/2、上限30万円）。ソフトウェアも対象経費に入ります。先着順・予算に達し次第終了で、申請前に東松山市商工会の確認が要ります。

