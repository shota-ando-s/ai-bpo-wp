# 青森県内22町8村（平内・今別・外ヶ浜・鰺ヶ沢・深浦・藤崎・大鰐・板柳・鶴田・中泊・野辺地・七戸・六戸・横浜・東北・おいらせ・大間・三戸・五戸・田子・南部・階上・蓬田・西目屋・田舎館・六ヶ所・東通・風間浦・佐井・新郷）2026年度
# 確認日 2026-10-17。根拠は subsidy_b_areas.md
# 既存の中小企業がソフトウェア・クラウド等のIT導入に使える町村独自の制度を確認できたのは、大鰐町（事業者持続化支援事業補助金。要綱の対象経費に「クラウドサービス利用費」「ソフトウェア費」）と南部町（商工業者販売促進事業費補助金のDX等対応事業。ソフトウェア新規導入とそれに伴うパソコン等）の2町
# 研修の受講料を対象にする町村独自の制度は田子町のビジネスチャレンジ支援事業補助金（高度な技術習得の研修参加。10/10・15万円）だけ。外部専門家の謝金を対象にするのは藤崎町（経営改善タイプ）、コンサルタント経費は野辺地町（産業創出応援事業。新規雇用が条件）
# 創業向けの制度は今別・鰺ヶ沢・深浦・藤崎・大鰐・鶴田・野辺地・七戸・六戸・東北・三戸・五戸・田子・南部・新郷の15町村で確認した（深浦町・藤崎町・南部町・田子町は既存事業者の新分野進出・第二創業も対象）
# 平内町・外ヶ浜町・板柳町・中泊町・横浜町・おいらせ町・大間町・階上町・蓬田村・西目屋村・田舎館村・六ヶ所村・東通村・風間浦村・佐井村は、IT・DX・研修・創業向けの町村独自の制度を町村のサイトで確認できなかった（YAMLに項目なし。信用保証料・利子の補助だけの町村を含む）
# 板柳町の創業支援事業費補助金は補助金ポータルの掲載だけで、町の公式ページは削除済み（2025年度分）。YAMLに入れず subsidy_b_areas.md に secondary として書いた
# 町のサイトに受付期間の記載がなく、2026年度に受け付けているかをページから判断できない制度は period.status を unknown にした（要綱・募集ページは公式なので confidence は official）
# status の rolling は、このリポジトリの data/subsidies の表記（随時受付・予算の範囲内で先着）に合わせた
# open の end は、ページに締切日がある場合はその日、ない場合は要綱の事業期間（支払・完了の期限）の末日で、note にどちらかを書いた

