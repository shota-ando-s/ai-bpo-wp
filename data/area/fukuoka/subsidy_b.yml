# 福岡県の31町村（29町2村）の AI・IT・DX・設備・研修・販路開拓向けの町村独自の補助金（2026年度）。2026-11-04に各町村の公式サイトの事業者向け・産業振興・商工の分類ページと、補助金の本文・交付要綱で確認（詳細は subsidy_b_areas.md）
# （まとめは調査の最後に書く）
# 県・県域の機関・29市の制度は subsidy_a 担当のため入れていない。融資・利子補給・保証料補給・企業立地奨励・雇用奨励・特産品開発・店舗改修・創業・プレミアム商品券・個人向けの制度は YAML に入れていない（subsidy_b_areas.md に記した）
# 期間の status は data/subsidies/README.md の値（open / closed / rolling / unknown）。受付期間の定めがなく、国の補助金の交付決定・確定から一定期間内に申請する上乗せ型は rolling にした

