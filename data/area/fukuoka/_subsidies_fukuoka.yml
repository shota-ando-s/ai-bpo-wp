# 案（D34、2026-11-04）。福岡県の補助金。data/area/fukuoka/subsidy_a.yml（県・県域の機関と29市、19制度）と subsidy_b.yml（29町2村、7制度）を結合し、県のグリーンアジア国際戦略総合特区 中小企業設備投資促進事業（D34 が県のページで確認、1制度）を足した27制度。親が areas.yml の福岡県の行と同じコミットで data/subsidies/fukuoka.yml として入れる
# 状況の内訳（2026-11-04）: open 9（県 稼ぐ力強化〔2027-01-31〕、北九州市 ロボットFS二次〔11/2〜11/9〕・物価高騰 一般枠〔12/4〕・販路拡大等〔12/4〕・賃金引上げ応援〔2027-03-05〕、久留米市 デジタル化〔12/28〕・先端設備〔12/28〕、宗像市 生産性向上枠〔12/25、先着〕、うきは市 生産性向上投資〔2027-01-15、先着〕）・rolling 9（八女市 DX支援、糸島市 経営強化〔2027-01-29〕、みやま市 経営革新、県 グリーンアジア特区、新宮町 加算3件、宇美町 持続化上乗せ、小竹町 人材育成）・closed 7（県 生産性向上・賃上げ緊急支援〔6次 8/17〕・経営革新・賃上げ〔7/15〕、北九州市 DX推進〔5/29〕・物価高騰 DX強化枠〔5/29〕・ロボット導入〔6/12〕、大牟田市 企業競争力強化〔6/5〕、朝倉市 DX推進〔予算到達で終了〕）・unknown 2（広川町 販路開拓〔targets がすべて×で診断に出ない〕、吉富町 経営革新）。closed はどれも next_expected なし＝診断に出ない（来年度の見込みは書かない）
# AI・IT 導入に今申請できる市町村の制度（◎○）: 久留米市 小規模事業者デジタル化支援（◎ 1/2・20万円、12/28。市負担の専門家支援〔申込 11/30 まで〕の提案が前提）、うきは市 生産性向上投資支援（◎ ソフトウェアの例に「AIツール」、1/2・25万円）、八女市 中小企業DX支援（◎ 2/3・50万円、随時。商工会議所・商工会の指導が前提）、宗像市 がんばる中小企業者応援 生産性向上枠（○ 1/2・50万円）。県で AI・IT 導入に今申請できる補助金はない（生産性向上・賃上げ緊急支援補助金は6次 8/17 で終了）
# 国の補助金への上乗せ（addon）: 新宮町 商工関係事業加算補助金だけ。要綱の別表で上乗せ先ごとに上限が違う（IT導入補助金10万円・省力化投資補助金20万円・ものづくり補助金20万円・持続化補助金10万円）ので、subsidy_b が上乗せ先ごとに3件に分け、それぞれ max_yen と addon_to を持たせた（持続化補助金は national.yml にないので入れていない）。shindan.js の calcAddon は addon の max_yen を上限にするので、この分け方で表せる（README・shindan.js の変更は要らない）。要綱の「千円未満切捨て」は shindan.js では表せない（remaining は円単位の切り捨て）が、上限10万円・20万円に届く経費では差は出ない
# 新宮町の IT の加算は国のデジタル化・AI導入補助金（national.yml の digital-ai-donyu、fuenn_available_from 2027-04）に付くので、新宮町の efficiency では「来年度」の組み合わせに国の補助＋町の上乗せ（最大10万円）が出る。省力化投資補助金（shoryokuka-ippan）・ものづくり補助金（shinjigyo-monodukuri）は national.yml で closed・△なので、その2件の加算は診断の組み合わせに出ない（カードだけ）
# 県の稼ぐ力強化支援補助金（国の持続化補助金の1/12）・北九州市の賃金引上げ応援補助金（国の業務改善助成金の2/10）・宇美町の持続化補助金への上乗せ（自己負担の1/2）は、上乗せ先が national.yml にないので addon を書いていない（どれも △ で補助額は出ない）
# none の市町村（areas の _areas_snippet.yml）: 制度が1件もない46市町村（市20〔直方市はサイトが開けず確かめられなかった〕・町村26〔大任町は一覧が読めず確かめられなかった〕）。制度があるのは14市町村（市9: 北九州・大牟田・久留米・八女・宗像・うきは・朝倉・みやま・糸島、町5: 宇美・新宮・小竹・広川・吉富）
# 結合で直した点（D34）: (1) 北九州市 ロボットFS二次の consulting を ○→△（産業用ロボット等の導入前検証に限る。AI のコンサル一般に使えると読まれないように。11/9で終わる）、(2) 小竹町 人材育成の training を ○→△（対象は中小企業大学校九州校の研修か町長が準ずると認める研修。max_yen がなく rate_num 1.0 のため、○ のままだと研修費210万円で「今年度の組み合わせ」に210万円が出る）、(3) 新宮町の省力化投資補助金・ものづくり補助金への加算2件の efficiency を ○→△（上乗せ先の国の制度が national.yml で closed のため。国の制度が再開したら○に戻す）、(4) 県 グリーンアジア特区 中小企業設備投資促進事業を足した（efficiency △）
