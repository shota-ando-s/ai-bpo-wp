- id: fukuoka-seisansei-chinage
  name: 福岡県中小企業生産性向上・賃上げ緊急支援補助金（令和7年12月補正分）
  org: 福岡県（商工部 中小企業技術振興課 技術支援係。支援計画は福岡県中小企業“稼ぐ力”応援センター〔旧DX推進センター〕が作成）
  area: fukuoka
  max_yen: 22500000
  rate: 事業場内最低賃金を30円以上60円未満引き上げる場合は2/3以内（大規模支援 上限2,000万円・小規模支援 上限200万円）、60円以上引き上げる場合は3/4以内（大規模支援 上限2,250万円・小規模支援 上限225万円）
  rate_num: 0.667
  targets: {efficiency: ○, consulting: △, training: △}
  expenses: 省力化又は省エネ化による生産性向上に効果的な装置・ソフトウェア等の購入及び改良費、クラウドサービス等の使用料及びライセンス料、情報システム構築に係る委託料、装置等の利活用を促進する治具・器具等、これらに付随する運搬費・据付費・社員の教育訓練費（セミナー・講座等の受講料）（交付要綱 別表1）。汎用性のある事務用パソコン・プリンタ・タブレット等（生産性を向上させるシステムの一部を除く）、レンタル・リース、保守管理費、自社従業員の人件費、事業期間外のクラウド利用料などは対象外
  conditions: 県内に生産性向上の取組を行う事業所（要綱は本社もしくは事業所）を有する中小企業者（みなし大企業を含む）・中小企業等協同組合。福岡県中小企業“稼ぐ力”応援センター（旧DX推進センター）に申し込み、センターが作成した「DX・生産性向上支援計画」（作成に約2〜3か月）に位置づけられた事業であること。従業員を雇用している場合は補助事業終了時までに事業場内最低賃金を30円以上引き上げること。同一内容で県・他の公的機関の補助を受けていないこと。交付決定前の発注は対象外。補助対象期間は2027-02-15まで
  period: {status: closed, end: 2026-08-17}
  url: https://www.pref.fukuoka.lg.jp/contents/productivity-improvement-subsidy-2025-26.html
  checked: 2026-11-04
  confidence: official
  note: 県のページ（ページID 0808756、2026-09-03更新）で提出期限は1次2026-02-24・2次03-31・3次05-07・4次06-09・5次07-15正午・6次08-17正午で、6次まで「※募集は終了しました」。7次以降の告知はない。交付要綱（R8年5月18日一部改正）https://www.pref.fukuoka.lg.jp/uploaded/attachment/286856.pdf （p1 第2条〜第6条、p6〜7 別表1・別表2）、リーフレット https://www.pref.fukuoka.lg.jp/uploaded/attachment/287706.pdf 。要綱第1条の趣旨は「デジタル技術の活用等を通じた省力化又は省エネ化による生産性向上の取組みや設備投資」。大規模支援・小規模支援の区分の決め方は要綱・ページの表からは読み取れなかった（募集案内の Word は開いていない）。max_yen は大規模支援・60円以上の上限。センターへの支援申込みは補助金のスケジュールに関わりなく随時（センターのサイト https://www.f-seisanseikojo.jp/ は 2026-11-04 にメンテナンス中で開けなかった）。問い合わせ 県 092-643-3433、センター 092-292-8890（福岡市博多区吉塚本町9-15 中小企業振興センター5階）。福岡市のページ https://www.city.fukuoka.lg.jp/keizai/keieishien/business/jigyo_tenkai_support.html は旧名の「福岡県中小企業ＤＸ推進センター」で案内している
  fuenn_note: 福岡県内の中小企業が、県の“稼ぐ力”応援センター（旧DX推進センター）の伴走支援で作った計画にもとづき、省力化の装置・ソフトウェア・クラウド・システム構築などを入れ、最低賃金を30円以上上げる場合に2/3〜3/4（最大2,250万円）を補助する県の制度でした。今年度の募集は6次（2026年8月17日）で終わりました。センターへの支援の申込みは随時できます。

