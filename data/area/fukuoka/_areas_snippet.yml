# 案（D34、2026-11-04）。data/subsidies/areas.yml の末尾に足す福岡県の部分。親が最後に areas.yml に入れる（data/subsidies/fukuoka.yml〔案は data/area/fukuoka/_subsidies_fukuoka.yml〕と同じコミット。areas.yml は直接編集していない）
# none: true は _subsidies_fukuoka.yml にその市町村の制度が1件もない46市町村（市20・町村26）。直方市（サイトが開けない）・大任町（商工業の一覧が読めない）も none にし、note の一文目を「確かめられませんでした」にした。朝倉市・大牟田市は今年度の受付を終えた制度しかないが、yml に制度があるので none にせず note の一文目で状況を書いた。広川町は制度が yml にある（status unknown、targets がすべて×で診断に出ない）ので none にせず note で状況を書いた
# 並びは県の4地域（stats.md の pref_area。令和7年国勢調査 付表４の地域計）の順: 福岡（20）→ 北九州（13）→ 筑豊（15）→ 筑後（12）。地域の中は市（自治体コード順）→ 町村（自治体コード順）。朝倉市・筑前町・東峰村は4地域では福岡地域
# 確かめ方は subsidy_a_areas.md・subsidy_b_areas.md（市町村の事業者向け・商工の分類ページを開いた）。商工会議所・商工会の名前は gov_ai.md・gov_ai_b.md の一覧
