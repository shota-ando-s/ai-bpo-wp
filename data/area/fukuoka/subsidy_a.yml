  org: 宗像市（産業振興部 商工観光課）
  area: fukuoka/munakata
  max_yen: 500000
  rate: 補助対象経費の1/2（市内事業者へ発注した経費は2/3）、上限50万円（事業継続力強化計画を策定済みの事業者は10万円上乗せ）
  rate_num: 0.5
  targets: {efficiency: ○, consulting: △, training: ×}
  expenses: 広報費（上限10万円）、工事請負費、委託料（マーケティング調査・F/S調査・専門家委託等、上限30万円）、備品購入費（汎用性が高いもの・消耗品は対象外）、ソフトウェア等利用料（特定業務用ソフトウェア・情報システム等の利用料、上限20万円）、人材活用に係る経費（専門家派遣・副業人材活用・求人掲載等、上限20万円）など。生産性向上枠の対象事業は「事業自動化（無人化）・省力化実現のための設備・デジタル技術の導入等」と、国の中小企業省力化投資補助金のカタログ登録製品の導入
  conditions: 宗像市内に事業所又は店舗を有する中小企業者・特定非営利活動法人（個人事業者は市内居住者）で、事業開始から1年を経過し、市税等の滞納がないこと。交付決定前の着手は対象外。補助対象期間は交付決定日〜2027-02-28。ほかに新事業・販路開拓枠、人への投資枠がある
  period: {status: open, start: 2026-06-01, end: 2026-12-25}
  url: https://www.city.munakata.lg.jp/kiji0034119/index.html
  checked: 2026-11-04
  confidence: official
  note: 市のページ（最終更新2026-06-01）で補助申請受付期間「令和8年6月1日（月曜日）から令和8年12月25日（金曜日）まで (注)受付は先着順で予算上限に到達次第終了します。」。募集要領 https://www.city.munakata.lg.jp/kiji0034119/3_4119_up_qy0swyxu.pdf は開いていない。予算の消化状況は書かれていない（同じ課の職場環境改善事業補助金のページには申請率が出ている）。枠ごとの補助率はページの表で「新事業・販路開拓枠」の行に1/2（市内発注2/3）とあり、生産性向上枠・人への投資枠も同じ表の中で上限50万円と読んだ（表の結合セル。募集要領で確かめ直す）。国の省力化投資補助金のカタログ製品の導入も対象だが、国の補助金への上乗せ（率の加算）ではないので addon にしていない
  fuenn_note: 宗像市内の中小企業が、自動化・省力化のための設備やデジタル技術（業務用ソフトウェアの利用料を含む）を入れる費用を1/2（市内業者への発注は2/3）、最大50万円補助する市の制度です。2026年12月25日まで先着順で受け付けています（予算に達し次第終了）。
