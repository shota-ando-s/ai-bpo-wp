# 山形県内19町3村（山辺・中山・河北・西川・朝日・大江・大石田・金山・最上・舟形・真室川・大蔵・鮭川・戸沢・高畠・川西・小国・白鷹・飯豊・三川・庄内・遊佐）2026年度
# 確認日 2026-10-24。根拠は subsidy_b_areas.md
# 生成AI・AI導入・AI研修を名指しで補助する町村独自の制度は、22町村とも確認できなかった
# 「デジタル化」「DX」を補助メニューに明記している町村の制度
#   - 大江町 商売繁盛創出支援事業補助金「デジタル化支援事業」（デジタル化・DX化・キャッシュレス。HP作成費・備品購入費など。1/2・上限20万円。随時、予算到達で終了）
#   - 飯豊町 中小企業振興事業費補助金「商業活性化支援事業 ②デジタル化推進費」（キャッシュレス・EC販売システム・デジタルオーダーシステム・専門家相談経費。1/2・上限30万円。2026年度は第3次募集が2026-10-15で終了）
# ホームページ作成・ネット販売・キャッシュレスに使える町村独自の制度: 三川町（経営強化支援 情報発信事業 1/2・10万円ほか）、朝日町（ネットショップ出店の初期登録料・月額利用料 1/2）、戸沢村（中小企業者等支援事業 2/3・40万円）、鮭川村（受付終了）、金山町（新規開発 販路拡大）、大蔵村（持続化支援）、西川町（持続化チャレンジ）
# 研修費に使える町村独自の制度: 飯豊町（人材育成 1/2・10万円、受付終了）、大江町（企業人材スキルアップ 1/2・10万円）、三川町（研修・技術資格取得 1/2・5万円）、真室川町（技能向上支援。研修会の開催・受講 1/2・年10万円）、遊佐町（技術者養成研修 2/3・年20万円）、白鷹町（リスキリング支援 1/3・5万円、窓口は商工会）、山辺町（企業人材育成 1/2・5万円）、中山町（講習受講 2/3・1.5万円）、高畠町（新事業活動推進サポート。研修会の開催 1/2・30万円）
# 国の補助金への上乗せ: 大蔵村 小規模事業者持続化補助金（全国商工会連合会の持続化補助金に採択された場合、補助対象経費から75万円を引いた額を上限25万円まで村が補助）。持続化補助金は national.yml に未登録のため addon・addon_to は書いていない
# 国のデジタル化・AI導入補助金（旧IT導入補助金）・中小企業省力化投資補助金に町村が上乗せする制度は、22町村とも確認できなかった
# 町村のページに受付期間の記載がなく「予算の範囲内で随時」「予算に達し次第終了」とある制度は period.status を rolling にした。ページが前年度以前のままで2026年度の実施をページから判断できない制度は unknown にした
# 鶴岡市の企業研修助成金（庄内地域産業振興センター）は三川町・庄内町の企業も対象の広域の制度（subsidy_a 担当の確認。2026-07-24に予算到達で受付終了）。町独自の制度ではないので、この YAML には入れていない
# 山形県の制度・県域の機関（やまがた産業支援機構など）・国の制度は別担当（subsidy_a）のため入れていない。融資・利子補給・保証料補給・企業立地の奨励金・雇用の奨励金・物価高騰対策の支援金・賃上げ支援金・移住支援金・個人向けの資格取得助成は YAML に入れていない（subsidy_b_areas.md の「IT向けではない制度」に記した）

