# 山形県（県・公益財団法人やまがた産業支援機構・公益財団法人庄内地域産業振興センター）と山形市・米沢市・鶴岡市・酒田市・新庄市・寒河江市・上山市・村山市・長井市・天童市・東根市・尾花沢市・南陽市（2026年度）。2026-10-24に公式ページ・公募要領・交付要綱で確認
# 県のデジタル化向け補助金は「山形県中小企業まるっとサポート補助金（収益力向上支援事業）」（商業振興・経営支援課。事務局はやまがた産業支援機構）。小規模事業者枠がDX・デジタル技術の設備投資（ソフト・クラウド利用料を含む）向け。第1次2026-04-01〜05-29、第2次08-03〜09-04で、どちらも終了。県のページ（更新日2026-09-30）に第3次の掲載はない。財源は国の物価高騰対応重点支援地方創生臨時交付金（令和7年度からの繰越）
# 県の補助金で「AI」を名前に掲げたものはない。小規模事業者枠の早見表に取組例として「AIやIoT等の技術を活用した遠隔操作システムの導入」がある。旧称の「中小企業パワーアップ補助金」（令和4〜6年度）は、令和7年度に「まるっとサポート補助金（稼ぐ力向上支援事業）」、令和8年度に「収益力向上支援事業」に変わっていて、令和8年度にパワーアップ補助金の名前の募集はない（subsidy_a_areas.md）
# 市でAIを名指しした制度は2つ。酒田市 DX化推進補助金（「データ、AI等のデジタル技術を活用」、2027-02末まで受付中）と、寒河江市 中小企業販売促進事業費補助金のAI活用事業（対象経費の一つ目が「生成AI導入費」、申請期限2027-02-26）
# 新庄市・長井市・天童市・東根市・南陽市は市独自のAI・IT・研修向け補助金なし（subsidy_a_areas.md に確認したページ）
# 国の補助金への上乗せ（addon）: 確認できたものはない。県のまるっとサポート補助金、山形市・酒田市・寒河江市・鶴岡市・上山市の制度は、国・県などの他の補助金を受ける事業を対象外にしている。村山市の企業DX推進補助金だけは「他の公的機関等から補助金等の交付を受けている場合は、当該補助金額を差し引いた額」を対象経費にする（＝remaining ratio 0.5 の形）が、今年度の受付状況が分からないため addon は書いていない
# 19件すべて confidence: official（村山市の企業DX推進補助金と尾花沢市の資格取得促進助成金は今年度の受付期間をページで確認できず status: unknown）
# 期間の status は data/subsidies/README.md の値（open / closed / rolling / unknown）を使う。随時受付は rolling

