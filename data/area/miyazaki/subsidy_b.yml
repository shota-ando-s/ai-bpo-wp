# 宮崎県の14町3村（三股町・高原町・国富町・綾町・高鍋町・新富町・木城町・川南町・都農町・門川町・美郷町〔東臼杵郡〕・高千穂町・日之影町・五ヶ瀬町・西米良村・諸塚村・椎葉村）の AI・IT・DX・設備・研修・販路向けの補助金（2026年度）。2026-11-04に各町村の公式サイトの事業者向け・商工業の分類ページ、商工担当課の記事一覧（curl でリンクを一覧にし、本文は curl か WebFetch で読んだ）、都農町は例規集の交付要綱、五ヶ瀬町は「令和8年度五ヶ瀬町補助金等一覧」PDF で確認
# AI・生成AI・IT導入・DX研修を名指しして補助する町村独自の制度は、17町村とも見つからなかった
# IT・デジタルに使える可能性がある町村の制度は3つ: 美郷町 商工業設備投資支援事業（対象事業に「生産性向上／ICT活用事業」、2/3・100万円。既存事業者の令和8年度の要望調査は終了）、都農町 商工業振興対策基金事業補助金の新技術導入支援事業（業務の効率化・省力化の技術導入、固定資産税の課税対象の設備で100万円超、1/2・300万円）と販路開拓支援事業（ホームページ等作成費を含む、1/2・50万円）。都農町は公式サイトが JavaScript だけで描かれるため募集のページを開けず、受付状況は unknown
# 研修: 高原町が中小企業大学校の受講料補助のページを持つが、補助額・期間の記載がない（ページ更新2020-04-01）。川南町の商工業振興支援事業補助金（店舗・設備・備品、1/2・50万円）はページ更新2020-12-22で受付期間の記載がない
# 制度が見つからなかった町村: 三股町・国富町・綾町・高鍋町・新富町・木城町・門川町・高千穂町・日之影町・五ヶ瀬町・西米良村・諸塚村・椎葉村（根拠は subsidy_b_areas.md）。新富町は産業振興課の記事一覧が1件しか出ず、町のサイトに商工業の分類ページがない。椎葉村は事業者向けの分類ページがない（制度なしと断定していない）
# 国・県の補助金への上乗せ（addon）: 17町村とも該当なし
# 町村の事業者が使える県・近隣の制度は subsidy_a.yml（県の産業DX推進は2026年度分が終了、機構の企業経営力アップ人材育成支援事業も終了）。延岡市・串間市・えびの市などの市の制度は、その市内の事業者に限る

