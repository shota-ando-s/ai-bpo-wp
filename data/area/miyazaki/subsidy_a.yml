# 宮崎県（県・県域の機関〔宮崎県情報産業協会＝県の補助金の事務局、公益財団法人宮崎県産業振興機構 https://www.mepo.or.jp/ 〕）と9市（2026年度）。2026-11-04に県の公式ページ・募集要領・交付要綱、Jグランツの公開API、機構のサイト、市の公式ページ（商工担当課の記事一覧・事業者向けの分類ページ）、延岡市の「中小企業支援ハンドブック（令和8年9月版）」で確認
# 県でデジタルを名指しした中小企業向けの補助金は、総合政策部 産業政策課（産業デジタル担当）の「令和8年度産業DX推進事業費補助金」（導入タイプ 1/2・250万円〔下限100万円、事務局は一般社団法人宮崎県情報産業協会〕、発展タイプ 1/2・1,000万円〔下限200万円、県が直接受付〕）と、令和7年度補正の「物価高騰対策DX推進事業費補助金」（デジタルツール導入事業 1/2・200万円、戦略的DX推進事業 1/2・500万円）。どちらも受付を終えた（導入 6/12、発展 6/30、物価高騰 5/15。物価高騰の二次募集は 8/7 締切と検索の抜粋にあり、県のページは404）。追加募集の告知はない
# 県（商工観光労働部）の「稼ぐ力」強化支援事業費補助金（IT導入関連費・ECサイト関連費を含む、2/3〔賃上げ特例3/4〕・50万/100万円）は5/29、ものづくり企業物価高騰対策設備等改修支援事業補助金（製造業のみ、1/2・1,500万円）は二次募集が8/27で終了。宮崎県賃上げ対応緊急支援金（7万円×人数）も終了（締切はプレスリリース9/30、県の支援策ページ10/31で食い違う）
# 県・県域の機関で 2026-11-04 に申請できる補助金は見つからなかった。無料の支援（補助金ではない）は、宮崎県よろず支援拠点（機構内。生産性向上支援センター・よろずAI相談会）、産業DXサポートセンター（宮崎県情報産業協会。運営は株式会社宮崎県ソフトウェアセンター）。県のみやざきDXけん引人材育成事業（無料、戦略策定コースは8/26締切、実践コース20社は11/6キックオフ）・みやざきDX推進モデル企業創出プロジェクト（5社程度、8/7締切。AIを使った分析・AIリスキリングの回あり）は募集を終えた
# AIを名指しした制度: 県の産業DX推進（発展タイプ）は審査項目「先進性」に「ＡＩ等を活用した新たなビジネスモデルの構築」（20点）、導入タイプはJグランツの参考例に「AI-OCRやRPAを活用した文書事務の効率化」。宮崎市の成長応援!設備投資サポート（DX支援枠）は対象経費に「AIツール」「AIカメラ（不良品検知、来客分析等）」（受付終了）
# 市で 2026-11-04 に申請できるもの: 延岡市の研修系（人材確保支援補助金の人材育成推進事業＝国の人材開発支援助成金の自己負担の1/2・10万円〔addon〕、中小企業大学校研修派遣 1/2・10万円、ものづくり人材育成派遣研修 1/2〜2/3・10万円、副業人材マッチングの掲載料 10/10・11万円）、えびの市の中小企業大学校受講料補助（2万円/人、〜2027-02-26）、串間市の企業支援プロジェクト（3/5・50万円、申請は11/6まで。ただし必須の事前相談は10/30で締切）
# 市独自の AI・IT 導入・研修向けの補助が見つからない市: 西都市（地場産業販路拡大〔団体向け・物産展〕・創業・事業継続力強化だけ）。日南市は販路拡大型（ECサイト構築を含む、1/2・50万円）だけで終了、小林市は中小企業大学校の受講料補助だけ。日向市の公式サイト（www.hyugacity.jp）は 2026-11-04 に curl・WebFetch とも 503 で開けず、日向市の制度は補助金ポータル（二次情報）だけで入れた（confidence: secondary）
# 国の補助金への上乗せ（addon）: 延岡市 人材確保支援補助金（人材育成推進事業）が国の人材開発支援助成金（人への投資促進コース・事業展開等リスキリング支援コース）の支給決定を受けた研修の自己負担分の1/2・上限10万円で、national.yml の jinzai-reskilling に addon（remaining, 0.5）を付けた。国のデジタル化・AI導入補助金・省力化投資補助金・ものづくり補助金への県・市の上乗せは見つからない。県の産業DX推進は「国庫及び公的制度からの二重受給」を対象外とする（発展タイプ募集要領 p4）
# 宮崎県工業技術センター（www.iri.pref.miyazaki.jp）は 2026-11-04 に curl で接続できず、WebFetch は 503。補助金は持たない機関とみられるが、確かめていない
# 期間の status は data/subsidies/README.md の値（open / closed / rolling / unknown）を使う。随時受付は rolling。来年度の見込み（next_expected）は書いていない

