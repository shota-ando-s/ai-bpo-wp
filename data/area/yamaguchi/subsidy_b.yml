# 山口県の6町（周防大島町・和木町・上関町・田布施町・平生町・阿武町。県内に村はない）の AI・IT・DX・研修・外部専門家向けの補助金（2026年度）。2026-11-01に6町の公式サイトの事業者向け・商工業・補助金のページを開いて確認（確認したURLは subsidy_b_areas.md）
# 6町とも、AI・IT導入・DX・事業者の研修（リスキリング）・外部専門家の活用を補助する町独自の制度は見つからなかった。このファイルには制度を入れていない（entries は空）
# 入れていないもの: 上関町 人材育成事業助成金（研修視察の旅費の2/3・国内1人5万円。対象は町内に居住する個人・町内で活動する団体・グループで、事業者〔企業〕の明記がなく、分野は地場産業・教育・文化・福祉等）、阿武町 起業化支援補助金（起業・新分野進出の事業所開設・設備備品・人材育成費等1/2・50万円、申請期限は5月末・8月末・11月末・2月末。IT・ソフトウェアの明記なし）、周防大島町 事業拡大支援事業補助金（国の小規模事業者持続化補助金〔令和元〜3年度補正〕への上乗せ。申請期限2024-03-31で終了）、和木町 創業支援事業補助金（2021年の掲載、創業向け）
# 国の補助金への上乗せ（addon）: 6町とも現行の制度は見つからない。周防大島町の持続化補助金への上乗せ（（持続化補助金の補助対象経費−交付額）×4/5、上限50万円）は2024-03-31で終わった制度で、上乗せ先も national.yml にない
# 6町の事業者は、県・やまぐち産業振興財団の制度（subsidy_a.yml のデジタル人材等育成支援補助金・採用活動効率化支援補助金など）を使える
# 期間の status は data/subsidies/README.md の値（open / closed / rolling / unknown）を使う

