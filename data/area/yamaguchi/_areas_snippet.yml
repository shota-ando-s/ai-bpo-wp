# data/subsidies/areas.yml の末尾に足す山口県の部分（D34、2026-11-01）。親が最後に areas.yml に入れる（data/subsidies/yamaguchi.yml〔案は data/area/yamaguchi/_subsidies_yamaguchi.yml〕と同じコミット。areas.yml は直接編集していない）
# none: true は _subsidies_yamaguchi.yml にその市町の制度が1件もない11市町（下松市・柳井市・美祢市・周南市・山陽小野田市と、周防大島町・和木町・上関町・田布施町・平生町・阿武町の6町）。宇部市・長門市は今年度の受付を終えた制度しかなく、下関市は令和8年度の受付が未告知の制度しかないが、yml に制度があるので none にせず、note の一文目で状況を書いた
# 並びは自治体コードの順（13市→6町。総務省「全国地方公共団体コード」、stats.md の表）。県の地域区分（観光の4地域・保健所の区分）で並べるかは【D1】の地域区分の決定に合わせて親が決める（D34 判断）
# 6町は町の公式サイトの事業者向け・商工業・補助金のページで確かめた（subsidy_b_areas.md。鳥取の「とっとり産業支援ナビ」のような県の市町村支援DBは山口県にない）。和木町は「補助・助成」の一覧（/life/sub/）が 403 で開けなかったので、note で断定しない書き方にした
# none の callout は「AI・IT導入向けの独自の補助金が見つかりませんでした」と出るので、none の note は確かめ方・相談先を書く
- code: yamaguchi
  name: 山口県
  cities:
    - {code: yamaguchi/shimonoseki, name: 下関市, note: 市内の中小企業が従業員を中小企業大学校の研修に派遣したときに受講料の1/2（上限5万円）を補助する中小企業大学校研修生派遣事業補助金がありますが、令和8年度の受付はまだ告知されていません（2026-11-01確認。令和7年度は研修後の2026年2〜3月に受付）。AI・IT導入の費用を補助する市独自の制度は見つかりませんでした。市の産業振興課か下関商工会議所に確認してください}
    - {code: yamaguchi/ube, name: 宇部市, note: Y-BASE宇部ブランチの支援と連動してソフトウェア・クラウドの導入や専門家の活用を2/3（一般枠は上限100万円）補助する中小企業等DX推進事業費補助金は、2026年度の募集が2026-08-31で終わりました（2026-11-01確認）。市の産業政策課かY-BASE宇部ブランチに来年度の予定を確認してください}
    - {code: yamaguchi/yamaguchi-city, name: 山口市, note: 人の作業を代わりに行う機器やソフトウェア（顧客管理・電話自動応答など）の導入に1/2（購入は上限50万円、クラウド利用・リースは10万円）を補助する省人化・省力化機器等導入支援補助金は2027-01-15まで申請できますが、2026-10-26時点で予算の90％を超えています。研修の費用を1/2（1人5万円・1社20万円）補助する中小企業人材育成応援補助金もあります（研修の申込み前に申請）}
    - {code: yamaguchi/hagi, name: 萩市, note: 従業員の賃金を3％（または時給50円）以上引き上げ、AI活用や生産管理システムなどのデジタル化に取り組む費用を1/2（従業員数により上限25万〜100万円）補助する中小企業者持続的成長・賃金引き上げ促進補助金は2026-11-30まで申請できます（2026-11-01確認）。設備等の導入前に市の産業政策課への事前相談が必要です。人手不足対策のITツール導入を1/2（上限10万円）補助する事業拡大補助金（雇用課題DX促進事業）もあります}
    - {code: yamaguchi/hofu, name: 防府市, note: 事業場内最低賃金を5％以上引き上げ、基幹システムやRPA・IoTなどの設備を導入する費用を2/3（上限50万円）補助する賃金引上げ応援事業補助金は2026-11-30まで申請できます（2026-11-01確認）。防府市中小企業サポートセンター（コネクト22）の支援を受けて事業計画を作ることが条件です。10万円以上の償却資産（機械装置・専用ソフトウェアなど）を取得して市内の事業所に置くことが必要で、パソコン・タブレットだけの導入は対象外です。月額のクラウド利用だけで使えるかは市の商工振興課に確認してください}
    - {code: yamaguchi/kudamatsu, name: 下松市, none: true, note: 市の産業振興課のページで確かめた範囲で、市独自のAI・IT導入や研修の補助金は見つかりませんでした（2026-11-01確認）。下松商工会議所か市の産業振興課に確認してください}
    - {code: yamaguchi/iwakuni, name: 岩国市, note: 一般の中小企業向けの市独自のAI・IT導入の補助金は見つかりませんでした（2026-11-01確認）。市内のバス・タクシー・地域鉄道の事業者には、配車・シフト作成・IT点呼などのシステム導入を1/2（上限150万円）補助する交通事業者デジタル機器等整備事業費補助金があり、2026-12-18まで申請できます。市は生産性・省力化の無料の個別相談会（2027年2月まで）も開いています}
    - {code: yamaguchi/hikari, name: 光市, note: 市独自のAI・IT導入の補助金は見つかりませんでした（2026-11-01確認）。従業員にリスキリングなどの研修（6時間以上）を受けさせる受講料・旅費を1/2（1社20万円まで）補助する中小企業等人財定着・定住支援補助金【定着】があり、研修の開講日の前日までに市の商工振興課に申請します}
    - {code: yamaguchi/nagato, name: 長門市, note: 会計・勤怠・受発注管理などのソフトウェアや省力化機器の導入に2/3（上限50万円）を補助する省力化機器等導入支援補助金は、2026年度の受付が2026-06-01で終わりました（2026-11-01確認）。市の産業立地・戦略推進課か長門商工会議所に確認してください}
    - {code: yamaguchi/yanai, name: 柳井市, none: true, note: 市の商工観光課の中小企業振興のページで確かめた範囲で、市独自のAI・IT導入や研修の補助金は見つかりませんでした（2026-11-01確認）。柳井商工会議所か大畠商工会に確認してください}
    - {code: yamaguchi/mine, name: 美祢市, none: true, note: 市の商工業のページで確かめた範囲で、市独自のAI・IT導入や研修の補助金は見つかりませんでした（2026-11-01確認）。美祢市商工会か市の商工労働課に確認してください}
    - {code: yamaguchi/shunan, name: 周南市, none: true, note: 市の商工振興課のページで確かめた範囲で、市独自のAI・IT導入や研修の補助金は見つかりませんでした（2026-11-01確認。経営課題解決支援補助金は2026-06-30で受付終了）。徳山商工会議所・新南陽商工会議所か市の商工振興課に確認してください}
    - {code: yamaguchi/sanyo-onoda, name: 山陽小野田市, none: true, note: 市の商工労働課のページで確かめた範囲で、市独自のAI・IT導入や研修の補助金は見つかりませんでした（2026-11-01確認）。小野田商工会議所・山陽商工会議所か市の商工労働課に確認してください}
    - {code: yamaguchi/suo-oshima, name: 周防大島町, none: true, note: 町独自のAI・IT導入や研修の補助金は見つかりませんでした（2026-11-01確認。国の持続化補助金に上乗せする町の制度は2024年3月で終了）。周防大島町商工会か町の商工観光課に確認してください}
    - {code: yamaguchi/waki, name: 和木町, none: true, note: 町の商工業のページで確かめた範囲で、町独自のAI・IT導入や研修の補助金は見つかりませんでした（2026-11-01時点。補助・助成の一覧は開けませんでした）。和木町商工会か町役場に確認してください}
    - {code: yamaguchi/kaminoseki, name: 上関町, none: true, note: 町独自のAI・IT導入や事業者の研修の補助金は見つかりませんでした（2026-11-01確認）。上関町商工会か町の産業観光課に確認してください}
    - {code: yamaguchi/tabuse, name: 田布施町, none: true, note: 町独自のAI・IT導入や研修の補助金は見つかりませんでした（2026-11-01確認）。田布施町商工会か町の経済課に確認してください}
    - {code: yamaguchi/hirao, name: 平生町, none: true, note: 町独自のAI・IT導入や研修の補助金は見つかりませんでした（2026-11-01確認）。平生町商工会か町役場に確認してください}
    - {code: yamaguchi/abu, name: 阿武町, none: true, note: 町独自のAI・IT導入や研修の補助金は見つかりませんでした（2026-11-01確認）。起業や新分野への進出を1/2（上限50万円）補助する起業化支援補助金でシステムの経費が対象になるか（令和8年度の実施を含む）は、町役場に確認してください。商工会は萩阿武商工会です}
