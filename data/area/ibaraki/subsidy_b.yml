# 茨城県の10町2村（茨城町・大洗町・城里町・大子町・阿見町・河内町・八千代町・五霞町・境町・利根町・東海村・美浦村）の AI・IT・DX・研修・省力化・生産性向上に使える町村独自の補助金（2026年度）。2026-11-06に12町村の公式サイトの事業者向けの分類ページ・商工の記事一覧・補助金一覧を開いて確認（境町は WebFetch だけ）
# DX・デジタル・省力化を名指しした町村独自の補助金は2件: 八千代町 事業所DX推進事業補助金（2/3・20万円、随時）、東海村 中小企業省力化・生産性向上設備導入支援補助金（1/2・購入50万円／リース10万円、R8 は予算の上限に達し受付終了）
# このほか、設備・研修・ホームページ製作などにも使える一般の制度を6件（大子町3件・大洗町・河内町・利根町）。いずれも AI・IT の名指しはなく、targets は △ にした
# 受付中・随時（2026-11-06）: 八千代町 DX推進、大子町 経営改善・創業等支援（人材不足対策・生産性向上の設備、1/2・25万円）・国補助金活用事業（ものづくり補助金等の交付決定者に定額10万円）・地域人材育成（新規正規雇用者の研修費、1人15万円）、大洗町 創業ビギナープロモーション（ホームページ製作費など、1/2・10万円）、河内町 創業支援促進（設備費・備品購入費など、1/2・30万円、2027-02-26 まで）、利根町 空き店舗等活用創業期支援（改修・広告宣伝・賃料、先着）
# 国の補助金への上乗せ: 大子町「国補助金活用事業」が国のものづくり補助金等の交付決定を受けた事業に定額10万円（README の addon の kind では表せない。下の note）。八千代町 DX推進は「他の公的機関の補助金を受ける場合は補助対象経費外」で、addon {kind: remaining} の形に近いが上乗せの制度ではない（note）
# 町村のサイトにある県・国の制度（阿見町が案内する国のデジタル化・AI導入補助金2026・県のデジタルスキル習得支援事業補助金、利根町が案内する県の中小企業人材育成支援事業補助金）は町村独自ではないので入れていない（subsidy_a・national の担当へ）
# 期間の status は data/subsidies/README.md の値（open / closed / rolling / unknown）を使う
# 町村ごとの確認したページ・制度がない町村は subsidy_b_areas.md

