# 案（D34、2026-11-06 のデータ）。data/subsidies/areas.yml の末尾に足す茨城県の部分。親が最後に areas.yml に入れる（data/subsidies/ibaraki.yml〔案は data/area/ibaraki/_subsidies_ibaraki.yml〕と同じコミット。areas.yml は直接編集していない）
# none: true は _subsidies_ibaraki.yml にその市町村の制度が1件もない30市町村（24市・6町村）。どれも市町村の公式サイトの商工・事業者向けの補助金一覧で確かめて見つからなかった（subsidy_a_areas.md・subsidy_b_areas.md）。境町だけは curl で開けず WebFetch の要約で確かめたので、note に「町にも確かめて」と書いた
# 水戸市・ひたちなか市・かすみがうら市・東海村は今年度の受付を終えた制度しかないが、yml に制度があるので none にせず、note の一文目で状況を書いた（岡山県玉野市・鹿児島県霧島市と同じ）
# 並びは県の地域区分（census_pref の注「県内地域区分は以下による」、stats.md）の順: 県北（6）→ 県央（9）→ 鹿行（5）→ 県南（14）→ 県西（10）。区分の中は市（自治体コード順）→ 町村（自治体コード順）
# none の callout は「AI・IT導入向けの独自の補助金が見つかりませんでした」と出るので、none の note は確かめたページ・相談先（商工会議所・商工会は gov_ai.md の名簿）・無料と資料にある窓口・取り違えの注意を書く
# 「無料」と書いたのは資料に無料とあるものだけ: 産業活性化コーディネーター（笠間市のページ「相談は無料です」、ひたちなか市のページ「相談は無料です」、大洗町のページ「相談は無料」〔小美玉市・茨城町・大洗町担当〕）、那珂市よろず相談事業（「相談は無料です」）。茨城県よろず支援拠点（県のガイドブック p.26「料金：無料」）は ibaraki の行の県域の窓口なので、市町村の note には書いていない（水戸市だけ所在の注意として書いた）
# 取り違えの注意: 茨城町（ibaraki-town）は茨城県と別、古河市（koga）は福岡県古賀市と別、鹿嶋市（kashima）は佐賀県鹿島市と別、那珂市（naka）は徳島県那賀町と別、境町（sakai-town）は福井県坂井市と別、つくばみらい市はつくば市と別、を note に入れた
# 市町村の制度は市町村内に事業所がある事業者が対象で、近くの市町村の事業者は使えない。県の制度（デジタルスキル習得支援・いばらき業務改善奨励金・IIS エキスパート派遣）は ibaraki の行で全地域に出るので、市町村の note には書いていない
