#
# 以下は data/area/ibaraki/subsidy_a.yml（県・県域の機関と32市）の冒頭のコメント
# 茨城県（県・公益財団法人いばらき中小企業グローバル推進機構〔IIS〕・茨城県産業技術イノベーションセンター〔ITIC〕）と32市（2026年度）。2026-11-06に県の公式ページ・交付要項・募集要項、県の「2026年度中小企業・小規模企業支援施策活用ガイドブック」（産業戦略部産業政策課、2026年6月末時点の情報）、県の賃上げ支援の特設サイト（ibaraki-chinage.com、茨城県の事業）、IIS のサイト、32市の公式サイト（商工・事業者向けの補助金一覧）で確認
# 県で「デジタル」を名指しして今申請できる中小企業向けの補助金は「デジタルスキル習得支援事業補助金」（産業人材育成課。デジタルスキルの研修受講料・講師招聘経費の1/2・上限10万円、2026-04-15〜2027-01-29、先着順。いばらきリスキリング推進宣言企業であることが要件）だけ。県に、IT・AIツールの導入費を直接補助する中小企業向けの補助金（鹿児島県のDX推進補助金のような制度）はガイドブックにも県のページにも見当たらない
# 県の「いばらき業務改善奨励金」（労働政策課、国の重点支援交付金。〜2027-01-29）は、事業場内最低賃金を50円以上引き上げて生産性向上の設備投資等をする事業者向け。拡大コース（国の業務改善助成金の対象外の事業場〔事業場内最低賃金1,136円以上1,500円未満〕、7/8・最大700万円）は、システム開発会社等への委託費・ライセンス（3年分まで）・経営コンサルティング・外部講師の研修も対象。上乗せコースは国の業務改善助成金への上乗せ（国の対象経費の1/8〜1/20）
# AIを名指しした県の補助金は「いばらきフィジカルAIビジネス創出支援事業費補助金」（技術革新課。2/3・1,000万円、コンソーシアム正会員の製品化・ソフト開発、2026-10-01〜10-29で終了）。既存の市販ソフトを入れる業務効率化は対象外
# 市で今受け付けているAI・IT・研修向けの補助: 常陸太田市 ビジネスチャレンジ事業費補助金のDX促進支援（2/3・20万円、予算がなくなり次第終了、7月時点で「予算が残りわずかの事業区分もある」）・技能訓練支援、日立市 競争力強化支援（1/3・80万円）・人的資本経営支援（1/3・30万円、研修・資格・副業人材。いずれも〜2026-11-30先着）、つくば市 ビジネス拡大支援補助金（8/10か5/10・30万円、〜2027-01末）、鉾田市 中小企業等人材育成事業補助金（1/2・1名5万円・2名まで、〜2027-02-26）、つくばみらい市 新商品開発支援等事業費補助金（生産効率向上事業 1/2・50万円、予算の範囲）
# 今年度の受付を終えた市の補助: 水戸市 中小企業振興支援補助金（デジタルツール導入 1/2・100万円、「ＡＩの導入に係る経費」を名指し。予算額に達して全事業終了）、日立市 中小企業AIサービス実証支援事業補助金（1/2・100万円、9/30締切）、かすみがうら市 新時代対応型事業展開支援補助金（3/4・20万円、生産性向上型で「データ、ＡＩ等のデジタル技術」を名指し。予算上限到達で終了）、ひたちなか市 中小企業事業活性化補助金（技能訓練 1/2・10万円ほか。予算枠到達で終了）
# 市独自のAI・IT導入・研修向けの補助が見つからない市（24市）: 土浦市（ITオフィスの改修工事の補助だけ）・古河市・石岡市・結城市・龍ケ崎市・下妻市・常総市・高萩市・北茨城市・笠間市（販路・人材確保だけ）・取手市・牛久市・鹿嶋市・潮来市・守谷市・常陸大宮市・那珂市・筑西市・坂東市・稲敷市・桜川市・神栖市・行方市・小美玉市。詳細と確かめたページは subsidy_a_areas.md
# 国の補助金への上乗せ（addon）: 県・32市とも、国のデジタル化・AI導入補助金・省力化投資補助金・ものづくり補助金への上乗せは見つからない。県のいばらき業務改善奨励金（上乗せコース）は国の業務改善助成金への上乗せだが、業務改善助成金は data/subsidies/national.yml にないので addon・addon_to は書いていない（入れるなら addon の kind cost_ratio、国の助成率3/4のとき ratio 0.125）。日立市・常陸太田市・かすみがうら市・つくば市・鉾田市の補助は他の公的補助との重複を認めていない
