# 診断の「今年度に使える組み合わせ」（efficiency、○◎で今申請できる制度）は常陸太田市（ビジネスチャレンジ DX促進支援 ◎、2/3・20万円）と八千代町（事業所DX推進 ◎、2/3・20万円）だけに出る。ほかの42市町村は出ない。来年度は国のデジタル化・AI導入補助金（fuenn_available_from 2027-04）
# AI を名指しした制度（水戸市 デジタルツール導入「ＡＩの導入に係る経費」、日立市 AIサービス実証支援、かすみがうら市 新時代対応型「データ、ＡＩ等のデジタル技術」、県 フィジカルAIビジネス創出〔AI を作る側〕）はすべて今年度終了。今申請できる制度に AI を名指ししたものはない（常陸太田市・八千代町は「デジタル技術」「ITコンサルティング」まで）
