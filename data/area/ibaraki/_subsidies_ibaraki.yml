# 制度が1件もない30市町村は areas.yml で none: true（_areas_snippet.yml）。水戸市・ひたちなか市・かすみがうら市・東海村は今年度終了の制度しかないが、yml に制度があるので none にせず note の一文目で状況を書く（岡山県玉野市・鹿児島県霧島市と同じ）
