# 東京都 23区のうち11区（渋谷区・中野区・杉並区・豊島区・北区・荒川区・板橋区・練馬区・足立区・葛飾区・江戸川区）の AI・IT・DX・研修・販路開拓向け補助金・助成金（2026年度）。2026-11-14 に区・区の産業振興公社の公式ページ・要領で確認（根拠は subsidy_2_areas.md）
# 形は data/subsidies/tokyo.yml（パイロット、2026-10-14）と同じ項目（period の status は open / closed / rolling / unknown）。来年度の見込み（next_expected）は書かない。area は tokyo/<slug>（nakano-ku・toshima-ku・kita-ku）。パイロットの id（itabashi-digital）はそのまま使う
# 都・公社・しごと財団の制度は subsidy_pref.yml、残りの12区は subsidy_1.yml（govsub_1）
# 区の制度を調べ終わった順に書き足した
# 生成AIを名指しで対象にした区の補助金: 中野区 経営力強化支援事業補助金のＩＴ・ＤＸ対応支援（生成ＡＩ使用及び導入）（生成AIの使用料・導入コンサル・研修、1/2・メニュー合計20万円、2027-01-31まで）、豊島区 DX推進補助金（「生成AI機能を含む」ソフトウェア、1/2・20万円、2026-11-27 17時必着）。逆に江戸川区 IT導入は「パソコン、生成AIなど」汎用性の高いものを対象外と明記
# 今日（2026-11-14）申請できるソフトウェア・クラウドの区の補助: 板橋区（公社、1/2〜2/3・50万〜500万円、予算到達まで。専門家事前相談が必須）、豊島区（1/2・20万円、11/27まで）、荒川区 製造業等DX推進補助（1/2・100万円、2027-02-15まで）・商業・サービス業（1/4・100万円、2027-02-12まで）、足立区（2/3・75万円、2027-02-12まで。診断士の事前相談が必須）、葛飾区（1/2・50万円、2027-02-26まで。IT相談の診断書が先）、江戸川区 IT導入（2/3・50万円、随時・予算到達まで）、中野区（生成AIのみ、上）。受付終了: 杉並区（9/28 予算到達）、北区（5/8 締切）、江戸川区 DX導入（11/13 締切）、練馬区 新規ビジネスチャレンジ（8/31 締切）
# 国・都の制度への上乗せ（addon）: 葛飾区 産業人材育成支援補助事業（人材開発支援助成）＝国の人材開発支援助成金（人材育成支援コース・事業展開等リスキリング支援コース）の支給額の1/3・50万円（kind が README に無いので addon は書かず stacking だけ）。都の公社の専門家派遣の利用料への補助: 中野区（1回1万円×8回、IT・DX テーマ）・練馬区（1回1万円×3回、ただしデジタル分野は対象外）。国のデジタル化・AI導入補助金（旧IT導入補助金）への区の上乗せは11区とも見つからない
# addon の kind: fixed（per_visit_yen・max_visits）は govsub_1 の subsidy_1.yml に合わせた形（tokyo.yml・README に無いので、取り込むときに親で確認）
# ソフトウェア・IT導入の区独自の補助が見つからない区: 渋谷区（パイロットの none のまま）、練馬区（公社の補助はホームページ作成・見本市・認証など）。北区は伴走支援の参加企業向けで締切済み、杉並区は受付終了

