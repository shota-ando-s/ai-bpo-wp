  conditions: 都内に登記簿上の本店または支店があり、都内で実質的に事業を行っている中小企業者等（会社・個人事業主・中小企業団体）。都内に本店があれば事業実施場所は都内と神奈川・埼玉・千葉・群馬・栃木・茨城・山梨でもよい（支店のみは都内の事業所だけ）。一般市場で販売されていることが確認できるツールに限る（募集要項 P.14「申請時点で、製造元及び販売代理店等のホームページで、デジタルツールの価格、仕様及びサービス内容並びに一般に広く販売されていること（ホームページ等で個別問合せを行うことなく直ちに購入できる等）を事務局が確認できることが必要です」）。同一の内容（経費）で公社・国・都道府県・区市町村から重複して助成を受けないこと。過去にこの事業（前身を含む）で採択された場合は助成金額が確定していて、同一目的のツールでないこと。1募集回1事業者1申請。申請は事業者自身か法令上代行が認められる士業だけ。Jグランツ（GビズIDプライム）で申請。2〜3か月のトライアル導入は不可
  period: {status: open, start: 2026-09-28, end: 2027-01-29}
