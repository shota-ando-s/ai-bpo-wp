  fuenn_note: 都内の中小企業が、市販のソフトウェアやクラウドサービス（生成AIで問い合わせ対応を自動化するツールなど）を新しく入れる費用を1/2（小規模企業者は2/3、最大150万円）、2年分まで助成する都の制度です。申請は2027年1月29日までで、予算に達すると早く締め切られます。

