# 東京都（都・東京都中小企業振興公社・東京しごと財団）の AI・IT・DX・研修向け補助金・助成金（2026年度）。2026-11-14に公式ページ・募集要項で確認（根拠は subsidy_pref_areas.md）
# 形は data/subsidies/tokyo.yml（パイロット、2026-10-14）と同じ項目（period の status は open / closed / rolling / unknown）。来年度の見込み（next_expected）は書かない（神奈川の subsidy_a.yml と同じ扱い）。パイロットの都の6制度の id はそのまま使っている（消さない）。area は都 tokyo。区市町村の制度は段階2以降の担当
# 今日（2026-11-14）新しく申請できる都の制度: 中小企業デジタル導入促進補助事業（1/2〔小規模・環境負荷軽減ツールは2/3〕・150万円、2027-01-29まで、予算到達で終了。市販のツールで価格・仕様がホームページで確認できるもの。生成AIの例示あり）、躍進的な事業推進のための設備投資支援事業 第14回（1/2〜4/5・1億円、ソフトウェアは固定資産計上のもの。クラウド利用料は対象外、11/24 13時締切）、しごと財団の DXリスキリング助成金（3/4・1人1研修7.5万円・年100万円）・事業外スキルアップ助成金（1/2〔小規模2/3〕・1人1研修2.5万円）・事業内スキルアップ助成金（受講者数×時間×800円）（いずれも研修開始の1か月前までに申請、2027-02-28まで）
# DX推進トータルサポート助成金（生産性向上・DX推進〔ステップアップ・アドバンス〕・AI活用の各コース）は、公社のアドバイザー派遣で「提案書」を受け取った事業者だけが申請できる。2026年度のアドバイザー派遣の募集は AI活用コース・DXコースが 5/8、生産性向上コース（第2回）が 11/11 の更新で予定件数到達で終了。助成金の第1回は事前予約 10/15〜11/13（終了）・申請 11/2〜11/30（事前予約した事業者のみ）
# 国の「デジタル化・AI導入補助金」（national.yml の digital-ai-donyu。7次は 2026-12-01 17時締切、事務局のスケジュールで 2026-11-14 に再確認）との関係: 都・公社・しごと財団の制度は、どれも同一の内容（経費）で国・他の自治体の補助を受けないこと（併用不可）。上乗せ（addon）の制度はない
