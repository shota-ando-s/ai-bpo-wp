# 東京都23区のうち12区（千代田区・中央区・港区・新宿区・文京区・台東区・墨田区・江東区・品川区・目黒区・大田区・世田谷区）2026年度
# 確認日 2026-11-14。根拠は subsidy_1_areas.md
# 形は data/subsidies/tokyo.yml と同じ項目（period の status は open / closed / rolling / unknown）。来年度の見込み（next_expected）は書かない。area は tokyo/<slug>（chiyoda-ku・chuo-ku・ota-ku は slug に合わせた）
# パイロット（data/subsidies/tokyo.yml、2026-10-14）の区の id（shinagawa-digital-soft・shinagawa-jinzai-addon・minato-software・minato-digital-addon・sumida-digital・sumida-jinzai・koto-ict）はそのまま使っている
# 都・公社・しごと財団の制度は subsidy_pref.yml
# 生成AIを名指しで対象にした区の補助金は江東区 ICT等導入支援事業だけ（「代表的な生成AI（ChatGPT・Claude・Geminiなど）」、1/2・50万円）。品川区 デジタル技術活用推進助成（ソフトウェア）は「ＡＩを活用したシステム」を対象と明記（2/3・60万円）
# 今日（2026-11-14）申請できるソフトウェア・クラウドの区の補助: 墨田区（3/4・50万円、2026-11-30 17時必着）、港区（3/4・40万円、2027-01-31）、品川区（2/3・60万円、2027-01-29）、江東区（1/2・50万円、締切の表示なし・事前の支援員確認が必須）。いずれも予算到達で終了
# 国・都の制度への上乗せ（addon）: 港区 デジタル技術導入促進（国のものづくり補助金〔DX〕・省力化投資補助金一般型の残額の1/2・100万円）、品川区 人材スキルアップ（しごと財団の DXリスキリング等の助成額の1/5）、港区・台東区（事業団）の公社の専門家派遣の利用料への補助。国のデジタル化・AI導入補助金（旧IT導入補助金）への区の上乗せは12区とも見つからない
# addon の kind: fixed（per_visit_yen・max_visits）は今回新しく使った形（公社の専門家派遣1回あたりの定額）。tokyo.yml の形に無いので、取り込むときに親で確認
# ソフトウェア・IT導入の区独自の補助が見つからない区: 千代田区・中央区・新宿区・大田区（パイロットの none のまま）、目黒区・世田谷区（世田谷区は経営支援補助金が受付終了）。文京区は研修（リスキリング 1/2・10万円）、台東区は設備・業務システム（ソフト・クラウドだけは対象外）

