  org: 目黒区（産業経済・消費生活課 中小企業振興係、03-3711-1134）
  area: tokyo/meguro
  max_yen: 400000
  rate: 補助対象経費の2/5、1事業者上限40万円（千円未満切り捨て）
  rate_num: 0.4
  targets: {efficiency: △, consulting: ×, training: ×}
  expenses: 国の中小企業省力化投資補助金（カタログ注文型）のカタログに登録された省力化製品本体の購入費（例 券売機・清掃ロボット・自動調理器具・パワーアシストスーツ）
  conditions: 中小企業基本法の中小企業者または従業員300人以下の社会福祉法人。法人は区内に登記上の本店、個人事業者は開業届の納税地が目黒区。大企業が実質的に経営に参画していないこと、個人開業医でないことなど。国の補助金と併用可。先着順（50社程度）
  period: {status: open, end: 2027-01-29}
  url: https://www.city.meguro.tokyo.jp/sangyoukeizai/shigoto/kigyoushien/syouryokuka.html
  checked: 2026-11-14
  confidence: official
  note: WebFetch で読んだ（curl は接続リセット。要約ツールの抜き出しなので原文で再確認が要る）。ページ（更新日 2026年5月30日）「予算上限に達し次第終了」。ソフトウェア・クラウド・AIを対象とする記載はない。national.yml にカタログ注文型の id はない（shoryokuka-ippan だけ）ので stacking は書いていない。国の補助の残額への上乗せ（addon）ではなく、同じ経費への区の補助として記録した（国の補助と合わせた上限は要綱で未確認）
  fuenn_note: 目黒区に本店がある中小企業が、国の省力化投資補助金のカタログにある省力化製品（券売機・清掃ロボットなど）を買う費用の2/5（最大40万円）を、国の補助と併せて区が補助する制度です。2027年1月29日まで先着50社程度で、ソフトウェアやAIツールは対象として書かれていません。

