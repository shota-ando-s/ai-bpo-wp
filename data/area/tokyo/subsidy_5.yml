# 都・公社・しごと財団の都内全域の制度は subsidy_pref.yml（ここでは扱わない）。パイロット（data/subsidies/tokyo.yml）に島しょの制度はない
# 生成AI・AIを名指しで対象にした制度は見つからない。ソフトウェア・情報システムの費用が対象経費に入るのは、三宅村・八丈町の雇用機会拡充事業（国の特定有人国境離島地域社会維持推進交付金。雇用増を伴う創業・事業拡大。補助対象事業費の3/4、事業拡大で事業費上限1,600万円。パソコン・タブレット等の汎用品は対象外）と、都・東京観光財団の多摩・島しょの新たな観光の魅力創出支援事業（ハードに「ICT化、機器導入」。受付終了）
# 今日（2026-11-22）申請できる町村の制度: 八丈町 雇用機会拡充（11/25 17時必着）、三宅村 雇用機会拡充（12/11 17時）、三宅村 宿泊事業者等支援（上限100万円、12/28まで）、大島町 原料価格等高騰対策支援金（12/10まで）
# 今日申請できる都・都の団体の島しょ向けの制度: 地域企業再建支援事業費補助金（八丈町・青ヶ島村の台風被災事業者、4/5・5,000万円、12/28まで）、土産品等を活用した多摩・島しょ観光プロモーション事業助成金（2/3・600万円、12/18まで）、多摩・島しょ地域観光課題解決支援補助金（市町村・観光協会等、2/3・2,000万円、12/25まで）
# 国・都の制度への上乗せ（addon）は9町村とも見つからない。雇用機会拡充事業は「国や地方公共団体等の他の補助事業により補助対象となっている経費」を対象外と明記
# 町村独自の事業者向け補助が見つからない: 利島村・神津島村・青ヶ島村・小笠原村（新島村は漁協向けの2件だけ。御蔵島村は令和7年度の起業・事業拡大支援事業のページのまま）

