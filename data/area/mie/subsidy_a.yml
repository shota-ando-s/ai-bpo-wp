# 三重県（県・公益財団法人三重県産業支援センター）と14市の AI・IT・DX・研修向け補助金・無料の支援（2026年度）。2026-11-11に公式ページ・チラシ・要領で確認
# 県域でAIを名指ししたのは、県の「みえDX・AIチャレンジプログラム」（補助金ではなく、県の委託事業による無料の伴走支援・研修。トライアルサポートは09-01申込締切、スキルアップアカデミーは09-16申込締切、リテラシーセミナーは2027-02-09まで各回1週間前までの申込で受付中）と、研究開発の「成長産業推進に向けた試作・開発支援事業補助金」（テーマ例に「情報・ＡＩ」、06-02で終了）
# 県域の補助金で DX を対象にしたのは「令和8年三重県エネルギー価格等高騰対応生産性向上・業態転換支援補助金」（1/2・賃上げコース200万円・一般コース100万円。第3期 08-18〜09-10 で終了、10-15 に53者採択）。2026-11-11 時点で第4期の告知は見つからない
# 三重県産業支援センターの「ICT等専門家派遣」（三重県版経営向上計画ステップ3、1企業5回まで無料、随時・予算まで）は受付中（rolling）
# 県の業務改善助成金への上乗せ・県独自の賃上げ補助は見つからない。国のデジタル化・AI導入補助金への県・市の上乗せ（addon）も見つからない
# 期間の status は data/subsidies/README.md の値（open / closed / rolling / unknown）。来年度の見込み（next_expected）は書かない

