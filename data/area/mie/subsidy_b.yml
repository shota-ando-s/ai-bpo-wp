# 三重県の15町（木曽岬町〔桑名郡〕、東員町〔員弁郡〕、菰野町・朝日町・川越町〔三重郡〕、多気町・明和町・大台町〔多気郡〕、玉城町・度会町・大紀町・南伊勢町〔度会郡〕、紀北町〔北牟婁郡〕、御浜町・紀宝町〔南牟婁郡〕）の AI・IT・デジタル化・DX・研修・業務改善に使える町独自の補助金（2026年度）。2026-11-11に15町の公式サイトの事業者向け・商工業の分類ページ、補助金の一覧・ガイドブックを開いて確認
# AI・生成AI・IT導入・DXを名指しした町独自の補助金は、15町とも見つからなかった（町ごとの確認したページは subsidy_b_areas.md）
# 入れたのは3件: 南伊勢町 買い物不便・困難者対策【事業再構築等促進支援】事業補助金（国の IT導入補助金・省力化投資補助金などの採択を受けた町内の食料品店に、国・県補助の自己負担額の2/3を上乗せ、300万円まで、2027-02-10 まで）、大台町 空き店舗等活用促進事業補助金・紀宝町 空き店舗再生事業費補助金（店舗の改修・家賃。AI・デジタルの名指しはなく、IT 機器・ソフトは対象経費に書かれていない。targets は △）
# 国・県の補助金への上乗せ（addon）: 南伊勢町の1件だけ（対象は食料品店に限る）。addon_to は national.yml にある digital-ai-donyu・shoryokuka-ippan・shinjigyo-monodukuri。上乗せ先ごとの上限の違いはない（1事業者300万円）ので1件にまとめた
# 受付状況は 2026-11-11 時点。ページ・要綱に受付期間がない制度は unknown。国のデジタル化・AI導入補助金2026 の7次締切 2026-12-01 17:00 は事務局のスケジュール https://it-shien.smrj.go.jp/schedule/ で確かめた（2026-11-11）
# 入れなかった町の制度（IT 導入向けではない）: 木曽岬町 産業関係制度資金利子補給金、東員町 商工業経営近代化資金利子補給制度、多気町 商工業者事業資金利子補給制度（R8 創設、上限20万円）、明和町 事業継続力強化対策支援金（R7、防災設備、受付終了）、大台町 6次産業化等促進支援事業費補助金（農林漁業者）・特産品流通支援事業補助金、玉城町 展示会参加に対する工業会支援補助金（上限10万円）、度会町 創業支援補助金・マル経融資の利子補給（ページ未確認）、南伊勢町 創業支援補助金（受付終了）・インターンシップ受入事業補助金・ふるさとものづくり支援事業補助金（受付終了）など。subsidy_b_areas.md
# 期間の status は data/subsidies/README.md の値（open / closed / rolling / unknown）を使う

