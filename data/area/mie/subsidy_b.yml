  confidence: official
  note: 町のページ（更新 2026-04-01）「国・県の補助金を活用し事業改善を進める町内の食料品店を対象に町独自の上乗せ補助・横出し補助を実施します」、申請期限 令和9年2月10日、令和8年度予算額300万円（予算に達したら早期終了）。チラシ R8kaimono_HP.pdf（2026-03 作成）に「【令和７年度募集分】」「実施期間 令和6年度～令和8年度」、上乗せ補助の式「【（国・県の補助対象経費）－国・県の補助額】×補助率（2/3）」。交付要綱（令和6年4月1日 告示第22号）第5条は「1,500万円を上限」と書くが、ページ・チラシの令和8年度の上限は1事業者300万円（ページ・チラシの値で書いた）。対象は食料品店だけで、一般の事業者は使えない。チラシの国の制度名は「IT導入補助金」で、2026年度の「デジタル化・AI導入補助金」が対象になるかは町の文言では「中小企業生産性革命推進事業（令和5年度補正予算以降）で実施する補助金」に入ると読めるが、町に確かめていない。rate_num・addon の 2/3 は小数で近似。addon_to は national.yml にある国の制度だけ（持続化補助金・事業再構築補助金などは national.yml にない）
  fuenn_note: 南伊勢町の食料品店（各種食料品小売業など）が国のIT導入補助金（デジタル化・AI導入補助金）や省力化投資補助金などの採択を受けたとき、国の補助を除いた自己負担額の2/3を町が上乗せする制度です（1事業者300万円まで、令和9年2月10日まで、予算がなくなり次第終了）。対象の業種がしぼられているので、町のまちづくり推進課へ先に確かめてください。

