  rate_num: 0.6667
  addon: {kind: remaining, ratio: 0.6667}
  stacking: {addon_to: [digital-ai-donyu, shoryokuka-ippan, shinjigyo-monodukuri]}
  targets: {efficiency: △, consulting: ×, training: ×}
  expenses: 国・県補助金（国の中小企業生産性革命推進事業〔ものづくり補助金・持続化補助金・IT導入補助金・事業承継・引継ぎ補助金・事業承継・M&A補助金〕、中小企業省力化投資補助事業、中小企業等事業再構築促進事業、中小企業新事業進出促進事業、冷凍冷蔵機器の脱フロン・脱炭素化推進事業、省エネ・非化石転換補助金、県のエネルギー価格等高騰対応生産性向上・業態転換支援補助金）の補助対象経費のうち自己負担額
  conditions: 町内に本店又は支店を有する食料品店（日本標準産業分類の小分類「その他の各種商品小売業（従業者が常時50人未満）」又は「各種食料品小売業」。業種・業態転換後に該当する見込みの者を含む）で、全店舗の従業者が常時50人未満、食料品・日用品・鮮魚・野菜等の日常生活に必要な生活物資を販売、3年以上継続して事業を行う、町税等の滞納がない。別表の国・県補助金の採択を受けていること（国の制度は令和5年度補正予算以降のものなど）。交付申請に国・県補助金の交付申請書・交付決定通知の写しが要る
  period: {status: open, end: 2027-02-10}
