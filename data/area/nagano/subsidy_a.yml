# 長野県（県・公益財団法人長野県産業振興機構〔NICE〕・長野県プロフェッショナル人材戦略拠点）と19市（2026年度）。2026-10-30に公式ページ・要綱・要領・マニュアルで確認
# 県域で今も申請できるのは、県の「賃上げ環境整備支援事業」の補助金（事業場内最低賃金を50円以上上げることが条件。基本型〔3/4〜10/10、補助対象経費の上限53.3万〜960万円〕・経過措置分・人材育成追加型〔10/10、22万〜30万円。申請マニュアルの研修例に「生成AI活用」〕は申請期限2027-01-20、業務改善助成金上乗せ補助は県への申請期限2027-02-26）と、副業・兼業人材活用促進事業補助金（プロ拠点経由のプロ人材、8/10・50万円〔2回目以降は2/3・42万円〕、2026-12-28まで）
# 県域でAIを名指しした補助は、宿泊事業者のDX支援事業補助金（AI・RPA・BI・ERP・CRM等、2/3・1施設300万円、4/20〜8/31で終了）と信州型サンドボックス事業「Shinshu AI GEARS」（申請者はAI開発者、10/10・800万円、5組採択で終了）。業務共同化モデル実証補助金（連携体、1/2・500万円、7/17締切）も終了。長野県産業振興機構（NICE）には中小企業のIT・AI導入の補助金はない（専門家派遣は有料で事業者負担1/2〜1/4）
# 市でAIを名指しした補助は、諏訪市 AI・IoT導入支援事業補助金（製造業・ソフトウェア業、1/2・50万円、2027-03-10まで）と塩尻市 中小企業デジタル化促進事業補助金（IoT/AI/RPA、1/2・30万円、2026年度は予算到達で終了）。デジタル化・DXの補助は、岡谷市（製造業、デジタル技術活用等1/2・30万円、クラウド利用料・IT研修も対象）・駒ヶ根市（生産性向上コース〔DX〕1/2・100万円）・安曇野市（2/10・50万円、クラウドは年度分）・千曲市（1/4・50万円、クラウド型ITツール）・飯山市（1/2・10万円、クラウド使用料も対象）・諏訪市（ウェルビーイング経営推進のデジタル化導入、1/2・20万円）・茅野市（小規模の生産性向上設備、2/3・10万円）・上田市（省力化・効率化、ICT業務システム、予算到達で終了）・長野市（DXモデル、5/29で終了）
# 市の研修補助: 長野市・松本市・上田市・諏訪市（e-ラーニング1/2・20万円）・須坂市・伊那市・駒ヶ根市・中野市・茅野市（DX研修は2/3）・千曲市・安曇野市。外部人材（副業・兼業）の補助: 長野市・松本市・飯田市
# 市独自のAI・IT導入・研修向けの補助が見つからない市: 小諸市、大町市、佐久市、東御市（近代化モデル事業所育成事業補助金〔コンサル委託4/10・30万円〕だけ）。確認したページは subsidy_a_areas.md
# 国の補助金への上乗せ（addon）: 県の中小企業賃上げ・生産性向上サポート補助金は国の業務改善助成金への上乗せだが、業務改善助成金は national.yml にないので addon・addon_to は書いていない（note 参照）。市の上乗せは見つからない
# 期間の status は data/subsidies/README.md の値（open / closed / rolling / unknown）を使う。随時受付は rolling。今年度の受付期間・予算がページで確かめられないものは unknown

