# 長野県 35村（川上村・南牧村・南相木村・北相木村・青木村・原村・南箕輪村・中川村・宮田村・阿智村・平谷村・根羽村・下條村・売木村・天龍村・泰阜村・喬木村・豊丘村・大鹿村・木祖村・王滝村・大桑村・麻績村・生坂村・山形村・朝日村・筑北村・松川村・白馬村・小谷村・高山村・木島平村・野沢温泉村・小川村・栄村）2026年度
# 確認日 2026-10-30。根拠は subsidy_c_areas.md
# 生成AI・AI導入を名指しで補助する村独自の制度は、35村とも確認できなかった。名指しに最も近いのは原村の「中小企業活性化緊急支援補助金」の「DX推進活動」（クラウド会計・CRM・ECサイト構築などのソフトウェア・サービスの導入）
# IT・デジタル化・研修に使える村独自（商工会経由を含む）の制度で、今申請できるもの（2026-10-30時点）
#   - 原村 中小企業活性化緊急支援補助金: 定額 中小企業40万円（経費税抜20万円以上）・小規模20万円（同10万円以上）。DX推進活動・生産性向上・事業継続強化。電子申請 2026-12-31まで
#   - 原村 商工業活性化補助金: 償却資産の更新・導入 3/100（上限10万円）、新製品の研究開発 上限20万円など。受付は12-31まで
#   - 南箕輪村 企業人材育成補助事業補助金: 研修会・講習会・視察の受講費等の全額、1企業 年5万円まで（従業員100人未満）
#   - 北相木村 商工業地域活性化支援事業補助金: 商工業育成（施設整備・備品購入 1/3・上限50万円）、販路拡大（ホームページ作成など 1/3・上限10万円）
#   - 泰阜村 商工業振興事業（設備改修支援）: 1基20万円以上の機械等 1/2・上限100万円
#   - 豊丘村 デジタル地域通貨「トヨペイ」加盟店決済端末等補助金: 端末 10/10・1台3万円、会計機器等の設定変更 2/3・上限20万円。2026-12-31まで
#   - 豊丘村商工会 令和8年度助成事業: 人材育成支援（研修受講料 最大2/3・上限20万円、2027-03-31まで）、営業活動等促進支援（ホームページ・PR動画の新規制作 1/2・上限10万円、2027-01-31まで）
#   - 宮田村商工会 令和8年度 商工会独自助成金（会員限定）: 商工業活性化事業助成金 通常枠 2/3・上限10万円、応援枠（補助金の採択者は自己負担額の上限10万円、不採択者は2/3・上限20万円）
#   - 木島平村 特産品開発推進奨励補助金: 1/2・上限100万円（デザイン・販路開拓の調査・研修参加費・機械装置など。特産品開発に限る）
# 今年度は終了: 山形村 小規模事業者チャレンジ補助金（DX/脱炭素の経費を含む 1/2・上限10万円、新規受付終了）、木祖村 源気くん型地域産業活性化事業補助金（3/4・30万〜100万円、2026-05-13締切）、天龍村 事業者持続化補助金（30%・上限50万円、2026-08-31締切）、野沢温泉村 宿泊税に係るシステム改修事業補助金（10/10、2026-06-30締切）
# 受付状況が分からない: 白馬村 宿泊税対応システム改修事業補助金（「令和8年度も実施」とあるが、令和8年度の申請期間の終わりが読み取れない）
# 国の補助金への上乗せ（addon）: 該当なしとした。近いものは宮田村商工会の「商工業活性化事業助成金 応援枠」（補助金の採択者の自己負担額に上限10万円を助成）だが、どの補助金が対象かが申請書に書かれておらず、addon の計算方法も決められない（md の宮田村の節）
# 創業向けの制度（白馬村・野沢温泉村・木島平村・大鹿村・喬木村・松川村・栄村・小川村・木祖村・泰阜村・北相木村など）、展示会出展の補助（青木村・原村）、資格取得（栄村。対象資格に IT 系なし）、地域資源型の小さな創業（麻績村）は YAML に入れず md に記した
# 県の制度・県域の機関・国の制度・19市は subsidy_a、23町は subsidy_b 担当
# 期間の status は data/subsidies/README.md の値（open / closed / rolling / unknown）

