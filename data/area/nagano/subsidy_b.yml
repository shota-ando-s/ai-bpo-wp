#   - 箕輪町 DX推進事業補助金: 設備（ソフトウェアを含む）・システム開発・コンサルティング・クラウド利用料の 1/2・上限50万円。随時受付（当該年度の3月31日までに完了）。同じ内容で国・県の補助を受ける者は対象外、1事業者1回
#   - 飯島町 生産性向上支援事業交付金: 区分A（ITツール導入等のソフト事業）2/3・上限20万円、対象経費15万円以上。受付 2026-04-01〜2027-01-29（予算上限で終了）。汎用PC・タブレットは原則対象外、1事業者1回
#   - 高森町 中小企業等人材育成事業補助金: 研修・講習会の受講料 1/2・1人2万5千円、年10万円まで。事業対象期間 2026-04-01〜2027-03-31
#   - 箕輪町 中小企業競争力向上支援補助金（人材育成研修事業）: 国・県等が行う研修の受講料 1/2・年9万円（1人3万円）。小規模企業者が対象。随時
#   - 飯綱町 商工業振興対策事業（従業員研修）: 中小機構・県の技術研修の受講料の30/100・1企業5万円まで
#   - 佐久穂町 商工業振興助成金: 企業内勉強会（講師謝礼など）1/2・上限3万円、外注のホームページ作成・改修 1/2・上限10万円ほか。期限 2029-03-31
#   - 阿南町 商工業機械備品リフレッシュ補助金: 1件10万円以上の機械備品 6/10・上限30万円（従業員20人以下）
#   - 立科町 商工業振興対策事業補助金（小企業合理化施設事業）: 合理化の機械・設備 1/10・上限10万円
#   - 小布施町 販路拡大支援事業補助金: ホームページ・自社ECサイト・紹介動画の外注 1/2・上限5万円/年（商工会加入の中小企業者）
#   - 山ノ内町 キャッシュレス決済等導入補助金: 端末・設置・回線開設 1/2・上限3万円
#   - 南木曽町 事業継承応援補助金: 事業承継時のホームページ・コンサルティング料など 1/2・上限20万円
# 国の補助金への上乗せ（addon）: 計算できる形では該当なし。佐久穂町の「佐久穂町の商工業関連支援制度（2026版）」に「小規模事業者持続化補助金（町で上乗せ）窓口：商工会」とあるが、上乗せの率・上限・要綱は町と商工会のサイトで見つからず、YAML に入れていない（subsidy_b_areas.md の佐久穂町）
