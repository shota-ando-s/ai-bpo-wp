# 県のデジタル化補助金は「宮城県中小企業等デジタル化支援事業補助金」（中小企業支援室。事務局はみやぎ産業振興機構）。通常枠・発展・展開枠・AI枠の3つで、AI枠は過去に県のデジタル化補助金の交付を受けた事業者だけが対象。今年度はエントリー2026-07-10、申請07-10／07-31で、すべて終了
# みやぎ産業振興機構の補助金（ステージアップ支援、チャレンジ応援基金、スタートアップ加速化、営業活動強化など）にAI・IT導入向けはない。デジタル化支援事業の事務局と、無料のデジタル化相談の窓口（2027-02まで受付）を担う（subsidy_a_areas.md）
