# 白石市・名取市・角田市・多賀城市・岩沼市・東松島市・富谷市は市独自のAI・IT・研修向け補助金なし（subsidy_a_areas.md に確認したページ）
# 国の補助金への上乗せ: 仙台市の仙台生産性ブースト補助金（デジタル化・AI導入補助金・IT導入補助金・省力化投資補助金の自己負担分に最大50万円、受付中）。支給額は段階式（自己負担25万円までは全額、超える分は1/2、上限50万円）で、README の addon の kind（remaining / cost_ratio）では表せないため addon は書いていない
# 県の補助金への上乗せ: 気仙沼市の中小企業等再起支援事業補助金（県の再起支援補助金の自己負担分を全額、上限50万円、追加募集は2026-11-30まで）。県の制度は終了しているので、新たに県の交付決定を受けることはできない
