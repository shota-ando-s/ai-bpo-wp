# 宮城県内20町1村（蔵王・七ヶ宿・大河原・村田・柴田・川崎・丸森・亘理・山元・松島・七ヶ浜・利府・大和・大郷・大衡・色麻・加美・涌谷・美里・女川・南三陸）2026年度
# 確認日 2026-10-23。根拠は subsidy_b_areas.md
# 生成AI・AI研修・DX・IT導入を名指しで補助する町村独自の制度は、21町村とも確認できなかった
# 国の「デジタル化・AI導入補助金」（旧IT導入補助金）・「中小企業省力化投資補助金」に町村が上乗せする制度も、確認できた19町村にはない（addon の制度なし）。亘理町・涌谷町は公式サイトが開けず未確認
# 国の制度への町の上乗せは、加美町の創業者支援事業助成金（厚生労働省の地域雇用開発奨励金の対象外経費に、国の助成額の1/2を上限に助成）だけ。デジタル化向けではないので YAML に入れず subsidy_b_areas.md に記載
# IT・設備・販路・研修に使える可能性がある町村独自の制度
#   - 利府町 地域産業活性化事業補助金（ふるさと納税の返礼品の開発・改良。開発4/5・改良3/5・上限100万円、2026-12-18まで受付中。設備等導入事業 4/5・上限1,000万円は2026-07-21で受付終了）
#   - 七ヶ宿町 産業活性化助成事業（機器リース料・備品購入費・研修費・広告費。2/3・1事業200万円。要綱は2028-03-31まで有効。町のサイトに募集ページがない）
#   - 丸森町 産業創造事業補助金（ホームページの作成・ネット販売システム構築2/3・上限20万円、新事業開発2/3・上限150万円。コロナ禍で売上20%以上減少が要件。町のサイトに募集ページがない）
#   - 丸森町 無人航空機操縦資格取得補助金（ドローンの講習の受講料1/2・1人5万円。町のパートナー企業の技能認定に限る）
#   - 川崎町 商品化促進・販路拡大事業補助金（町特産品の開発・改良・販売促進。90%・上限30万円。ページ2024-06）
#   - 加美町 起業者育成支援事業助成金（備品購入費・委託料・報償費など。4/5・上限30万円、3か年度まで。ページ2021-04）
# 創業向けの制度: 川崎町・丸森町・松島町（2026年度は受付終了）・加美町・女川町。空き店舗の出店向け: 加美町（2026-09-01〜2027-02-26受付中）・蔵王町（2025年度で受付終了、2026年度は未確認）
# 町村のサイトに日付・年度の記載がない、またはページが前年度以前のままで2026年度の受付をページから判断できない制度は period.status を unknown にした（要綱・募集ページは公式なので confidence は official）
# 宮城県の制度（中小企業等デジタル化支援事業、ものづくり企業AI・IoT先進技術導入補助金など）と国の制度は別担当のため入れていない

