# 県で AI・デジタルを名指しした中小企業向けの補助金は3本: (1) 大分県省力化・生産性向上支援補助金（国の省力化投資補助金〔カタログ注文型・一般型〕と、国のデジタル化・AI導入補助金〔インボイス枠インボイス対応類型〕への県の上乗せ。県への申請は2027-01-29まで）、(2) 大分県中小企業等デジタルツール導入補助金（県の DX総合支援事業〔ONE OITA〕の DX コンサルタントの支援を受けた企業だけが申請できる。2/3・25万円、賃上げ枠3/4・30万円）、(3) 先端技術挑戦プロジェクト産学連携創出支援事業費補助金（テーマに「ロボティクス・ＡＩ（人工知能）」。可能性調査枠 1/2・100万円は2026-11-13まで受付中、研究開発枠は4/10で終了）
# 宿泊業向けに、宿泊事業者ＤＸ推進事業費補助金（県 観光政策課、2/3・300万円〔賃上げ枠3/4・340万円〕、2026-12-28まで）と、大分県宿泊業経営力強化加速化事業費補助金（ツーリズムおおいた。観光庁の省力化投資補助事業への上乗せ 1/6・340万円〔賃上げ枠1/4・500万円〕、2026-12-25まで）が受付中
