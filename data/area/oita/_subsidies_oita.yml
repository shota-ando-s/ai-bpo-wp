# 市で AI・DX を名指ししているのは、大分市 中小企業者経営力強化促進補助金（人材育成応援事業。「DX研修」は補助率2/3〔通常1/2〕、1人10万円・1者30万円。経済産業省・IPA のデジタルスキル標準の項目の研修。通年・予算が残りわずか）、大分市 小規模事業者競争力強化支援事業補助金（DX推進枠 2/3・40万円、後期は10/23で終了）、豊後大野市 中小企業者生産性向上設備等導入補助金（導入例に「AI検査・計測装置」。2/3・200万円、6/30で終了）、由布市 中小企業等経営力強化支援事業（DXを用いた取組は2/3・30万円、予算到達で終了）
# 市独自の AI・IT導入・研修向けの補助が見つからない市: 別府市（無料のDX相談窓口だけ）・中津市・佐伯市・竹田市・杵築市・宇佐市・国東市（無料の「くにさきNEXT経営塾」だけ）。臼杵市は県の宿泊事業者DX補助金を案内しているだけ（市の制度ではない）。詳細は subsidy_a_areas.md
# 国の補助金への上乗せ（addon）: 県の省力化・生産性向上支援補助金（省力化投資）は national.yml の shoryokuka-ippan への上乗せとして addon を書いた（県の補助額は国の確定額の1/3〔通常〕・1/2〔大幅な賃上げ〕。経費に対しては国の補助率1/2のとき1/6・1/4。addon は通常の1/6で書く）。デジタル化の上乗せ（インボイス対応類型）は national.yml の digital-ai-donyu（通常枠）が対象外なので addon を書いていない。日田市の賃上げ環境整備支援助成金は国の業務改善助成金・持続化補助金などの自己負担の1/2で、上乗せ先が national.yml にないため addon を書いていない
