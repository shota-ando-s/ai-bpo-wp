# 案（2026-11-04）。data/subsidies/areas.yml の末尾に足す大分県の部分。親が最後に areas.yml に入れる（data/subsidies/oita.yml〔案は data/area/oita/_subsidies_oita.yml〕と同じコミット。areas.yml は直接編集していない）
# none: true は _subsidies_oita.yml にその市町村の制度が1件もない11市町村（別府市・中津市・佐伯市・竹田市・杵築市・宇佐市・国東市と日出町・九重町・玖珠町・姫島村）。臼杵市・豊後高田市・豊後大野市は今年度の受付を終えた制度しかないが、yml に制度があるので none にせず、note の一文目で状況を書いた
# 並びは県の6振興局（stats.md の region_shinko。東部以外の所属は confidence: secondary）の順: 東部（5）→ 中部（4）→ 南部（1）→ 豊肥（2）→ 西部（3）→ 北部（3）。振興局の中は市（自治体コード順）→ 町村（自治体コード順）
# 14市は市の商工担当課の記事一覧・事業者向けページ、3町1村は町村のサイトの事業者向けページ・補助制度の一覧を開いて確かめた（subsidy_a_areas.md・subsidy_b_areas.md）
# none の callout は「AI・IT導入向けの独自の補助金が見つかりませんでした」と出るので、none の note は確かめ方・相談先（商工会議所・商工会は gov_ai.md の対応表）・使える県の制度・取り違えの注意を書く
# 大分市（oita-city）は大分県と別、九重町（ここのえ）は竹田市の久住と別、由布市には湯布院（旧町）を含む、の注意を note に入れた
- code: oita
  name: 大分県
  cities:
    - {code: oita/beppu, name: 別府市, none: true, note: 市の中小企業向け施策一覧（令和8年度）で確かめた範囲で、市独自のAI・IT導入や研修の補助金は見つかりませんでした（2026-11-04確認）。別府市まちなか交流館で、PC・スマホ・SNS・キャッシュレスの相談ができる事業者向けDX相談窓口（無料）が毎週日曜に開いています。別府商工会議所か市の産業政策課に確認してください}
    - {code: oita/kitsuki, name: 杵築市, none: true, note: 市の産業振興・補助金一覧のページで確かめた範囲で、市独自のAI・IT導入や研修の補助金は見つかりませんでした（2026-11-04確認）。杵築市商工会か市の商工観光の担当課に確認してください}
    - {code: oita/kunisaki, name: 国東市, none: true, note: 市の観光・地域産業創造課のページで確かめた範囲で、市独自のAI・IT導入や研修の補助金は見つかりませんでした（2026-11-04確認）。AI・デジタル活用をテーマの1つにした無料の「くにさきNEXT経営塾」（2026年9月〜2027年1月）を市が開いています。国東市商工会か市の観光・地域産業創造課に確認してください}
    - {code: oita/hiji, name: 日出町, none: true, note: 町のしごと・産業と事業者向け補助制度のページで確かめた範囲で、町独自のAI・IT導入や研修の補助金は見つかりませんでした（2026-11-04確認）。日出町商工会か町役場に確認してください}
    - {code: oita/himeshima, name: 姫島村, none: true, note: 村のくらしの情報のページで確かめた範囲で、村独自のAI・IT導入や研修の補助金は見つかりませんでした（2026-11-04確認。事業者向けは創業支援事業補助金など）。姫島村商工会か村役場に確認してください}
    - {code: oita/oita-city, name: 大分市, note: 中小企業者経営力強化促進補助金（人材育成応援事業）は、従業員の研修費用を1/2、デジタルスキル標準にもとづくDX研修なら2/3（1人10万円・1社30万円まで）補助し、通年受け付けています（2026-11-04確認。10月28日に「予算が残りわずか」と告知）。小規模事業者のソフトウェア導入などに2/3（上限40万円）を補助した小規模事業者競争力強化支援事業補助金（DX推進枠）は、2026年度の申請を10月23日に終えました。大分市は大分県と別の自治体です}
    - {code: oita/usuki, name: 臼杵市, note: 機械装置やシステムの導入に1/2（上限150万円）を補助した産業・雇用促進事業補助金は、2026年度の募集を6月10日に終えました（2026-11-04確認）。市のサイトが案内している宿泊事業者向けのシステム改修・DX補助金は県の制度です（2026-12-28まで）。臼杵商工会議所・野津町商工会か市の産業観光課に確認してください}
    - {code: oita/tsukumi, name: 津久見市, note: 小規模事業者等物価高騰対策環境整備支援事業補助金は、IT導入・システム経費・キャッシュレス決済などの費用を4/5（上限20万円）補助し、2027-01-29まで申請できます（2026-11-04確認。従業員20名以下〔商業・サービス業は5名以下〕の小規模事業者が対象、1事業者1回）。事業計画書は津久見商工会議所の相談支援を受けて作ります}
    - {code: oita/yufu, name: 由布市, note: 魅力ある職場づくり支援事業補助金は、従業員の研修受講・資格取得などの費用を1/2（上限10万円、行動計画の届出などの特別枠は4/5・上限30万円）補助し、予算に達するまで先着順で受け付けています（2026-11-04確認。売上高の減少などの要件あり）。DXを用いた業務効率化に2/3（上限30万円）を補助した中小企業等経営力強化支援事業は、2026年度の予算に達して受付を終えました。湯布院・挾間・庄内は由布市です。由布市商工会か市の商工観光課に確認してください}
    - {code: oita/saiki, name: 佐伯市, none: true, note: 市の商工業・企業支援・創業支援のページと令和8年度の補助交付金一覧で確かめた範囲で、市独自のAI・IT導入や研修の補助金は見つかりませんでした（2026-11-04確認）。佐伯商工会議所・佐伯市番匠商工会・佐伯市あまべ商工会か市の商工振興課に確認してください}
    - {code: oita/taketa, name: 竹田市, none: true, note: 市の中小企業向け支援のページで確かめた範囲で、市独自のAI・IT導入や研修の補助金は見つかりませんでした（2026-11-04確認。令和8年度は事業承継支援事業補助金を創設）。竹田商工会議所・九州アルプス商工会か市の商工振興課に確認してください}
    - {code: oita/bungoono, name: 豊後大野市, note: AI検査・計測装置や生産管理システム・クラウドサービスなどの導入に2/3（上限200万円、下限50万円）を補助した中小企業者生産性向上設備等導入補助金は、2026年度の申請を6月30日に終えました（2026-11-04確認）。豊後大野市商工会か市の商工観光課 経済振興係に確認してください}
    - {code: oita/hita, name: 日田市, note: 中小企業等賃上げ環境整備支援助成金は、国の業務改善助成金や小規模事業者持続化補助金などの交付決定を受けた事業者に、自己負担額の1/2（上限50万円）を上乗せします（2026-11-04確認。国の交付決定は2027-01-31まで）。AI・IT導入に絞った市の補助金ではありません。日田商工会議所・日田地区商工会か市の商工労政課に確認してください}
    - {code: oita/kokonoe, name: 九重町, none: true, note: 町の商工業のページと「まちの事業紹介【令和８年度版】」で確かめた範囲で、町独自のAI・IT導入や研修の補助金は見つかりませんでした（2026-11-04確認）。宿泊施設は県の宿泊事業者ＤＸ推進事業費補助金（2026-12-28まで）を使えます。九重町（ここのえまち）は竹田市の久住とは別です。九重町商工会か町の観光・地域振興課に確認してください}
