    - {code: oita/nakatsu, name: 中津市, none: true, note: 市の企業支援・商業・工業のページで確かめた範囲で、市独自のAI・IT導入や研修の補助金は見つかりませんでした（2026-11-04確認。技能検定の受検手数料の2/3を助成する制度はあります）。市のサイトの「省力化投資補助金」のページは国の制度の案内です。中津商工会議所・中津市しもげ商工会に確認してください}
