# 案（D34、2026-11-04）。data/subsidies/areas.yml の末尾に足す熊本県の部分。親が最後に areas.yml に入れる（data/subsidies/kumamoto.yml〔案は data/area/kumamoto/_subsidies_kumamoto.yml〕と同じコミット。areas.yml は直接編集していない）
# none: true は _subsidies_kumamoto.yml にその市町村の制度が1件もない35市町村。うち28は公式サイトの事業者向け・商工業のページで確かめて見つからなかった市町村、7（玉名市・上天草市・嘉島町・甲佐町・小国町・相良村・芦北町）は公式サイトが開けず（Incapsula の 403・文字化け、芦北町は商工業の記事一覧が取れず）確かめられなかった市町村で、note の一文目で「確かめられませんでした」と書いた（断定しない。広島県江田島市と同じ）
# 水俣市は今年度の受付を終えた制度（がんばる事業所補助金）しかないが、yml に制度があるので none にせず、note の一文目で状況を書いた（岡山県玉野市と同じ）
# 並びは県の4広域本部（stats.md の region_honbu の表の順）: 県北（18）→ 県央（9）→ 県南（15）→ 天草（3）。広域本部の中は市（自治体コード順）→ 町村（自治体コード順）
# none の callout は「AI・IT導入向けの独自の補助金が見つかりませんでした」と出るので、none の note は確かめ方・相談先（商工会議所・商工会は gov_ai.md の対応表）・取り違えの注意を書く。災害の復旧の制度は note に書かない（石川県と同じ。診断は AI・IT 導入の画面）
# 取り違えの注意: 熊本市（kumamoto-city）は熊本県と別、美里町（misato-town-kumamoto、下益城郡）は他県の美里町・美郷町と別、嘉島町（kashima-town、上益城郡）は佐賀県鹿島市と別、大津町（ozu、菊池郡）は愛媛県大洲市と別、高森町（takamori、阿蘇郡）は長野県高森町と別、小国町（oguni、阿蘇郡）は山形県小国町と別、錦町は球磨郡、を note に入れた
# 市の制度（熊本市・天草市など）は市内の事業者が対象で、町村の事業者は使えない（subsidy_b_areas.md）。県の制度（後押し補助金・リスキリング応援補助金・副業・兼業人材）は kumamoto の行で全地域に出るので、市町村の note には書いていない
