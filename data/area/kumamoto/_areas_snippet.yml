    - {code: kumamoto/amakusa, name: 天草市, note: 中小企業等物価高騰緊急対策事業補助金は、市内の商工団体の支援を受けてITツールの導入や設備のIoT化など省力化に取り組む費用を、1回目は2/3（通常枠の上限50万円）補助し、2027-03-01まで（予算に達し次第終了）受け付けています（2026-11-04確認。原則として市内の事業者から調達）。申請は本渡商工会議所・牛深商工会議所・天草市商工会を通します。従業員の資格取得や講座受講の費用を1/2（1人1件15万円まで）補助する資格取得支援事業補助金もあります}
    - {code: kumamoto/reihoku, name: 苓北町, none: true, note: 町の事業者・起業者支援と商工業のページで確かめた範囲で、町独自のAI・IT導入や研修の補助金は見つかりませんでした（2026-11-04確認。創業・事業承継向けの補助はあります）。苓北町商工会か町の商工観光課に確認してください}
