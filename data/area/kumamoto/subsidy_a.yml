# 熊本県（県・公益財団法人くまもと産業支援財団・熊本県商工会連合会〔県の委託〕ほか）と14市（2026年度）。2026-11-04に県の公式ページ（商工労働部 商工振興金融課・産業支援課・商工政策課・労働雇用創生課、土木部 監理課の記事一覧）、県の「令和8年度熊本県デジタル化施策実施計画」（令和8年3月）https://www.pref.kumamoto.jp/uploaded/attachment/307293.pdf 、市の公式ページ（商工担当課の記事一覧・補助金一覧）で確認
# 県で今申請できる、AI導入・研修に使える補助金は2つ。熊本県中小・小規模事業者生産性・売上げ向上後押し事業補助金【第2弾】（国・県の補助事業の自己負担を1/10まで軽減する上乗せ。デジタル化・AI導入補助金〔旧IT導入補助金〕の通常枠は2/5、最大200万円。2026-02-02〜2027-01-29、予算到達で終了）と、熊本県リスキリング応援補助金（10時間未満の外部研修の受講費の3/4、1事業者50万円。訓練は2027-02-15まで、10/23時点の予算残は75%）
# 県の副業・兼業人材活用促進事業費補助金（4/5・50万円）は2次募集8/14で締切、予算に残があれば随時受付の予定（rolling と書いた）。県の建設産業働き方改革推進事業費補助金（DXの推進などの1/2・10万円、建設業者）は追加募集が2026-12-28まで（予算到達で締切）
# くまもと産業支援財団の「中小企業DX推進臨時補助金」（2/3・500万円、5/13〜6/12）と「生産性向上投資支援事業費補助金（DX・CN化支援分）」（1/2・500万円、製造業等、7/6〜7/31）は、財団のサイト www.kmt-ia.or.jp がこのセッションから名前解決できず（プロキシで接続拒否）、補助率・期間は補助金ポータル等の二次情報（verified false / confidence secondary）。県の実施計画で「中小企業DX推進臨時補助事業」（産業支援課、令和8年度予算170,000千円、DXに向けた生産現場のデジタル化に必要な機器の整備）があることだけは一次情報で確認した
# 市でAIを名指ししているのは水俣市「がんばる事業所補助金」（対象経費に「ＡＩ導入に係るライセンス費用」。市内調達2/3・100万円）だけで、2026-07-21に予算上限で受付終了。熊本市 DX環境整備事業補助金（1/2・40万円）も7/31に予算到達で締切
# 市で今申請できるIT・省力化・研修向けは、天草市 中小企業等物価高騰緊急対策事業補助金（ITツールの導入・設備のIoT化など、1回目2/3・50万円、2027-03-01まで、商工団体経由）、菊池市 副業人材活用マッチング事業費補助金（2/3・20万円、2027-02-26まで）、研修の補助（熊本市・八代市・山鹿市・合志市・天草市）
# 国の補助金への上乗せ（addon）: 県の後押し補助金だけ（national.yml の digital-ai-donyu・shoryokuka-ippan・shinjigyo-monodukuri の自己負担を軽減。通常の補助率1/2の枠は2/5を上乗せ＝経費×0.4、cost_ratio 0.4 で近似）。14市の上乗せは見つからない
# 令和8年熊本地震（2026-07-28〜）・令和7年8月豪雨・令和2年7月豪雨の事業者向けの復旧の制度（くまもと事業者再出発支援補助金、被災中小企業者再建支援補助金、なりわい再建支援補助金、持続化補助金〈災害支援枠〉など）は AI 導入向けではないため yml に入れず、subsidy_a_areas.md の「災害の復旧の制度（AI導入向けとは別）」の節に書いた（石川県の能登半島地震と同じ扱い）
# 玉名市・上天草市は公式サイトが curl・WebFetch とも 403（Incapsula の画面）か文字化けで、制度を確かめられなかった（subsidy_a_areas.md）。「制度なし」と断定していない
