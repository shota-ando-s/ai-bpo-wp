  targets: {efficiency: △, consulting: ×, training: ×}
  expenses: 機械・設備の新規導入及び更新費用、販路を開拓するために必要となる物品等の購入費用（修繕等は対象外）
  conditions: あさぎり町の商工業振興を目的に事業を継続・拡大させる取組を行う、町内の個人事業主又は町内に所在する会社等の営利法人。町税等の滞納がないこと。導入前に申請（申請前に導入したものは対象外）
  period: {status: rolling}
  url: https://www.town.asagiri.lg.jp/kiji0033867/index.html
