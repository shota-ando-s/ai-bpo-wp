# 熊本県の23町8村の AI・IT・DX・研修・省力化向けの補助金（2026年度）。2026-11-04に各町村の公式サイトの事業者向け・商工業の分類ページと記事一覧を開いて確認（curl、curl が 403・JS のサイトは WebFetch）。根拠は subsidy_b_areas.md
# 生成AI・AI導入・AI研修を名指しで補助する町村独自の制度は、確かめた町村では見つからなかった
# IT・省力化に使える町村独自の制度: 大津町 中小企業省力化機器等導入支援補助金（小売・宿泊・飲食・生活関連サービス業。セルフレジ・配膳ロボット・セルフオーダーシステム・「人が行う業務を代替できる機器・ソフトウェア等」、購入1/2・30万円、リース・利用1/2・10万円、毎年2月末まで）、津奈木町 小規模事業者総合支援補助金（業務効率化に伴う設備等の導入1/2・50万円、専門家活用2/3・20万円）、あさぎり町 商工業振興補助金（機械・設備の新規導入・更新1/2・50万円。IT・ソフトウェアの名指しはない）
# 研修: あさぎり町 中小企業大学校人吉校研修費助成（受講料の1/2）。大津町 中小企業人材育成事業補助金は中小企業大学校が町内で開く特定の研修（2026年9月8〜9日）の受講料の半額で、今年度の対象研修は終わっている（yml に入れていない）
# 国・県の補助金への上乗せ（addon）: 該当なし（31町村とも見つからない）。県の後押し補助金（国の補助事業の自己負担の軽減）は subsidy_a.yml
# 嘉島町・甲佐町・小国町・相良村は公式サイトが curl・WebFetch とも 403（Incapsula の画面）か文字化けで、制度を確かめられなかった。芦北町は商工業のページ（/sangyo_shigoto/sangyo/shokogyo）の記事一覧を取れなかった。この5町村は「制度なし」と断定していない
# 令和8年熊本地震・令和7年8月豪雨の復旧の制度は yml に入れず、subsidy_a_areas.md の災害の節に書いた
# 期間の status は data/subsidies/README.md の値（open / closed / rolling / unknown）

- id: kumamoto-ozu-shoryokuka
  name: 大津町中小企業省力化機器等導入支援補助金
  org: 大津町（産業振興部 商業観光課 商業観光係）
  area: kumamoto/ozu
  max_yen: 300000
  rate: 機器等の購入は補助対象経費の1/2・上限30万円、リース・利用は1/2・上限10万円（購入とリース・利用をあわせて申請する場合は30万円まで、うちリース・利用は10万円まで）。同じ年度内に1事業者1回限り
  rate_num: 0.5
  targets: {efficiency: ○, consulting: ×, training: ×}
  expenses: 人手不足の解消につながる機器等。自動精算機（セルフレジ）、券売機、自動チェックイン機、食器洗浄機、配膳ロボット、調理ロボット、セルフオーダーシステム、その他人が行う業務を代替できる機器・ソフトウェア等（その他の場合は省力化確認票を提出）。キャッシュレス決済のシステム・決済機器、会計ソフトウェア、他の公的支援を受けた経費、既存機器の入替え・更新、中古品、町外の店舗への導入は対象外
  conditions: 大津町内に主たる事業所がある中小企業で、小売業・宿泊業・飲食サービス業・生活関連サービス業を営む事業者（管理・補助的経済活動の事業所を除く）。交付決定後に着手（令和8年度に限り4〜6月の着手も要件を満たせば対象）。事業は交付決定日から当該年度の3月31日まで
  period: {status: rolling, end: 2027-02-28}
  url: https://www.town.ozu.kumamoto.jp/page/24589.html
  checked: 2026-11-04
  confidence: official
  note: 町のページ（2026-07-14更新）で申請期限「毎年2月末日まで」、申請は役場2階 商業観光課。予算到達の記載はない。要綱 https://www.town.ozu.kumamoto.jp/uploaded/attachment/19374.pdf は開いていない。AIの名指しはないが、「人が行う業務を代替できる機器・ソフトウェア等」が対象（月額の利用料は「リース・利用」の区分になると読める。要綱で確かめていない）。問い合わせは 096-293-3115
  fuenn_note: 大津町内の小売・宿泊・飲食・生活関連サービス業の中小企業が、セルフレジや配膳ロボット、人の業務を代わりに行うソフトウェアなどを入れる費用を1/2（購入は最大30万円、リース・利用は最大10万円）補助する町の制度です。毎年2月末まで受け付けています。

- id: kumamoto-tsunagi-shokibo-sogo
  name: 津奈木町小規模事業者総合支援補助金
  org: 津奈木町（商工観光班）
  area: kumamoto/tsunagi
  max_yen: 500000
  rate: 店舗等整備・生産設備等導入事業は1/2以内・上限50万円、専門家活用事業は2/3以内・上限20万円、新商品開発事業・販路開拓・拡大事業は2/3以内・上限40万円、広告宣伝事業（ウェブサイトの構築など）は2/3以内・上限20万円
  rate_num: 0.5
  targets: {efficiency: △, consulting: △, training: ×}
  expenses: 店舗等（事務所を除く）の改修と、生産・販売力強化・業務効率化に伴う設備等の導入に係る経費。専門家活用事業は経営改善・事業継承等の専門家の旅費・報酬費・委託費。広告宣伝事業は自社PRのウェブサイト構築・パンフレット作成などの委託費・印刷製本費・広告費
  conditions: 町税等の滞納がなく、町内に本店又は主たる事業所を有し、今後3年以上継続して経営する意思のある事業者で、製造業・情報通信業・卸売業・小売業・宿泊業・飲食サービス業・生活関連サービス業・娯楽業（風俗営業・チェーン店等を除く）を営む常時使用する従業員20人以下の小規模事業者
  period: {status: rolling}
  url: https://www.town.tsunagi.lg.jp/page4097.html
  checked: 2026-11-04
  confidence: official
  note: 町のページ（最終更新2026-06-01、「募集について」）。受付期間・予算・事業ごとの回数の記載はページにない（交付要綱 PDF は開いていない）。設備にソフトウェアやクラウドの利用料が入るかは書かれていない。AI・ITの名指しはない。max_yen・rate_num は店舗等整備・生産設備等導入事業の値。問い合わせは 0966-83-8066、shokokanko@town.tsunagi.lg.jp
  fuenn_note: 津奈木町内の従業員20人以下の小規模事業者が、業務効率化のための設備を入れる費用（1/2・最大50万円）や、経営改善の専門家を活用する費用（2/3・最大20万円）などを補助する町の制度です。

