  note: 町のページ（最終更新2024-06-24）に「令和8年度より…令和8年度～令和12年度のうち1回限りの申請」。受付期間の記載はなく「予算の範囲内」。ソフトウェア・ITツールが「機械・設備」に入るかは書かれていない。創業・事業承継の区分（外部専門家への謝金、ホームページ等の販売促進媒体など。町商工会の確認が要件）もある。担当課の名前はページの抜粋で確かめていない
