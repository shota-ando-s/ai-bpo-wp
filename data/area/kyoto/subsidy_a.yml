# 京都府（府・公益財団法人京都産業21）と15市の AI・IT・DX・研修向け補助金（2026年度）。2026-11-11に公式ページ・募集要領・報道発表で確認
# 府域でAIを名指ししたのは京都産業21の「ものづくり産業AI活用支援事業」（AIを使った製品・サービスを作る側の開発補助 1/2・500万円、採択3件程度、08-14〜09-25で終了）だけ。京都エコノミック・ガーデニング支援強化事業の「成長分野」に AI・半導体があるが 05-14 で終了
# 府域で 2026-11-11 に申請できるのは、府の多様な働き方推進事業費補助金（長時間労働の削減につながる機器・ソフトウェア、社内研修、テレワーク 1/2・50万円、09-01〜12-25、事前に「子育て企業サポートチーム」への相談が要る）だけ。府の建設業等人手不足対策支援事業（建設業のバックオフィスのクラウドシステム・研修 1/2・50万円）は 10-30 で終了
# 京都市（京都市・ASTEM）は AI・ロボティクス導入支援 PoC 補助金（2/3・200万円、07-03〜07-31で終了、09-28 に6社採択）、デジタル化推進プロジェクト（クラウド利用料・指導研修も対象 4/5・40万円〜2/3・100万円、05-29で終了）、DXモデル構築プロジェクト（1/2・300万円、06-12で終了）、賃上げ環境整備支援事業（省力化設備 2/3・200万円、事前エントリーは 07-17 で終了）。今申し込めるのは無料の「デジタル・DX人材育成のための研修講師派遣」（11-11〜12-11、10社。補助金ではないので subsidy_a_areas.md に書いた）
# 14市（福知山〜木津川）の制度は下（id: kyoto-<slug>-…）。制度が見つからなかった市は subsidy_a_areas.md に確かめたページを書いた
# 国の補助金への上乗せ: 府・京都市とも、国のデジタル化・AI導入補助金への上乗せは見つからない。府の業務改善助成金への上乗せ（経営基盤強化推進奨励金）は令和7年度で終わり、令和8年度の同じ制度は見つからない。addon・exclusive_with は入れていない
# 2026年の府内の災害の事業者向け制度: 災害救助法の適用なし（stats 担当）。事業者向けの災害の補助・特別相談は見つからなかった（subsidy_a_areas.md）
# 期間の status は data/subsidies/README.md の値（open / closed / rolling / unknown）。来年度の見込み（next_expected）は書かない

