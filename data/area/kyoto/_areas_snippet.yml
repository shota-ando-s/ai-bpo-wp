# 案（D34、2026-11-11 のデータ）。data/subsidies/areas.yml の末尾に足す京都府の部分。親が最後に areas.yml に入れる（data/subsidies/kyoto.yml〔案は data/area/kyoto/_subsidies_kyoto.yml〕と同じコミット。areas.yml は直接編集していない）
# none: true は「市町村独自の制度」が _subsidies_kyoto.yml に1件もない13市町村（綾部市・亀岡市・城陽市・向日市・長岡京市・八幡市・南丹市・大山崎町・井手町・宇治田原町・笠置町・精華町・南山城村）。どれも公式サイトの事業者向け・商工業のページで確かめて見つからなかった（subsidy_a_areas.md・subsidy_b_areas.md）。callout は「独自の補助金が見つかりませんでした。京都府と国の制度を使います」と出る
# 京都市・京丹後市は今年度の受付を終えた制度しかないが、yml に制度があるので none にせず、note の一文目で状況を書いた（滋賀県草津市・湖南市、岡山県玉野市と同じ）。久御山町（HPリニューアル、随時）・和束町（空き家のサテライトオフィス、受付期間の記載なし）・京丹波町（FROM京丹波、11-13 まで）・伊根町（受付期間の記載なし）・与謝野町（創業者向け、12-18 まで）も none なし。舞鶴市・宇治市・宮津市・福知山市・京田辺市・木津川市は受付中の制度がある
# 並びは府の推計人口の表の参考の地域の8区分の順（京都市域 → 乙訓〔向日・長岡京・大山崎〕→ 山城北部〔宇治・城陽・八幡・久御山・井手・宇治田原〕→ 学研〔京田辺・木津川・精華〕→ 相楽東部〔笠置・和束・南山城〕→ 南丹〔亀岡・南丹・京丹波〕→ 中丹〔福知山・舞鶴・綾部〕→ 丹後〔宮津・京丹後・伊根・与謝野〕。stats.md「自治体コードと地域区分」）。区分の中は自治体コード順。判断 D4-9
# none の callout は「AI・IT導入向けの独自の補助金が見つかりませんでした」と出るので、none の note は確かめ方・相談先（商工会議所は日本商工会議所の一覧、商工会は全国商工会連合会の名簿〔gov_ai.md〕。電話もその名簿の値）・取り違えの注意を書く
# 「無料」と書いたのは資料に無料とあるものだけ: 京都市の研修講師派遣（市のページ「講師派遣料 無料」）、久御山町の AI セミナー（町のページ「参加費 無料」）。京都府よろず支援拠点（「支援は無料。」）は府の窓口なので市町村の note には入れていない（記事本文の H2 9 で書く）。京都産業21の専門家派遣は有料・IoT・AI相談窓口は無料の記載がない＝入れていない
# 府の制度（多様な働き方推進。北部地域人材確保プロジェクト推進コースを含む）は kyoto の行で全地域に出るので、市町村の note には書いていない。市町村の制度は市町村内に事業所がある事業者が対象で、近くの市町村の事業者は使えない。京都市・ASTEM の制度は京都市内の事業者だけ
# 取り違えの注意: 京都市（kyoto-city。京都府と別）、八幡市（やわた。北九州市八幡東区・西区と別）、京田辺市（和歌山県田辺市と別）、長岡京市（新潟県長岡市と別）、京丹波町（兵庫県丹波市と別）、南丹市（「南丹」地域は亀岡市・南丹市・京丹波町）を note に入れた。郡名（乙訓郡・久世郡・綴喜郡・相楽郡・船井郡・与謝郡）を町村の note に入れた。南山城村は府内で唯一の村
# 2026年は府内で災害救助法の適用がない。災害・特別相談（中東情勢・全東信）は note に入れない
# note は全角の句読点だけ（ASCII のカンマ・「: 」を入れていない＝YAML の流れ形式で区切りにならない）
