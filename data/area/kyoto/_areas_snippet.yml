    - {code: kyoto/yosano, name: 与謝野町, note: 京都府与謝郡与謝野町の産業振興補助金（創業等支援事業）は、町内で新たに開業する人の機器購入費や研修費などを補助する制度で、2026-12-18まで受け付けています（2026-11-11確認）。すでに事業をしている会社のAI・IT導入に使える町独自の補助金は見つかりませんでした（織物業内製化支援事業補助金は2026-05-29で受付を終えました）。与謝野町商工会（0772-43-1020）か町の産業観光課（0772-43-9012）に確認してください}
