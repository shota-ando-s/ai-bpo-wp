# 静岡県（県・公益財団法人静岡県産業振興財団）と23市の AI・IT・DX・研修向け補助金（2026年度）。2026-11-11に公式ページ・募集要項・要綱で確認（根拠は subsidy_a_areas.md）
# 形は data/subsidies/README.md（period の status は open / closed / rolling / unknown）。来年度の見込み（next_expected）は書かない。data/subsidies/shizuoka.yml に移すときは area をそのまま使える（県 shizuoka、市 shizuoka/<slug>）
# 県・財団の AI・DX の補助は、今日（2026-11-11）はどれも受付していない: 財団の生成AI等活用実証事業費補助金（自動車産業、2/3・350万円、2026-04-01〜05-08正午）、中小企業等収益力向上（賃上げ環境整備）事業費補助金 DX推進枠（1/2〔賃上げ2/3〕・700万円〔賃上げ1,000万円〕、1次 4/1〜5/15・2次 6/1〜6/30）、県の小規模企業経営力向上事業費補助金（2/3・50万円、ITソフトウェア含む、2次 6/22終了）、「シズオカ×AI チャレンジ」（補助金は AI 事業者に交付、1/2・500万円、実証計画書 9/25締切・採択済み）
# 浜松市 中小事業者等AIエージェント導入支援事業費補助金（1/2・500万円・下限50万円）は一次 4/20〜5/29、二次 6/15〜7/31、三次 8/3〜9/30 で、すべて終了（補助対象期間は12/15まで）
# 今申請できる市の制度（2026-11-11）: 焼津市 DX促進モデル事業補助金（1/2・250万円、交付申請 2027-01-29まで）、静岡市 物流効率化等生産性向上支援事業補助金（物流事業者、1/2・300万円、2026-11-30 17時必着）、熱海市 宿泊業の経営力基盤強化事業費補助金（市1/4＋県1/4、各75万円、2027-02-26まで）、磐田市 人材育成事業費補助金（1/2・10万円、2027-02-28まで）、藤枝市 IT導入事業費補助金（国の補助への上乗せ、随時）、静岡市 DX人材等育成支援事業補助金（研修 2/3・10万円、随時）、島田市 先端設備等導入費補助金（随時）
# 終了: 静岡市 デジタル活用（7/3）、富士市 DX推進（予算到達）、湖西市 DX推進（予算到達）、袋井市 デジタル化推進（8/7）、掛川市 新たなビジネススタイル（予算到達）、下田市 宿泊業（10/30）
# 国の「デジタル化・AI導入補助金」（national.yml の digital-ai-donyu。7次は2026-12-01 17時締切）への上乗せ（addon）は 藤枝市 IT導入事業費補助金だけ（{kind: remaining, ratio: 0.5}、上限10万円）。浜松市・湖西市・富士市・焼津市・磐田市・掛川市の補助は国・他の補助との併用・重複を認めない。静岡市 デジタル活用（終了）は国等の補助額を対象経費から除く形
# 独自の AI・IT 導入・研修の補助が見つからなかった市: 沼津市・三島市・富士宮市・伊東市・御殿場市・裾野市・伊豆市・御前崎市・菊川市・伊豆の国市・牧之原市（確認したページは subsidy_a_areas.md）

