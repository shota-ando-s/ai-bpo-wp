# 静岡県（県・公益財団法人静岡県産業振興財団）と23市の AI・IT・DX・研修向け補助金（2026年度）。2026-11-11に公式ページ・募集要項・要綱で確認（根拠は subsidy_a_areas.md）
# 形は data/subsidies/README.md（period の status は open / closed / rolling / unknown）。来年度の見込み（next_expected）は書かない。data/subsidies/shizuoka.yml に移すときは area をそのまま使える（県 shizuoka、市 shizuoka/<slug>）
# 県・財団の AI・DX の補助は、今日（2026-11-11）はどれも受付していない: 財団の生成AI等活用実証事業費補助金（自動車産業、2/3・350万円、2026-04-01〜05-08正午）、中小企業等収益力向上（賃上げ環境整備）事業費補助金 DX推進枠（1/2〔賃上げ2/3〕・700万円〔賃上げ1,000万円〕、1次 4/1〜5/15・2次 6/1〜6/30）、県の小規模企業経営力向上事業費補助金（2/3・50万円、ITソフトウェア含む、2次 6/22終了）、「シズオカ×AI チャレンジ」（補助金は AI 事業者に交付、1/2・500万円、実証計画書 9/25締切・採択済み）
# 浜松市 中小事業者等AIエージェント導入支援事業費補助金（1/2・500万円・下限50万円）は一次 4/20〜5/29、二次 6/15〜7/31、三次 8/3〜9/30 で、すべて終了（補助対象期間は12/15まで）

