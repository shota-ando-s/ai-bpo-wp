# 静岡県 12町（東伊豆町・河津町・南伊豆町・松崎町・西伊豆町・函南町・清水町・長泉町・小山町・吉田町・川根本町・森町）2026年度
# 確認日 2026-11-11。根拠は subsidy_b_areas.md
# 生成AI・AI導入・IT導入・DX を名指しで補助する町独自の制度は、12町とも確認できなかった
# 国の「デジタル化・AI導入補助金」（national.yml の digital-ai-donyu）への町の上乗せ（addon）は12町とも見つからない
# IT・ホームページ・研修に使える町独自の制度: 清水町 中小企業支援補助金（販売力促進: ホームページ作成費など 1/2・年5万円）・経営革新計画支援補助金（研修費・ホームページ作成費・外注費など 1/2・50万円）、河津町 小規模事業者強化事業費補助金（ホームページ制作・ネット販路整備 1/2・30万円、事業開始は申請後10月末まで）
# 創業・設備（備品）に使える町の制度: 東伊豆町 創業支援事業補助金、松崎町 起業等支援事業補助金、清水町 産業創出支援事業費補助金、小山町 賑わい商業創出支援事業助成金、吉田町 産業振興事業費補助金（新規創業）、川根本町 起業及び事業継続チャレンジ補助金、長泉町 起業・創業支援事業費補助金（R8受付終了）
# 独自の事業者向け補助（IT・創業・設備・研修）が見つからなかった町: 南伊豆町（融資のみ）・西伊豆町（融資・利子補給のみ）・函南町（企業立地奨励金・創業相談のみ）・森町（企業立地のみ。ブランド向上支援は受付終了）
# 県の制度・県域の機関・23市は subsidy_a 担当
# 期間の status は data/subsidies/README.md の値（open / closed / rolling / unknown）。来年度の見込み（next_expected）は書かない

