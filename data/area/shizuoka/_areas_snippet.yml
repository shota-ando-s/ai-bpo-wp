# areas.yml に足す静岡県の行（D345 の下書き、2026-11-11。data/subsidies/areas.yml は編集していない。親が最後に areas.yml の末尾に足す。先頭のコメント5行は areas.yml に入れなくてよい）
# none: true は data/area/shizuoka/_subsidies_shizuoka.yml にその市町の制度が1件もない15市町（沼津・三島・富士宮・伊東・御殿場・裾野・伊豆・御前崎・菊川・伊豆の国・牧之原の11市と南伊豆・西伊豆・函南・森の4町）。浜松市・富士市・湖西市・掛川市・袋井市・下田市のように今年度は終わった制度しかない市や、東伊豆町・小山町・吉田町のように創業の制度だけの町も、yml に制度があるので none にせず note の一文目で状況を書いた
# 並びは団体コードの順（政令市2→21市→賀茂郡→田方郡→駿東郡→榛原郡→周智郡）。県の「県内市町」の4区分（西部・中部・東部・賀茂）の並びにするかは D345 の判断（D4 判断）
# 同名・紛らわしい自治体（静岡市と県、清水町と静岡市清水区、小山町と栃木県小山市、森町と北海道森町）は note に郡名か「◯◯とは別」を入れた。県の制度（今申請できる AI・IT 向けはない）は市町の note に書いていない
# note に ASCII のコンマ・コロン・URL を入れない（flow の書き方で yaml.safe_load が壊れるため）
- code: shizuoka
  name: 静岡県
  cities:
    - {code: shizuoka/shizuoka-city, name: 静岡市, note: 静岡市の中小企業DX人材等育成支援事業補助金は、市内に本社か工場がある中小企業が社員にソフトウェア技能の研修を受けさせる受講料を2/3（上限10万円）補助し、研修を始める前に申請します（随時。2026-11-11確認）。荷主・倉庫業者・トラック運送事業者向けの物流効率化等生産性向上支援事業補助金（1/2・上限300万円）は2026-11-30の17時必着です。ITツールの導入に2/3を補助する中小企業等デジタル活用事業補助金は2026年度の受付を7月3日で終えました。窓口は市の産業振興課 経営支援係（054-354-2058）}
    - {code: shizuoka/hamamatsu, name: 浜松市, note: 浜松市の中小事業者等AIエージェント導入支援事業費補助金（1/2・50万〜500万円）は、2026年度の一次から三次の募集がすべて終わりました（三次は9月30日締切。2026-11-11確認）。RPAや単純な議事録作成ツールは対象外で、国など他の補助金と同じ事業では使えません。宿泊業の経営力基盤強化事業費補助金も7月31日で受付を終えています。窓口は市の産業振興課（053-457-2044）}
    - {code: shizuoka/numazu, name: 沼津市, none: true, note: 沼津市の事業者向けのページと商工業の支援のページで確かめた範囲で、市独自のAI・IT導入や研修の補助金は見つかりませんでした（2026-11-11確認。工場の立地や設備投資の補助はあります）。沼津商工会議所か沼津市商工会に相談できます}
    - {code: shizuoka/atami, name: 熱海市, note: 熱海市の宿泊業の経営力基盤強化事業費補助金は、市内の旅館・ホテルが予約管理や勤怠管理のシステム・ロボットなどを入れる費用（対象経費20万〜300万円）の1/4を市が、同じ額を県が補助し（市・県とも上限75万円）、計画の提出は2027-02-26までです（2026-11-11確認）。宿泊事業者だけが対象で、ほかの業種に使える市独自のAI・IT導入の補助金は見つかりませんでした。窓口は市の観光経済課 産業振興室（0557-86-6195）}
    - {code: shizuoka/mishima, name: 三島市, none: true, note: 三島市の商工観光まちづくり課のページで確かめた範囲で、市独自のAI・IT導入や研修の補助金は見つかりませんでした（2026-11-11確認。店舗の改修や空き店舗の補助はあります）。三島商工会議所に相談できます}
    - {code: shizuoka/fujinomiya, name: 富士宮市, none: true, note: 富士宮市の企業・事業者向け支援制度の一覧（2025年5月更新）で確かめた範囲で、市独自のAI・IT導入や研修の補助金は見つかりませんでした（2026-11-11確認。一覧は融資・出展・知的財産の制度です）。富士宮商工会議所か芝川商工会に相談できます}
    - {code: shizuoka/ito, name: 伊東市, none: true, note: 伊東市で確かめた範囲では、市独自のAI・IT導入や研修の補助金は見つかりませんでした（2026-11-11確認）。旅館・ホテル向けの宿泊業の経営力基盤強化事業費補助金のページはありますが、2026年度の受付期間が書かれていないので市の観光課（0557-32-1711）に確認してください。伊東商工会議所に相談できます}
    - {code: shizuoka/shimada, name: 島田市, note: 島田市の先端設備等導入費補助金は、市の認定を受けた先端設備等導入計画に沿って設備を入れる費用を1/2（賃上げの方針により上限50万円か100万円）補助し、随時受け付けています（実績報告は2027-01-31まで。2026-11-11確認）。ソフトウェアが対象になるかはページに書かれていないので、導入の前に市の商工課 商工政策係（0547-36-7146）に相談してください。島田市産業支援センターおびサポ（0547-54-5760）でも相談できます}
    - {code: shizuoka/fuji, name: 富士市, note: 富士市の中小企業等DX推進事業支援補助金（ソフトウェア・クラウドの導入やデジタル研修に1/2・上限50万円）は、予算の上限に達して2026年11月に受付を終えました（2026-11-11確認）。今申請できる市独自のAI・IT導入の補助金は見つかりませんでした。窓口は市の産業支援課（0545-52-6783）で、富士市地域産業支援センター（Beパレットふじ）でも相談できます}
    - {code: shizuoka/iwata, name: 磐田市, note: 磐田市の人材育成事業費補助金は、市内の中小企業が社員向けに新しく開く研修や市外のセミナーの費用を1/2（上限10万円、複数社なら20万円）補助し、2027-02-28まで申請できます（予算がなくなり次第終了。2026-11-11確認）。生成AIの研修が対象になるかは内容によるので市の産業政策課に確認してください。AI・ITツールの導入に使える市独自の補助金は見つかりませんでした}
    - {code: shizuoka/yaizu, name: 焼津市, note: 焼津市の中小企業等DX促進モデル事業補助金は、デジタル技術で新しい製品・サービスを作ったり既存のシステムを使って業務の進め方を見直したりする事業の費用を1/2（上限250万円）補助し、交付申請は2027-01-29までです（予算に達すると終了。2026-11-11確認）。事前に市の商工観光課（054-626-1175）への相談が必要で、国やほかの自治体の補助と同じ事業では受けられません。市の事業者デジタル支援窓口（無料）でも相談できます}
    - {code: shizuoka/kakegawa, name: 掛川市, note: 掛川市の新たなビジネススタイル整備支援事業費補助金（小規模企業者のペーパーレス化・EC・会計ソフトなどに1/2・上限5万円）は、予算に達して2026年度の受付を終えました（2026-11-11確認）。今申請できる市独自のAI・IT導入の補助金は見つかりませんでした。窓口は市の産業観光課（0537-21-1125）}
    - {code: shizuoka/fujieda, name: 藤枝市, note: 藤枝市のIT導入事業費補助金は、市内の中小企業が国のデジタル化・AI導入補助金（旧IT導入補助金）を使ったとき、国の補助を引いた自己負担の1/2（上限10万円）を市が上乗せする制度で、国の補助事業が終わってから市に申請します（締切の記載なし。2026-11-11確認）。窓口は市の産業政策課（054-643-3165）}
    - {code: shizuoka/gotemba, name: 御殿場市, none: true, note: 御殿場市の中小企業者支援のページ（助成・補助・融資）で確かめた範囲で、市独自のAI・IT導入や研修の補助金は見つかりませんでした（2026-11-11確認。大規模な設備投資の補助はあります）。御殿場市商工会に相談できます（御殿場市に商工会議所はありません）}
    - {code: shizuoka/fukuroi, name: 袋井市, note: 袋井市の中小企業等デジタル化推進事業（IT専門家の無料派遣とソフトウェアなどの導入の伴走・補助）は、2026年度の募集を8月7日で終えました（2026-11-11確認）。今申請できる市独自のAI・IT導入の補助金は見つかりませんでした。窓口は市の産業未来課 産業政策係（0538-44-3136）}
    - {code: shizuoka/shimoda, name: 下田市, note: 下田市の宿泊業の経営力基盤強化事業費補助金（旅館・ホテルのシステムやロボットの導入に市1/4と県1/4）は、2026年度の計画提出を10月30日で終えました（2026-11-11確認）。宿泊業以外のAI・IT導入向けの市独自の補助金は見つかりませんでした。窓口は市の観光交流課で、下田商工会議所にも相談できます}
    - {code: shizuoka/susono, name: 裾野市, none: true, note: 裾野市の産業・ビジネスと企業支援・補助金のページで確かめた範囲で、市独自のAI・IT導入や研修の補助金は見つかりませんでした（2026-11-11確認）。市の産業・イノベーション推進課（055-995-1842）か裾野市商工会に相談できます（裾野市に商工会議所はありません）}
    - {code: shizuoka/kosai, name: 湖西市, note: 湖西市の中小企業経営力向上支援補助金（DX推進事業。ソフトウェアやクラウドサービスの導入に1/2・上限30万円）は、予算の上限に達して2026年度の受付を終えました（2026-11-11確認）。今申請できる市独自のAI・IT導入の補助金は見つかりませんでした。窓口は市の産業振興課 モノづくり推進室で、湖西市商工会か新居町商工会にも相談できます}
    - {code: shizuoka/izu, name: 伊豆市, none: true, note: 伊豆市の事業者向けの支援制度のページで確かめた範囲で、市独自のAI・IT導入や研修の補助金は見つかりませんでした（2026-11-11確認）。旅館・ホテル向けの宿泊業の経営力基盤強化事業費補助金のページはありますが、2026年度の期間が書かれていないので市の観光商工課（0558-72-9911）に確認してください。伊豆市商工会に相談できます}
    - {code: shizuoka/omaezaki, name: 御前崎市, none: true, note: 御前崎市の商工業のページで確かめた範囲で、市独自のAI・IT導入や研修の補助金は見つかりませんでした（2026-11-11確認。企業の優遇制度や融資はあります）。市の商工観光課（0537-85-1135）か御前崎市商工会に相談できます}
    - {code: shizuoka/kikugawa, name: 菊川市, none: true, note: 菊川市の支援・制度のページで確かめた範囲で、市独自のAI・IT導入や研修の補助金は見つかりませんでした（2026-11-11確認）。経営基盤強化（販路拡大）補助金のIT導入の区分は越境ECの導入だけが対象です。市の産業支援センターEnGAWA（0537-35-0930）か菊川市商工会に相談できます}
