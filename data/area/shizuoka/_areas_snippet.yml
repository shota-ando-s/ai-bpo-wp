    - {code: shizuoka/kawazu, name: 河津町, note: 賀茂郡河津町の小規模事業者強化事業費補助金は、町の小規模事業者のホームページの制作やネット注文・メール配信の仕組みづくりの費用を1/2（5万〜30万円）補助します。申請後10月末までに事業を始める決まりなので、今年度の受付は町の産業振興課に確認してください（2026-11-11確認）。旅館・ホテル向けの宿泊業の補助も公開されているのは2024年度分の手続きです。AIを名指しした制度ではありません}
