    - {code: shizuoka/matsuzaki, name: 松崎町, note: 賀茂郡松崎町の起業等支援事業補助金は、町で起業する人や既存の事業者が新しい事業を始めるとき、事業に直接必要な設備・機械・備品の費用を1/2（上限100万円、20万円以上）補助します（期間の表示なし。2026-11-11確認）。町内の業者から買うことが条件で、ソフトウェアは対象として書かれていません。AI・IT導入に使える町独自の補助金は見つかりませんでした。松崎町商工会に相談できます}
    - {code: shizuoka/nishiizu, name: 西伊豆町, none: true, note: 賀茂郡西伊豆町の補助金・助成金の一覧と中小企業者への経営支援のページで確かめた範囲で、事業者向けの町の補助金は見つかりませんでした（2026-11-11確認。制度融資と利子補給はあります）。西伊豆町商工会に相談できます}
    - {code: shizuoka/kannami, name: 函南町, none: true, note: 田方郡函南町の事業者向け情報と補助金のページで確かめた範囲で、町独自のAI・IT導入や研修の補助金は見つかりませんでした（2026-11-11確認。企業立地の奨励金や無料の創業相談はあります）。函南町商工会に相談できます}
    - {code: shizuoka/shimizu-town-shizuoka, name: 清水町, note: 静岡県駿東郡清水町（静岡市清水区とは別）の中小企業支援補助金は、ホームページ作成などの広報費を1/2（年5万円まで）、展示会の出展料を1/2（年10万円まで）補助し、経営革新計画支援補助金は県の承認を受けた経営革新計画に沿った開発・販路開拓（研修費や外注費を含む）の費用を1/2（上限50万円）補助します（どちらも期間の表示なし。2026-11-11確認）。AIを名指しした制度ではありません。窓口は町の産業観光課 産業振興係（055-981-8239）}
    - {code: shizuoka/nagaizumi, name: 長泉町, note: 駿東郡長泉町の中小企業産学共同研究支援補助金は、大学や高専とソフトウェアや製品の共同研究をするときに大学等へ払う費用を1/2（上限20万円）補助しますが、同じページに2026年度の受付終了の表示があり、この制度にも当たるかは書かれていません（2026-11-11確認）。起業・創業の補助は予算に達して終わりました。AI・IT導入に使える町独自の補助金は見つかりませんでした。町の産業振興課か長泉町商工会に確認してください}
    - {code: shizuoka/oyama-town, name: 小山町, note: 静岡県駿東郡小山町（栃木県小山市とは別）には、卸売・小売・宿泊・飲食の起業や新分野への進出を助成する賑わい商業創出支援事業助成金がありますが、AI・IT導入や研修に使える町独自の補助金は見つかりませんでした（2026-11-11確認）。小山町商工会か町の商工観光課に相談できます}
    - {code: shizuoka/yoshida, name: 吉田町, note: 静岡県榛原郡吉田町には、町で創業する小規模企業者の設備・機械の費用を1/2（上限50万円）補助する制度がありますが、AI・IT導入や研修に使える町独自の補助金は見つかりませんでした（2026-11-11確認）。吉田町商工会か町の産業課（0548-33-2122）に相談できます}
    - {code: shizuoka/kawanehon, name: 川根本町, note: 榛原郡川根本町の起業及び事業継続チャレンジ補助金は、町で起業する人の店舗の工事や備品・設備の費用を1/2（上限100万円）補助しますが、既存の事業者向けの区分は建物の改築・増築だけです（2026-11-11確認）。AI・IT導入や研修に使える町独自の補助金は見つかりませんでした。川根本町商工会か町の産業振興課 商工業室（0547-56-2226）に相談できます}
    - {code: shizuoka/mori-town-shizuoka, name: 森町, none: true, note: 静岡県周智郡森町（北海道茅部郡森町とは別）の企業立地・企業支援のページで確かめた範囲で、受付中の町独自の事業者向けの補助金は見つかりませんでした（2026-11-11確認。企業立地の補助はあります）。森町商工会に相談できます}
