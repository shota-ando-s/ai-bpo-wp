# 富山県 4町1村（舟橋村・上市町・立山町・入善町・朝日町〔下新川郡〕）2026年度
# 確認日 2026-10-25。根拠は subsidy_b_areas.md
# 生成AI・AI導入・AI研修を名指しで補助する町村独自の制度は、5町村とも確認できなかった
# IT・デジタル化に使える町村独自の制度
#   - 立山町 小規模事業者省エネ・省力化推進事業補助金（2026-05-29告示）。「省力化システム」＝国の「デジタル化・AI導入補助金」（令和7年度補正）にITツールとして登録・公表されているソフトウェアの新規導入の購入費（月額使用料・導入設定費・保守料は対象外）。1/2・上限20万円、対象経費5万円以上、町内に事業所等がある小規模事業者だけ。申請期間2026-07-15〜12-28（12-31までに完了するもの、予算到達で終了）。交付申請の提出先は立山舟橋商工会
# 国の補助金への上乗せ（addon）: 立山町の上の制度だけ。要綱第4条(4)「国、県その他の団体から補助金等の交付を受ける場合は、当該補助金等の額を控除した後の額を補助対象経費とする」と、対象ソフトが国のデジタル化・AI導入補助金のITツールに限られることから、（経費−国の補助額）×1/2（remaining 0.5、上限20万円）として digital-ai-donyu への addon にした。ただし町の対象経費は購入費だけで、国が対象にするクラウド利用料・導入設定・保守は町では対象外（note に記載）。subsidy_a の黒部市は国の対象経費×比率（cost_ratio）、立山町は国の補助額を引いた残り×1/2（remaining）で、計算の形が違う
# 専門家派遣: 入善町 経営アドバイザー派遣事業補助金（富山県新世紀産業機構・富山県商工会連合会の経営アドバイザー派遣の利用者負担金の1/2。1回1万円・年5回を限度に積算するため最大2万5千円）
# 研修: 朝日町 がんばる事業者応援事業補助金の研修事業（新規採用者の初任者研修等への参加経費の全額、上限3万円）。AI研修が対象になるかは書かれていない
# 創業向けで、備品・広告宣伝費が対象になる制度: 朝日町 起業応援事業補助金（1/2・上限100万円）。上市町の創業支援事業費補助金はパソコン・タブレット端末など汎用性の高い備品を対象外と申請要領に明記しているため YAML に入れず、subsidy_b_areas.md の「IT向けではない制度」に書いた
# 国のデジタル化・AI導入補助金・中小企業省力化投資補助金に町村が上乗せする制度は、立山町のほかは確認できなかった。県の制度（TONIO のトランスフォーメーション補助金など。subsidy_a.yml）に町村が上乗せする制度も見つからない
# 舟橋村は公式サイトが2026-10-22から「システムメンテナンス」で開けず（2026-10-25も503）、Internet Archive（2026-10-03・10-15版）のサイトマップと、村の例規集（public2.legalcrud.com、2026-10-01内容現在）で確認した。商工業向けの補助金の要綱は例規集にない
# 県の制度・県域の機関（TONIO・よろず支援拠点など）・国の制度は別担当（subsidy_a）のため入れていない。融資・利子補給・保証料・企業立地の助成・雇用の奨励金・燃料費や物価高騰の支援金・空き店舗・商店街の店舗改装・チャレンジショップ・サテライトオフィス誘致（県外事業者向け）・個人向けの職業訓練奨励金は YAML に入れていない（subsidy_b_areas.md の「IT向けではない制度」に記した）
# 期間の status は data/subsidies/README.md の値（open / closed / rolling / unknown）

# ---- 立山町 ----
- id: toyama-tateyama-shoryoku
  name: 立山町小規模事業者省エネ・省力化推進事業補助金（省力化システム）
  org: 立山町（商工観光課 商工労働係）
  area: toyama/tateyama
  max_yen: 200000
  rate: 補助対象経費の1/2（千円未満切り捨て）、上限20万円。国・県等の補助金を受ける場合はその額を控除した額が補助対象経費
  rate_num: 0.5
  min_cost_yen: 50000
  small_only: true
  addon: {kind: remaining, ratio: 0.5}
  stacking: {addon_to: [digital-ai-donyu]}
  targets: {efficiency: ○, consulting: ×, training: ×}
  expenses: 省力化システム＝中小企業庁の令和7年度補正予算「デジタル化・AI導入補助金」でITツールとして登録・公表されているソフトウェアの新規導入（更新は除く）の購入費。月額使用料・導入設定費・保守料は対象外。同じ制度の省エネ設備（業務用の高効率空調・給湯器・冷凍冷蔵設備、家庭用エアコン・エコキュート・LED照明等の既存設備からの更新、町内業者の販売・施工）と合算できる。対象経費の合計5万円以上
  conditions: 町内に店舗・事業所・工場等がある小規模事業者（製造業その他は従業員20人以下、商業・サービス業は5人以下）。個人事業主・株式会社・合名会社・合同会社・合資会社・有限会社に限る（社会福祉法人・医療法人・NPO・一般社団法人・農事組合法人などは対象外）。町税の滞納がない。同じ事業で立山町の他の補助金を受けない。自社で導入する（自ら施工・導入する）ものは対象外。契約・発注・支払の前に申請（交付決定前の着手は対象外）。1事業者1回限り
  period: {status: open, start: 2026-07-15, end: 2026-12-28}
  url: https://www.town.tateyama.toyama.jp/shigoto_sangyo/sangyoshinko/shokogyo/12097.html
  checked: 2026-10-25
  confidence: official
  note: ページ更新2026-06-19。申請期間2026-07-15〜12-28、2026-12-31までに導入と支払が終わる事業に限り、予算額に達した場合は期間内でも受付終了（受付終了の表示はない）。交付要綱（2026-05-29告示第76号、2027-03-31失効）https://www.town.tateyama.toyama.jp/material/files/group/9/youkou2026.pdf （別表が対象のソフトウェアと経費）、交付申請の手引き https://www.town.tateyama.toyama.jp/material/files/group/9/tebiki2026.pdf 。交付申請の提出先は立山舟橋商工会（立山町前沢2469、076-463-1221）、変更・実績報告・請求は町の商工観光課 商工労働係（076-462-9970）。実績報告は完了の翌日から1か月か2027-01-15の早い日まで。addon は要綱第4条(4)の控除の規定による（経費−国の補助額）×1/2 だが、要綱は国の補助金との併用を名指ししてはいない。町の対象経費はソフトウェアの購入費だけで、国のデジタル化・AI導入補助金が対象にするクラウド利用料（最大2年分）・導入設定・保守は町では対象外のため、クラウド型（月額）のAIツールは町の補助を受けにくい。財源の記載はないが趣旨は「エネルギー価格等の物価高騰の影響を受ける」小規模事業者の負担軽減。AIの語は国の制度名（デジタル化・AI導入補助金）としてだけ出る
  fuenn_note: 立山町に事業所がある小規模事業者が、国のデジタル化・AI導入補助金に登録されたソフトウェアを新しく購入するとき、購入費の1/2（上限20万円）を町が補助します。申請は2026年12月28日までで、12月31日までに導入と支払を終える必要があります。月額の利用料は対象外です。申請書は立山舟橋商工会に出します。

