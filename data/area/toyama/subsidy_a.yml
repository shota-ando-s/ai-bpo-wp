# 富山県（県・公益財団法人富山県新世紀産業機構〔TONIO〕・富山県よろず支援拠点）と富山市・高岡市・魚津市・氷見市・滑川市・黒部市・砺波市・小矢部市・南砺市・射水市（2026年度）。2026-10-25に公式ページ・手引き・公募要領・交付要綱で確認
# 県のAI・DX向けの主力は「第3次 富山県中小企業トランスフォーメーション補助金」（TONIO。DX枠・AI導入枠・GX枠・省力化・省人化モデル枠）。AI導入枠は中小・組合2/3、小規模3/4、上限500万円・下限100万円。当初募集（2026-02-27〜07-31、随時締切6回）も追加募集（08-10〜09-04）も締め切られ、2026-10-08の最終報で「交付先は全て決定」。AI導入枠の採択は第1報〜最終報の合計19者（申請50件）
# 県で今申請できるのは研修（とやま人材リスキリング補助金、10時間未満の訓練、経費75％・上限100万円、2027-02-26まで）、副業・兼業人材（8/10・上限50万円）、価格転嫁のコンサル（1/2・上限50万円、11-30まで）、業務改善助成金への上乗せ（賃上げサポート補助金）。県のIT・AIツール導入費の補助で受付中のものはない
# 市でAIを名指しした制度は小矢部市「中小企業等生成AI活用支援事業補助金」だけ（ChatGPT・Gemini・Claude等の有料プランの新規契約の利用料、2/3、小規模5万円・中小10万円、2026-02-16から予算到達まで、対象は2027年2月利用分まで）。県のトランスフォーメーション補助金の AI導入枠は県の制度
# 市独自のDX・IT導入補助: 高岡市 産業スマート化（ものづくり関連業種のみ。デジタイゼーション75万円は2027-01-29まで、デジタライゼーション・DX 150万円は09-30で終了）、小矢部市 DX推進（1/2・10万円）、南砺市 若者・女性に選ばれる企業への変革応援（DXソフト導入は認定企業のみ1/2・100万円、専門家活用1/2・50万円）、射水市 中小企業等DX推進（1/2・5万円）。富山市の先端設備等導入加速化（1/2・500万円）は予算上限で受付終了
# 市独自のAI・IT導入向けの補助がない市: 滑川市・砺波市・魚津市（研修補助だけ）・氷見市（研修・専門家補助だけ）・黒部市（国の補助への上乗せだけ）。確認したページは subsidy_a_areas.md
# 国の補助金への上乗せ（addon）: 黒部市 中小企業者等賃上げ・人手不足解消支援補助金の2区分。省力化推進事業（国の中小企業省力化投資補助金の対象経費の1/4〔国の補助率2/3なら1/6〕、上限50万円 → shoryokuka-ippan cost_ratio 0.25）と働き方改革推進事業（働き方改革推進支援助成金の対象経費の1/8〔国4/5なら1/10〕、上限40万円 → hatarakikata cost_ratio 0.125）。同じ制度の業務改善事業（1/10・40万円）と販路開拓事業（持続化補助金）、県の賃上げサポート補助金（業務改善助成金への上乗せ）は、上乗せ先が national.yml にないため addon にせず note に書いた
# 県の制度への市の上乗せ: 魚津市 中小企業エネルギー効率化推進補助金（県の補助の残り×1/2）、小矢部市 DX推進補助金（他の補助金の額を引いた額×1/2、県のトランスフォーメーション補助金と併用可と明記）。国のデジタル化・AI導入補助金への上乗せは県・10市とも見つからない（射水市 DX推進補助金は「国、県等から補助金を受ける場合は、その額を控除」で併用はできるが、国の制度名を書いていないため addon にしていない）
# 能登半島地震の支援制度（富山県なりわい再建支援補助金、高岡市の被災企業向け制度など）は AI 導入向けではないため yml に入れず、subsidy_a_areas.md の「能登半島地震の支援制度（AI導入向けとは別）」の節に書いた
# 期間の status は data/subsidies/README.md の値（open / closed / rolling / unknown）を使う。随時受付は rolling

