  conditions: 空き家を活用して新規創業する事業者（個人事業主・法人）。事業開始日から5年以上その空き家で事業を継続できること、地域の活性化等の地域貢献に資する事業（別表の対象事業）を行うこと。過去にその空き家の取得で国・県・町の類似の補助を受けていないこと。町税の滞納がないこと。申請は基準日（事業の開始日）から1年以内、役場に直接
