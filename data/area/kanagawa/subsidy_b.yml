# ---- 大井町 ----
- id: kanagawa-oi-business-dx
  name: 大井町中小企業ビジネスDX応援事業費補助金
  org: 大井町（地域振興課、0465-85-5013）
  area: kanagawa/oi
  max_yen: 150000
  rate: 総事業費の1/2以内、上限15万円（要綱 別表第2。デジタル化推進事業・広報及びマーケティング事業。申請は同年度内に各事業1回）
  rate_num: 0.5
  targets: {efficiency: △, consulting: ×, training: ×}
  expenses: デジタル化推進事業（キャッシュレス決済端末、POSレジ導入、その他町長が認めるもの）、広報及びマーケティング事業（ホームページ作成・更新、Web広告掲載料金、マーケティング調査費用、ECサイト利用料金、その他町長が認めるもの）。町内の事業所に係る経費のみ。月額定額制料金は初月から同年度2月末日まで
  conditions: 中小企業基本法第2条第1項の中小企業者（業種別の資本金・従業員の基準）とその団体。町内で1年以上継続して同一事業を営み今後も町内で営む予定、町内に住所（法人は事業所）、町税の滞納なし。事業に着手する前に申請（月額定額制料金は金額確定後、同年度2月末日までに申請）。同年度に町の他の補助事業の交付決定を受けた事業は対象外
  period: {status: rolling}
  url: https://www.town.oi.kanagawa.jp/soshiki/10/business-dx.html
  checked: 2026-11-13
  confidence: official
  note: ページ（更新日 2026年5月1日）「DX導入に係る経費の一部を補助する制度です。補助率は、総事業費の1/2（上限15万円）」「事業実施前に交付申請が必要」。交付要綱 https://www.town.oi.kanagawa.jp/uploaded/attachment/19336.pdf （4ページ、令和8年5月1日施行）第1条「ＤＸの推進による経営基盤強化事業」、第4条2項・第5条・第6条、別表第1・第2。受付期間・予算額の表示はなく「予算の範囲内」。上限15万円が事業ごとか申請者ごとかは別表の書き方では確定できない（1つの表に2事業と「２分の１以内 15万円」）。生成AI・業務ソフトは例示になく「その他、町長が認めるもの」に当たるかは町に確認が要る。国のデジタル化・AI導入補助金への上乗せの規定はない（addon なし）
  fuenn_note: 大井町の中小企業が、キャッシュレス決済・POSレジやホームページ・ECサイトなどのデジタル化の費用を1/2（最大15万円）補助する町の制度です（2026年5月開始）。事業を始める前の申請が必要です。AIツールが対象になるかは、町の地域振興課に事前に相談してください。
