  fuenn_note: 厚木市内で1年以上営む中小企業が、ロボット・IoT・AI などを導入した費用（50万円以上）の1/2（AI導入は最大50万円、ソフトだけのIT導入は最大10万円）を補助する市の制度です。導入の前に概要書を出し、導入後2か月以内（最終は2027年3月15日）に申請します。国の補助金を使った場合は、その額を引いた残りが対象です。クラウドの利用料は対象外です。

