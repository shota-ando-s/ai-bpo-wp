# 神奈川県（県・県域の機関〔KIP・KISTEC〕）と19市の AI・IT・DX・研修向け補助金（2026年度）。2026-11-12〜13に公式ページ・公募要領・要綱で確認（根拠は subsidy_a_areas.md）
# 形は data/subsidies/README.md（period の status は open / closed / rolling / unknown）。来年度の見込み（next_expected）は書かない。data/subsidies/kanagawa.yml（パイロット8制度）の id はそのまま使っている（消さない）。area は県 kanagawa、市 kanagawa/<slug>。13町1村は別の担当（choson）
# 県の AI・デジタルの補助は今日（2026-11-13）どれも受付していない: 小規模事業者デジタル化支援推進（2/3・50万円、生成AIツールが例示、8/28に予算到達で終了）、中小企業生産性向上促進（1/2〔小規模2/3〕・一般枠500万円、ITサービス導入費は50万円まで、8/31終了）、KISTEC 生成AI等開発枠（補助金ではなく代表企業への業務委託、1,000万円以内、7/14締切・3社採択）。県の副業・兼業人材活用補助金（8/10・50万円）は 12/28まで受付中
# 今申請できる市の制度（2026-11-13）: 平塚市 中小企業等DX支援補助金（1/2・200万円、経費100万円以上、ITコーディネータの事前確認、2027-02-28まで。既存の生成AIサービスの導入は対象外）、平塚市 DX人材育成体制構築奨励金（定額10万円、2027-03-31まで）、厚木市 ロボット関連産業等促進事業補助金（導入後申請、AI導入は1/2・50万円、2027-03-15まで、国の補助額を引いた残りに1/2）、鎌倉市 経営基盤強化事業費補助金 デジタル化推進（業務ソフトの利用料 1/3・15万円）・人材育成（1/2・15万円、公的機関の研修か外部講師）（2027-02-26まで）、秦野市 人材育成事業補助金（研修 1/2・年10万円、随時）、海老名市 人材育成事業（公的機関の3日以上の研修 1/2・5万円、先着）、川崎市 リスキリング支援（デジタル人材 2/3・30万円、11/13必着・エントリーシート提出済みの事業者のみ）、綾瀬市 強靭化推進補助金 第3次（製造業、2/3・150万円、11/13締切・事前相談済みのみ）。横須賀市 ICT「はじめの一歩」（3/4・30万円、生成AI活用の例示）は受付状況が書かれておらず unknown
# 終了: 川崎市 生産性向上支援（予算到達）、川崎市 人手不足対策モデル（7/31）、相模原市 生産性向上（第2回事前申請 9/16）、相模原市 建設関連事業者生産性向上（10/16）、座間市 生産性向上設備導入（予算到達）
# 国の「デジタル化・AI導入補助金」（national.yml の digital-ai-donyu。7次は2026-12-01 17時締切）への上乗せ（addon）は 厚木市だけ（{kind: remaining, ratio: 0.5}。クラウド利用費は対象外）。平塚市 DX・川崎市・相模原市・綾瀬市・県の2制度は国・他の補助と同じ内容・経費での併用を認めない
# 独自の AI・IT 導入・研修の補助が見つからなかった市: 横浜市（2026年度は無料の講座・伴走支援だけ）・藤沢市・小田原市・茅ヶ崎市・逗子市・三浦市・南足柄市・伊勢原市（製造業の機械設備だけ）・大和市（自動化セミナー受講補助は詳細不明）（確認したページは subsidy_a_areas.md）

