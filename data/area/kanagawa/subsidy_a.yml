  targets: {efficiency: △, consulting: ×, training: ×}
  expenses: 生成AI等の活用の推進に必要な開発費等（別表1の範囲）。開発経費の一部と伴走支援（専門家マッチング、デザイン、メンター、知財、試作、技術連携、販路開拓）
  conditions: 県内に事業所がある中小企業支援法の中小企業者で、生成AIやデザイン等の専門家を構成員に含むグループ。令和8年度末までに生成AI等で生産性の向上・省人化に寄与するロボット等の製品化・試作品の完成か、新ビジネス・新サービスの開発・実装（試作モデルの完成）ができる者。KISTEC と代表企業が単年度の委託契約（終期2027-03-15）を結び、委託事業費は事業終了後の検査を経て代表企業に支払われ、代表企業が構成員に分配する。採択2件程度
  period: {status: closed, start: 2026-04-17, end: 2026-07-14}
  url: https://www.kistec.jp/connect/business/productization/next_design/
  checked: 2026-11-12
  confidence: official
  note: 募集要項 https://www.kistec.jp/connect/verbinden/wp-content/uploads/boshuu_proposal_01youkou_next_design_ai_2026.pdf （8ページ、PDF作成2026-04-08）p1「支援対象企業となる代表企業…に開発支援プロジェクトとして委託します」、p1 募集期間「支援テーマ（参加意思表明書）募集 令和８年４月17日（金）～ 令和８年５月７日（木）」「企画提案（プロポーザル）募集 令和８年６月15日（月）～ 令和８年７月14日（火）」、p2「プロジェクト終了後、産技総研が証拠書類等により内容を確認し、採択額を上限に代表企業に支払う」、p6「令和９年３月15日（月）を終期とする…単年度委託契約」。**補助金（交付）ではなく委託で、お金は県内の中小企業である代表企業に支払われる**（AI 事業者に交付される形ではない）。令和8年度の採択は3件（エニマス・リカザイ・スタックス、3社とも川崎市。2026-09-08 記者発表、cases.md）。AI ツールを買う費用の補助ではなく、生成AI を使った自社の製品・サービス・業務の開発が対象。max_yen はモデルAの上限＋デザイン加算
  fuenn_note: 神奈川県内の中小企業が専門家とグループを組み、生成AIで生産性向上や省人化につながる開発をするとき、県の研究所（KISTEC）が開発費（最大1,000万円）を委託費として負担する制度です。2026年度の募集は7月14日で終わり、3件が採択されました。

