  conditions: 久米島町に在住する者又は移住予定で勤務先が保証される者で、町内の事業所に雇用されドライバー（町営バス・観光バス・一次産業等）として5年以上継続して町内に居住・就業する意思がある者。年齢55歳以下。当該年度に雇用された者・雇用されている者・内定者。教育訓練給付制度を使って取得できる者は対象外（沖縄本島に指定講座がない場合を除く）。申請者は個人（事業者ではない）
