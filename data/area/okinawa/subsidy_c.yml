# 沖縄県の離島の13町村（伊江村・渡嘉敷村・座間味村・粟国村・渡名喜村・南大東村・北大東村・伊平屋村・伊是名村・久米島町・多良間村・竹富町・与那国町）の AI・IT・DX・研修・資格取得・店舗改善・創業・事業承継に使える町村独自の補助金（2026年度）。2026-11-06に13町村の公式サイトの事業者向けの分類ページ・商工担当課の記事一覧・計画の一覧を開いて確認（伊是名村はサイトがメンテナンス中で確かめられない）
# AI・生成AI・IT導入・DXを名指しした町村独自の補助金は、12町村とも見つからなかった（伊是名村は不明）
# 入れたのは、IT機器・通信・研修（資格取得）・事業に使える可能性がある一般の制度3件（久米島町・竹富町・与那国町）。いずれも AI・ITツールの名指しはなく、targets は △ にした
# 受付中: 竹富町 ブロードバンド加入促進補助金（町内の住宅・事業所の光回線の引込工事・衛星通信機材、最大3万円〔鳩間島・西表船浮地区は7万5千円〕、2026-04-01〜2027-03-15）、久米島町 離島交通課題対策事業補助金（町内事業所に雇われるドライバーの大型1種・2種免許、9/10、取得期間 2026-04-01〜2027-01-31、個人が申請）。終了: 与那国町 どぅなん活性化事業支援助成金（雇用創出の事業、上限100万円×2事業者、2026-05-01〜05-29）
# 入れなかったもの（subsidy_c_areas.md に書いた）: 伊平屋村 催事出店支援事業補助金（販路拡大の配送料・出店料・旅費）、座間味村 大型２種免許取得助成（村営バスの運転手の確保、村民が対象）、与那国町 どぅなんまちづくり活動支援助成金（団体のまちづくり活動）
# 国・県の補助金への上乗せ（addon）: 13町村とも見つからない
# 台風の災害の制度（県の融資の対象かどうか）は AI 導入の補助金とは別に subsidy_c_areas.md の「災害の制度」の節に書いた（町村独自の見舞金・融資は見つからない）
# 期間の status は data/subsidies/README.md の値（open / closed / rolling / unknown）を使う

