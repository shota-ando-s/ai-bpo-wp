  fuenn_note: 久米島町内の事業所でドライバーとして5年以上働く人が、大型1種・2種免許を合宿で取る費用・渡航費・宿泊費を9/10（免許取得費は最大45万円）補助してもらえる町の制度です。2027年1月31日までの取得が対象で、本人が申請します。

