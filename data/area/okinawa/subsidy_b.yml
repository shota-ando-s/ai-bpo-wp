# 沖縄県 本島の17町村（国頭村・大宜味村・東村・今帰仁村・本部町・恩納村・宜野座村・金武町・読谷村・嘉手納町・北谷町・北中城村・中城村・西原町・与那原町・南風原町・八重瀬町）の AI・IT・DX・研修・資格取得・店舗改善・創業に使える町村独自の補助金（2026年度）。2026-11-06に17町村の公式サイトの事業者向けの分類ページ・商工担当課の記事一覧を開いて確認（国頭村は WordPress の REST API で「補助金」「事業者」「DX」「デジタル」「AI」「商工会」「創業」「セミナー」も検索。ほかの16町村は分類ページを約220ページずつたどってリンクの題名を「補助」「助成」「支援金」「創業」「事業者」などで引いた）
# AI・生成AI・IT導入・DXを名指しした町村独自の補助金は、17町村とも見つからなかった
# 入れたのは、IT資格の取得にも使える可能性がある一般の制度1件（嘉手納町 雇用促進資格取得支援事業補助金）。事業者ではなく町内在住の求職者・非正規労働者・学生などの個人が申請する制度で、AI・デジタルの名指しはなく、targets は △ にした
# 国・県の補助金への上乗せ（addon）: 17町村とも該当なし。町村のサイトにある国の「中小企業省力化投資補助金」（北谷町・南風原町が案内）、県・ISCO の制度は町村の制度ではないので入れていない（subsidy_a の担当）
# 補助金ではない町村の支援: 特定創業支援事業（北谷町・西原町・八重瀬町・嘉手納町・南風原町など。登録免許税の軽減・創業関連保証の要件緩和）、北谷町 小規模事業者経営改善資金利子補給金（マル経の利子）、女性デジタル人材育成事業（嘉手納町 R8・与那原町 R6。個人向けの講座）は subsidy_b_areas.md に書いた
# 期間の status は data/subsidies/README.md の値（open / closed / rolling / unknown）を使う
# 町村ごとの確認したページ・制度がない町村は subsidy_b_areas.md

- id: okinawa-kadena-shikaku-shutoku
  name: 嘉手納町雇用促進資格取得支援事業補助金
  org: 嘉手納町（産業環境課 商工振興係）
  area: okinawa/kadena
  max_yen: 100000
  rate: 補助対象経費の総額の8割に相当する額または10万円のいずれか低い額（1,000円未満切り捨て）。1年度につき1人1回
  rate_num: 0.8
  targets: {efficiency: ×, consulting: ×, training: △}
  expenses: 講座等の受講費用および教材費用（1つの資格につき最短で取得できる回数分）、試験等の受験費用、資格の登録費用。対象資格は国家資格、職業能力開発促進法第44条の技能検定、その他国内で取得が可能な就業に有利と認められる資格等（いわゆる民間資格）。普通自動車免許等は対象外。試験のある資格は合格が条件。更新費用は対象外
  conditions: 町内に住所を有し、求職者（公共職業安定所を通じて求職活動をしている方）・非正規労働者・在学者（高校生以上）・学卒未就職者（学卒5年以内）のいずれか。事業者（雇用主）が申請する制度ではない。資格の取得後に申請（領収書・受験票の写しなど）
  period: {status: rolling}
  url: https://www.town.kadena.okinawa.jp/info/n6789.html
  checked: 2026-11-06
  confidence: official
  note: 町のページ（産業環境課、2025-06-11 掲載）。受付期間・締切の記載はなく、2026年度の予算・受付状況は書かれていない（rolling とした。予算の範囲かどうかも書かれていない）。交付規則は令和3年3月30日規則第14号（PDF は開いていない）。対象の民間資格に IT パスポート・生成AI の検定などが入るかは書かれていない。正社員の研修には使えない（非正規労働者は対象）
  fuenn_note: 嘉手納町に住む求職者・非正規で働く人・学生などが、就職に有利な資格の受講料・受験料を8割（最大10万円）補助してもらえる町の制度です。会社ではなく個人が申請し、試験のある資格は合格が条件です。
