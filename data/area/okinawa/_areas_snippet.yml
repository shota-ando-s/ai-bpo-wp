# 案（D34、2026-11-06 のデータ）。data/subsidies/areas.yml の末尾に足す沖縄県の部分。親が最後に areas.yml に入れる（data/subsidies/okinawa.yml〔案は data/area/okinawa/_subsidies_okinawa.yml〕と同じコミット。areas.yml は直接編集していない）
# none: true は _subsidies_okinawa.yml にその市町村の制度が1件もない36市町村。34は公式サイトの事業者向け・商工業のページ・商工担当課の記事一覧で確かめて見つからなかった市町村、伊是名村は公式サイトが2026-10-22からメンテナンス中で確かめられなかった村（note の一文目で「確かめられませんでした」と書いた。断定しない。広島県江田島市・熊本県玉名市・鹿児島県阿久根市と同じ）、久米島町は町の制度（大型免許の補助）を yml から外したので none にして note で触れた（判断 D4-5）
# 那覇市・与那国町は今年度の受付を終えた制度しかないが、yml に制度があるので none にせず、note の一文目で状況を書いた（岡山県玉野市・鹿児島県霧島市と同じ）。うるま市（受付中）・嘉手納町（随時、個人向け）・竹富町（受付中、通信回線）も none なし（5市町）
# 並びは県 統計課の推計人口の地域区分（北部・中部・南部・宮古・八重山の5区分。spec/D1.md の「県の地域区分」と同じ）の順。区分の中は市（自治体コード順）→ 町村（自治体コード順）。伊平屋村・伊是名村は島尻郡だが北部、浦添市・西原町は中部
# none の callout は「AI・IT導入向けの独自の補助金が見つかりませんでした」と出るので、none の note は確かめ方・相談先（商工会議所・商工会は gov_ai.md の名簿〔日本商工会議所・全国商工会連合会〕）・取り違えの注意を書く
# 「無料」と書いたのは資料に無料とあるものだけ: 沖縄県よろず支援拠点（拠点のサイト「国（中小企業庁）が全国に設置している 無料の経営相談所 です。」、098-851-8460）。商工会のない粟国村・渡名喜村・北大東村・多良間村と、サイトを確かめられない伊是名村の note にだけ入れた（県域の窓口は県ページと記事本文の H2 9 で書く）
# 取り違えの注意: 沖縄市（okinawa-city）は沖縄県と別、西原町（nishihara-town、中頭郡）は熊本県西原村と別、東村（higashi-village、国頭郡）、を note に入れた。竹富町商工会の事務所は石垣市美崎町（町役場と同じ番地）にある
# 市の制度（那覇市・うるま市）は市内に事業所がある事業者が対象で、近くの町村の事業者は使えない。県の制度（プロフェッショナル人材確保支援）は okinawa の行で全地域に出るので、市町村の note には書いていない
# 台風（第13号・第18号・9月5日大雨と第26号・第30号）の県のセーフティネット資金（融資）は note に入れない（AI 導入の補助ではない。docs の【D4】「災害の制度」）
