# 福井県 8町（永平寺町・池田町・南越前町・越前町〔丹生郡〕・美浜町・高浜町・おおい町・若狭町）2026年度
# 確認日 2026-10-27。根拠は subsidy_b_areas.md
# 生成AI・AI導入・AI研修を名指しで補助する町独自の制度は、8町とも確認できなかった
# IT・デジタル化に使える町独自の制度
#   - 永平寺町 小規模事業者経営支援事業補助金のDXツール導入（受発注システム・キャッシュレス・顧客管理システムなど。チラシの例はキャッシュレス決済端末・POSレジ・クラウド会計ソフト・受発注管理ツール）。1/2・上限5万円。町が永平寺町商工会に補助し、商工会が事業者に給付する仕組み（要綱 令和8年4月1日告示第74号）。財源は国の物価高騰対応重点支援地方創生臨時交付金。募集期限は9/30から2026-11-30に延長、事業期間は2027-01-29まで（受付中、予算に達し次第終了）。月額利用料が対象かは書かれていない
#   - 永平寺町 チャレンジ企業支援事業補助金（新商品・新製品の開発。対象経費に「機械設備等（パソコン等の事務機器を含む。）の購入及びリース料」「職員研修費」。対象経費60万円以上、1/2・上限50万〜100万円）。例規集の要綱だけで、町の募集ページは見つからず、受付状況は分からない（unknown）
# 国の補助金への上乗せ（addon）: 該当なし。国のデジタル化・AI導入補助金・省力化投資補助金・ものづくり補助金・人材開発支援助成金・業務改善助成金に町が上乗せする制度は8町とも見つからない。池田町・越前町・美浜町・高浜町・若狭町のページは国の「賃上げ」支援助成金パッケージ（業務改善助成金など）や人材開発支援助成金の案内だけで、町の上乗せはない
# 創業向けで、設備・備品・HP作成などが対象になる制度（YAMLに入れた）: 美浜町（2/3・上限200万円、HP作成費・機械器具の借用も対象。原則4〜9月提出で今年度は終了）、高浜町（2/3〜1/2・最大200万円、汎用性のある機械装置は除く。第3回は10〜11月）、おおい町（2/3・上限500万円、令和8年度の下期は9/30で終了）、南越前町（2/3・上限150万円、店舗の工事と備品）。どれもソフトウェア・クラウドサービスが対象になるかは書かれていない
# 研修: 既存の事業者の研修費を補助する町独自の制度は8町とも見つからない（永平寺町のチャレンジ企業支援事業の「商品開発等に係る職員研修費」だけ）。高浜町商工会・おおい町商工会は2026年度に無料・少人数の生成AI活用セミナーを開いた（補助金ではない。subsidy_b_areas.md に記載）
# 原子力発電所の立地に関係する制度: 町独自の事業者向け補助で財源に電源立地地域対策交付金と書かれたものは見つからない。県の「原子力発電施設等周辺地域企業立地支援給付金」（電気料金の約半額相当の給付）などは AI 導入向けではないため YAML に入れず、subsidy_b_areas.md に事実だけ書いた
# 県の制度・県域の機関（FISC など）・国の制度は別担当（subsidy_a）のため入れていない。融資・利子補給・信用保証・企業立地助成・空き工場・空き店舗・新商品開発（お土産品）・販路開拓（見本市・EC出店）・ふるさと納税返礼品・キャッシュレス端末（南越前町の平成29年の要綱）・中退共は YAML に入れていない（subsidy_b_areas.md の「IT向けではない制度」に記した）
# 期間の status は data/subsidies/README.md の値（open / closed / rolling / unknown）

