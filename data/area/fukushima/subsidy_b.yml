# 福島県 県北・県中・県南の13町8村（桑折・国見・川俣・大玉・鏡石・天栄・石川・玉川・平田・浅川・古殿・三春・小野・西郷・泉崎・中島・矢吹・棚倉・矢祭・塙・鮫川）2026年度
# 確認日 2026-10-24。根拠は subsidy_b_areas.md
# 生成AI・AI導入・AI研修を名指しで補助する町村独自の制度は、21町村とも確認できなかった
# IT・デジタル化に使える町村独自の制度
#   - 国見町 中小企業・小規模企業振興事業補助金（3メニュー。設備投資支援＝専用ソフトウェア・情報システムの購入・構築費 上限50万円、魅力発信支援＝自社ホームページ制作費・ソフトウェア等の登録料と使用料・WEB/SNS広告費 上限30万円、人材育成支援＝公的団体等の研修受講・研修開催 上限10万円。いずれも2/3、全額を町内企業に発注すると3/4。申請期間は2027-01-28まで、予算到達で終了）
#   - 川俣町 商工業事業者未来投資補助金（「生産性の向上又は業務の効率化に向けてデジタル技術を活用した取組」・人材育成など6事業。ソフトウエア購入費・コンサルタント費・受講料など。4/5・上限100万円。申請期間2026-09-01〜09-30で終了）
# 国の補助金への上乗せ: 天栄村 小規模事業者持続化補助金（国の持続化補助金〔一般型〕の交付を受けた事業の自己負担額の1/2・上限10万円）。持続化補助金は national.yml に未登録のため addon・addon_to は書いていない。ページは2024-08-19更新のまま（status: unknown）
# 川俣町の未来投資補助金は、国・県等の補助金を受ける場合は経費からその額を差し引く（要綱第4条2項）。国のデジタル化・AI導入補助金と併用すれば（経費−国の補助額）×4/5 の形になるが、併用を明記した文言はなく、受付も終わっているため addon は書いていない
# 西郷村 中小企業課題解決アドバイザー活用支援事業は、国の事業再構築補助金・ものづくり補助金の申請のための事業計画の策定費（専門家謝金・コンサルティング費）を補助する。DX・GXを踏まえた計画は上乗せ枠あり。国の補助金の補助額への上乗せではないので addon にしていない
# 国のデジタル化・AI導入補助金（旧IT導入補助金）・中小企業省力化投資補助金に町村が上乗せする制度は、21町村とも確認できなかった。県の制度（生産性向上推進事業補助金・いきいき支援事業・業務改善応援補助金など）に町村が上乗せする制度も確認できなかった（西郷村は県の業務改善応援補助金の案内ページを出しているだけ）
# 創業向けで、備品・テレワーク設備・委託料などが対象になる制度: 矢吹町（随時）、棚倉町（2023年のページ）、鮫川村（2025年のページ）、玉川村（2024年のページ、店舗中心）
# 浅川町は公式サイトが2026-10-24に503で開けず、Internet Archive（2026-08-31版の「商工業関連」）でも先端設備導入計画のページしかなかった。「ない」とは断定せず「確認しきれていない」
# 福島県の制度・県域の機関（福島県産業振興センターなど）・国の制度は別担当（subsidy_a）のため入れていない。融資・利子補給・保証料補給・企業立地の奨励金・雇用の奨励金・物価高騰対策の支援金・空き店舗の家賃や改装費・店舗改良工事・イベント・6次化・移住支援金・個人向けの資格取得助成は YAML に入れていない（subsidy_b_areas.md の「IT向けではない制度」に記した）
# 期間の status は data/subsidies/README.md の値（open / closed / rolling / unknown）

