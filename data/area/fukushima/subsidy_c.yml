# 福島県 会津・南会津の15町村（下郷・檜枝岐・只見・南会津・北塩原・西会津・磐梯・猪苗代・会津坂下・湯川・柳津・三島・金山・昭和・会津美里）と相双の10町村（広野・楢葉・富岡・川内・大熊・双葉・浪江・葛尾・新地・飯舘）2026年度
# 確認日 2026-10-24。根拠は subsidy_c_areas.md
# 生成AI・AI導入・AI研修を名指しで補助する町村独自の制度は、25町村とも確認できなかった
# パソコン・ソフトウェアを対象経費に明記している町村の制度
#   - 柳津町 小規模事業者後継者支援事業補助金（商工会員の小規模事業所の50歳までの後継者。簿記等のPCソフト・ハード機器、研修会経費の全額・上限30万円。出典は町の「令和8年度 助成金及び補助金交付金一覧表」）
#   - 大熊町 創業・本社機能移転促進補助金（業務用パソコンの調達費を含む。10/10・200万〜500万円。福島イノベーション・コースト構想の重点分野か F-REI の研究開発分野の事業に限る）
#   - 南会津町 経営拡大支援事業補助金の新商品開発事業（「システム構築費等」を含む。1/2・20万円）
# ホームページ作成に使える町村独自の制度: 檜枝岐村 民間事業者広告支援事業補助金（5万円を超える部分の3/4・上限30万円。受付期間は回覧で周知）、会津坂下町 新事業創出支援補助金（インターネットを使った販路開拓など 10/10・10万円。記載例は「商品PR用WEBページ作成委託費」）、会津美里町 小規模事業者持続的経営発達支援事業補助金（国の持続化補助金の不採択者向け。ウェブサイト関連費を含む 1/2・40万円）
# 研修費に使える町村独自の制度: 柳津町（後継者の研修会経費。上記）、会津美里町（公的機関の研修 1/2・年5万円）、会津坂下町（特定創業支援事業の研修等の受講料 1/2・1万円）、大熊町 就労サポート補助金（eラーニング・外部研修の受講料、研修開催の専門家謝金 1/2・200万円。自立・帰還支援雇用創出企業立地補助金の交付決定を受けた事業者に限る）、飯舘村（はじめるサポートの資格取得の受講料）
# 国の補助金への上乗せ（addon）は、25町村とも確認できなかった。会津美里町の持続的経営発達支援事業は国の小規模事業者持続化補助金に「不採択」となった事業者向けで、上乗せではない（持続化補助金は national.yml にもない）。県の中小企業等生産性向上推進事業補助金・業務改善応援補助金に町村が上乗せする制度も見つからない
# 相双の町村の事業再開・創業向けの町独自の制度（富岡町の事業再開支援・創業事業展開支援、大熊町の創業・本社機能移転促進）は、富岡町の2つは建物・設備・備品の経費に限られソフトウェア・研修の区分がない。大熊町は業務用パソコンが対象
# 町村のページに受付期間の記載がなく「事業着手前に申請」「予算の範囲内」とある制度は period.status を rolling にした。ページの更新日が2025年度以前で2026年度の実施をページから判断できない制度、町のページに案内がなく例規集だけで確認した制度は unknown にした
# 県の制度（生産性向上推進事業補助金・業務改善応援補助金・原子力被災事業者事業再開等支援補助金・創業促進・企業誘致に向けた設備投資等支援補助金・12市町村起業支援金など）・国の制度・福島相双復興推進機構の支援は入れていない（subsidy_c_areas.md に事実だけ書いた）。融資・利子補給・企業立地の奨励金・雇用の奨励金・光熱水費の補助・物価高騰対策・個人向けの資格取得助成・ドローン/除雪の資格補助は YAML に入れていない（subsidy_c_areas.md の「IT向けではない制度」に記した）

