# 秋田県（県・公益財団法人あきた企業活性化センター・秋田県中小企業団体中央会）と秋田市・能代市・横手市・大館市・男鹿市・湯沢市・鹿角市・由利本荘市・潟上市・大仙市・北秋田市・にかほ市・仙北市（2026年度）。2026-10-18に公式ページ・実施要領・交付要綱・Q&Aで確認
# 県域の産業支援機関は「あきた産業振興機構」ではなく「公益財団法人あきた企業活性化センター」（秋田市山王三丁目1-1、018-860-5610）。センターの令和8年度の補助金は海外出願支援とあきた農商工応援ファンド（農林漁業者との連携による新商品開発）だけで、AI・IT導入向けはない（subsidy_a_areas.md）
# 中央会の助成事業は組合向け（組合等情報ネットワークシステム等開発事業など全国中央会の事業）で、1社で申請できるAI・IT導入の補助金はない
# 男鹿市・仙北市は市独自のAI・IT・研修向け補助金なし（仙北市は市の「産業」ページから制度のページを開くと「指定されたデータがありません」で、内容を確認できなかった）
# 国のデジタル化・AI導入補助金に県・市が上乗せする制度は見つからない。県のデジタル化補助金は「国又は県の他の補助金等の採択を受けていないこと」が要件、秋田市は同様の目的の補助金と併用不可、北秋田市は国・県の補助分を経費から引く方式（上乗せではない）
# 21件すべて confidence: official（県の食のリーディングカンパニー育成支援事業だけは今年度の募集ページが開けず、県の「令和8年度 中小企業等支援施策の手引き」で確認。status: unknown）
# 期間の status は data/subsidies/README.md の値（open / closed / rolling / unknown）を使う。随時受付は rolling

