# 秋田県内9町3村（小坂・三種・八峰・五城目・八郎潟・井川・美郷・羽後・藤里・上小阿仁・大潟・東成瀬）2026年度
# 確認日 2026-10-18。根拠は subsidy_b_areas.md
# 国の「デジタル化・AI導入補助金」（旧IT導入補助金）・「中小企業省力化投資補助金」に町村が上乗せする制度は、12町村とも確認できなかった（addon の制度なし）
# 既存の中小企業が生産性向上・DX・デジタル化に使える町村独自の制度を確認できたのは次の5町村
#   - 東成瀬村 地域経済活性化事業補助金の経営革新事業（「生産性向上のためのＤＸ導入等」。1/2・上限50万円。インバウンド対策等支援事業は電子決済システム・無線LANの導入等で1/2・上限25万円）。令和8年7月1日の新制度
#   - 美郷町 中小企業持続化支援事業補助金（高効率化・省力化・省エネ設備。町の令和8年度版まちづくりガイドに「生産・工程管理システム」が例示。1/2・上限300万円）
#   - 八峰町 生産性向上等支援補助金（生産・作業に直接かかわる設備・機械。事務用機器は対象外。15%・上限30万円、新規事業は30%・上限100万円。後期の申込は2026-10-01〜10-30）
#   - 三種町 地域雇用創出推進事業の機械設備投資事業（新たな雇用が見込まれること。営業車両・事務用機器は対象外。30%・上限100万円）
#   - 美郷町 インターネット販売販路開拓支援事業補助金（自社ホームページ・ネット販売システムの開設委託費。2/3・上限20万円）、上小阿仁村 事業者等支援事業費補助金（ECサイト事業を含む。2/3・上限30万円、令和7年度の一覧で確認）
# 研修・資格取得の費用を事業所が申請できる町の制度: 小坂町・三種町・八峰町の資格取得支援事業（いずれも1/2・1人上限10万円。対象資格一覧に「情報処理技術者」がある）。藤里町・美郷町・上小阿仁村の資格取得支援は個人が申請する制度（YAMLに入れず subsidy_b_areas.md に記載）
# 外部専門家・コンサルタントの費用を対象にするのは小坂町（創業チャレンジ）、八峰町（雇用創出活動支援の創業支援費）、井川町（創業等チャレンジ）、大潟村（創業サポートの技術コンサルタント料）、東成瀬村（専門家等への謝金）
# 創業向けの制度は12町村すべてで確認した（羽後町は新事業展開助成金、上小阿仁村は地域おこし協力隊の定住支援の中の起業・事業承継支援だけ）
# 町村のサイトに日付・年度の記載がない、またはページが前年度以前のままで2026年度の受付をページから判断できない制度は period.status を unknown にした（要綱・募集ページは公式なので confidence は official）
# status の rolling は、2026年度のページ・一覧・ガイドで実施が確認でき、締切の記載がないもの（随時受付・予算の範囲内）。open の end はページに締切日がある場合はその日
# 秋田県の制度（中小企業デジタル化導入支援事業費補助金など）と国の制度は別担当のため入れていない

