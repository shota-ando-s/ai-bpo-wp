# 案（D34、2026-11-04）。data/subsidies/areas.yml の末尾に足す佐賀県の部分。親が最後に areas.yml に入れる（data/subsidies/saga.yml〔案は data/area/saga/_subsidies_saga.yml〕と同じコミット。areas.yml は直接編集していない）
# none: true は _subsidies_saga.yml にその市町の制度が1件もない16市町（鳥栖市・多久市・武雄市・鹿島市・小城市・嬉野市・神埼市と、吉野ヶ里町・上峰町・みやき町・玄海町・有田町・大町町・江北町・白石町・太良町）。佐賀市・唐津市・伊万里市・基山町は制度があるので none にしない（佐賀市は受付中の働きがい×企業力アップがある）
# 並びは県の保健福祉事務所の5区分（stats.md の region_hoken。厚生労働省「保健所所管区域案内 佐賀県」）の順: 佐賀中部（5）→ 鳥栖（4）→ 唐津（2）→ 伊万里（2）→ 杵藤（7）。区分の中は市（自治体コード順）→ 町（自治体コード順）。判断 D4-6
# 10市は市の商工担当課の記事一覧・事業者向けの分類ページ（subsidy_a_areas.md。鹿島市は D34 が www.city.saga-kashima.lg.jp で 2026-11-04 に確認）、10町は町のサイトの事業者向けページ・商工担当課の記事一覧（subsidy_b_areas.md）を開いて確かめた。県の補助制度一覧だけでは判断していない
# none の callout は「AI・IT導入向けの独自の補助金が見つかりませんでした」と出るので、none の note は確かめ方・相談先（商工会議所・商工会は gov_ai.md の対応表）・無料と資料にある窓口・取り違えの注意を書く
# 「無料」と書いたのは資料に無料とあるものだけ: 佐賀県よろず支援拠点（拠点のサイト「無料で、何度でも」）、みやき町サテライト（町のページ「費用: 無料」）、鳥栖市産業支援相談室〔鳥栖ビズ〕（市のページ「無料で行います」、D34確認）。佐賀県産業スマート化センター・かしまビジネスサポートセンターは無料の記載がない＝無料と書かない
# 佐賀市（saga-city）は佐賀県と別、大町町（omachi-town）は長野県大町市と別、白石町（shiroishi-town）は宮城県白石市と別、鹿島市は茨城県鹿嶋市と別、鳥栖市は鳥取県と別、の注意を note に入れた
# 市の制度（佐賀市・唐津市・伊万里市）は市内に本店・事業所がある事業者が対象＝近くの町（玄海町・有田町など）の note に入れた
- code: saga
  name: 佐賀県
  cities:
    - {code: saga/saga-city, name: 佐賀市, note: 市内に本店がある中小企業向けの働きがい×企業力アップ支援事業補助金は、1年目に専門家の伴走で計画を作る費用（研修を含む）を2/3（上限160万円）、2年目にその計画にもとづくデジタル技術の導入などを1/2（DX認定で2/3、上限150万円）補助する2年間の制度で、受付中です（2026-11-04確認。支援件数6件、予算に達し次第終了、事前に市の経済政策課に相談）。AIを活用した業務の自動化などに1/2（上限50万円）を補助したデジタル技術導入支援事業補助金は、2026年度は予算に達して受付を終えました。佐賀県の制度とは別の、佐賀市の制度です}
    - {code: saga/taku, name: 多久市, none: true, note: 市の産業振興・商工業のページで確かめた範囲で、市独自のAI・IT導入や研修の補助金は見つかりませんでした（2026-11-04確認）。多久市商工会か市の商工観光課に確認してください。佐賀県よろず支援拠点（無料の経営相談）も使えます}
    - {code: saga/ogi, name: 小城市, none: true, note: 市の事業者向け情報・商業・工業のページで確かめた範囲で、市独自のAI・IT導入や研修の補助金は見つかりませんでした（2026-11-04確認）。小城商工会議所・小城市商工会（牛津・芦刈）か市の商工観光課に確認してください。佐賀県よろず支援拠点の小城サテライトもあります}
    - {code: saga/kanzaki, name: 神埼市, none: true, note: 市の事業者の方へのページと商工振興係のお知らせで確かめた範囲で、市独自のAI・IT導入や研修の補助金は見つかりませんでした（2026-11-04確認）。神埼市商工会か市役所の商工振興係に確認してください}
    - {code: saga/yoshinogari, name: 吉野ヶ里町, none: true, note: 町の商工観光課の商工業のページで確かめた範囲で、町独自のAI・IT導入や研修の補助金は見つかりませんでした（2026-11-04確認）。吉野ヶ里町商工会か町の商工観光課に確認してください}
    - {code: saga/tosu, name: 鳥栖市, none: true, note: 市のビジネス・産業と商工観光課のページで確かめた範囲で、市独自のAI・IT導入や研修の補助金は見つかりませんでした（2026-11-04確認）。鳥栖市産業支援相談室（鳥栖ビズ、サンメッセ鳥栖1階）が中小企業の経営課題の相談を無料で受けています（市のページ）。鳥栖商工会議所か市の商工観光課も相談先です。佐賀県鳥栖市で、鳥取県とは別です}
    - {code: saga/kiyama, name: 基山町, note: 基山町経営革新計画推進補助金は、佐賀県の承認を受けた経営革新計画にもとづく新しい取組の費用を2/3（上限40万円）補助し、事業を始める前に申請します（2026-11-04確認。受付期間の記載はなく、予算の範囲内）。AI・ITの名指しはなく、計画の承認が前提です。基山町商工会か町の商工観光課 商工係に確認してください}
    - {code: saga/kamimine, name: 上峰町, none: true, note: 町の事業者向け・商工業のページで確かめた範囲で、町独自のAI・IT導入や研修の補助金は見つかりませんでした（2026-11-04確認。一覧は新着の数件だけの表示）。上峰町商工会か町の産業課に確認してください}
    - {code: saga/miyaki, name: みやき町, none: true, note: 町の産業支援課・商工業のページで確かめた範囲で、町独自のAI・IT導入や研修の補助金は見つかりませんでした（2026-11-04確認。ブランド戦略促進事業補助金は自社ブランド商品の販売促進向けです）。町役場三根庁舎で毎週木曜日に佐賀県よろず支援拠点のサテライト（無料の経営相談、予約制）があります。みやき町商工会か町の産業支援課にも確認してください}
    - {code: saga/karatsu, name: 唐津市, note: 唐津市中小企業等活性化支援事業補助金（経営力強化分 DX枠）は、業務改善ツールや在庫管理システムなどのDXの費用（30万円以上）を1/2（上限50万円）補助し、二次募集を2026-12-28まで受け付けています（2026-11-04確認。予算に達し次第終了）。事前に唐津商工会議所・唐津東商工会・唐津上場商工会か中小企業診断士に事業計画を相談し、商工団体の会員であることが要件です。市の商工振興課に確認してください}
    - {code: saga/genkai, name: 玄海町, none: true, note: 町の企業・事業者向けのページで確かめた範囲で、町独自のAI・IT導入や研修の補助金は見つかりませんでした（2026-11-04確認）。唐津市の補助金は唐津市内に本店・事業所がある事業者が対象です。唐津上場商工会（玄海町の経営支援センター）か町の企画商工課に確認してください}
    - {code: saga/imari, name: 伊万里市, note: 伊万里市中小企業DX・GX支援事業費補助金は、AIを使った文書作成・問合せ対応・業務自動化ツールなどのITツールの導入費（ソフトウェアの導入が必須）か、専門家の伴走でDXを検討する費用を2/3（上限50万円）補助し、2026-11-30まで受け付けています（2026-11-04確認。予算は残りわずかで、予算に達し次第終了）。市の企業誘致・商工振興課か伊万里商工会議所に確認してください}
    - {code: saga/arita, name: 有田町, none: true, note: 町の事業者支援・商工業のページで確かめた範囲で、町独自のAI・IT導入や研修の補助金は見つかりませんでした（2026-11-04確認）。伊万里市の補助金は伊万里市内に店舗・事業所がある事業者が対象です。有田商工会議所か町の商工観光課に確認してください。佐賀県よろず支援拠点の有田サテライトもあります}
    - {code: saga/takeo, name: 武雄市, none: true, note: 市の事業者向け・商工のページで確かめた範囲で、市独自のAI・IT導入や研修の補助金は見つかりませんでした（2026-11-04確認）。武雄商工会議所・武雄市商工会（山内・北方）に確認してください。佐賀県よろず支援拠点の武雄サテライトもあります}
    - {code: saga/kashima, name: 鹿島市, none: true, note: 市の事業者の方へ・商工業・産業振興のページで確かめた範囲で、市独自のAI・IT導入や研修の補助金は見つかりませんでした（2026-11-04確認。産業振興の補助金は特産品開発・販路拡大向けです）。鹿島商工会議所、かしまビジネスサポートセンター（鹿島商工会館1階、予約制）か市の商工観光課に確認してください。佐賀県鹿島市で、茨城県鹿嶋市とは別です}
    - {code: saga/ureshino, name: 嬉野市, none: true, note: 市の産業・ビジネス、商工業のページで確かめた範囲で、市独自のAI・IT導入や研修の補助金は見つかりませんでした（2026-11-04確認）。嬉野市商工会に確認してください。佐賀県よろず支援拠点の嬉野サテライトもあります}
    - {code: saga/omachi-town, name: 大町町, none: true, note: 町の商工業・起業支援のページで確かめた範囲で、町独自のAI・IT導入や研修の補助金は見つかりませんでした（2026-11-04確認）。大町町商工会か町役場の商工観光・広報統計係に確認してください。佐賀県杵島郡の大町町で、長野県大町市とは別です}
    - {code: saga/kohoku, name: 江北町, none: true, note: 町の企業誘致・支援・補助金のページで確かめた範囲で、町独自のAI・IT導入や研修の補助金は見つかりませんでした（2026-11-04確認）。江北町商工会か町の地域づくり課に確認してください}
    - {code: saga/shiroishi-town, name: 白石町, none: true, note: 町の商工関係のページで確かめた範囲で、町独自のAI・IT導入や研修の補助金は見つかりませんでした（2026-11-04確認）。白石町商工会か町の商工観光課に確認してください。佐賀県杵島郡の白石町で、宮城県白石市とは別です}
    - {code: saga/tara, name: 太良町, none: true, note: 町の企業融資・支援のページで確かめた範囲で、町独自のAI・IT導入や研修の補助金は見つかりませんでした（2026-11-04確認。販路開拓の展示会・商談会の出展補助はあります）。太良町商工会か町の商工観光課に確認してください}
