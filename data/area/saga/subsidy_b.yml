  conditions: 町内に本店を置く中小企業者又は町内に住民登録を行っている個人事業主で、佐賀県から経営革新計画の承認を受けた者。町税等の滞納がないこと。同一事業で国・県・他の補助金を受けていないこと。過去にこの要綱で補助を受けたことがないこと。事業着手前に交付申請（交付決定後に着手・支払）。予算の範囲内
