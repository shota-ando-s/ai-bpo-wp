# 案（D34、2026-11-04）。data/subsidies/saga.yml の案。data/area/saga/subsidy_a.yml（県・県域の機関と10市、14制度）と subsidy_b.yml（10町、1制度）を結合した15制度。親が areas.yml の佐賀県の行（_areas_snippet.yml）と同じコミットで data/subsidies/saga.yml として入れる（data/subsidies/ と areas.yml は編集していない）
# 【下書き】D34 の案の直しを入れてある（各制度の「# 案」のコメント）。親が決めたら「# 案」の行を消す
# 状況の内訳（2026-11-04）: open 4（県「第2弾」業務改善サポート〔2027-02-17、原則先着〕、佐賀市 働きがい×企業力アップ〔締切の記載なし、6件〕、唐津市 活性化 DX枠〔2026-12-28〕、伊万里市 DX・GX〔2026-11-30、残りわずか〕）・rolling 2（県 半導体人材育成〔さが半導体フォーラム会員〕、基山町 経営革新計画推進〔県の経営革新計画の承認が前提〕）・closed 9（県 第8弾生産性向上〔10/23〕・きらめく生産性改善・高度化〔5/22〕・NEXTものづくり〔4/22〕・クリエイティブコネクト〔10/30〕・建設DX〔9/30〕・物流業〔9/14〕・介護テクノロジー〔6/22〕、佐賀市 デジタル技術導入〔予算到達〕・働きやすさアップ〔5/18〕）・unknown 0。closed はどれも next_expected なし＝診断に出ない（来年度の見込みは書かない）
# AI を名指し（チラシの例）した制度: 伊万里市 DX・GX（受付中、11/30）、佐賀市 デジタル技術導入（終了）。県に AI を名指しした補助金はない
# 国の業務改善助成金への県の上乗せ（「第2弾」業務改善サポート）は、national.yml に業務改善助成金がないので addon にしない。単独の制度として rate_num 0.2・efficiency △（判断 D4-1。福井県 fukui-gyomukaizen-chinage の扱いに近い）。shindan.js・README の変更は要らない
# 結果として（案の直しのあと）、efficiency の「今年度に使える組み合わせ」が出るのは伊万里市（DX・GX ◎、2/3・50万円）と唐津市（DX枠 ○、1/2・50万円、対象経費30万円以上）だけ。ほかの18地域と「上記以外」は出ない（国のデジタル化・AI導入補助金は fuenn_available_from 2027-04 で「来年度」）
# 制度が1件もない16市町（鳥栖市・多久市・武雄市・鹿島市・小城市・嬉野市・神埼市と、基山町を除く9町）は areas.yml で none: true（_areas_snippet.yml）。鹿島市は D34 が正しいドメインで分類ページを見た（上の追記）
# id は saga- / karatsu- / imari- / kiyama- の接頭辞（既存の data/subsidies/*.yml と重複しないことを作業用コピーの build で確認）。area は saga と saga/<slug>（佐賀市は saga/saga-city、大町町は saga/omachi-town、白石町は saga/shiroishi-town）
# 電源立地・原子力関係の給付金・企業立地支援（県・唐津市・玄海町）と災害の制度は入れていない
#
# 以下は data/area/saga/subsidy_a.yml の冒頭のコメントと制度
# 佐賀県（県・公益財団法人佐賀県産業振興機構〔佐賀県産業イノベーションセンター〕・佐賀県産業スマート化センターほか）と10市（2026年度）。2026-11-04に県の公式ページ・交付要綱・公募要領、県の「佐賀県の補助制度一覧を掲載します」（令和8年度当初予算にもとづく一覧、2026-04-20更新）https://www.pref.saga.lg.jp/kiji00374164/index.html 、産業振興機構のお知らせ一覧（https://sagaperch.jp/news/ 、2026-11-02掲載分まで）、佐賀県産業スマート化センターの「デジタル関連補助金」https://www.saga-smart.jp/subsidy/ 、市の公式ページ（商工担当課の記事一覧）で確認
# 県で今申請できるのは「第2弾」佐賀県業務改善サポート補助金（国の業務改善助成金を受けた県内中小企業に、国の助成対象経費の1/5または1/4を上乗せ、上限200万円、2026-04-01〜2027-02-17・原則先着順）だけ。国の業務改善助成金（佐賀労働局）の令和8年度の申請期限は2026-11-13（太良町のページ）で、これから国に申請する事業者は間に合いにくい
# 県で「デジタル」を対象に入れた中小企業向けの補助（第8弾 佐賀県中小企業生産性向上支援補助金〔デジタル技術等を活用した業務改善、2/3・最大200万円〔10%以上の賃上げで400万円〕〕は 9/25〜10/23 で終了）、製造業向け（さが「きらめく」ものづくり産業創生応援事業 生産性改善・高度化補助金 2/3・500万円、NEXT佐賀ものづくり投資促進事業費補助金 2/3・2,500万〜5,000万円）、建設業（建設DX加速化）・物流業（物流業生産性向上支援）・介護（介護テクノロジー定着支援）の業種別の補助は、いずれも2026年度の受付を終えている
# 事例担当からの手がかり「中小企業DXフラッグシップモデル創出事業」「DXアクセラレータ事業」は、県・機構・スマート化センターのサイトで2026年度の募集を見つけられなかった。スマート化センターのお知らせは「R7年度アクセラレータ事業の事例を公開」「令和7年度DX伴走支援事業」の事例公開だけ。令和8年度は「DX伴走支援事業『ハンズオン』」（主催 佐賀県・佐賀県産業振興機構 さが産業ミライ創造ベース、運営 株式会社BottoK、6か月の伴走、公募説明会 2026-05-29、選考結果 7月上旬）で、補助金ではなく、募集も終わっている（subsidy_a_areas.md）
# 市でAIを名指ししているのは、伊万里市 中小企業DX・GX支援事業費補助金（チラシの例に「ＡＩを活用した文書作成・問合せ対応・業務自動化ツールの導入」、2/3・上限50万円、〜2026-11-30・残りわずか）と、佐賀市 デジタル技術導入支援事業補助金（チラシの例に「AIを活用した業務の自動化」、1/2・50万円、予算到達で受付終了）。唐津市 中小企業等活性化支援事業補助金（経営力強化分 DX枠 1/2・50万円、〜2026-12-28）も受付中
# 市独自のAI・IT導入・研修向けの補助が見つからない市: 鳥栖市・多久市・武雄市・小城市・嬉野市・神埼市。鹿島市は公式サイトが curl で接続リセット、WebFetch で 503 になり確かめられなかった（「制度なし」と断定しない）。詳細は subsidy_a_areas.md
#   → D34 追記（2026-11-04）: subsidy が開いたのは www.city.kashima.saga.jp で、鹿島市の公式サイトは https://www.city.saga-kashima.lg.jp/ （gov も使ったドメイン）。こちらは curl で開けた。「事業者の方へ」「商工業」「産業振興」の分類ページで見た範囲では、市独自のAI・IT導入・研修の補助は見つからなかった（商工業: 企業誘致・事業承継・融資・空き店舗対策・先端設備等導入計画・かしまビジネスサポートセンター。産業振興の「補助金（特産品開発・販路拡大）」は地域資源活用販路拡大支援事業補助金・ふるさと納税返礼品開発等支援事業費補助金の2件〔WebFetch〕）
# 国の補助金への上乗せ: 県の「第2弾」業務改善サポート補助金は国の業務改善助成金への上乗せ（率は国の助成率で 1/5 か 1/4）。national.yml に業務改善助成金の項目がないため addon・addon_to は書いていない（rate_num も書かない）。国のデジタル化・AI導入補助金・省力化投資補助金・ものづくり補助金への県・10市の上乗せは見つからない
# 電源立地地域対策交付金・原子力発電施設等周辺地域の給付金・企業立地支援（県・唐津市・玄海町）、災害の制度は、AI導入の補助金に入れていない（名前だけ subsidy_a_areas.md）
