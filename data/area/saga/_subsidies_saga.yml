# 以下は data/area/saga/subsidy_b.yml の冒頭のコメントと制度
# 佐賀県の10町（吉野ヶ里町・基山町・上峰町・みやき町・玄海町・有田町・大町町・江北町・白石町・太良町）の AI・IT・DX・研修向けの補助金（2026年度）。2026-11-04に各町の公式サイトの事業者向けの分類ページと商工担当課（商工観光課・産業支援課・情報未来課・企業誘致商工振興課など）の記事一覧を開き、補助・助成・支援の名前の記事は本文を確かめた。県の「佐賀県の補助制度一覧」・佐賀県産業スマート化センターの「デジタル関連補助金」とも照らした（県の一覧だけでは判断していない）
# AI・生成AI・IT導入・研修を名指しで補助する町独自の制度は10町とも見つからなかった。ここに入れたのは基山町の経営革新計画推進補助金だけで、県の経営革新計画の承認を受けた取組なら IT の導入も対象になりうる（デジタルの名指しはなく efficiency は △）
# 町の制度はあるが IT 向けではないもの: みやき町 ブランド戦略促進事業補助金（自社ブランド商品の販売促進。オンライン販路関連費を含む、2/3・150万円、四次募集 2026-10-01〜11-30・先着）、玄海町 展示会等出展支援事業、太良町 販路開拓展示会・商談会等出展支援補助金、有田町 陶土値上対策支援事業 など（subsidy_b_areas.md）
# 町の事業者が使える県の制度: 「第2弾」佐賀県業務改善サポート補助金（〜2027-02-17）、佐賀県半導体人材育成事業費補助金（さが半導体フォーラム会員）など（subsidy_a.yml）
# 国・県の補助金への上乗せ（addon）: 10町とも該当なし
# 原子力発電施設等周辺地域の給付金・企業立地支援補助金（玄海町）はAI導入の補助金に入れていない

