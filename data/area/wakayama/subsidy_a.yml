# 和歌山県（県・公益財団法人わかやま産業振興財団など県域の機関）と9市（2026年度）。2026-11-07に県の公式ページ・交付要綱・申請要領、県の「令和8（2026）年度 デジタル化支援メニュー」（デジタル社会推進課）、県の「令和8年度商工労働行政の概要」、財団のサイト、9市の公式ページ（商工担当課の記事一覧・事業者向けの分類ページ）で確認
# 県で中小企業のシステム導入に使える最大の補助金は「和歌山県中小企業成長促進補助金」（商工企画課。わかやま賃上げ環境整備支援パッケージ、国の重点支援地方交付金、予算20億円。2/3・100万〜1,000万円、商工会・商工会議所の確認書が必要）。受付 2026-05-18〜07-31 の予定だったが予算上限に達して受付終了（終了日は県のページに書いていない）。交付決定は560件で、AIを名指しした事業計画名が10件ある（cases 担当向け、subsidy_a_areas.md）
# 県で「DX」「デジタル」を名指しした中小企業向けの補助金は2026年度にない。県の DX 推進事業（和歌山県DX推進ラボ、2026-06に地域DX推進ラボの認定）は、デジタル経営診断・DX推進員・講習（生成AI実践講習など）・デジタル専門家派遣（無料、2026-12-28まで）で、補助金ではない（md だけ）
# 県の補助金で終わったもの: 中小企業成長促進補助金（予算到達）、業務改善促進助成金（国の業務改善助成金〔令和7年度〕の上乗せ、9/30締切）、えるぼし認定等促進による職場環境整備補助金（AI・RPAなどの業務効率化ツールを名指し、9/30締切）
# 県域で今申請できるもの: 財団の成長企業支援補助金（プロ人材〔デジタル人材を含む〕の紹介手数料の1/2・100万円、2027-02-01まで）、副業・兼業人材活用促進補助金（8/10・45万円、随時）、副業・兼業人材活用拡大推進補助金（1/2・10万円、随時）。業種を限ったものでは、タクシー事業者の生産性向上支援（配車アプリ・DXに資するシステム、1/2・500万円、12/25まで）とスマート水産業推進事業（漁業者のICT・ロボット機器、1/3・200万円、12/18まで）
# 市で今受け付けているAI・IT向けの補助: 和歌山市 生産性向上ツール導入補助金（AI又はIT・IoTツール、1/2・50万円、2026-10-01から予算到達まで。11/6時点で申請額 2,340,000円／予算 3,000,000円）。和歌山市 ビジネスチャンス創出支援補助金のECサイト構築事業（1/2・30万円、2027-01-29まで）
# 市独自のAI・IT導入・研修向けの補助が見つからない市: subsidy_a_areas.md に確かめたページを書いた
# 国の補助金への上乗せ（addon）: 県の業務改善促進助成金は国（厚生労働省）の業務改善助成金の上乗せ（令和7年度に交付を受けた事業者向け、自己負担額の1/2・100万円、9/30で終了）。national.yml に業務改善助成金の id はないので stacking は入れていない。国のデジタル化・AI導入補助金・省力化投資補助金・ものづくり補助金への上乗せは県・9市とも見つからない。和歌山市の生産性向上ツール導入補助金は「国、本市その他の地方公共団体等の補助金」との同一経費の併用を認めない
# 期間の status は data/subsidies/README.md の値（open / closed / rolling / unknown）を使う。随時受付は rolling

