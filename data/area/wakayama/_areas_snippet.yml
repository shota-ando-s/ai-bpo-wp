# 案（D34、2026-11-07 のデータ）。data/subsidies/areas.yml の末尾に足す和歌山県の部分。親が最後に areas.yml に入れる（data/subsidies/wakayama.yml〔案は data/area/wakayama/_subsidies_wakayama.yml〕と同じコミット。areas.yml は直接編集していない）
# none: true は _subsidies_wakayama.yml にその市町村の制度が1件もない19市町村（海南市・有田市・御坊市・田辺市・新宮市・岩出市・かつらぎ町・高野町・美浜町・日高町・由良町・印南町・みなべ町・白浜町・上富田町・すさみ町・那智勝浦町・古座川町・串本町）。17は市町村の事業者向け・商工業のページと商工担当課の記事一覧で確かめて見つからなかった市町村、みなべ町（梅干製造業雇用維持支援）と串本町（起業チャレンジの家賃補助）は町の制度を yml から外したので none にして note で触れた（判断 D4-4。沖縄県久米島町と同じ）
# 湯浅町・広川町・有田川町は今年度の受付を終えた創業の補助しかないが、yml に制度があるので none にせず、note の一文目で状況を書いた（岡山県玉野市・鹿児島県霧島市・沖縄県那覇市と同じ）。和歌山市・橋本市・紀の川市・紀美野町・九度山町・日高川町（受付中・随時）、太地町・北山村（受付状況不明）も none なし（11市町村）
# 並びは県の振興局の7区分（和歌山県振興局設置条例。stats.md の「県の地域区分」）の順: 海草→那賀→伊都→有田→日高→西牟婁→東牟婁。区分の中は市（自治体コード順）→町村（自治体コード順）。判断 D4-9
# none の callout は「AI・IT導入向けの独自の補助金が見つかりませんでした」と出るので、none の note は確かめ方・相談先（商工会議所は日本商工会議所の一覧、商工会は全国商工会連合会の名簿と県の成長促進事業のページの表〔gov_ai.md・gov_ai_b.md〕）・取り違えの注意を書く
# 「無料」と書いたのは資料に無料とあるものだけ: 和歌山県よろず支援拠点（拠点のサイト「無料で経営相談ができる相談所です（中小企業庁の事業です）」、073-433-3100）。商工会が名簿の所在地で見つからない太地町の note にだけ入れた（県域の窓口は県ページと記事本文の H2 9 で書く）
# 取り違えの注意: 和歌山市（wakayama-city）は和歌山県と別、美浜町（mihama-town、日高郡）は福井県美浜町と別、日高町（hidaka-town-wakayama、日高郡）は北海道日高町・高知県日高村と別、広川町（hirogawa、有田郡、ひろがわ）は福岡県広川町と別、新宮市（shingu-city）は福岡県新宮町と別、かつらぎ町（katsuragi-town、伊都郡）は奈良県葛城市と別、北山村（kitayama-village、東牟婁郡）は奈良県の上北山村・下北山村と別、を note に入れた
# 市の制度（和歌山市・橋本市・紀の川市）は市内に事業所がある事業者が対象で、近くの町村の事業者は使えない。県・財団の制度（成長企業支援・副業兼業など）は wakayama の行で全地域に出るので、市町村の note には書いていない
# 災害の融資（セーフティネット保証1号〔全東信〕・中東情勢の資金繰り安定資金）は note に入れない（AI 導入の補助ではない。docs の【D4】「災害の制度」）
