# 和歌山県の20町1村（紀美野町・かつらぎ町・九度山町・高野町・湯浅町・広川町・有田川町・美浜町・日高町・由良町・印南町・みなべ町・日高川町・白浜町・上富田町・すさみ町・那智勝浦町・太地町・古座川町・串本町・北山村）の AI・IT・DX・研修・創業に使える町村独自の補助金（2026年度）。2026-11-07に21町村の公式サイトの事業者向け・商工業の分類ページと商工担当課の記事（各約220ページをたどった題名）を開き、補助・助成・支援の記事の本文と要綱・パンフレットを確認
# AI・生成AI・IT導入・DXを名指しした町村独自の補助金は、21町村とも見つからなかった
# 入れたのは、創業・事業拡大の設備（パソコンなどの汎用品は除く制度が多い）にも使える可能性がある創業支援の補助金9件と、国の雇用調整助成金の上乗せ（教育訓練を含む）1件、事業内容の記載が少ない交付金1件。いずれも AI・デジタルの名指しはなく、targets は △ か ×
# 受付中・随時: 紀美野町 創業支援（2/3・70万円、随時）とその上乗せの課題解決チャレンジ（+50万円）、九度山町 起業創業支援（1/2・50万円、〜2026-11-30）、日高川町 起業応援（1/2・50万円、交付申請は1月31日まで）、みなべ町 梅干製造業雇用維持支援（雇用調整助成金の上乗せ、期間ごとの締切）
# 今年度の受付を終えたもの: 湯浅町 創業支援（全額・100万円、〜2026-10-30）、広川町 起業支援（1/2・500万円、7月末）、有田川町 起業支援（1/2・50万円、2026-09-18〜10-16）
# 受付状況がページで分からないもの（unknown）: 太地町 創業支援（全額・5万円、2024-05-01〜の先着）、串本町 起業チャレンジ（家賃1/4・月2.5万円）、北山村 小規模事業者持続化交付金（サービス業、交付率・上限の記載なし）
# 店舗の改装（かつらぎ町 店舗リフォーム・広川町 事業所リフォーム）、空き店舗（有田川町・那智勝浦町）、特産品開発（日高町・日高川町・広川町）、観光（那智勝浦町 体験観光スタートアップ・由良町 ゆらコン）、企業誘致（かつらぎ町・白浜町・那智勝浦町）は IT・AI に使う制度ではないので yml に入れず、subsidy_b_areas.md に書いた
# 国・県の補助金への上乗せ（addon）: みなべ町 梅干製造業雇用維持支援補助金が国の雇用調整助成金の上乗せ（national.yml に雇用調整助成金の id がないので stacking は入れていない）。国のデジタル化・AI導入補助金・省力化投資補助金・ものづくり補助金への上乗せは21町村とも見つからない
# 期間の status は data/subsidies/README.md の値（open / closed / rolling / unknown）を使う
# 町村ごとの確認したページ・制度がない町村は subsidy_b_areas.md

