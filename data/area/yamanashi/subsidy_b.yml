# 山梨県 8町（市川三郷町・早川町・身延町・南部町・富士川町・昭和町・西桂町・富士河口湖町）6村（道志村・忍野村・山中湖村・鳴沢村・小菅村・丹波山村）2026年度
# 確認日 2026-10-31。根拠は subsidy_b_areas.md
# 生成AI・AI導入・IT導入・DX・研修を名指しで補助する町村独自の制度は、14町村とも確認できなかった
# IT・ホームページに使える町村独自の制度は、昭和町 持続的発展支援補助金（ホームページの作成・改修・販路開拓の機器等 2/3、一般型30万円・ふるさと事業型50万円）だけで、2026年度は一般型7/31・ふるさと事業型6/30で締切済み
# 県の「中小企業者等支援策一覧」（2026年8月版）に載る町村の制度は、融資・利子補給・保証料・企業立地・創業支援・特産品開発が中心。鳴沢村の「情報ハイウェイ接続事業費補助金」（企業のIT利用環境、1/4）は一覧に載るが、村の補助金ページ（商工関連）に載っておらず、YAML に入れていない
# 国の補助金（national.yml）への町村の上乗せ（addon）は見つからない
# 富士河口湖町の公式サイトは2026-10-31に「公開を一時停止」（メンテナンス）、道志村・小菅村の公式サイトは 503 で、町村のページを確かめられていない（商工会のサイトは確認）
# 県の制度・県域の機関・国の制度・13市は subsidy_a 担当
# 期間の status は data/subsidies/README.md の値（open / closed / rolling / unknown）。来年度の見込み（next_expected）は書かない

# ---- 昭和町 ----
- id: yamanashi-showa-jizokuteki-hatten
  name: 令和8年度 昭和町持続的発展支援補助金
  org: 昭和町（環境経済課。申請・問い合わせ窓口は昭和町商工会）
  area: yamanashi/showa
  max_yen: 500000
  rate: 事業費の2/3。一般型 上限30万円、ふるさと事業型 上限50万円
  rate_num: 0.667
  targets: {efficiency: △, consulting: ×, training: ×}
  expenses: ①販路開拓等に伴う機器の購入 ②販促用チラシの作成・配布 ③ホームページの作成・改修 ④パッケージデザインの作成 ⑤店舗改装 ⑥新商品の開発 等。ソフトウェア・クラウド利用料の扱いはチラシに書かれていない
  conditions: 昭和町内で事業を営む従業員20人以下の事業者。経営計画（事業計画書）を作り、昭和町商工会の支援で見直したものを町が認定。事業終了後も町内で商工会の支援を受けながら事業を継続すること。ふるさと事業型は新商品等を昭和町ふるさと納税の返礼品として年度内に登録申請し、事前に商工会と町ふるさと納税推進課に確認（事前相談締切 2026-05-29）。事業実施期間は交付決定日〜2027-03-31。予算に限りあり
  period: {status: closed, end: 2026-07-31}
  url: https://showaf.com/info/6761283
  checked: 2026-10-31
  confidence: official
  note: 昭和町商工会のお知らせ（2026-05-15）のチラシ画像（https://cdn.goope.jp/201532/260514142548-6a055cdc2cb9a.jpg）で申請受付締切は一般型 2026-07-31、ふるさと事業型 2026-06-30。商工会の支援メニュー https://showaf.com/menu も同じ内容（締切は毎年6月下旬・7月下旬）。町のページ「中小企業支援について」https://www.town.showa.yamanashi.jp/soshiki/8/1819.html （2023-10-01更新）からのリンク先 https://www.town.showa.yamanashi.jp/soshiki/8/1857.html は2026-10-31に404で、町のページでは確かめられていない。県の「中小企業者等支援策一覧」（2026年8月版）には「小規模事業者等持続的発展支援補助金」として載る。max_yen はふるさと事業型。問い合わせは昭和町商工会 055-275-3344、町 環境経済課 055-275-8355
  fuenn_note: 昭和町の従業員20人以下の事業者が、ホームページの作成・改修や販路開拓の機器などに使う費用を2/3（最大30万〜50万円）補助する町の制度です。2026年度の受付は7月31日で終了しました。
