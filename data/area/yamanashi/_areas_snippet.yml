# data/subsidies/areas.yml の末尾に足す山梨県の部分（D4、2026-10-31）。親が最後に areas.yml に入れる（島根県と同時に足すため、areas.yml は直接編集していない）
# none: true は data/subsidies/yamanashi.yml にその市町村の制度が1件もない20市町村（7市・13町村）。甲斐市・昭和町は今年度の受付を終えた制度しかないが、yml に制度があるので none にせず、note の一文目で状況を書いた
# 並びは県の4地域（中北・峡東・峡南・富士・東部。県の条例の地域県民センター等の所管区域、stats.md の「県の地域区分」）の順、地域の中は市→郡の町村の順
# 富士河口湖町（町のサイトが公開停止中）・道志村・小菅村（村のサイトが503）は、商工会のサイトと県の「中小企業者等支援策一覧」（2026年8月版）だけで判断した（subsidy_b_areas.md）
- code: yamanashi
  name: 山梨県
  cities:
    - {code: yamanashi/kofu, name: 甲府市, note: 市独自のAI・IT導入の補助金は見つかりませんでした（2026-10-31確認）。ポリテクセンター山梨の市が指定したIT業務改善の研修を従業員が受けた受講料を1/2（1人2,000円・5人まで）補助する制度があり、年度末（2027-03-31）まで申請できます}
    - {code: yamanashi/nirasaki, name: 韮崎市, note: 市独自のAI・IT導入の補助金は見つかりませんでした（2026-10-31確認）。小規模事業者が商工会の指導で行う新商品開発（ウェブサイト関連費などを含む）に1/2（上限40万円）を補助するビジネスチャレンジ支援事業補助金があります。今年度の受付状況は市の商工観光課に確認してください}
    - {code: yamanashi/minami-alps, name: 南アルプス市, none: true, note: 市独自のAI・IT導入や研修の補助金は見つかりませんでした（2026-10-31確認。機械設備の取得の助成は総額1,000万円以上が条件でソフトウェアの記載はありません）。南アルプス市商工会に確認してください}
    - {code: yamanashi/hokuto, name: 北杜市, none: true, note: 市独自のAI・IT導入や研修の補助金は見つかりませんでした（2026-10-31確認）。北杜市商工会に確認してください}
    - {code: yamanashi/kai, name: 甲斐市, note: 業務効率化のソフトウェアやウェブサイト作成などに1/2（上限50万円）を補助する甲斐市小規模企業者持続化補助金は、2026年度の募集が2026-07-31で終わりました（2026-10-31確認）。甲斐市商工会に確認してください}
    - {code: yamanashi/chuo, name: 中央市, none: true, note: 市独自のAI・IT導入や研修の補助金は見つかりませんでした（2026-10-31確認）。中央市商工会か、中央市にある山梨県よろず支援拠点に確認してください}
    - {code: yamanashi/showa, name: 昭和町, note: 従業員20人以下の事業者のホームページの作成・改修や販路開拓の機器などに2/3（上限30万〜50万円）を補助する持続的発展支援補助金は、2026年度の受付が2026-07-31で終わりました（2026-10-31確認）。昭和町商工会に確認してください}
    - {code: yamanashi/yamanashi-city, name: 山梨市, none: true, note: 市独自のAI・IT導入や研修の補助金は見つかりませんでした（2026-10-31確認）。山梨市商工会に確認してください。山梨県全体の制度とは別に、山梨市の制度だけを調べた結果です}
    - {code: yamanashi/fuefuki, name: 笛吹市, none: true, note: 市独自のAI・IT導入や研修の補助金は見つかりませんでした（2026-10-31確認）。笛吹市商工会に確認してください}
