# 岐阜県 19町2村（岐南町・笠松町・養老町・垂井町・関ケ原町・神戸町・輪之内町・安八町・揖斐川町・大野町・池田町・北方町・坂祝町・富加町・川辺町・七宗町・八百津町・白川町・御嵩町・東白川村・白川村）2026年度
# 確認日 2026-10-29。根拠は subsidy_b_areas.md
# 生成AI・AI導入を名指しで補助する町村独自の制度は、21町村とも確認できなかった（坂祝町の制度は「汎用的ＡＩシステム」を対象外と明記）
# IT・デジタル化・業務効率化に使える町村独自（商工会経由を含む）の制度で、今申請できるもの（2026-10-29時点）
#   - 坂祝町 働いてもらい方改革推進補助金（坂祝町商工会）: 業務専用ソフトウェア・情報システム（POS・給与管理・日報・生産管理など）と専用端末、ベンダーのトレーニング費。3/4・上限40万円。受付 2026-10-01〜10-30 17時（締切は明日）
#   - 神戸町 元気な中小企業・小規模事業者サポート補助金（申請は神戸町商工会）: 機械装置等（パソコン等の汎用品と既存ソフトの更新料は対象外）・新商品開発費。1/2・上限30万円。申請期限は年度の12月の最終開庁日（2026-12-28）
#   - 養老町 中小企業チャレンジ支援事業補助金（町に提出、養老町商工会の支援が必須）: 機械装置・借料・謝金（専門家）・委託費など。1/2、費目ごとに上限（委託費20万円・謝金10万円など）。パソコン・タブレットは対象外。2027-01-31までに完了する事業
#   - 垂井町 事業者支援補助金（垂井町 産業課）: 経営改善枠 3/4・上限7万5千円（業務効率化の設備・研修・eラーニング・コンサルティングなど）。「コネクトベース垂井」の有償利用が条件。受付 2026-09-01〜2027-01-29
#   - 大野町 販路拡大支援事業補助金（大野町商工会）: 1/2・上限20万円、対象経費は国の小規模事業者持続化補助金に準拠。2026-06-01〜2027-03-31
#   - 御嵩町 副業人材活用事業補助金・白川町 副業人材活用支援事業補助金・川辺町 副業・兼業人材活用事業支援補助金（デジタル化の課題に副業人材を使う費用。上限5万〜10万円）
# 今年度は終了: 笠松町 小規模事業者チャレンジ事業補助金（2026-04-15〜06-03、追加公募なし）、池田町 中小企業者等チャレンジ応援事業補助金（2026-06-01〜07-24。システム購入費・クラウド初期設定費が対象）、池田町 創業支援事業補助金（予算上限で休止。PC・ソフトウェアが対象）
# 国の補助金への上乗せ（addon）: 該当なし。国のデジタル化・AI導入補助金などに町村が上乗せする制度は21町村とも見つからない。近いものは池田町の「中小企業者等補助金申請支援補助金」（国庫補助金の申請をコンサルタントに委託した費用の2/3・上限20万円。ページ更新2024-01-04で今年度の受付は不明）で、上乗せではない
# 西濃の9町（養老・垂井・関ケ原・神戸・輪之内・安八・揖斐川・大野・池田）は、西美濃創生広域連携推進協議会の補助金（製造業のホームページ・動画制作 1/2・上限24万円、ソフトピアジャパンエリアの企業への委託が条件。窓口は大垣市）も使える。窓口が大垣市のため YAML に入れず、subsidy_b_areas.md に書いた（subsidy_a の大垣市と照合）
# 県の制度・県域の機関・国の制度・21市は subsidy_a 担当
# 創業向けでパソコン等を対象外と明記している制度（富加町・養老町・神戸町）、店舗の家賃補助（岐南町）、施設整備（白川村・七宗町）は YAML に入れず md に記した
