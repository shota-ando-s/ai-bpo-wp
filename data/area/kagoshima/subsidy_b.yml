# 鹿児島県の20町4村（さつま町・長島町・湧水町・大崎町・東串良町・錦江町・南大隅町・肝付町・中種子町・南種子町・屋久島町・瀬戸内町・龍郷町・喜界町・徳之島町・天城町・伊仙町・和泊町・知名町・与論町・三島村・十島村・大和村・宇検村）の AI・IT・DX・研修・省力化・生産性向上に使える町村独自の補助金（2026年度）。2026-11-04に24町村の公式サイトの事業者向けの分類ページ・商工担当課の記事一覧（WordPress のサイトは REST API の検索で「補助金」「事業者」「DX」「デジタル」「商工」も）を開いて確認
# AI・生成AI・IT導入を名指しした町村独自の補助金は、24町村とも見つからなかった
# 入れたのは、IT機器の導入・IT資格の取得・事業拡充にも使える可能性がある一般の制度5件（大崎町2件・東串良町・龍郷町・大和村）。いずれも AI・デジタルの名指しはなく、targets は △ にした
# 受付中・随時: 大崎町 人材育成補助金（IT資格の受験料等、1/2・10万円、個人が申請）、東串良町 事業者応援補助金（店舗・30万円以上の設備備品、2/3・100万円、先着）、龍郷町 資格取得支援助成金（国家資格、2/3・10万円、2月末まで）。大崎町 企業価値向上補助金は受付期間の記載なし（unknown）。大和村 起業創業ステップアップ助成金は 2026-06-26 で終了
# 国・県の補助金への上乗せ（addon）: 24町村とも該当なし。町村のサイトにある県の「サービス業生産性向上支援事業費補助金」（さつま町・南種子町が案内）は県の制度で、ここには入れていない（subsidy_a の担当へ）
# 期間の status は data/subsidies/README.md の値（open / closed / rolling / unknown）を使う
# 町村ごとの確認したページ・制度がない町村は subsidy_b_areas.md

