# 鹿児島県（県・公益財団法人かごしま産業支援センター〔KISC〕・県の事業の事務局）と19市（2026年度）。2026-11-04に県の公式ページ・交付要綱・募集要領、県の事業の専用サイト（r8dx-kagoshima.pref.kagoshima.lg.jp ほか）、KISC のサイト、市の公式ページ（商工担当課の記事一覧・事業者向けの分類ページ）で確認
# 県で「DX」を名指しした中小企業向けの補助金は「かごしま中小企業DX推進事業費補助金」（産業立地課新産業創出室、事務局は MBC開発株式会社。2/3・上限400万円、ITベンダーか認定経営革新等支援機関と共同で事業計画書を作成）。1次 2026-05-18〜06-19・2次 07-17〜08-19 で終わり、1次は150件を交付決定。県の「中小企業DX支援プラットフォーム」（kagoshima-dx.jp、運営 株式会社アンクス）の「DX推進補助金」はこの補助金の案内で、別の補助金ではない
# 県の補助金はほかもすべて今年度の募集を終えた: サービス業生産性向上支援事業費補助金（2/3・300万円、8/21まで）、かごしまの「稼ぐ力」加速化総合補助金（通常枠2/3・100万円／重点支援枠3/4・300万円、10/5まで。事例に「生成AIの専門家を招き、販売方法の検討を行う」）、食品関連製造業生産工程自動化・省力化等支援事業（2/3・1,000万円、5/29まで）、ものづくり中核企業生産革新支援事業（2/3・3,000万円、5/29まで）、副業・兼業人材活用促進事業補助金（8/10・50万円、7/28に予算到達）
# 県域で今申請できるのは、地域外副業・兼業人材活用促進事業補助金（県外の副業・兼業人材の移動費の1/2・上限30万円、2027-02-06まで）と KISC の ＩＴ資格取得支援事業（KISC会員、ITパスポートの受験料の2/3・1件5千円、2027-03-05まで）だけ
# 市で今受け付けているAI・IT向けの補助: 鹿児島市 中小企業等生産性向上支援事業（ICTツール導入 1/2・50万円、2次 2026-10-01〜12-25・先着順）、奄美市 ICT事業拡大支援事業補助金（2/3・30万円、2次 2026-11-02〜2027-01-29）、鹿屋市 中小企業等物価高騰対策支援事業（設備導入。区分「DXの推進」あり、小規模2/3・50万円／中小1/2・100万円、〜2026-12-21）
# 市独自のAI・IT導入・研修向けの補助が見つからない市: 西之表市・垂水市・曽於市・指宿市（店舗の改修だけ）・出水市・日置市・南さつま市・志布志市（新商品・新サービスの設備は対象だがIT名指しなし）・伊佐市（起業・継業向け）・姶良市。阿久根市はサイトに接続できず、公式で確かめていない。詳細は subsidy_a_areas.md
# 国の補助金への上乗せ（addon）: 県・19市とも、国のデジタル化・AI導入補助金・省力化投資補助金・ものづくり補助金への上乗せは見つからない。鹿児島市・鹿屋市・奄美市の補助は「国・県等の補助金を受ける事業は対象外」「他の補助金等の助成を受けたときは対象外」と定めており、併用もできない
# 期間の status は data/subsidies/README.md の値（open / closed / rolling / unknown）を使う。随時受付は rolling

