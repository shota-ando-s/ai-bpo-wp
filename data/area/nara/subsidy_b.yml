# 奈良県の15町（平群町・三郷町・斑鳩町・安堵町・川西町〔磯城郡〕・三宅町・田原本町・高取町・上牧町・王寺町・広陵町・河合町・吉野町・大淀町・下市町）の AI・IT・DX・研修・省力化・生産性向上に使える町独自の補助金（2026年度）。2026-11-07に15町の公式サイトの事業者向けの分類ページ・商工の記事一覧・補助金一覧を開いて確認（大淀町は curl、ほかの14町は curl が接続リセット・408 で WebFetch だけ）
# DX・デジタル・IT を名指しした町独自の補助金は2件: 広陵町 中小企業・小規模企業デジタル化推進補助金（1/2・10万円、2026-06-01〜予算上限で終了）、大淀町 原油価格・物価高騰対策支援金（国のデジタル化・AI導入補助金などの自己負担分を上限10万円まで。国の補助金への上乗せ）
# このほか、設備・創業にも使える一般の制度を3件（広陵町 設備投資促進、吉野町 事業者支援設備投資〔受付終了〕、斑鳩町 創業支援〔受付終了〕）。いずれも AI・IT の名指しはなく、targets は △ にした
# 受付中・随時（2026-11-07）: 大淀町 物価高騰対策支援金（受付 2026-06-05〜2027-02-26）、広陵町 デジタル化推進（予算50万円。上限に達したかはページにない）・設備投資促進（予算400万円。同）
# 国の補助金への上乗せ（addon）: 大淀町だけ（{kind: remaining, ratio: 1.0}、上限10万円。1事業者1回で、国のものづくり補助金・デジタル化・AI導入補助金・持続化補助金・事業承継M&A補助金・省力化投資補助金・新事業進出補助金と県の4制度のどれか1つ）。広陵町 デジタル化推進は「国、県等他の制度の補助等を受けていない者」が対象で、国の補助金と同じ経費には使えない（exclusive_with）
# 町のサイトにある県・国の制度（王寺町が案内する県の「奈良県物価高騰克服プログラム」、大淀町の補助金活用相談会が扱う国の IT導入補助金など）は町独自ではないので入れていない（subsidy_a・national の担当へ）
# 期間の status は data/subsidies/README.md の値（open / closed / rolling / unknown）を使う
# 町ごとの確認したページ・制度がない町は subsidy_b_areas.md

