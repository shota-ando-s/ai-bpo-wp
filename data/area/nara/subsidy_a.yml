# 県で今申請できる、IT・AIの導入費を補助する中小企業向けの補助金はない。今年度の柱だった「奈良県中小企業賃上げ環境整備支援補助金」（経営支援課。省力化・収益力向上の設備投資・システム構築費・クラウド利用費〔令和9年3月分まで〕等、中小1/2・小規模2/3、上限500万円・下限50万円、商工会議所・商工会の伴走支援と給与支給総額2.9%以上の増加が要件）は公募要領（令和8年5月15日時点）で申請期間 2026-05-26〜07-31（必着）で終わった
# 令和7年度の「デジならキャンペーン」（クラウドサービスの初期費用・最大1年分の利用料、1/2・20万円、専門家の無料面談が要件）は終了し、県のページ（更新日2026-08-14）に「令和8年度の募集はございません」。令和7年度の「中小企業省力化・生産性向上設備投資支援補助金」（1/2・500万円、中小企業診断士の3回の面談が要件）も 2026-01-16 で申請受付を終えた
# 県の無料・低額の支援（補助金ではない。yml に入れていない。subsidy_a_areas.md）: 大学連携中小企業デジタル化促進事業（奈良先端大の院生2名と教員1名が伴走、生成AIの活用方法なども。最大5社、申込 2026-07-10 で終了）、デジタル×経営実践プログラム（勉強会5回＋DXプロ人材の個別伴走8回、10社、参加費 44,000円、申込 2026-09-25 で終了）、地域産業振興センターの専門家派遣（謝金の1/2を企業負担・初回無料、同一年度3回まで、随時）
# 市で今受け付けているAI・IT・研修向けの補助: 橿原市 業務改善支援補助金（国の業務改善助成金を受けた市内中小企業に、経費から国の助成額を引いた額・上限10万円、2026-04-01〜2027-03-12、窓口のみ・先着）、宇陀市 地元企業人材育成支援事業補助金（資格取得の研修受講料・受験料・登録費の1/2・10万円、〜2027-03-31）、奈良市 産学連携共同研究等支援補助金（奈良先端大など市と連携協定のある県内の学術機関との共同研究 4/5・100万円、機器利用 2/3・10万円、〜2027-03-31・予算がなくなり次第終了）
# 今年度の受付を終えた市の補助: 桜井市 小規模事業者等IT化支援事業補助金（IT導入枠 1/2・10万円／IT活用枠 1/2・20万円／DX推進枠 2/3・50万円、クラウド・サブスクは最大1年〔DX枠2年〕分、2026-04-13〜06-24 17時必着）、生駒市 人材確保等総合支援事業補助金の育成支援（資格取得・研修費 1/2・50万円〔条件で100万円〕、予算額に達して受付終了）
# 市独自のAI・IT導入・研修向けの補助が見つからない市（8市）: 奈良市（産学連携の補助だけ）・大和高田市（新商品開発だけ）・大和郡山市・天理市・五條市・御所市・香芝市（1台500万円以上の機械の設備投資促進補助金だけ）・葛城市。詳細と確かめたページは subsidy_a_areas.md
