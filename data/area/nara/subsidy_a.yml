  org: 桜井市（まちづくり部 商工振興課 商工・統計係。桜井市商工会の伴走型支援の対象事業）
  area: nara/sakurai
  max_yen: 500000
  rate: IT導入事業枠は補助対象事業費の1/2（上限10万円・下限3万円）、IT活用事業枠は1/2（上限20万円・下限10万円）、DX推進事業枠は2/3（上限50万円・下限20万円）。千円未満切捨て
  rate_num: 0.5
  max_months: 12
  min_cost_yen: 60000
  targets: {efficiency: ◎, consulting: ×, training: ×}
  expenses: 機械装置等費（ハードウェア費〔パソコン・タブレット・周辺機器・決済用端末等。スマートフォン・ウェアラブル端末は対象外。過去に交付を受けた者は汎用ハードを計上不可〕、ソフトウェア費〔生産性向上・業務効率化に資するソフトウェア及びクラウドサービス等使用料〕、セキュリティ対策費）、広報費（ホームページの新規作成、自社ECサイト・予約受注管理システムの新規構築）。月額・年額の製品（サブスクリプション）は IT導入枠・IT活用枠で最大1年分、DX推進枠で最大2年分。家庭用・一般事務用ソフト、既導入ソフトの更新料、申請書作成の費用は対象外
  conditions: 市内の事業所でITの活用による生産性向上・業務効率化・販路開拓・DXを目指す、市内で事業を営む中小企業者（みなし大企業を除く）・小規模企業者又は個人事業者。市税等の滞納がないこと。補助対象事業について国又は地方公共団体の補助金等の交付を受けていない・受ける予定がないこと。過去に交付を受けた者は IT導入事業枠の対象外、過去に DX推進事業枠で交付を受けた者は対象外。補助対象期間は交付決定日から2027-02-01
  period: {status: closed, start: 2026-04-13, end: 2026-06-24}
  url: https://www.city.sakurai.lg.jp/gyosya/chusyokigyou/9878.html
  checked: 2026-11-07
  confidence: official
  note: 応募要領 https://www.city.sakurai.lg.jp/material/files/group/32/R8ITyouryou.pdf （p1〜2 補助対象者・枠、p2「６ 応募書類受付期間 令和８年４月１３日（月）～令和８年６月２４日（水）１７時必着」、ソフトウェア費とサブスクの扱い）を curl で読んだ。交付要綱 …/R08ITyoukou.pdf は開いていない。市のページ（更新日2026-04-01）に締切後の受付終了の表示はないが、要領の日付で closed とした。審査のうえ予算の範囲で採択、補助事業者名・事業名・業種等を公表する旨の記載がある（採択一覧は見つけていない）。min_cost_yen は IT導入枠の下限3万円から逆算した6万円。令和7年度（2025-04-14〜07-04）・令和6年度にも同じ制度があった（WebSearch の要約、二次情報）。AIの語は要領の抜き出した範囲にない。問い合わせ 0744-42-9111（内線3661）
  fuenn_note: 桜井市内の小規模事業者等が、業務効率化のソフトウェアやクラウドサービス、ホームページ・ECサイトを導入する費用を1/2（DX推進枠は2/3）、最大50万円補助する市の制度でした。クラウドの利用料は最大1年分（DX推進枠は2年分）が対象でした。2026年度の受付は6月24日で終わりました。

- id: nara-ikoma-jinzai-ikusei
  name: 令和8年度 生駒市人材確保等総合支援事業補助金（育成支援補助金）
  org: 生駒市（地域活力創生部 商工観光課 産業雇用係）
  area: nara/ikoma
  max_yen: 500000
  rate: 補助対象経費の1/2、上限50万円（市・国の認定を受けた事業者は100万円）。採用支援（1/2・50万円）・マッチング支援（1/2・30万円）と併用で1事業者最大130万円（条件で260万円）
  rate_num: 0.5
  targets: {efficiency: ×, consulting: △, training: ○}
  expenses: 市内事業所に就業する従業員の ①業務上必要な資格の取得経費（市指定の315種類の資格のみ）、②業務上必要な技能・技術・知識等の習得のための研修経費。国・都道府県等から同一経費に補助金等を受ける場合は対象外。マッチング支援は市指定の専門人材（ローカルビジネスパートナー）への業務委託経費
  conditions: 中小企業基本法の中小企業者・小規模企業者、公益法人・社会福祉法人・NPO法人・医療法人・協同組合等（親睦団体・政治・宗教団体等は対象外）。市外事業所の従業員は対象外。補助対象期間は2026-04-01〜2027-01-31に実施・支払いを終えたもの
  period: {status: closed, start: 2026-06-22, end: 2026-12-25}
  url: https://www.city.ikoma.lg.jp/0000041653.html
  checked: 2026-11-07
  confidence: official
  note: 市のページ（公開2026-06-22、更新日2026-11-06、WebFetch の要約）で申請受付期間 2026-06-22〜2026-12-25 だったが「予算額に達したため受付は終了」（11月3日に申請してエラーになった人は商工観光課に相談、とある）。end は本来の締切日で、実際の終了日（予算到達の日）はページから分からない。チラシ https://www.city.ikoma.lg.jp/cmsfiles/contents/0000041/41653/chirashi3.pdf （p2 補助率・対象経費を目で確認）。交付要綱・実施要領・資格一覧の PDF は画像で文字が取れず、IT・AI の研修や資格（ITパスポート等）が対象かは確かめていない。AIの語はチラシにない
  fuenn_note: 生駒市内の中小企業等が、従業員の資格取得や業務に必要な研修を受けさせる費用を1/2、最大50万円（認定事業者は100万円）補助する市の制度でした。2026年度は予算額に達して受付を終えました。

- id: nara-uda-jinzai-ikusei
  name: 令和8年度 宇陀市地元企業人材育成支援事業補助金
  org: 宇陀市（農林商工部 商工産業課）
  area: nara/uda
  max_yen: 100000
  rate: 補助対象経費の1/2（千円未満切捨て）、同一年度内で上限10万円
  rate_num: 0.5
  targets: {efficiency: ×, consulting: ×, training: △}
  expenses: 従業員の資格取得に必須となる研修等の受講料（教材費を含む）、受験料、資格の登録に係る費用。どの資格・研修が対象か（IT・DX・AI関係を含むか）はページに書いていない
  conditions: 市内で事業を営む事業者。雇用保険被保険者の従業員の資格取得であること（申請書類に雇用保険被保険者資格取得等確認通知書の写し）。市税等の滞納がないこと。最終支払日か資格取得日の遅い日から6か月以内に申請し、2027-03-31までに補助金交付請求書を出せるもの
  period: {status: rolling, start: 2026-04-01, end: 2027-03-31}
  url: https://www.city.uda.lg.jp/soshiki/23/10840.html
  checked: 2026-11-07
  confidence: official
  note: 市のページ（ページID 0010840、更新日2026-08-25、WebFetch の要約）で申請受付期間 2026-04-01〜2027-03-31、「予算が上限に達した場合は早期に終了する場合があります」。要綱はページにない。国の人材開発支援助成金との関係は書いていない。AI・ITの名指しはない。問い合わせ 0745-82-5874
  fuenn_note: 宇陀市内の事業者が、従業員の資格取得のための研修受講料・受験料・登録費を負担したとき、その1/2、最大10万円を補助する市の制度です。2027年3月31日まで受け付けています（予算に達し次第終了）。
