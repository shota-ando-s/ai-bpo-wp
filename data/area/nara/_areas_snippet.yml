# 案（D34、2026-11-07 のデータ）。data/subsidies/areas.yml の末尾に足す奈良県の部分。親が最後に areas.yml に入れる（data/subsidies/nara.yml〔案は data/area/nara/_subsidies_nara.yml〕と同じコミット。areas.yml は直接編集していない）
# none: true は _subsidies_nara.yml にその市町村の制度が1件もない28市町村（7市・11町・10村）。どれも市町村の公式サイトの商工・事業者向けの補助金一覧で確かめて見つからなかった（subsidy_a_areas.md・subsidy_b_areas.md・subsidy_c_areas.md）。12村と大淀町以外の14町は curl が通らず WebFetch の要約で確かめたので、町村の note に「町（村）にも確かめて」を入れた
# 桜井市・生駒市・吉野町・斑鳩町は今年度の受付を終えた制度しかないが、yml に制度があるので none にせず、note の一文目で状況を書いた（茨城県水戸市・鹿児島県霧島市と同じ）
# 並びは県観光局「令和6年 奈良県観光客動態調査報告書」の4エリア（spec/D1.md「県の地域区分」の案）: 県北部（3）→ 県西部（16）→ 県東部（8）→ 県南部（12）。区分の中は市（自治体コード順）→ 町村（自治体コード順）
# none の callout は「AI・IT導入向けの独自の補助金が見つかりませんでした」と出るので、none の note は確かめたページ・相談先（商工会議所・商工会は gov_ai.md の名簿）・無料と資料にある窓口・取り違えの注意を書く
# 「無料」と書いたのは資料に無料とあるものだけ: 奈良県よろず支援拠点（拠点サイト「ご相談に何度でも無料で対応！」。柏木本部〔奈良市〕・近鉄奈良駅前サテライト〔奈良市〕・大和高田出張相談所・橿原出張相談所）、奈良県工業振興センターの技術相談（県の産業施策集 p.28「相談は無料」）、大淀町の補助金活用相談会（「相談料 無料」）。県域の窓口は全地域に関わるので、所在の市（奈良市・大和高田市・橿原市）の note にだけ書いた
# 取り違えの注意: 奈良市（nara-city）は奈良県と別、川西町（kawanishi-town）は磯城郡の町で山形県川西町と別、川上村（kawakami）は吉野郡の村で長野県川上村と別、葛城市（katsuragi）は和歌山県かつらぎ町（katsuragi-town）・北葛城郡と別、上北山村と下北山村、御所市（ごせ）を note に入れた
# 市町村の制度は市町村内に事業所がある事業者が対象で、近くの市町村の事業者は使えない。県の制度は 2026-11-07 に今申請できるものがない（3制度とも closed）
