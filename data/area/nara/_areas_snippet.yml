    - {code: nara/kurotaki, name: 黒滝村, none: true, note: 奈良県吉野郡黒滝村のサイトで確かめた範囲で、村独自のAI・IT導入や研修の補助金は見つかりませんでした（2026-11-07確認）。村のサイトは要約でしか読めなかったので、村の企画政策課（0747-62-2031）にも確かめてください。黒滝村商工会に相談できます}
    - {code: nara/tenkawa, name: 天川村, none: true, note: 奈良県吉野郡天川村のサイトで確かめた範囲で、村独自のAI・IT導入や研修の補助金は見つかりませんでした（2026-11-07確認）。村のサイトは要約でしか読めなかったので、村役場（0747-63-0321）にも確かめてください。天川村商工会に相談できます}
    - {code: nara/nosegawa, name: 野迫川村, none: true, note: 奈良県吉野郡野迫川村の「事業者向け」のページで確かめた範囲で、村独自のAI・IT導入や研修の補助金は見つかりませんでした（2026-11-07確認）。村のサイトは要約でしか読めなかったので、村の産業課（0747-37-2104）にも確かめてください}
    - {code: nara/totsukawa, name: 十津川村, none: true, note: 奈良県吉野郡十津川村のサイトで確かめた範囲で、村独自のAI・IT導入や研修の補助金は見つかりませんでした（2026-11-07確認。起業の補助のページは準備中）。村のサイトは要約でしか読めなかったので、村役場（0746-62-0001）にも確かめてください。十津川村商工会に相談できます}
    - {code: nara/shimokitayama, name: 下北山村, note: 下北山村の起業支援補助金は、村で起業する人や村内の事業者が新しい事業を始めるときの改修・備品・研修受講・設備・広告の費用を、審査の点数に応じて補助します（上限120万〜200万円。2026-11-07確認）。募集の時期はページに書かれていないので、村の地域振興課（07468-6-0001）に確かめてください。上北山村とは別の村です。下北山村商工会にも相談できます}
    - {code: nara/kamikitayama, name: 上北山村, none: true, note: 奈良県吉野郡上北山村のサイトで確かめた範囲で、村独自のAI・IT導入や研修の補助金は見つかりませんでした（2026-11-07確認。事業継続支援金のページには中身がありません）。村のサイトは要約でしか読めなかったので、村の企画政策課（07468-2-0002）にも確かめてください。下北山村とは別の村です。上北山村商工会に相談できます}
    - {code: nara/kawakami, name: 川上村, none: true, note: 奈良県吉野郡川上村のサイトで確かめた範囲で、村独自のAI・IT導入や研修の補助金は見つかりませんでした（2026-11-07確認）。村のサイトは要約でしか読めなかったので、村の総務税務課（0746-52-0111）にも確かめてください。川上村商工会に相談できます。長野県の川上村とは別の村です}
