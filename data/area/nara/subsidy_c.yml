# 奈良県の12村（山添村・曽爾村・御杖村・明日香村・黒滝村・天川村・野迫川村・十津川村・下北山村・上北山村・川上村〔吉野郡〕・東吉野村）の AI・IT・DX・研修・省力化・生産性向上・創業に使える村独自の補助金（2026年度）。2026-11-07に12村の公式サイトの事業者向けの分類ページ・補助金一覧・商工の記事一覧・計画を開いて確認（12村とも curl が通らず WebFetch の要約で読んだ）
# AI・生成AI・IT導入・DXを名指しした村独自の補助金は、12村とも見つからなかった
# 入れたのは、研修（資格取得・研修受講費）・創業の設備に使える可能性がある一般の制度3件（御杖村2件・下北山村1件）。いずれも AI・ITツールの名指しはなく、targets は △ にした
# 受付: 御杖村 就業資格取得支援助成金（随時。資格取得の翌日から1か月以内に申請）。御杖村 地域活性化創業支援事業補助金・下北山村 起業支援補助金はページに受付期間がなく unknown
# 入れなかったもの（subsidy_c_areas.md に書いた）: 山添村 中小企業等エネルギー価格高騰対策支援金（エネルギー費、2026-02-27で終了）、上北山村 事業継続支援金（ページに中身がない）、黒滝村 起業支援補助金（過疎計画に名前だけ）、十津川村の起業の補助（ページが準備中）
# 国・県の補助金への上乗せ（addon）: 12村とも見つからない
# 期間の status は data/subsidies/README.md の値（open / closed / rolling / unknown）を使う

- id: nara-mitsue-shugyo-shikaku
  name: 御杖村就業資格取得支援助成金
  org: 御杖村（産業建設課）
  area: nara/mitsue
  max_yen: 100000
  rate: 対象経費の1/2以内（1,000円未満切捨て）、上限10万円。1人につき年度内1回限り
  rate_num: 0.5
  targets: {efficiency: ×, consulting: ×, training: △}
  expenses: 就業機会の拡大に資する資格又は免許（趣味的・教養的・入門的・基礎的なもの、普通自動車・自動二輪・原付・小型特殊の免許を除く）の研修等の受講料（教材費を含む）、受験料、資格の登録料。申請の前日から数えて12か月前までの経費
  conditions: 村内に住民登録がある個人で、資格を取得して費用を支払った人（ハローワークに求人登録をしている人、スキルアップを目指す就労者を含む）。交付決定後2年間の村内居住の意思、村税等の未納がないこと。資格を取得した日の翌日から1か月以内に申請
  period: {status: rolling}
  url: https://www.vill.mitsue.nara.jp/kurashi/jigyosha/sangyo_koyo/1067.html
  checked: 2026-11-07
  confidence: official
  note: 村のページ「就業資格取得支援助成金について（詳細）」（更新日 2026年10月01日。WebFetch の要約）。申請するのは事業者ではなく個人（村民）。AI・IT の資格（例 生成AIの民間資格）が「就業機会の拡大に資する資格」に入るかはページに書かれていない（産業建設課 0745-95-2001 内線230〜234 に確かめる）。第四次御杖村長期総合計画 後期基本計画の KPI「就業資格取得者累計人数」3人（R2〜R6年度）→5年間で10人
  fuenn_note: 御杖村に住む人が仕事に役立つ資格を取ったとき、講座の受講料・受験料・登録料の1/2（最大10万円）を村が助成する制度です。AI 関連の資格が対象になるかは、申請前に村の産業建設課に確かめてください。

- id: nara-mitsue-sogyo-shien
  name: 御杖村地域活性化創業支援事業補助金
  org: 御杖村（むらづくり振興課）
  area: nara/mitsue
  max_yen: 1000000
  rate: 補助対象経費の2/3以内、上限100万円。一事業又は一対象者につき1回限り
  rate_num: 0.667
  targets: {efficiency: △, consulting: ×, training: ×}
  expenses: 改装費、設備費、広告宣伝費、事務所の賃借料（交付決定後に実施・開始し、申請年度の3月31日までに完了したもの）
  conditions: 村内に住所を有する者で、創業又は開業しようとする事業を5年以上継続して展開する見込みのある者など（ページの要件をすべて満たす者）。申請年度内に事業を完了すること
  period: {status: unknown}
  url: https://www.vill.mitsue.nara.jp/kurashi/jigyosha/sangyo_koyo/808.html
  checked: 2026-11-07
  confidence: official
  note: 村のページ「地域活性化創業支援事業補助金について」（更新日 2026年04月01日。WebFetch の要約）。受付期間はページになく「村長の定める期日までに提出」。要綱の直接のリンクはない（様式の Word ファイルだけ）。創業向けで、AI・IT の名指しはない（設備費にソフトウェアが入るかは書かれていない）。問い合わせ むらづくり振興課 0745-95-2001（内線130〜135）
  fuenn_note: 御杖村に住む人が村内で創業するとき、改装費・設備費・広告宣伝費・事務所の賃料の2/3（最大100万円）を村が補助する制度です。受付の時期と、IT の費用が対象になるかは村のむらづくり振興課に確かめてください。

- id: nara-shimokitayama-kigyo-shien
  name: 下北山村起業支援補助金
  org: 下北山村（地域振興課）
  area: nara/shimokitayama
  max_yen: 2000000
  rate: 審査委員会の評価点数で補助率が決まる。総事業費240万円未満は4/5（80点以上）〜1/5（65〜69点）・上限120万円、240万円以上は1/2（80点以上）〜1/8・上限200万円。補助対象経費の上限400万円。64点以下は不交付
  rate_num: 0.5
  targets: {efficiency: △, consulting: ×, training: △}
  expenses: 施設改修費、備品購入費、研修受講費、設備費、広告宣伝費等。人件費・飲食費・商品の試作や実験販売等の経費・店舗兼住宅の居住空間の改修費は対象外
  conditions: 新たに起業する場合は、村内に事業所を置き通年で営業する意思、交付決定日以降補助事業期間完了日までに開業届・法人設立、申請者または従事者が村内に居住（予定を含む）、村に5年以上定住する意思の4つすべて。既に起業している人が新規事業を行う場合は、村内で新規事業を行い、過去にこの補助金を受けていないこと
  period: {status: unknown}
  url: https://www.vill.shimokitayama.nara.jp/kurashi/kigyoushien.html
  checked: 2026-11-07
  confidence: official
  note: 村のページ「起業支援補助金制度」（更新日・受付期間・年度の記載なし。WebFetch の要約）。村のお知らせに「起業支援補助金の2次募集を開始しました。」（2019-08-15）があり、年度ごとの募集とみられるが、2026年度の募集はサイトで確かめられない（地域振興課 07468-6-0001 に確かめる）。rate_num は総事業費240万円以上・80点以上の1/2（最も高い評価の場合。240万円未満なら最大4/5）。既存事業者の新規事業にも使え、研修受講費が対象経費に入るので training を △ にした。AI・IT の名指しはない
  fuenn_note: 下北山村で起業する人や、村内の事業者が新しい事業を始めるとき、改修・備品・研修受講・設備・広告の費用を審査の点数に応じて最大4/5（上限120万〜200万円）補助する村の制度です。募集の時期は村の地域振興課に確かめてください。
