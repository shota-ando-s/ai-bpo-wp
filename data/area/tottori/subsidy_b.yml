# 鳥取県の14町1村（岩美町・若桜町・智頭町・八頭町・三朝町・湯梨浜町・琴浦町・北栄町・大山町・南部町・伯耆町・日南町・日野町・江府町・日吉津村）の AI・IT・DX・研修向けの補助金（2026年度）。2026-10-31に、県の「とっとり産業支援ナビ」の市町村支援メニュー（県の支援施策DB、令和8年度施策。各町村の掲載は2026-07-27更新）と町の公式ページ・要綱で確認
# 15町村とも、AI・生成AI を名指しした町村独自の補助金はない
# IT に使える町独自の制度は、琴浦町 中小企業ステップアップ支援補助金の「DX推進（IT導入）」（ソフトウェア導入費・ホームページ/ECサイト構築費・キャッシュレス決済導入費・デジタル技術導入支援費〔専門家への助言依頼費・研修費〕、1/2・上限20万円・下限5万円、琴浦町商工会の確認が必要）だけで、令和8年度の申請は2026-10-30で締切
# 国・県の補助金への上乗せ: 伯耆町 本気で頑張る産業支援事業「国・県等制度利用支援事業補助金」（国・県等の補助制度を使う事業の事業者負担額の1/2以内、上限50万円/年・下限5万円/年。国・県の補助率が70％以上なら対象外。町の産業振興に寄与すると町長が認める場合）。国のデジタル化・AI導入補助金が対象になるかは要綱に例示がなく、町に確認が要る
# 研修: 伯耆町 人材育成支援事業補助金（研修講師の招へい・先進地視察、1/2・上限5万円）。専門人材: 日南町 チャレンジ企業支援事業（副業・兼業人材活用支援、プロ人材拠点の支援を受けた外部人材の雇用・委託費、1/2・上限30万円）
# 創業・新事業・販路開拓の補助（八頭町・三朝町・湯梨浜町・南部町・江府町・岩美町・日南町の経営改善など）は、対象経費に IT・ソフトウェアが明記されていないため入れていない（subsidy_b_areas.md）
# 期間の status は data/subsidies/README.md の値（open / closed / rolling / unknown）を使う。受付期間の明記がなく予算の範囲内で受け付けるものは rolling

- id: tottori-kotoura-stepup
  name: 琴浦町中小企業ステップアップ支援補助金（DX推進〔IT導入〕）
  org: 琴浦町（商工観光課 商工担当。琴浦町商工会の確認が必要）
  area: tottori/kotoura
  max_yen: 200000
  rate: 1/2、上限20万円（予算枠に達する場合は残予算額が上限）・下限5万円
  rate_num: 0.5
  targets: {efficiency: ○, consulting: △, training: △}
  expenses: DX推進（IT導入）はホームページ・ECサイトの構築費（外注費・インフラ整備費等）、ソフトウェア導入費（初回導入のみ。ライセンス費用・カスタマイズ費用等）、キャッシュレス決済導入費（初回導入のみ）、デジタル技術導入支援費（初回導入のみ。専門家への助言依頼費、研修費等）。通信費・サブスクリプション・リース料などのランニングコストと、汎用性の高いパソコン・タブレットは対象外。ほかに新商品・新役務の開発（ふるさと納税返礼品に係るもの）と販路開拓・拡大の区分がある
  conditions: 町内に本社などの主たる事業所を有する中小企業者・個人事業主（企業組合・事業協同組合・農協・漁協・NPO法人等も可）。申請に琴浦町商工会の確認が必要
  period: {status: closed, start: 2026-04-07, end: 2026-10-30}
  url: https://www.town.kotoura.tottori.jp/docs/2026040600022/
  checked: 2026-10-31
  confidence: official
  note: 町のページ（掲載2026-04-07）を WebFetch で確認（curl は接続リセット）。申請受付期限は2026-10-30（期限内でも予算枠に達し次第締切）、補助対象期間は2027-02-28まで。2026-10-31時点で受付は終わっている。クラウドの月額利用料（サブスクリプション）は対象外で、AI の語はない。とっとり産業支援ナビの掲載（2026-07-27更新）は「DX推進(IT導入)に関する事業」と同じ費目。補助金ポータル（二次情報）には令和7年度は2025-09-25に予算上限で受付終了とある。要綱 PDF は開いていない。問い合わせは 0858-52-1713、syoukoukankou@town.kotoura.tottori.jp
  fuenn_note: 琴浦町内の中小企業が、ソフトウェアやホームページ・ECサイト、キャッシュレス決済を初めて導入する費用（専門家の助言・研修費を含む）を1/2、最大20万円補助する町の制度です。2026年度の申請は10月30日で締め切られました。

