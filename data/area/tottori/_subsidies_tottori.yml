# 結合で直した点（案）: (1) 収益力強化型の rate_small_num を外した（2/3 は県の経営診断を受けた小規模企業者だけ。診断は従業員数だけで小規模と判定するため、外さないと診断を受けていない小規模企業にも2/3で出る）、(2) 大規模成長投資型の efficiency を ○→△（5％以上の賃上げと付加価値額3年9％以上の伸びが要件の大型投資向けで、AI ツールの導入の組み合わせの一番上に出すと誤解を招く）、(3) 収益力強化型→賃上げ環境整備型に exclusive_with（募集要領「3類型の同時応募不可」。片方だけに書いた。3組すべてに書くと、鳥取県のすべての地域・目的で警告が3行出るため、○ どうしの1組だけにした。大規模成長投資型との併用不可は conditions にある）
