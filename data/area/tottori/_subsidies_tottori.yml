# 県で生成AIを名指しした補助金は「鳥取県中小企業DX推進支援補助金【生成AIの利活用】」（産業未来創造課。DX戦略策定支援型1/2・100万円・5件程度、実装支援型〔製造業のみ〕1/2・1,000万円・2件程度）。令和8年度の募集は2026-06-12〜07-31で終わった（追加募集の告知はない）
# 県域で今申請できてAI・IT導入に使えるのは、県の「持続的な賃上げ・生産性向上支援補助金」（国の重点支援地方交付金を活用。システム導入費〔クラウドサービス利用料を含む〕・専門家経費・人材育成費が対象。賃上げ3％以上が要件。収益力強化型1/2〜3/4・200万〜500万円、賃上げ環境整備型1/2〜2/3・100万円、大規模成長投資型1/2・1,500万円。募集2026-10-14〜12-18、予算がなくなり次第終了）と、「鳥取県産業未来共創事業〈生産性向上・新技術導入推進型〉」（国の経営力向上計画の認定が前提、設備・新技術導入費など1/2・500万円、事業認定の第3回申請2026-11-02〜11-30・第4回2027-01-04〜01-29、商工団体経由）
# 研修・専門家: 県の工学エキスパート育成支援補助金（鳥取大学大学院の工学エキスパート養成プログラム〔AI・IoT・データサイエンス〕の検定料・入学料・授業料、1/2・年50万円、毎年度末に申請）、「週1副社長」推進加速化補助金（プロ人材拠点を通じて初めて副業・兼業人材を活用、8/10・50万円）。県の人材育成型専門家活用支援補助金（ICT分野のDX等、1/2・25万円）は2026-06-12で募集終了
# 市でAIを名指ししているのは、鳥取市 中小企業人材育成補助金（対象研修の区分に「AI、IoT、DX等の次世代技術・先端技術に関する講習」、1/2〔かがやき企業2/3〕・1人5万円・1企業20万円、2026-09-24に受付再開）だけ。鳥取市のリモートワーカー等外部人材活用補助金（デジタル人材の活用・業務プロセスの見直しの専門的支援、1/2・30万円〔かがやき企業50万円〕）も使える
# 市独自のAI・IT導入・研修向けの補助が見つからない市: 米子市・倉吉市・境港市（市のサイトの事業者向け補助の一覧と県の支援施策DBで確認）。倉吉市の経営者チャレンジアップ支援事業費補助金（2/3・30万円）は人材確保・女性活躍・子育て応援の取組が対象で、研修は女性のキャリアアップ研修に限られるため入れていない
