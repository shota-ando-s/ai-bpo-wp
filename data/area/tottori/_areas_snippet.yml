# data/subsidies/areas.yml の末尾に足す鳥取県の部分（D34、2026-10-31）。親が最後に areas.yml に入れる（data/subsidies/tottori.yml〔案は data/area/tottori/_subsidies_tottori.yml〕と同じコミット。areas.yml は直接編集していない）
# none: true は _subsidies_tottori.yml にその市町村の制度が1件もない15市町村（米子市・倉吉市・境港市と、琴浦町・伯耆町・日南町以外の12町村）。琴浦町は今年度の受付を終えた制度しかないが、yml に制度があるので none にせず、note の一文目で状況を書いた
# 並びは県の3地区（東部・中部・西部。県「令和7年国勢調査」第2表の注、stats.md の region）の順、地区の中は市→郡の町村の順（西部は西伯郡→日野郡）
# 町村のサイトを開いていない9町村（岩美町・若桜町・智頭町・三朝町・北栄町・大山町・南部町・日野町・日吉津村）は、県の支援施策データベース（とっとり産業支援ナビ）の市町村支援メニューだけで判断した（subsidy_b_areas.md）。note は「確かめた範囲で見つかりませんでした」と書き、ないと断定しない。米子市は市の補助金一覧（43134.htm）が開けず（D34 も 2026-10-31 に 404 を確認）、商工課のページとナビで判断した
# none の callout は「AI・IT導入向けの独自の補助金が見つかりませんでした」と出るので、none の note は確かめ方・相談先・取り違えの注意を書く
- code: tottori
  name: 鳥取県
  cities:
    - {code: tottori/tottori-city, name: 鳥取市, note: 中小企業人材育成補助金は、市内の中小企業がAI・IoT・DXなどの専門的な研修を受けたり自社で開いたりする費用に1/2（かがやき企業は2/3。1人5万円・1社20万円まで）を補助し、2026-09-24から受付を再開しています（2026-10-31確認）。経費を支払う2週間前までの申請が必要です。デジタル人材などの外部人材の活用や業務の見直しを1/2（上限30万円）補助するリモートワーカー等外部人材活用補助金もあります}
    - {code: tottori/iwami, name: 岩美町, note: 町独自のAI・IT導入の補助金は見つかりませんでした（2026-10-31確認）。県の持続的な賃上げ・生産性向上支援補助金の交付を受けた町内の中小企業に、県の交付額の1/2（上限100万円）を町が上乗せする支援金があり、2027年2月末まで申請できます。岩美町の商工観光課か岩美町商工会に確認してください。島根県の石見地方とは別の町です}
    - {code: tottori/wakasa, name: 若桜町, none: true, note: 町のサイトでは確かめておらず、県の支援施策データベース（とっとり産業支援ナビ）で確かめた範囲で、町独自のAI・IT導入や研修の補助金は見つかりませんでした（2026-10-31時点）。若桜町商工会に確認してください。八頭郡の若桜町で、福井県若狭町とは別の町です}
    - {code: tottori/chizu, name: 智頭町, none: true, note: 町独自のAI・IT導入や研修の補助金は見つかりませんでした（2026-10-31確認）。町のページに副業・兼業の外部人材の活用を支援する補助金の案内（2021年掲載）がありますが、今年度の受付は町の企画課に確認してください。智頭町商工会にも相談できます}
    - {code: tottori/yazu, name: 八頭町, none: true, note: 町独自のAI・IT導入や研修の補助金は見つかりませんでした（2026-10-31確認）。新事業展開などを1/2（上限20万円）補助する「出る杭を伸ばす」事業者応援補助金でシステムの経費が対象になるかは、町の商工観光室か八頭町商工会に確認してください}
    - {code: tottori/kurayoshi, name: 倉吉市, none: true, note: 市独自のAI・IT導入や研修の補助金は見つかりませんでした（市の商工業補助制度のページ、2026-10-31確認）。倉吉商工会議所か市のしごと定住促進課に確認してください}
    - {code: tottori/misasa, name: 三朝町, none: true, note: 町のサイトでは確かめておらず、県の支援施策データベース（とっとり産業支援ナビ）で確かめた範囲で、町独自のAI・IT導入や研修の補助金は見つかりませんでした（2026-10-31時点）。三朝町商工会に確認してください}
    - {code: tottori/yurihama, name: 湯梨浜町, none: true, note: 町独自のAI・IT導入や研修の補助金は見つかりませんでした（2026-10-31確認）。創業・販路開拓支援補助金でシステムの経費が対象になるかは、町の産業振興課か湯梨浜町商工会に確認してください}
    - {code: tottori/kotoura, name: 琴浦町, note: ソフトウェアやホームページ・ECサイト、キャッシュレス決済の初めての導入に1/2（上限20万円）を補助する中小企業ステップアップ支援補助金（DX推進〔IT導入〕）は、2026年度の申請が2026-10-30で締め切られました（2026-10-31確認）。琴浦町商工会か町の商工観光課に確認してください}
    - {code: tottori/hokuei, name: 北栄町, none: true, note: 町独自のAI・IT導入や研修の補助金は見つかりませんでした（2026-10-31確認）。複業人材の報酬の1/2（上限45,000円）などを補助する「はじめての複業活用支援事業補助金」があり、外部の人材にAI・デジタル化の相談をするときに使えるかは町に確認してください。北栄町商工会にも相談できます}
    - {code: tottori/yonago, name: 米子市, none: true, note: 市の補助金一覧のページを開けなかったため、商工課の中小企業者への支援のページと県の支援施策データベースで確かめた範囲で、市独自のAI・IT導入や研修の補助金は見つかりませんでした（2026-10-31時点）。米子商工会議所か市の商工課に確認してください}
    - {code: tottori/sakaiminato, name: 境港市, none: true, note: 市独自のAI・IT導入や研修の補助金は見つかりませんでした（市の事業者向け支援のページ、2026-10-31確認）。境港商工会議所か市の水産商工課に確認してください}
    - {code: tottori/hiezu, name: 日吉津村, none: true, note: 村のサイトでは確かめておらず、県の支援施策データベース（とっとり産業支援ナビ）で確かめた範囲で、村独自のAI・IT導入や研修の補助金は見つかりませんでした（2026-10-31時点）。米子日吉津商工会に確認してください}
    - {code: tottori/daisen, name: 大山町, none: true, note: 町独自のAI・IT導入や研修の補助金は見つかりませんでした（2026-10-31確認）。大山町商工会に確認してください。西伯郡の大山町（だいせんちょう）で、秋田県大仙市とは別の町です}
    - {code: tottori/nanbu, name: 南部町, none: true, note: 町独自のAI・IT導入や研修の補助金は見つかりませんでした（2026-10-31確認）。南部町商工会に確認してください。西伯郡の南部町で、青森県・山梨県の南部町とは別の町です}
    - {code: tottori/hoki, name: 伯耆町, note: 国・県の補助金を使う事業の自己負担分に1/2以内（年5万〜50万円）を町が上乗せする国・県等制度利用支援事業補助金があります（2026-10-31確認）。国のデジタル化・AI導入補助金が対象になるかは要綱に書かれていないため、申請前に町の産業課 商工観光室に確認してください。研修講師の招へいなどを1/2（上限5万円）補助する人材育成支援事業補助金もあります}
    - {code: tottori/nichinan, name: 日南町, note: 町独自のAI・IT導入の補助金は見つかりませんでした（2026-10-31確認）。とっとりプロフェッショナル人材戦略拠点の支援を受けて専門知識のある外部人材を3か月以上雇用・委託する費用を1/2（上限30万円）補助するチャレンジ企業支援事業（副業・兼業人材活用支援）があります}
    - {code: tottori/hino, name: 日野町, none: true, note: 町独自のAI・IT導入や研修の補助金は見つかりませんでした（2026-10-31確認）。日野町商工会に確認してください。日野郡の日野町で、滋賀県日野町とは別の町です}
    - {code: tottori/kofu, name: 江府町, none: true, note: 町独自のAI・IT導入や研修の補助金は見つかりませんでした（2026-10-31確認）。江府町商工会か町の産業建設課に確認してください。日野郡の江府町（こうふちょう）で、山梨県甲府市とは別の町です}
