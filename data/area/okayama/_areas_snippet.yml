    - {code: okayama/satosho, name: 里庄町, none: true, note: 町の企業支援のページで確かめた範囲で、町独自のAI・IT導入や研修の補助金は見つかりませんでした（2026-11-03確認）。浅口商工会（里庄地区支援センター）か町役場に確認してください}
