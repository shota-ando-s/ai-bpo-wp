# 案（D34、2026-11-03）。data/subsidies/areas.yml の末尾に足す岡山県の部分。親が最後に areas.yml に入れる（data/subsidies/okayama.yml〔案は data/area/okayama/_subsidies_okayama.yml〕と同じコミット。areas.yml は直接編集していない）
# none: true は _subsidies_okayama.yml にその市町村の制度が1件もない19市町村（笠岡市・総社市・高梁市・備前市・瀬戸内市・赤磐市・美作市と10町2村）。玉野市は今年度の受付を終えた制度しかないが、yml に制度があるので none にせず、note の一文目で状況を書いた
# 並びは県の3県民局（stats.md の region_kenmin。県 税務課「県税を扱う県の事務所と管轄区域」2024-12-16更新）の順: 備前（7）→ 備中（10）→ 美作（10）。県民局の中は市（自治体コード順）→ 町村（自治体コード順）
# 15市は市の商工担当課の記事一覧、10町2村は町村のサイトの事業者向けページ・商工担当課の記事一覧を開いて確かめた（subsidy_a_areas.md・subsidy_b_areas.md。県の補助金リストだけでは判断していない）。新庄村は https では開けないが http で開けた（2026-11-03、執筆担当 W2）。事業者向けページの商工業の支援は起業家支援資金（貸付）だけで、補助金は見つからなかった
# none の callout は「AI・IT導入向けの独自の補助金が見つかりませんでした」と出るので、none の note は確かめ方・相談先（商工会議所・商工会は gov_ai.md の対応表）・使える近隣の制度・取り違えの注意を書く
# 岡山市（okayama-city）は岡山県と別、新庄村（shinjo-village）は山形県新庄市（yamagata/shinjo）と別、備北商工会（高梁市）は広島県庄原市の同名の団体と別、の注意を note に入れた
# 津山市（つやま産業支援センター）の補助金は津山市内に本社・主たる事業所・工場がある事業者が対象（県の補助金リストの記載）で、県北の町村にだけ事業所がある事業者は使えない＝鏡野町・奈義町・久米南町・美咲町の note に入れた
- code: okayama
  name: 岡山県
  cities:
    - {code: okayama/okayama-city, name: 岡山市, note: IoT機器のデータをAIで分析するなどのIoT・AI・ロボット（RPAを含む）の本格導入に1/3（上限750万円）を補助するIoT・AI等先端技術導入支援補助金（検証済み先端技術導入事業）は、2026-11-30まで今年度最後の募集をしています（2026-11-03確認）。対象は前年度に市の事前検証事業を行った事業者か、独自に同等の検証をした事業者です。DX推進事業補助金（上限1,000万円）は2026-10-15で募集を終えました。市の産業振興課 ものづくり振興係か岡山商工会議所に確認してください。岡山県の制度とは別の、岡山市の制度です}
    - {code: okayama/tamano, name: 玉野市, note: 業務管理ソフトやテレワーク用の機材などの導入に1/2（上限30万円）を補助した中小企業職場環境整備補助金（デジタル活用推進）は2026-07-15に、研修の費用を1/2（上限10万円）補助した人材確保支援事業補助金（人材育成）は2026-10-02に、いずれも予算に達して受付を終えました（2026-11-03確認）。市の商工・企業立地課か玉野商工会議所に確認してください}
    - {code: okayama/bizen, name: 備前市, none: true, note: 市の補助制度の一覧で確かめた範囲で、市独自のAI・IT導入や研修の補助金は見つかりませんでした（2026-11-03確認）。備前商工会議所・備前東商工会か市の産業振興課 商工振興係に確認してください}
    - {code: okayama/setouchi, name: 瀬戸内市, none: true, note: 市の中小企業支援のページで確かめた範囲で、市独自のAI・IT導入や研修の補助金は見つかりませんでした（2026-11-03確認）。瀬戸内市商工会か市の産業戦略課に確認してください}
    - {code: okayama/akaiwa, name: 赤磐市, none: true, note: 市の中小企業等向け支援制度のページで確かめた範囲で、市独自のAI・IT導入や研修の補助金は見つかりませんでした（2026-11-03確認。ホームページの作成を1/2〔上限5万円〕補助する制度はあります）。中小企業診断士に無料で相談できる赤磐市産業支援センターか、赤磐商工会に確認してください}
    - {code: okayama/wake, name: 和気町, none: true, note: 町の中小企業等支援のページで確かめた範囲で、町独自のAI・IT導入や研修の補助金は見つかりませんでした（2026-11-03確認）。和気商工会か町の産業振興課に確認してください}
    - {code: okayama/kibichuo, name: 吉備中央町, none: true, note: 町の企業支援のページで確かめた範囲で、町独自のAI・IT導入や研修の補助金は見つかりませんでした（2026-11-03確認）。吉備中央町商工会か町の協働推進課 商工観光班に確認してください}
    - {code: okayama/kurashiki, name: 倉敷市, note: 人「財」育成支援補助金は、DX（ICTツールの導入やデジタル技術の活用）などの市の指定分野の研修を従業員に受けさせる受講料などを4/5（最大10万円）補助し、2027-02-26まで申請できます（2026-11-03確認。交付決定のあとに受講したものが対象）。AI・IoT・ロボットの導入に2/3（上限100万円）を補助した金融機関連携型中小企業支援事業費補助金（デジタル化推進事業）は、二次募集が2026-09-14で終わりました。市の商工課に確認してください}
    - {code: okayama/kasaoka, name: 笠岡市, none: true, note: 市の商工業のページで確かめた範囲で、市独自のAI・IT導入や研修の補助金は見つかりませんでした（2026-11-03確認）。笠岡商工会議所か市の商工観光課 商工労政係に確認してください}
    - {code: okayama/ibara, name: 井原市, note: 先端設備等導入促進事業補助金は、市の認定を受けた先端設備等導入計画にもとづいて取得した設備（1件30万円以上）の費用を1/3（年100万円まで、賃上げの要件を満たせば150万円）補助し、その年に取得した設備を翌年1月に申請します（2026-11-03確認）。AI・ITの名指しはなく、ソフトウェアが対象になるかは市の商工課に確認してください。井原商工会議所・備中西商工会も相談先です}
