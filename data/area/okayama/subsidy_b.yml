# 岡山県の10町2村（和気町・早島町・里庄町・矢掛町・鏡野町・勝央町・奈義町・久米南町・美咲町・吉備中央町・新庄村・西粟倉村）の AI・IT・DX・研修向けの補助金（2026年度）。2026-11-03に各町村の公式サイトの事業者向けのページ・商工担当課の記事一覧（西粟倉村は WordPress の検索 API で「補助金」「デジタル」「事業者」「研修」の記事も）と、県産業振興課の「補助金等情報 現在募集中」（補助金リスト 2026.10.30時点）https://www.pref.okayama.jp/uploaded/life/997329_9609254_misc.pdf で確認
# 11町村とも、AI・生成AI・IT導入・研修・外部人材を補助する町村独自の制度は見つからなかった。このファイルに制度は入れていない（空の配列）
# 新庄村（岡山県真庭郡新庄村、shinjo-village）は公式サイト（www.vill.shinjo.okayama.jp）が https で SSL エラー、http で 503（curl・WebFetch とも）で確かめられなかった。「制度なし」と断定していない（subsidy_b_areas.md）
# 町村の事業者が使える近隣・県の制度: 県のプロフェッショナル人材確保支援補助金・おかやま働き方改革推進応援金（subsidy_a.yml）。津山市のつやま産業支援センターの補助金は、県の補助金リストの記載では「津山市内に本社又は主たる事業所もしくは工場を有する事業者」が対象で、県北の町（鏡野町・勝央町・奈義町・久米南町・美咲町）にだけ事業所がある事業者は使えない
