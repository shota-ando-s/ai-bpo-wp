# 町村の事業者が使える近隣・県の制度: 県のプロフェッショナル人材確保支援補助金・おかやま働き方改革推進応援金（subsidy_a.yml）。津山市のつやま産業支援センターの補助金は、県の補助金リストの記載では「津山市内に本社又は主たる事業所もしくは工場を有する事業者」が対象で、県北の町（鏡野町・勝央町・奈義町・久米南町・美咲町）にだけ事業所がある事業者は使えない
