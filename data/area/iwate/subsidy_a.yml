# 盛岡市・宮古市・久慈市・陸前高田市・二戸市・八幡平市・滝沢市は市独自のAI・IT・研修向け補助金なし（subsidy_a_areas.md に確認したページを記載）。盛岡市の人材育成補助金は2026-03-31で終了
# 県の補助金一覧ページ（青森県のような月ごとの一覧PDF）は見つからなかった。県「補助・融資（商工労働観光部）」https://www.pref.iwate.jp/kensei/tetsuzuki/hojo/shoko/index.html は国庫補助・制度融資・グループ補助金の様式だけ。県の制度は「その他公募情報」https://www.pref.iwate.jp/kensei/nyuusatsu/1010807/index.html とセンターのトップページのお知らせで拾った
