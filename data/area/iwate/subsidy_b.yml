# 岩手県内15町4村（雫石・葛巻・岩手・紫波・矢巾・西和賀・金ケ崎・平泉・住田・大槌・山田・岩泉・軽米・洋野・一戸・田野畑・普代・野田・九戸）2026年度
# 確認日 2026-10-18。根拠は subsidy_b_areas.md
# 岩手町（iwate/iwate-town）は県と同名。ここに載せたのは岩手町役場の制度だけで、岩手県の制度は入れていない
# 既存の中小企業がソフトウェア・システム・デジタル機器の導入に使える町村独自の制度を確認できたのは3町
#   - 山田町 省力化対策支援事業費補助金（国の「デジタル化・AI導入補助金」「中小企業省力化投資補助金」の採択案件に1/5・上限60万円を上乗せ）
#   - 葛巻町 くずまき型持続可能な産業づくり支援事業費補助金の電子化推進事業（ウェブコンテンツの強化、タブレット端末等の導入、電子マネー対応。1/2・上限50万円）
#   - 大槌町 地域基幹産業人材確保支援事業費補助金のDX推進事業（水産加工業だけ。データ管理システムの導入等。1/2・上限1,000万円。県の事業計画選定が条件）
# 研修の受講料を対象にする町村独自の制度: 葛巻町（ものづくり人材育成・経営品質向上。1/2・50万円）、岩手町（新規雇用等研修費。1/3・1人5万円）、一戸町（企業支援事業費の人材育成支援。2/3・30万円）、田野畑村（新規起業等支援の研修会等経費。受講料上限2万円）、平泉町（人材育成支援。資格取得。1/2・5万円）
# 外部専門家・コンサルタントの費用を対象にするのは葛巻町（経営品質向上事業で中小企業診断士・経営コンサルタントの招聘）、岩手町（起業チャレンジのコンサル料）、洋野町（創業支援の専門家謝金）、大槌町（DX推進事業の専門家謝金、6次産業化等の専門家謝金）
# 創業向けの制度は雫石（空き店舗）・葛巻・岩手町・矢巾・西和賀・金ケ崎・平泉・大槌・山田・洋野・田野畑・野田の12町村で確認した（岩手町・山田町・洋野町は第二創業・新事業も対象、野田村は新分野進出も対象）
# 紫波町・岩泉町・軽米町（商品開発の補助だけ）・九戸村は IT・DX・研修・創業向けの町村独自の制度を確認できなかった。住田町は町外企業のサテライトオフィス開設の補助だけ、普代村は起業支援事業補助金が村の一覧に名前だけ載っている（詳細は二次情報のみ。YAMLに入れず subsidy_b_areas.md に secondary として書いた）
# 町村のサイトに受付期間の記載がなく、ページの更新が古く2026年度の受付をページから判断できない制度は period.status を unknown にした（要綱・募集ページは公式なので confidence は official）
# status の rolling は、このリポジトリの data/subsidies の表記（随時受付・予算の範囲内で先着）に合わせた。2026年度のページ・一覧・チラシで実施が確認でき、締切の記載がないもの
# open の end は、ページに締切日がある場合はその日

