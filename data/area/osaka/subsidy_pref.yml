# 大阪府（府・公益財団法人 大阪産業局・府域の機関）の2026年度の中小企業向け補助金。2026-11-14に府のサイト（www.pref.osaka.lg.jp。curl が 408〔WAF〕・接続リセットのページは WebFetch）の「賃金引上げに向けた支援策一覧」（/o110010/shokosomu/chinage2023/index.html、更新日 2026-10-16）、商工労働部の各事業のページ・募集要項、府の「令和７年度 中小企業の振興に関する施策の実施状況」、大阪産業局（obda.or.jp・obdx.jp）、Jグランツの公開API（target_area_search=大阪府・keyword=大阪）で確認
# 府で今（2026-11-14）新しく申請できる、IT・AIの導入費を補助する中小企業向けの補助金はない。今年度の柱だった「利益率向上・賃上げ支援事業補助金」（専用ソフトウェア・情報システムの購入・構築も対象、2/3・上限500万円、600者程度の予定で737者を採択）は 2026-05-25〜06-26 で受付を終えた
# 国の業務改善助成金への府の上乗せ「大阪府業務改善・賃上げ促進補助金」（国の対象経費×1/4・上限200万円）は、事前登録 2026-09-01〜09-30 が必須で終了。交付申請 2026-12-01〜2027-03-10 は事前登録した事業者だけ。national.yml に業務改善助成金の id がないので addon・stacking は書いていない（note に記録）
# 府域の無料・低額の支援（補助金ではない。yml に入れていない。subsidy_pref_areas.md・gov_ai.md）: 大阪デジタル・AI活用促進プロジェクトの無料相談（大阪産業局、オンライン1時間）、大阪府よろず支援拠点・大阪府生産性向上支援センター（無料）、大阪府DX推進パートナーズ（マッチング、費用の記載なし）。同プロジェクトのセミナーは有料（1,000円・3,000円）
# 国の補助金への上乗せ（addon）: 国のデジタル化・AI導入補助金・省力化投資補助金・ものづくり補助金への府の上乗せは見つからない。利益率向上・賃上げ支援事業は募集要項 PDF p.14 で「同一の商品・サービス等の経費について、国又は地方公共団体等からの補助金の重複受給は認められません」
# 大阪市の制度（大阪市「AI活用 現場スマート化補助金」〔大阪市の交付金で大阪産業局 ソフト産業プラザTEQS が実施〕など）は府の制度ではないので入れていない（govsub_1 の subsidy_1.yml）。府「AIオンデマンド交通モデル事業費補助金」（令和5年度 3件）は交通事業者と市町村の実証の補助で中小企業一般向けではないので入れていない
# 市町村の補助金は govsub_1〜4 の subsidy_1〜4.yml
# 期間の status は data/subsidies/README.md の値（open / closed / rolling / unknown）を使う

- id: osaka-rieki-chinage
  name: 令和8年度 利益率向上・賃上げ支援事業補助金
  org: 大阪府（商工労働部。事務局は 令和8年度利益率向上・賃上げ支援事業事務局〔公益財団法人大阪産業局〕）
  area: osaka
  max_yen: 5000000
  rate: 補助対象となる経費総額の2/3以内。上限500万円（下限の記載なし）
  rate_num: 0.667
  targets: {efficiency: ○, consulting: △, training: △}
  expenses: 利益率向上に向けた取組みに必要な、機械装置・システム構築費（専ら補助事業のために使う単価5万円〔税抜〕以上の機械装置・工具器具、専用ソフトウェア・情報システム等の購入・構築・借用、クラウドサーバーの領域の借用・サーバー上のサービス利用料）、開発費、専門家経費、外注費、知的財産権等関連経費、広告宣伝・販売促進費（マーケティングツールの初期費用・利用料を含む）、研修費（新たに導入する機械装置やシステムを扱うための研修など。補助対象経費総額の1/3まで）。汎用性があり目的外使用になり得るもの（事務用のパソコン・プリンタ・タブレット端末・スマートフォン・デジタル複合機・文書作成ソフトウェア・生成AI・カメラ等）、自社の人件費、一般的なスキルアップの研修は対象外
  conditions: 府内で事業を行う中小企業（個人事業主を含む）等。従業員の給与支給総額を2.0%以上引き上げる目標を従業員に宣言し、宣言書を添付すること。追跡調査への回答に同意すること。常時使用する従業員が1人以上。採択は予算の範囲内で600者程度（うち100者に専門家の伴走支援）。同一の経費で国・地方公共団体等の補助金との重複受給は不可
  period: {status: closed, start: 2026-05-25, end: 2026-06-26}
  url: https://www.pref.osaka.lg.jp/o110050/keieishien/rieki/riekiritur8.html
  checked: 2026-11-14
  confidence: official
  note: 府のページ（更新日 2026-10-09、ページID 125966。curl は 408、WebFetch）で「令和8年6月26日 令和8年度の募集を締め切りました。」。採択結果を 2026-08-06 に公表、09-01 更新で採択者 737者（府のページ）。募集要項 https://www.pref.osaka.lg.jp/documents/125966/r8rieki_bosyuyoukou.pdf （30ページ。WebFetch で保存した PDF を pdftotext で読んだ。PDF p.3 事業概要、p.5 要件、p.8 補助対象事業の例「専門家による診断を踏まえ、AI 搭載システムを導入して業務プロセスの見直しを実施した。」、p.9〜10 対象経費・対象外経費〔「生成 AI」は汎用品として対象外〕、p.11 機械装置・システム構築費の具体例、p.13 研修費、p.14 重複受給の禁止）。補助対象期間は交付決定日（2026年8月上旬予定）〜2027-01-31。物価高騰対応重点支援地方創生臨時交付金を活用した事業（来年度の実施は未発表のため next_expected は書かない）。事務局 050-5530-2226
  fuenn_note: 大阪府内の中小企業が、賃上げの目標を宣言して、利益率を高める専用ソフトウェアや情報システム、機械などを入れる費用を2/3、最大500万円補助する府の制度でした。2026年度の募集は6月26日で締め切られました。汎用の生成AIツールやパソコンは対象外です。

