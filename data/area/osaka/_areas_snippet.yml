# 案（D34、2026-11-14 のデータ）。data/subsidies/areas.yml に足す大阪府と43市町村の行。親が data/subsidies/osaka.yml（案は data/area/osaka/_subsidies_osaka.yml）と同じコミットで areas.yml の末尾（aichi の後）に入れる（areas.yml は直接編集していない。今の areas.yml に大阪府の行はない）
# none: true は _subsidies_osaka.yml にその市町村の制度が1件もない24市町村（13市・10町・1村）。どれも市町村の公式サイトの事業者向けのページ・補助金の一覧で確かめて見つからなかった（subsidy_1〜4_areas.md）。忠岡町はイメージアップ補助（HP作成など）を診断データから外したので none にした
# 今年度の受付を終えた制度しかない大東市・堺市、受付状況が分からない制度（unknown）しかない摂津市・河内長野市は、yml に制度があるので none にせず note の一文目で状況を書いた（埼玉県越谷市・三郷市と同じ）
# 並びは府の統計の地域区分（spec/D1.md「府の地域区分」）: 大阪市地域（1）→ 豊能（5）→ 三島（5）→ 北河内（7）→ 中河内（3）→ 南河内（9）→ 泉北（5。堺市を含む）→ 泉南（8）
# 「無料」と書いたのは資料に無料とあるものだけ: 摂津ビジネスサポートセンター（相談 無料）、大東市 D-Biz（費用 無料）、門真市中小企業サポートセンター（費用 無料）、八尾商工会議所のデジタルツールお悩み相談（相談料 無料）、東大阪商工会議所の ITなんでも相談窓口（IT専門家を無料で派遣）・東大阪市の専門家による経営相談（無料）、河内長野市経営相談会（無料）、大阪狭山市商工会の個別相談会（無料）、堺市の産業DX支援センター（利用は無料）、泉佐野市の経営相談（無料）。ほかの商工会議所・商工会は「無料」と書いていない。セミナーは日付が過ぎるので note に入れていない（記事の H2 9 で）
# 相談先は gov_ai.md の商工会議所（日商の一覧）・商工会（全国商工会連合会の名簿）と gov_ai_1〜4.md・subsidy_*_areas.md の担当課の電話（電話が分からないものは名前だけか書かない）。北大阪・守口門真・泉佐野・富田林商工会は地区が市町村をまたぐ
# note は yaml のフロー形式に入るので、半角のカンマ・コロン・波かっこを使っていない（scratchpad の d34/snippet.py で yaml として読めることを確かめた）
# 市町村の制度は市町村内に事業所がある事業者が対象で、近くの市町村の事業者は使えない。府の制度で今申請できる企業向けの IT・AI 導入の補助金はない
