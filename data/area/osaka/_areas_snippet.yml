    - {code: osaka/izumiotsu, name: 泉大津市, none: true, note: 泉大津市の事業者向けのページで確かめた範囲で、市独自のAI・IT導入や研修の補助金は見つかりませんでした（2026-11-14確認）。泉大津商工会議所（0725-23-1111）に相談できます}
    - {code: osaka/izumi-city, name: 和泉市, note: 和泉市の中小企業振興対策事業補助金（人材育成）は、大阪産業技術研究所（ORIST）や中小企業大学校など市が指定する機関の研修の受講料の1/2（年度20万円まで）を補助します（予算がなくなり次第終了（2026-11-14確認））。AIツールの導入費を補助する市独自の制度は見つかりませんでした。和泉商工会議所（0725-53-0330）に相談できます。ORISTの和泉センターは大阪府の機関です。鹿児島県出水市とは別の市です}
    - {code: osaka/takaishi, name: 高石市, none: true, note: 高石市の事業者向けのページで確かめた範囲で、市独自のAI・IT導入や研修の補助金は見つかりませんでした（2026-11-14確認）。高石商工会議所（072-264-1888）に相談できます}
    - {code: osaka/tadaoka, name: 忠岡町, none: true, note: 大阪府泉北郡忠岡町の事業者向けのページで確かめた範囲で、町独自のAI・IT導入や研修の補助金は見つかりませんでした（2026-11-14確認）。町のイメージアップ推進事業補助金はホームページやパンフレットの作成向けでAI向けではありません。忠岡町商工会（0725-33-3208）に相談できます}
    - {code: osaka/kishiwada, name: 岸和田市, note: 岸和田市のがんばる岸和田 企業経営支援補助金（デジタル化促進）は、市内の中小企業がAI導入やデジタル化のソフトウェア・クラウド製品（月額は6か月分まで）を入れる費用の1/2（上限30万円）を補助します。申込は事業の着手前で、2027-01-29必着です（予算に達し次第終了（2026-11-14確認））。研修の受講料の1/2（上限10万円）を補助する人材育成の区分もあります。岸和田商工会議所（072-439-5023）に相談できます}
    - {code: osaka/kaizuka, name: 貝塚市, note: 貝塚市の中小企業積極的事業展開促進補助金は、国や府の補助金を使った事業の自己負担分の1/2（10万〜100万円）を上乗せします。国の交付決定から3か月以内に申請し、国や府の支援の種類によっては対象にならないので、使う前に市の産業戦略課（072-433-7193）に確かめてください（2026-11-14確認）。貝塚商工会議所（072-432-1101）にも相談できます}
    - {code: osaka/izumisano, name: 泉佐野市, none: true, note: 泉佐野市の事業者向けのページで確かめた範囲で、市独自のAI・IT導入や研修の補助金は見つかりませんでした（2026-11-14確認）。市の消費生活センターで月2回、大阪府よろず支援拠点と連携した無料の経営相談があります。泉佐野商工会議所（泉佐野市・田尻町が地区。072-462-3128）にも相談できます}
    - {code: osaka/sennan, name: 泉南市, none: true, note: 泉南市の事業者向けのページで確かめた範囲で、市独自のAI・IT導入や研修の補助金は見つかりませんでした（2026-11-14確認）。泉南市商工会（072-483-6365）に相談できます}
    - {code: osaka/hannan, name: 阪南市, none: true, note: 阪南市の事業者向けのページで確かめた範囲で、市独自のAI・IT導入や研修の補助金は見つかりませんでした（2026-11-14確認）。阪南市商工会（072-473-2100）に相談できます}
    - {code: osaka/kumatori, name: 熊取町, note: 熊取町のスマート化による生産性向上補助金は、町内に主たる事業所がある中小企業がソフトウェアや自動化の装置・パソコン・専門家への謝礼・セミナーの受講料などにかける費用の2/3（上限75万円・1回限り）を補助します。熊取町商工会の会員であることと、商工会の支援で労働生産性の伸び率3%以上の計画を作りBCPを策定することが条件です（2026-11-14確認）。熊取町商工会（072-453-8181）に相談できます}
    - {code: osaka/tajiri, name: 田尻町, none: true, note: 大阪府泉南郡田尻町の事業者向けのページで確かめた範囲で、町独自のAI・IT導入や研修の補助金は見つかりませんでした（2026-11-14確認）。町に商工会はなく泉佐野商工会議所（072-462-3128）の地区です}
    - {code: osaka/misaki-town, name: 岬町, none: true, note: 大阪府泉南郡岬町の事業者向けのページで確かめた範囲で、町独自のAI・IT導入や研修の補助金は見つかりませんでした（2026-11-14確認）。岬町商工会（072-492-3311）に相談できます。岡山県美咲町とは別の町です}
