# 徳島県内15町1村（勝浦・上勝・佐那河内・石井・神山・那賀・牟岐・美波・海陽・松茂・北島・藍住・板野・上板・つるぎ・東みよし）2026年度
# 確認日 2026-10-17。根拠は subsidy_b_areas.md
# 既存の中小企業がIT・DX・研修に使える町独自の制度を確認できたのは東みよし町（中小企業者等応援事業補助金）だけ。北島町のデジタル販路の補助は締切済み
