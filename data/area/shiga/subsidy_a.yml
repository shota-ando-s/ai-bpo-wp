- id: shiga-mirai-toshi-sogo-3
  name: 滋賀県未来投資総合補助金（第3弾）
  org: 滋賀県（滋賀県未来投資支援事業。事務局は近畿日本ツーリスト株式会社を代表構成員とする共同企業体）
  area: shiga
  max_yen: 5000000
  rate: 賃上げ率算定対象の従業員1〜5名は2/3・上限50万円、6〜20名は1/2・上限200万円、21名以上は1/2・上限500万円（下限15万円）
  rate_num: 0.5
  targets: {efficiency: ○, consulting: △, training: ○}
  expenses: 生産性向上（機械装置等経費、システム・ソフトウェア費〔購入・構築・改良・委託〕、技術導入費、専門家経費）、新事業展開（開発・試作費、販売促進費など）、人材育成（研修費＝セミナー等受講料・教育機関の入学料・授業料、専門家経費）。交付決定日以降に発注し補助対象期間（〜2026-12-31）内に支払いを終えた経費
  conditions: 県内に事務所・事業所があり県内で事業を行う中小企業者等（NPO・農事組合法人・社会福祉法人等を含む）で、2025-12-31時点で事業を営み、常時使用する従業員が1名以上。常時使用する従業員の平均賃金を2025年12月支給分と比べて2026-01-01から事業完了までに3.5%以上引き上げる。申請は一次・二次を通じて1事業者1回。みなし大企業・県税の未納は対象外
  period: {status: closed, start: 2026-03-02, end: 2026-08-21}
  url: https://www.knt.co.jp/ec/shiga-miraitoshi_2026/
  checked: 2026-11-07
  confidence: official
  note: AIは名指ししていない（DXによる生産・業務の効率化、ロボット・物流システム・キャッシュレス決済の導入等、リスキリング）。事務局サイト（県の補助事業の公式の申請サイト）で一次募集 2026-03-02〜03-31、二次募集 06-08〜08-21 17:00（7/16に07-17から延長）、「2026.08.21 二次募集の受付は終了しました」。**手引き（令和8年2月、17ページ）https://www.knt.co.jp/ec/shiga-miraitoshi_2026/tebiki.pdf p1 の二次募集の締切は 07-17 のままで、延長はサイトのお知らせだけにある（食い違いではなく延長。end は延長後の 08-21）**。手引き p10 の経費表で、システム・ソフトウェア費と研修費（セミナー等受講料）が対象。クラウドの月額利用料の扱いは別紙1（開いていない）。rate_num は 6名以上の1/2（5名以下は2/3）。交付決定事業者一覧 dl/saitaku_jigyosha0929.pdf と業種別の活用事例（製造・建設・運輸・飲食宿泊）がサイトにある（開いていない）。県庁のページは開いていない。コールセンター 0570-001-178
  fuenn_note: 滋賀県が、平均賃金を3.5%以上引き上げる県内中小企業の、DX・ソフトウェア導入や従業員の研修などの費用を1/2〜2/3（従業員数に応じ最大500万円）補助した制度です。2026年度（第3弾）の受付は8月21日で終了しました。

- id: shiga-gyomu-kaizen-chinage
  name: 滋賀県業務改善・賃上げ支援事業補助金（令和8年度）
  org: 滋賀県（商工労働部 労働雇用政策課 労政福祉係）
  area: shiga
  max_yen: 1000000
  rate: 国の業務改善助成金の自己負担額（対象経費の支出済額−助成額）の1/2以内。上限は国の申請コースと引上げ労働者数で6万円〜100万円（90円コース・10人以上〔特例事業者〕で100万円）
  targets: {efficiency: △, consulting: ×, training: ×}
  expenses: 国の業務改善助成金の対象経費のうち、支出済額から助成額を除いた額（自己負担額）
  conditions: 県内の事業場規模30人未満の事業者で、2026-09-01以降に滋賀労働局へ業務改善助成金を交付申請し、2027-02-26までに交付額確定の通知を受けていること。労働者名簿・賃金台帳の整備、法令遵守、県税の未納なし。申請はしがネット受付サービスだけ（窓口・郵送不可）。予算額を超えると期限前でも受付終了
  period: {status: open, start: 2026-09-01, end: 2027-03-05}
  url: https://www.pref.shiga.lg.jp/fe00/28970.html
  checked: 2026-11-07
  confidence: official
  note: AIは名指ししていない。国の業務改善助成金（生産性向上の設備投資等と事業場内最低賃金の引上げ）への県の上乗せ。県のページ（更新日2026-09-10）で申請期限 2027-03-05（金）。報道発表 https://www.pref.shiga.lg.jp/fe00/press-release/32797.html （提供 2026-08-28）。上限の一覧表 https://www.pref.shiga.lg.jp/documents/28970/5616287.pdf （50円コース1人6万円〜90円コース10人以上100万円）。交付要綱 https://www.pref.shiga.lg.jp/documents/28970/5618633.pdf ・実施要領・手引は開いていない。国の業務改善助成金は national.yml にないため addon・addon_to は書いていない（計算は（経費−国の助成額）×1/2、福井県の上乗せと同じ扱い）。甲賀市の中小企業者等賃上げ環境整備補助金（社労士等の申請手続費用）と併用できる（甲賀市のページに明記）。問い合わせは 労働雇用政策課 労政福祉係
  fuenn_note: 滋賀県が、国の業務改善助成金を使って最低賃金を引き上げた事業場規模30人未満の事業者に、国の助成で残った自己負担の1/2（最大100万円）を上乗せする制度です。申請は2027年3月5日まで（予算に達すると終了）で、国の助成金の交付額確定が2027年2月26日までに要ります。

