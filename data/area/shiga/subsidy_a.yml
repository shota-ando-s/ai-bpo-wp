  conditions: 滋賀の新しい産業づくりチャレンジ計画の認定を受けた中小企業者等（キックオフステージは、認定要件を満たし県立の産業技術共創センターの支援を受ける場合も可）。成長産業枠（デジタル産業＝AI・IoT・ロボット・情報通信等、健康・Well-Being産業）とCO2ネットゼロ枠。自社の新製品・新技術の研究開発（調査研究・試作・実証実験）で、AIツールを業務に導入する費用の補助ではない。競争的資金
