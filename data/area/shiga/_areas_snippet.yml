# 案（D34、2026-11-07 のデータ）。data/subsidies/areas.yml の末尾に足す滋賀県の部分。親が最後に areas.yml に入れる（data/subsidies/shiga.yml〔案は data/area/shiga/_subsidies_shiga.yml〕と同じコミット。areas.yml は直接編集していない）
# none: true は「市町独自の制度」が _subsidies_shiga.yml に1件もない12市町（彦根市・近江八幡市・甲賀市・野洲市・高島市・東近江市・米原市・竜王町・愛荘町・豊郷町・甲良町・多賀町）。どれも公式サイトの事業者向け・商工業のページで確かめて見つからなかった（subsidy_a_areas.md・subsidy_b_areas.md）。callout は「独自の補助金が見つかりませんでした。滋賀県と国の制度を使います」と出る
# 草津市・湖南市は今年度の受付を終えた制度しかないが、yml に制度があるので none にせず、note の一文目で状況を書いた（岡山県玉野市・鹿児島県霧島市・栃木県さくら市と同じ）。長浜市（終了＋受付不明の福祉の制度）・日野町（創業・空き店舗の家賃と改修、受付期間の記載なし）も none なし。大津市・守山市・栗東市は受付中の制度がある
# 並びは県の7圏域の順（大津 → 湖南〔草津・守山・栗東・野洲〕→ 甲賀〔甲賀・湖南〕→ 東近江〔近江八幡・東近江・日野・竜王〕→ 湖東〔彦根・愛荘・豊郷・甲良・多賀〕→ 湖北〔長浜・米原〕→ 湖西〔高島〕）。県の観光入込客統計の地域・保健所の所管区域・ハローワークの管轄が同じ組み合わせ（stats.md「県の地域区分」）。圏域の中は自治体コード順
# none の callout は「AI・IT導入向けの独自の補助金が見つかりませんでした」と出るので、none の note は確かめ方・相談先（商工会議所・商工会は gov_ai.md の名簿、電話は日商 Assist Biz・全国商工会連合会の名簿）・無料と資料にある窓口・取り違えの注意を書く
# 「無料」と書いたのは資料に無料とあるものだけ: 滋賀県よろず支援拠点の長浜サテライト（拠点のサイト「相談料は何回利用しても無料です。」。長浜商工会議所1階）、北部産業技術共創センターの技術相談（県のページ「（無料）」）。産業支援プラザの DX相談サロンは一覧に参加費の記載がない＝書いていない
# 県の制度（業務改善・賃上げ支援、プラザのスキルアップ支援）は shiga の行で全地域に出るので、市町の note には書いていない。市の制度は市内に事業所がある事業者が対象で、近くの町の事業者は使えない
# 取り違えの注意: 大津市（熊本県大津町）、草津市（kusatsu-city。群馬県草津町）、守山市（名古屋市守山区）、湖南市（konan-shiga。高知県香南市、県の「湖南」圏域〔草津・守山・栗東・野洲〕）、日野町（hino-town-shiga。鳥取県日野町・東京都日野市）、甲賀市（こうか）、愛荘町（愛知郡。愛知県と別）を note に入れた
# 2026-07-07 の甲賀市信楽町の土砂崩れは note に入れない（事業者向けの制度は見つかっていない。AI 導入の補助と結び付けない）
