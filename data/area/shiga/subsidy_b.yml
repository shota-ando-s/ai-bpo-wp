# 滋賀県の6町（日野町・竜王町〔蒲生郡〕、愛荘町〔愛知郡〕、豊郷町・甲良町・多賀町〔犬上郡〕）の AI・IT・DX・研修・省力化・生産性向上・創業に使える町独自の補助金（2026年度）。2026-11-07に6町の公式サイトの事業者向け・商工業の分類ページと商工担当課の記事一覧を開いて確認（6町ともサイト内検索は curl から使えず、分類ページ・サイトマップで探した）
# AI・生成AI・IT導入・DXを名指しした町独自の補助金は、6町とも見つからなかった
# 入れたのは、店舗の改修・家賃にも使える一般の制度2件（日野町 創業支援事業補助金、日野町 空き家空き店舗活用支援事業補助金）。どちらも AI・デジタルの名指しはなく、IT 機器・ソフトは対象経費に書かれていない。targets は △ にした
# 受付状況: 日野町の2件はページ・要綱に受付期間の記載がない（unknown。要綱は「予算の範囲内」「交付決定日から当該年度末までに要する経費」）
# 国・県の補助金への上乗せ（addon）: 6町とも該当なし
# 入れなかった町の制度（IT 導入向けではない）: 愛荘町 中小企業等再エネ・省エネ設備等導入促進補助金（1/2・20万円、2026-07-01〜12-10）、多賀町 物価高騰対策・影響緩和支援事業（町の補助で多賀町商工会が実施、光熱費の支援金 上限1万円、2次募集 2026-09-30 で受付終了）、豊郷町 住宅リフォーム補助金（住民向け）、竜王町 軽自動車購入助成・希望かなえる輝竜の郷づくり活動支援事業（地域活動）など。subsidy_b_areas.md
# 期間の status は data/subsidies/README.md の値（open / closed / rolling / unknown）を使う
# 町ごとの確認したページ・制度がない町は subsidy_b_areas.md

- id: shiga-hino-town-sogyo-shien
  name: 日野町創業支援事業補助金（家賃補助事業・店舗改修費補助事業）
  org: 日野町（商工観光課 商工観光担当）
  area: shiga/hino-town-shiga
  max_yen: 500000
  rate: 家賃補助は家賃月額の1/2以内・月3.5万円（特定創業支援等事業の証明を受けた者は月5万円）・最大12か月分。店舗改修費補助は改修経費の1/4以内・35万円（特定創業支援等事業の証明を受けた者は50万円）
  rate_num: 0.25
  targets: {efficiency: △, consulting: ×, training: ×}
  expenses: 町内で新たに創業する店舗（商品を陳列して販売する建物・商品の製造または加工をする建物。事務所のみの建物は対象外）の家賃（3親等以内の親族との契約を除く）と改修経費（当該年度末までに工事代金の支払が完了するもの）。IT・ソフトウェアは対象経費に書かれていない
  conditions: 申請年度内に創業する者または申請時に創業から1年を経過しない者（事業を営んでいない個人の開業・会社設立。店舗での事業承継を含む）。過去にこの補助金を受けていない、週3日以上の営業、町長が認める業種、フランチャイズでない、風俗営業でない。店舗改修費は改修工事の着工前に申請。家賃が12月分に満たない場合は次年度4月に残りの月数分を申請できる
  period: {status: unknown}
  url: https://www.town.shiga-hino.lg.jp/0000004008.html
  checked: 2026-11-07
  confidence: official
  note: 町のページ（公開 2020-07-11、更新 2023-06-23）と交付要綱 PDF https://www.town.shiga-hino.lg.jp/cmsfiles/contents/0000004/4008/youkou.pdf （平成28年4月1日施行、令和2年4月1日改正の付則）で確認。受付期間・年度の記載はなく、2026年度の受付状況は書かれていない（要綱は「予算の範囲内」）。町のページの表は店舗改修の上限を「50万円/月」と書くが、要綱の別表は「５００千円」（月額ではない）。max_yen は改修費の上限（証明あり）。rate_num は改修費の1/4。商工会の創業塾（特定創業支援事業）を受けると上限が上がる。起業する人向けで、既存の事業者の IT 導入には使えない
  fuenn_note: 日野町で新しく店舗を開いて創業する人に、店舗の家賃の1/2（月3.5万円〔商工会の創業塾などの証明があれば月5万円〕・最大12か月）と改修費の1/4（35万円〔証明があれば50万円〕）を補助する町の制度です。受付期間は町のページに書かれていないので、改修の着工前に町の商工観光課へ確かめてください。

- id: shiga-hino-town-akiya-akitenpo
  name: 日野町空き家空き店舗活用支援事業補助金（家賃補助事業・店舗改修費補助事業）
  org: 日野町（商工観光課 商工観光担当）
  area: shiga/hino-town-shiga
  max_yen: 500000
  rate: 家賃補助は家賃月額の1/2以内・月5.0万円・最大12か月分。店舗改修費補助は改修経費の1/4以内・50万円
  rate_num: 0.25
  targets: {efficiency: △, consulting: ×, training: ×}
  expenses: 町内の空き家（6か月以上居住していない建物）・空き店舗（6か月以上営業していない店舗）を活用する店舗（商品を陳列して販売またはサービスをするための建物。事務所のみは対象外）の家賃（3親等以内の親族との契約を除く）と改修経費（併用住宅は非住居部分。当該年度末までに支払が完了するもの）。IT・ソフトウェアは対象経費に書かれていない
  conditions: 1年以上継続して営業が見込まれ週2日以上営業できること。日野町創業支援事業補助金を受けていないこと。町内の店舗からの移転で移転前の店舗が休業・廃業にならないこと。町長が認める業種、フランチャイズでない、風俗営業でない、暴力団員等でない、国税・町税の未納がない
  period: {status: unknown}
  url: https://www.town.shiga-hino.lg.jp/0000006293.html
  checked: 2026-11-07
  confidence: official
  note: 町のページ（公開 2022-03-29、更新 2023-06-23）と交付要綱 PDF https://www.town.shiga-hino.lg.jp/cmsfiles/contents/0000006/6293/yoko.pdf で確認。受付期間・年度の記載はなく、2026年度の受付状況は書かれていない（要綱は「予算の範囲内」）。総合計画実施計画（R8〜R10）の商工振興事務事業に「町内の空家・空店舗等を活用して事業を行う者への補助」（7,878千円の内数）とあり、事業は続いている。創業支援事業補助金と併用できない。店舗の家賃・改修向けで、AI・IT 導入の補助ではない
  fuenn_note: 日野町の空き家・空き店舗を使って店を開く事業者に、家賃の1/2（月5万円・最大12か月）と改修費の1/4（最大50万円）を補助する町の制度です。受付期間は町のページに書かれていないので、町の商工観光課へ確かめてください（創業支援事業補助金とは併用できません）。
