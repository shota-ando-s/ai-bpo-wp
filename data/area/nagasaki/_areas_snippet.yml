# 案（D345、2026-11-04）。data/subsidies/areas.yml の末尾に足す長崎県の部分。親が最後に areas.yml に入れる（data/subsidies/nagasaki.yml〔案は data/area/nagasaki/_subsidies_nagasaki.yml〕と同じコミット。areas.yml は直接編集していない）
# none: true は _subsidies_nagasaki.yml にその市町の制度が1件もない11市町（諫早市・壱岐市・五島市・雲仙市・長与町・時津町・東彼杵町・川棚町・小値賀町・佐々町・新上五島町）。壱岐市・五島市・新上五島町は国境離島の雇用機会拡充事業（3/4、雇用増を伴う創業・事業拡大が要件）が受付中だが、AI導入だけでは使えないため診断のデータに入れていない（親の決定）。note にも書かない（記事の H2 6 の末尾で1〜2文）
# 佐世保市・西海市は今年度の受付を終えた制度しかなく、島原市・松浦市は受付状況が分からない制度しかないが、yml に制度があるので none にせず、note の一文目で状況を書いた
# 長与町・佐々町は町のサイトにクラウドの環境から接続できず（curl で CONNECT 502、WebFetch で名前解決できない。subsidy 担当・D345 とも 2026-11-04）、町独自の制度を確かめられなかった。none: true にして note の一文目を「確かめられませんでした」にした（「ない」と断定しない。岡山の新庄村・広島の江田島市の案と同じ）
# 並びは自治体コード順（市13 → 町8）。代案は保健所の区分の順（判断 D4-6）
# 相談先の商工会議所・商工会は gov_ai.md の対応表。長与町（西そのぎ商工会）・東彼杵町と波佐見町（東彼商工会の支所）は D345 が各会のサイトで確かめた（spec の【D3】）
# 長崎市（nagasaki-city）は長崎県と別、の注意を長崎市の note に入れた
- code: nagasaki
  name: 長崎県
  cities:
    - {code: nagasaki/nagasaki-city, name: 長崎市, note: DXに詳しい外部専門家の伴走支援を受ける費用を1/2（上限50万円）補助する伴走型DX化支援費補助金を2026-11-30まで、生産性向上・業務効率化のためのソフトウエアや設備の導入などを1/3（賃上げを行えば2/3）補助するチャレンジ企業応援事業費補助金を2026-12-28まで受け付けています（2026-11-04確認。どちらも予算がなくなり次第終了）。伴走型DX化はシステム・機器の導入費が対象外、チャレンジ企業応援は市内で3年以上事業を続けていることが要件です。市の新産業推進課（無料相談窓口「ビズデジコンシェル」）か長崎商工会議所に確認してください。長崎県の制度とは別の、長崎市の制度です}
    - {code: nagasaki/sasebo, name: 佐世保市, note: 研修の費用を1/2（上限10万円）補助した中小企業等人材育成支援事業補助金は2026-10-30に予算に達して受付を終え、省力化・生産性向上などを1/2（上限70万円）補助した物価高騰対応支援事業補助金は新規の受付を停止しています（2026-11-04確認。予算が残れば再募集の可能性があると市は案内しています）。市の経済部 商工労働課か佐世保商工会議所・佐世保市北部商工会・宇久町商工会に確認してください}
    - {code: nagasaki/shimabara, name: 島原市, note: 中小企業大学校の研修に従業員を派遣する受講料（3万6千円まで）と交通費の半分を助成する制度がありますが、市のページは2024-05-28の更新のままで、今年度の受付状況は確かめられませんでした（2026-11-04確認。対象は島原商工会議所か有明町商工会の会員）。市の商工振興課に確認してください。AI・IT導入向けの市独自の補助金は見つかりませんでした}
    - {code: nagasaki/isahaya, name: 諫早市, none: true, note: 市の産業振興・支援と商工業のページで確かめた範囲で、市独自のAI・IT導入や研修の補助金は見つかりませんでした（2026-11-04確認）。諫早商工会議所・諫早市商工会か市の商工担当課に確認してください}
    - {code: nagasaki/omura, name: 大村市, note: 中小企業者等人材育成支援事業補助金は、従業員の研修受講や資格受験の費用を1/2（1人3万5千円まで、年3人まで）補助し、個人の受講・受験の分を受け付けています（2026-11-04確認。研修・受験の2週間前までに申請）。業務のデジタル化のためのソフトウェアなどの導入費を補助したおおむら中小企業DX推進事業補助金は、予算の上限に達して受付を終えました。大村商工会議所か市の商工振興課に確認してください}
    - {code: nagasaki/hirado, name: 平戸市, note: 中小企業等人材育成支援事業補助金は、従業員を外部の研修に参加させる費用を2/3（1人年5万円・1事業者25万円まで）補助し、随時受け付けています（2026-11-04確認。予算がなくなり次第終了）。AI・デジタルの分野の指定はありません。平戸商工会議所・平戸市商工会か市の商工物産課に確認してください}
    - {code: nagasaki/matsuura, name: 松浦市, note: がんばる中小企業応援補助金のDX導入支援事業は、ソフトの導入（導入サポートを含む）や専門家の研修によるIT人材の育成の費用を1/2（上限30万円）補助しますが、期間を定めて公募する制度で、2026年度の公募の状況は市のページで確かめられませんでした（2026-11-04確認）。市の産業振興課 商工振興係か松浦商工会議所・松浦市福鷹商工会に確認してください}
    - {code: nagasaki/tsushima, name: 対馬市, note: 創業等支援事業補助金の人材育成支援事業は、事業に必要な資格や知識を市外で身につける費用を4/5（上限10万円）補助し、予算の範囲内で随時受け付けています（2026-11-04確認。交付決定のあとに始めた事業が対象）。AI・デジタルの分野の指定はありません。対馬市商工会か市の政策企画課に確認してください。対馬市に商工会議所はありません}
    - {code: nagasaki/iki, name: 壱岐市, none: true, note: 市の事業者向けの支援のページで確かめた範囲で、市独自のAI・IT導入や研修の補助金は見つかりませんでした（2026-11-04確認）。壱岐市商工会か市の商工振興課に確認してください。壱岐市に商工会議所はありません}
    - {code: nagasaki/goto, name: 五島市, none: true, note: 市の事業者向けの支援のページで確かめた範囲で、市独自のAI・IT導入や研修の補助金は見つかりませんでした（2026-11-04確認。市の商工の分類ページの一部は開けませんでした）。福江商工会議所・五島市商工会か市の商工雇用政策課に確認してください}
    - {code: nagasaki/saikai, name: 西海市, note: 生産性向上・業務効率化などのための設備の導入に1/2（上限50万円。松島・江島・平島の事業者は3/4・75万円）を補助した中小企業経営強化支援事業補助金は、2026年度の二次募集が9月15日で終わりました（2026-11-04確認）。ソフトウェアが対象になるかは書かれていません。西海市商工会か市の商工観光課に確認してください}
    - {code: nagasaki/unzen, name: 雲仙市, none: true, note: 市の商工業と助成金・補助金のページで確かめた範囲で、市独自のAI・IT導入や研修の補助金は見つかりませんでした（2026-11-04確認。宿泊税の徴収のためのレジシステムの補助は旅館業などに限られます）。雲仙市商工会か市の商工担当課に確認してください}
    - {code: nagasaki/minamishimabara, name: 南島原市, note: 中小企業ステップアップ支援事業補助金は、事業所の新設や規模拡大のためにITツールの導入を含む100万円以上の設備投資をする費用を1/3（上限100万円）補助し、2026年度も募集しています（2026-11-04確認。農業・林業・漁業・医療・福祉は対象外、更新は対象外、事前相談が必要）。南島原市商工会か市の商工観光課 商工振興班に確認してください}
