# 千葉県の16町1村（2026年度）。2026-11-13 に17町村の公式サイト（県の「市町村一覧」https://www.pref.chiba.lg.jp/kouhou/ichiran.html のリンクでドメインを確かめた。16町村は curl で読めた。御宿町 www.town.onjuku.chiba.jp は緊急メンテナンスで curl・WebFetch とも 503）で確認
# AI・IT導入・専門家への相談・研修に直接使える町村独自の補助金は、16町村で見つからなかった（御宿町は未確認）。デジタル化に近いものは酒々井町の「キャッシュレス決済端末導入支援補助金」（端末の購入費のうち10万円まで、交付申請 2026-11-30 まで）だけで、これを入れた
# 国のデジタル化・AI導入補助金・ものづくり補助金・持続化補助金などへの町村の上乗せ（addon）は16町村とも見つからない。酒々井町のキャッシュレスの補助は「国又は地方公共団体から同様の補助を受けた中小企業者」を対象外にしている
# 独自の制度がない町村、AI・IT向けでないので yml に入れなかった制度（創業・事業承継・企業立地・空き店舗・利子補給・災害の復旧）は subsidy_c_areas.md に確かめたページの URL を書いた
# 期間の status は data/subsidies/README.md の値（open / closed / rolling / unknown）を使う。随時受付・予算の範囲内・先着で期限までのものは rolling

- id: chiba-shisui-cashless
  name: 令和8年度 酒々井町キャッシュレス決済端末導入支援補助金
  org: 酒々井町（環境商工課 商工観光班）
  area: chiba/shisui
  max_yen: 100000
  rate: 本体機器・付属機器の購入費（税抜）のうち10万円まで（補助率の定めなし。要綱の別表「購入費のうち１０万円まで」）
  rate_num: 1.0
  targets: {efficiency: △, consulting: ×, training: ×}
  expenses: タッチ決済（NFC で Type-F〔FeliCa〕・Type-A・Type-B のすべてに対応）ができるキャッシュレス決済端末本体・オールインワン端末と、本体と同時に買う付属機器（暗証番号入力用キーパッド・非接触リーダーライター・バーコードリーダー・サインパッド・カスタマーディスプレイ・レシートプリンター・コード類・その他町長が認める関連機器）の購入費。交付決定後に購入したものに限る。中古品・割賦払い・レンタル・リースは対象外。ソフトウェア・クラウドの利用料・決済手数料は対象に書かれていない。古い端末の買い替えも可
  conditions: 中小企業信用保険法の中小企業者（農・林・漁・金融業を除く）で、町内の事業所で消費者と対面で決済するために端末を導入すること。個人事業主は町内に住み住民基本台帳に登録、法人は町内に本店登記。キャッシュレス決済事業者と契約すること、町税等の完納。フランチャイズ・風俗営業・政治宗教目的、国又は地方公共団体から同様の補助を受けた者は対象外。1中小企業者1回。交付申請 2026-07-01〜11-30、実績報告 2027-01-29 まで、交付請求 2027-02-26 まで
  period: {status: open, start: 2026-07-01, end: 2026-11-30}
  url: https://www.town.shisui.chiba.jp/docs/2026051100016/
  checked: 2026-11-13
  confidence: official
  note: 町のページ（公開日 2026-09-02、curl）「国の重点支援地方交付金を活用」「令和8年9月1日より補助率を引き上げ、交付申請の要件を緩和しました」。要綱 https://www.town.shisui.chiba.jp/docs/2026051100016/file_contents/cashless_youkou.pdf （令和8年6月22日告示、7月1日施行、9月1日改正、2027-03-31 失効。pdftotext で読んだ）第1条「予算の範囲内」。引き上げ前の率はページ・要綱に書かれていない。AI・IT導入の補助ではない（決済端末の購入費）ので efficiency は △。rate_num は「購入費のうち10万円まで」を10/10と読んだ当社の置き方。町「経済環境課の目標（令和８年度）」https://www.town.shisui.chiba.jp/docs/2026062400020/file_contents/08keizai.pdf にも記載。問い合わせ 043-382-2339
  fuenn_note: 酒々井町内の店舗などで対面の決済をする中小企業が、タッチ決済に対応したキャッシュレス決済端末と付属機器を買う費用のうち10万円まで（税抜）を補助する町の制度です。交付決定の後に購入する必要があり、交付申請は2026年11月30日まで、予算の範囲内です。AI・業務システムの導入には使えません。
