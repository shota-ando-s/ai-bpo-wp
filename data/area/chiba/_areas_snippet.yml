# 案（D34、2026-11-13 のデータ）。data/subsidies/areas.yml の千葉県の部分（パイロット 2026-10-14 の5市の行）と置き換える案。親が最後に areas.yml に入れる（data/subsidies/chiba.yml〔案は data/area/chiba/_subsidies_chiba.yml〕と同じコミット。areas.yml は直接編集していない）
# パイロットの code chiba/ichikawa は chiba/ichikawa-city に直した（兵庫県市川町の ichikawa と分けた slug。areas.yml・chiba.yml のほかに参照はない〔2026-11-12 grep〕）。パイロットの千葉市・船橋市・松戸市・柏市・市川市の5行はこの54行に含まれる（船橋市はパイロットでは none なし→none: true に。判断 D4-9）
# none: true は49市町村: _subsidies_chiba.yml に制度が1件もない47市町村と、船橋市（制度は国の補助金の申請支援費の補助だけで、診断のどの目的でも×）。none にしないのは千葉市・松戸市・館山市・南房総市・酒々井町の5市町
# 市原市（サイトが JavaScript だけで描かれ本文が読めない）・御宿町（2026-11-13 もトップが 503）は公式ページで確かめられなかったが none: true にし、note の一文目で「確かめられなかった」と書いた（判断 D4-10）。診断の callout は「AI・IT導入向けの独自の補助金が見つかりませんでした」と出る
# 並びは県の統計の11地域（毎月常住人口調査の区分。spec/D1.md「県の地域区分」の案）: 千葉（2）→ 葛南（5）→ 東葛飾（6）→ 印旛（9）→ 香取（4）→ 海匝（3）→ 山武（6）→ 長生（7）→ 夷隅（4）→ 安房（4）→ 君津（4）。区分の中は自治体コード順（判断 D4-11）。トップページの地域ページの一覧もこの並びになる（front-page.php が areas.yml の順を使う）
# note は診断の画面では none: true の市町村だけに出る（shindan.js の callout）。none でない5市町の note は記録として書いた
# none の note には、確かめたページ・相談先（商工会議所は県の中小企業者等相談窓口の一覧の電話、商工会は全国商工会連合会の名簿の電話。gov_ai.md・gov_ai_c.md・gov の scratchpad の保存）・他県の同じ名前・紛らわしい名前の自治体と別であることを書いた
# 「無料」と書いたのは資料に無料とあるものだけ: 柏市の専門家相談（「無料個別相談会」）、旭市の事業者デジタル化支援事業（「無料で実施」）、木更津市のらづ-Biz（「無料のビジネス相談窓口」）
# 市町村の制度は市町村内に事業所（本社）がある事業者が対象で、近くの市町村の事業者は使えない。県の制度で今申請できるのは人材系の2件（副業・兼業人材、デジタル人材マッチング）だけ
# 千葉県と千葉市を取り違えない: 千葉市の行の note に「千葉市内にある千葉県産業振興センター・千葉県よろず支援拠点は県の機関で、千葉市の窓口ではない」と書いた
