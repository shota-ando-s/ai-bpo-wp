# 国のデジタル化・AI導入補助金・ものづくり補助金・持続化補助金などへの町村の上乗せ（addon）は16町村とも見つからない。酒々井町のキャッシュレスの補助は「国又は地方公共団体から同様の補助を受けた中小企業者」を対象外にしている
