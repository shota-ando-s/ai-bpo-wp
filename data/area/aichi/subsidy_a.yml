# 愛知県（県・公益財団法人 あいち産業振興機構）と38市（2026年度）。2026-11-11に県のサイト（www.pref.aichi.jp。curl は 403、WebFetch で読んだ）の産業振興課デジタル産業グループ・建設企画課のページ、あいち産業振興機構のサイト（www.aibsc.jp・dx-hojo.aibsc.jp。curl で読めた）、38市の公式サイト（県の「愛知県内市町村等」のリンク https://www.pref.aichi.jp/adv/ba.php?id=583 でドメインを確かめた）で確認
# 県の柱の「中小企業デジタル化・DX促進補助金」（あいち産業振興機構が実施。コンサルティング・デジタルツール導入・システム改修、中小1/2・小規模2/3、上限200万円、あいち産業DX推進コンソーシアムの加入が要件）は公募要領で募集期間 2026-03-06〜05-12 17時で終わり、2026-07-14 に採択68件を公表（うち事業名に AI が入るのが11件。cases.md）。県のページ（2026-09-30更新）に「今年度の募集は終了しました」
# 県で今申請できるのは、建設業に限った「建設業DX推進支援事業費補助金」（建設局。国のデジタル化・AI導入補助金〔通常枠〕を受けた建設業者に、国の補助対象経費−国の補助額の1/2・上限50万円を上乗せ。県発注の一般土木工事の受注実績と格付の総合点数1150点未満が要件。2026-06-18〜2027-01-29、先着）だけ
# 県域の無料の支援（補助金ではない。yml に入れていない。subsidy_a_areas.md）: あいちデジタル技術活用相談窓口（あいち産業振興機構、ITコーディネーター・中小企業診断士等が無料・回数制限なしで相談・出張・伴走支援、2026-04-17〜2027-03-18）、愛知県よろず支援拠点（生産性向上支援センターを2026-04-01に開設）、経営力評価サービス事業（10社・無料、2026-07-03で募集終了）
# 期間の status は data/subsidies/README.md の値（open / closed / rolling / unknown）を使う。随時受付・予算の範囲内・先着で期限までのものは rolling

- id: aichi-digital-dx-sokushin
  name: 2026年度 中小企業デジタル化・DX促進補助金
  org: 愛知県（経済産業局 産業部 産業振興課 デジタル産業グループ）・公益財団法人 あいち産業振興機構（総務企画部 情報企画グループ。実施・事務局）
  area: aichi
  max_yen: 2000000
  rate: 中小企業は1/2以内、小規模企業者は2/3以内。限度額200万円
  rate_num: 0.5
  rate_small_num: 0.667
  targets: {efficiency: ◎, consulting: ○, training: △}
  expenses: 区分A（業務プロセス・生産プロセスの可視化・課題認識のためのコンサルティング費。一般的な経営コンサル・マーケティング・従業員研修は対象外）、区分B（生産性向上・省力化のデジタルツールの初期費用・ライセンス費用・支給対象期間中のサブスクリプション費用、機械装置のレンタル・リース、初期設定支援・導入後の最適化コンサル・導入したツールの操作方法を習得する研修の委託費、プラグイン開発の外注費。既に導入済みツールのプラン変更・アカウント追加、パソコン・プリンター・タブレットは対象外）、区分C（既存システムの改修・新システム構築・システムの月額料金・改修に伴うコンサル費。サーバー・パソコン等のハードウェア購入は対象外）。A・B・Cのいずれか一つか、A＋B・A＋Cの組み合わせ。生産管理・仕入在庫管理・販売顧客管理・バックオフィス（財務会計・人事等）の業務の効率化・高度化が対象。支給決定日から2026-12-31までの発注・支払い
  conditions: 「あいち産業DX推進コンソーシアム」に加入している、県内に事業所を持つ中小企業・小規模企業者。区分Aを含む申請は支援事業者（中小企業診断士・ITコンサルタント等）が申請書の一部を記載する。新たに取り組む事業（既存の業務プロセス・システムの改善でないもの）は対象外。同一法人の応募は1件。同一目的で国等の補助金を受ける場合は原則対象外
  period: {status: closed, start: 2026-03-06, end: 2026-05-12}
  url: https://www.pref.aichi.jp/site/aichi-pref-iot/dx-grants.html
  checked: 2026-11-11
  confidence: official
  note: 公募要領（2026年3月、あいち産業振興機構。PDF 25ページ、作成 2026-03-05）https://dx-hojo.aibsc.jp/documents/01_中小企業デジタル化・DX促進補助金_公募要領.pdf を curl で読んだ（表紙「募集期間 2026年３月６日（金）から５月12日（火）午後５時まで」、p1 支給対象事業者・支給対象期間、p2〜3 区分A〜C、p4〜7 補助率・経費、p7「同一目的の事業において、国等の補助金等の交付を受ける場合には、原則としてこの補助金の対象としません」）。財源は物価高騰対応重点支援地方創生臨時交付金。県のページ（2026-09-30更新、WebFetch）に「今年度の募集は終了しました」、採択事業のページ https://www.pref.aichi.jp/site/aichi-pref-iot/dx-grants-saitaku2026.html （2026-07-14更新）に採択一覧 https://www.pref.aichi.jp/uploaded/attachment/623609.pdf （68件、事業名に AI が入るのは11件。cases.md）。応募件数はページにない。二次募集の記載はない。AIの語は要領の抜き出した範囲にない（対象ツール例は稼働状況可視化・顧客関係管理）。2025年度にも同名の公募があった（県のページのリンク）。問い合わせは機構 050-3120-4888・dx-hojo@aibsc.jp、県 052-954-7495
  fuenn_note: 愛知県内の中小企業が、業務の見える化のコンサルティング、デジタルツールの導入、既存システムの改修をする費用を1/2（小規模企業者は2/3）、最大200万円補助する県の制度でした（あいち産業DX推進コンソーシアムへの加入が要件）。2026年度の募集は5月12日で終わりました。

- id: aichi-kensetsu-dx
  name: 2026年度 建設業DX推進支援事業費補助金
  org: 愛知県（建設局 土木部 建設企画課 土木技術グループ）
  area: aichi
  max_yen: 500000
  rate: 国のデジタル化・AI導入補助金（通常枠）の補助対象経費から国の補助金の額を引いた額の1/2、上限50万円（消費税は対象外）
  addon: {kind: remaining, ratio: 0.5}
  stacking: {addon_to: [digital-ai-donyu]}
  targets: {efficiency: ○, consulting: ×, training: ×}
  expenses: 働き方改革・生産性向上を目的としたシステム導入の経費と導入関連経費（例 工事写真管理システム・出来形管理システム・工程管理システム・勤怠管理システム・発注管理システム、付随するクラウド使用料・導入設定料・保守サポート料・導入コンサルティング料）。原則として国のデジタル化・AI導入補助金の補助対象経費。パソコン・タブレット等の汎用機器は対象外
  conditions: 申請年度に国の「中小企業デジタル化・AI導入支援事業費補助金交付規程（通常枠）」に基づく補助金確定通知書を受けた事業者で、県建設局・都市・交通局発注の一般土木工事に申請前年度までの過去3年間に受注実績があり、申請年度の一般土木工事の入札参加者格付基準の総合点数が1150点未満であること。同一法人の申請は1件。県へ2027-01-29までに申請し、交付決定から2027-03-19までに実績報告書を出せるもの
  period: {status: rolling, start: 2026-06-18, end: 2027-01-29}
  url: https://www.pref.aichi.jp/soshiki/kensetsu-kikaku/kensetsudx.html
  checked: 2026-11-11
  confidence: official
  note: 県のページ（ページID 0574443、2026-04-10更新、WebFetch）と公募要領（2026年4月、PDF 23ページ）https://www.pref.aichi.jp/uploaded/attachment/611913.pdf （pdftotext で読んだ。表紙 申請期間、p1 補助対象事業者、p2「デジタル化・AI導入補助金規程に基づく補助金を受けた事業者に対し、上乗せして補助金を交付します」「補助対象経費から国の交付を受ける補助金の額を減じた額に２分の１を乗じた額とし、50万円を上限」「令和８年度愛知県予算建設業DX推進支援事業費の範囲内」、p3〜4 先着順の審査）。要領の中で食い違いがある。p1 の対象者は国の「補助金確定通知書を受けた事業者」、p3 の申請書類は国の「交付決定通知書の写し」。p4 の実績報告の期限「2026年３月19日」は2027年の誤記とみられる。電話番号は要領 052-961-6507、県のページ 052-954-6507 で違う。受付終了・予算到達の表示はページにない（2026-11-11）。AIの語は国の補助金名だけ。チラシ https://www.pref.aichi.jp/uploaded/attachment/611956.pdf 。メール kensetsu-dxhojo@pref.aichi.lg.jp
  fuenn_note: 愛知県の一般土木工事を受注している建設業者が国のデジタル化・AI導入補助金で工事写真管理・勤怠管理などのシステムを入れたとき、自己負担分の1/2、最大50万円を県が上乗せする制度です。2027年1月29日まで先着順で受け付けています（予算の範囲内）。
