# 愛知県の14町2村（2026年度）。2026-11-11に16町村の公式サイト（県の「県内の市町村」https://www.pref.aichi.jp/site/userguide/link-citytown.html でドメインを確かめた。curl はどの町村も302のループか503で、WebFetch で読んだ。要綱 PDF は WebFetch が保存したファイルを pdftotext で読んだ）で確認
# AI・IT導入に直接使える町村独自の制度は、東郷町の「小規模企業及び中小企業振興補助金」（2026年度新設。DX推進枠 ソフトウェア導入費・クラウド利用料等 1/2・20万円）だけ。研修・専門家は大口町（中小企業支援事業補助金）と東郷町（人的資本経営枠）
# 国のデジタル化・AI導入補助金・ものづくり補助金などへの上乗せ（addon）は16町村とも見つからない。東郷町・南知多町・武豊町などは同一経費の重複を不可としている
# 独自の制度がない町村と、AI・IT向けでないので yml に入れなかった制度（豊山町の新商品開発・販路開拓、扶桑町の人材確保等、南知多町の中小企業者等応援〔人材採用・ECサイト〕、設楽町の商工業活性化、阿久比町・東栄町の創業など）は subsidy_c_areas.md に確かめたページの URL を書いた
# 期間の status は data/subsidies/README.md の値（open / closed / rolling / unknown）を使う。随時受付・予算の範囲内・先着で期限までのものは rolling

