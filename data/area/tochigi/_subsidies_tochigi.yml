  conditions: 氏家商工会か喜連川商工会の会員で、市内に事業所があり市税完納の中小企業者・小規模企業者。業種の除外あり（医師・歯科医師・助産師、農林漁業者、協同組合、一般・公益社団・財団法人、医療法人、学校法人、社会福祉法人、創業予定者、任意団体）。商工会の指導で作った「経営計画」に基づく販路開拓・経営品質の向上・新商品開発等の新たな取組。商工会の推薦書が必要。認定審査会（有識者）の審査で採択。事業開始前に申請し、2027-03-31までに完了
  period: {status: closed, start: 2026-06-01, end: 2026-06-30}
  url: https://www.city.tochigi-sakura.lg.jp/business/000042/000251/000450/p002193.html
  checked: 2026-11-06
  confidence: official
  note: AIは名指ししていない。市のページ（掲載日2026-05-01、更新日2026-05-26）で募集期間 2026-06-01〜06-30（終了）。国の小規模事業者持続化補助金に似た形の市の制度で、「経営品質の向上」に業務効率化のIT導入が入るかは書かれていない。要綱はページに見当たらず開いていない。市のサイトは curl で接続リセットが多く、間を空けて読んだ。問い合わせは 028-686-6627
  fuenn_note: さくら市の商工会員の中小企業が、経営計画に基づく販路開拓・経営品質の向上・新商品開発の取組を1/2（小規模は2/3、最大50万円）補助する市の制度です。2026年度の募集は6月30日で終了しました。

- id: tochigi-nasukarasuyama-keiei-kadai
  name: 令和8年度 那須烏山市経営課題解決事業費補助金
  org: 那須烏山市（商工観光課 商工振興グループ。計画づくり・申請の経由は那須烏山商工会）
  area: tochigi/nasukarasuyama
  max_yen: 200000
  rate: 補助対象経費の1/2以内、上限20万円（補助対象経費20万円未満は対象外のため、補助額は10万〜20万円）
  rate_num: 0.5
  min_cost_yen: 200000
  targets: {efficiency: ○, consulting: ○, training: ○}
  expenses: 那須烏山商工会が計画の実施に必要不可欠と認めたもの。①事業拠点の改修（市内事業者の施工）②機械設備・備品・ソフトウェア等の購入か借用（借用・サブスクリプションは補助対象期間中の利用分で支払いが完了するもの。車両・PC・タブレット・スマホ・事務用プリンタ等と家庭・一般事務用ソフト〔文書作成・表計算等〕は対象外）③広告宣伝費（HP・ECサイトの構築・改修、看板等）④専門家等への業務委託・相談（経営・技術のコンサルティング料、士業への相談。国県等の補助金申請の委託は対象外）⑤商工会の加入金・会費（新規入会）⑥新商品開発 ⑦従業員の教育・育成（研修受講料、資格取得、社内セミナーの講師謝金）⑧採用活動（欠員補充は除く）⑨第三者認証。役員報酬・人件費・消費税は対象外
  conditions: 市内に事業所があり1年以上同じ事業（風俗営業・金融業等を除く）を営む中小企業で、那須烏山商工会の支援で経営課題解決事業計画を作った者。過去にこの補助を受けた者は対象外。国・県その他の補助金の対象になるときは対象外（他の補助金が見込めるときは商工会の支援でそちらを目指す）。事業は2027-02-28までに実施・支払い完了。予算の予定額に達し次第打ち切り
  period: {status: closed, start: 2026-04-01, end: 2026-10-30}
  url: https://www.city.nasukarasuyama.lg.jp/community-tourism-industry/commerce-industry/commerce-subsidy/page005283.html
  checked: 2026-11-06
  confidence: official
  note: AIは名指ししていない。市のページ（更新日2026-05-01）で交付申請は2026-10-30（金）までに商工会経由（締切済み）。「予算に余裕があれば、国の補助金等の不採択案件に限り期限後の受付が可能になることもある」（那須烏山商工会の個別支援会への参加が要件）。start はページに書かれておらず年度初めとして記載。パンフレット https://www.city.nasukarasuyama.lg.jp/data/doc/1777511562_doc_32_0.pdf は開いていない。国の補助と併用できない（addon ではない）。問い合わせは 0287-83-1115（烏山庁舎1階）
  fuenn_note: 那須烏山市の中小企業が、商工会と作った計画に沿って行うソフトウェア・サブスクの導入、専門家への相談、従業員の研修などを1/2（10万〜20万円）補助する市の制度です。2026年度の申請は10月30日で締め切られました（国の補助金の不採択案件は期限後に受け付けることがあります）。

