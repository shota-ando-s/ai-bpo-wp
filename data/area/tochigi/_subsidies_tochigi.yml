  name: 令和8(2026)年度 中小企業高度化・事業創出助成事業助成金（AI・IoTソリューション試験導入助成事業）2次公募
  org: 公益財団法人栃木県産業振興センター（産業振興部 次世代産業支援チーム）
  area: tochigi/utsunomiya
  max_yen: 1000000
  rate: 助成対象経費の2/3以内、上限100万円
  rate_num: 0.667
  max_months: 12
  targets: {efficiency: ○, consulting: ×, training: ×}
  expenses: 機械装置・工具器具等の借用、消耗品（原則1年未満・10万円未満）、システム関連経費（ソフトウェア・利用ライセンス・専用システム・クラウドサービスの借用料・使用料）。消費税は対象外
  conditions: 高度技術産学連携地域（宇都宮市・鹿沼市・日光市・真岡市・下野市・上三川町・芳賀町・壬生町・高根沢町）に主たる事務所か事業所がある中小企業者だけ。製品の開発・製造、研究開発などの技術的な課題解決のため、AI・IoTソリューションを事業現場に試験導入して有効性・課題を検証する取組。助成期間は交付決定日から最長1年。応募前に事前相談。採択基準に「業務のDX化を通じた業務プロセスの高度化・最適化」
  period: {status: open, start: 2026-10-05, end: 2026-12-15}
  url: https://www.tochigi-iin.or.jp/home/3/51.html
  checked: 2026-11-06
  confidence: official
  note: （D34）公益財団法人栃木県産業振興センターの県域の制度で、宇都宮市の市町独自の制度ではない。対象が高度技術産学連携地域の9市町に限られるため、診断では対象の9市町の行（tochigi/<slug>）に分けて入れた（ほかの16市町と「上記以外」には出ない）。max_months 12 は助成期間「交付決定日～最長1年間」から。AIを名指ししている。2次公募のお知らせ https://www.tochigi-iin.or.jp/home/11/3920.html （2026-10-05）で、AI・IoTソリューション試験導入助成事業は 2026-10-05〜12-15 17時必着（研究開発助成事業は11-30まで）。対象地域が9市町に限られる（県全体ではない。足利・栃木・佐野・小山・大田原・矢板・那須塩原・さくら・那須烏山の各市は対象外）。財源は高度技術振興基金（出捐 宇都宮市・真岡市・芳賀町・高根沢町）の運用益と地域の負担金。チラシ https://www.tochigi-iin.or.jp/content/files/jisedaisangyo/R8/koudoka/2ji/R8_2ji-chirasi.pdf は開いていない。採択の一覧は見つからない。診断で県全域に出す場合は対象の市町を必ず表示する。問い合わせは 028-670-2608、jisedai[@]tochigi-iin.or.jp
  fuenn_note: 栃木県産業振興センターが、AI・IoTのソフトウェアやクラウドサービスを試験導入する費用を2/3（最大100万円）助成する制度です。対象は宇都宮市・鹿沼市・日光市・真岡市・下野市と上三川町・芳賀町・壬生町・高根沢町の中小企業だけで、2次公募は2026年12月15日17時までです。

