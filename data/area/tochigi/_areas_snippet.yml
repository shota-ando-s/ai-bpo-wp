# 案（D34、2026-11-06 のデータ）。data/subsidies/areas.yml の末尾に足す栃木県の部分。親が最後に areas.yml に入れる（data/subsidies/tochigi.yml〔案は data/area/tochigi/_subsidies_tochigi.yml〕と同じコミット。areas.yml は直接編集していない）
# none: true は「市町独自の制度」が _subsidies_tochigi.yml に1件もない13市町（栃木市・佐野市・大田原市・矢板市・那須塩原市・下野市・上三川町・茂木町・市貝町・芳賀町・壬生町・高根沢町・那須町）。どれも公式サイトの事業者向け・商工業のページで確かめて見つからなかった（subsidy_a_areas.md・subsidy_b_areas.md）。下野市・上三川町・芳賀町・壬生町・高根沢町には県域の AI・IoT試験導入助成を分けた行（tochigi/<slug>）があるが、市町独自ではないので none にした（callout は「独自の補助金が見つかりませんでした。栃木県と国の制度を使います」と出る。判断 D4-4）
# さくら市・那須烏山市は今年度の受付を終えた制度しかないが、yml に制度があるので none にせず、note の一文目で状況を書いた（岡山県玉野市・鹿児島県霧島市と同じ）。小山市（受付状況不明）・那珂川町（受付期間の記載なし）・益子町・野木町・塩谷町（創業・新事業向け）も none なし
# 並びは自治体コード順（市14 → 町11）。県の資料で市町の所属まで書かれている区分は農業振興事務所の7区域と保健所の区域で、「県北」「県南」の範囲が資料で違う（stats.md）ため、区分の順にしなかった（判断 D4-9）
# none の callout は「AI・IT導入向けの独自の補助金が見つかりませんでした」と出るので、none の note は確かめ方・相談先（商工会議所・商工会は gov_ai.md の名簿）・無料と資料にある窓口・取り違えの注意を書く
# 「無料」と書いたのは資料に無料とあるものだけ: 栃木県よろず支援拠点（拠点のサイト「何度でも無料で相談できます。」）とそのサテライト（9商工会議所。拠点のサイトのサテライト一覧 2026-11-06）、矢板市の地域活性化起業人の経営相談（市のページ）。とちぎビジネスAIセンターの個別相談は料金の記載がない＝「無料」と書かない
# 県域の AI・IoT試験導入助成（9市町だけ）は、対象の9市町の note に一言入れた。対象外の16市町の note では触れない（診断にも出ない）
# 取り違えの注意: 栃木市（tochigi-city）は栃木県と別、那珂川町（nakagawa-town、那須郡）は福岡県那珂川市と別、さくら市は千葉県佐倉市と別、那須町・那須塩原市・那須烏山市、塩谷町と塩谷郡（高根沢町も塩谷郡）、を note に入れた
# 市の制度（宇都宮市・鹿沼市など）は市内に事業所がある事業者が対象で、近くの町の事業者は使えない。県の制度（とちぎ賃上げ環境整備・ものづくり産業生産性向上・とちぎ企業内ＤＸ人材育成）は tochigi の行で全地域に出るので、市町の note には書いていない
# 2026年7月の大雨の足利市中小企業者復旧支援補助金・中小機構の特別相談窓口は note に入れない（AI 導入の補助ではない。docs の【D4】「災害の制度」）
