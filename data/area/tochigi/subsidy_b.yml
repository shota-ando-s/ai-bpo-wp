  url: https://www.town.nogi.lg.jp/business/business_news/page007101.html
  checked: 2026-11-06
  confidence: official
  note: 町のページ（更新日 2026-03-24）で「募集は、随時受け付けていますが、予算が上限に達し次第募集終了となります」。創業する人向けで、既存の事業者の IT 導入には使えない。事前相談は産業振興課 商工観光係（0280-57-4153）、創業の指導は野木町商工会（0280-55-2233）
  fuenn_note: 野木町で新しく事業を始める人に、設備・備品・ホームページ作成・経営相談などの初期費用の1/2（最大50万円）を補助する町の制度です。随時受付（予算に達するまで）で、申請の前に野木町商工会の指導を複数回受ける必要があります。

- id: tochigi-shioya-local10000
  name: 塩谷町地域経済循環創造事業（ローカル10,000プロジェクト）
  org: 塩谷町（企画調整課）
  area: tochigi/shioya
  max_yen: 55000000
  rate: 補助上限額（国費＋地方費）は、融資額/公費が2倍未満3,000万円、2倍以上3倍未満4,000万円、3倍以上4倍未満5,000万円、4倍以上5,500万円。補助率はページに記載なし
  targets: {efficiency: △, consulting: ×, training: ×}
  expenses: 地域の資源・資金を活用した新たなビジネスを事業化する段階の初期投資費用（総務省「地域経済循環創造事業交付金」の対象経費。IT・ソフトウェアの名指しはない）
  conditions: 塩谷町は国と町の補助を受ける「国庫補助事業型」だけ受付。地域密着型（地域資源の活用）、地域課題への対応（公共的な課題の解決）、地域金融機関等の融資を受けていること、新規性・モデル性。単年度が原則。申請前に金融機関・町と事前調整し、町の審査会で選定してから総務省に申請
  period: {status: rolling}
  url: https://www.town.shioya.tochigi.jp/info/2787
  checked: 2026-11-06
  confidence: official
  note: 町のページ（更新日 2026-09-09）で「事業の申請を随時受け付けております」「国及び町の予算状況に応じて年度内の受付を停止することがあります」。国（総務省）の制度に町が乗る形で、町が助成する経費に総務省が交付金を出す。AI・IT 導入の補助ではなく、融資を受けて地域資源を使う新事業の初期投資向け。max_yen は国費＋地方費の上限の最大区分。補助率が書かれていないので rate_num は書かない
  fuenn_note: 塩谷町が総務省の交付金とあわせて、地域の資源を使った新しいビジネスの初期投資を支援する制度です（地域の金融機関の融資が条件、上限は最大5,500万円）。随時受付で、まず町の企画調整課に事前相談が必要です。

