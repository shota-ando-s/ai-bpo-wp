# 栃木県の11町（上三川町・益子町・茂木町・市貝町・芳賀町・壬生町・野木町・塩谷町・高根沢町・那須町・那珂川町）の AI・IT・DX・研修・省力化・生産性向上に使える町独自の補助金（2026年度）。2026-11-06に11町の公式サイトの事業者向け・商工業の分類ページと商工担当課の記事一覧（サイト内検索がある町は「補助金」「DX」「AI」も）を開いて確認
# AI・生成AI・IT導入を名指しした町独自の補助金は、11町とも見つからなかった
# 入れたのは、設備・備品・ホームページ作成・店舗改修などにも使える可能性がある一般の制度4件（益子町 起業支援、野木町 スタートアップ支援、塩谷町 ローカル10,000プロジェクト、那珂川町 空き店舗等活用促進）。いずれも AI・デジタルの名指しはなく、targets は △ にした
# 受付中・随時: 益子町 起業支援補助金（1/3・100万円）、野木町 スタートアップ支援補助金（1/2・50万円、予算まで）、塩谷町 ローカル10,000（融資が条件、最大5,500万円）。那珂川町 空き店舗等活用促進（1/2・50万円）は受付期間の記載なし（unknown）
# 国・県の補助金への上乗せ（addon）: 11町とも該当なし
# 県域の制度: 栃木県産業振興センター AI・IoTソリューション試験導入助成（2/3・100万円、12/15まで、subsidy_a.yml）の対象は11町のうち上三川町・芳賀町・壬生町・高根沢町だけ。ここには入れていない
# 期間の status は data/subsidies/README.md の値（open / closed / rolling / unknown）を使う
# 町ごとの確認したページ・制度がない町は subsidy_b_areas.md

- id: tochigi-mashiko-kigyo-shien
  name: 益子町起業支援補助金（新規起業準備補助金・事業所賃借料補助金）
  org: 益子町（観光商工課 商工係）
  area: tochigi/mashiko
  max_yen: 1000000
  rate: 新規起業準備補助金は初期投資経費の1/3以内・限度額100万円（基本30万円に、空き店舗活用10万円・町内金融機関の融資10万円・事業開始年齢〔40歳未満50万円・50歳未満30万円・60歳未満10万円〕を加算）。事業所賃借料補助金は家賃の1/2以内・月3万円・24カ月以内・限度額72万円。どちらか1回限り
  rate_num: 0.333
  targets: {efficiency: △, consulting: ×, training: ×}
  expenses: 町内で起業し事業所を新設するための初期投資経費（IT・ソフトウェアの名指しはない）、または事業所の家賃（敷金・礼金・駐車場費・共益費・光熱水費等を除く）
  conditions: 益子町民（町外在住者は実績報告までに転入）で、中小企業基本法の中小企業者。町税の未納がない。益子町商工会の会員（または会員になる）。加算要件と賃借料補助は益子町特定創業支援等事業の支援を受けた者。風俗営業、大企業が実質的に経営に参画する者、交付決定後3年以上町内で事業ができない者などは対象外。完了後3年間は決算書の提出と報告会での報告
  period: {status: rolling}
  url: https://www.town.mashiko.lg.jp/page/page000850.html
  checked: 2026-11-06
  confidence: official
  note: 町のページで「募集期間 随時受け付けております。（事業開始前に、観光商工課に事前相談をお願いします。）」。ページに更新日の表示はない。リーフレット https://www.town.mashiko.lg.jp/data/doc/1721962196_doc_111_0.pdf 、交付要綱（Word）は開いていない。起業する人向けで、既存の事業者の IT 導入には使えない
  fuenn_note: 益子町で起業して事業所を新しく構える人に、初期投資の1/3（最大100万円）か家賃の1/2（最大72万円）を補助する町の制度です。随時受付で、事業を始める前に町の観光商工課へ相談が必要です。

- id: tochigi-nogi-startup
  name: 野木町スタートアップ支援補助金
  org: 野木町（産業振興課 商工観光係）
  area: tochigi/nogi
  max_yen: 500000
  rate: 補助対象経費の1/2以内、上限50万円
  rate_num: 0.5
  targets: {efficiency: △, consulting: △, training: ×}
  expenses: 町内の事業所の取得・改修（改修は町内の事業者の施工に限る）、事業に使う機械設備・備品等の購入、パンフレット作成・広告掲載・ホームページ作成等の広告宣伝、経営相談・税務相談・法律相談等、町内の事業所の賃借料（3か月分まで）。IT・ソフトウェアの名指しはない
  conditions: 申請時に事業を営んでいない個人が、町内で個人事業を開業するか法人を設立して新たに事業を始める場合（町内に事業所を持つ中小企業者となる者）。交付決定後3年以上事業を継続、野木町商工会の指導を複数回受け商工会に加入、町税の滞納がない。審査会の面接審査に出席が必須。風俗営業、フランチャイズ、過去に町内で創業した者・この補助金を受けた者は対象外。交付申請前の契約・支出は対象外
