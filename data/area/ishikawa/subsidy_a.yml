# 石川県（県・公益財団法人石川県産業創出支援機構〔ISICO〕）と金沢市・七尾市・小松市・輪島市・珠洲市・加賀市・羽咋市・かほく市・白山市・能美市・野々市市（2026年度）。2026-10-27に公式ページ・公募要領・交付要綱で確認
# 県・ISICOに「AI導入枠」のようなIT・AIツール導入費の補助はない。今申請できる県域の制度は ISICO の自動化設備投資準備補助金（3次公募、生産工程の自動化設備を入れる前の設計・試作・実証・評価。2/3・上限100万円、2026-10-30 16時必着。AI等の従量課金サービスの賃借費も対象、設備の購入費は対象外）と、国の業務改善助成金への県の上乗せ（石川県業務改善奨励金、2027-03-10まで）だけ
# 県・ISICOの今年度終了: 賃上げに向けた収益力強化補助金（システム構築費も対象、600万円・最大3/4、R8.10.19の県の一覧で「募集終了」）、ISICO 成長促進高度アドバイザー活用事業（AI・IoT等の専門技術者の指導も例示、1/2・150万円、2次7/31締切）、ISICO 研究開発支援事業（DX）（2者以上の連携体の製品・サービス開発、2/3・3,000万円、6/12締切）
# 市でAIを名指しした制度は金沢市「AI・DX推進支援事業補助金」だけ（1年目＝計画策定のコンサル費2/3・上限150万円、2年目＝令和9年度にシステム導入1/2〔小規模2/3〕・上限200万円の2年間必須。令和8年度の募集は2026-03-16〜05-22で終了）。金沢市の「ものづくり企業リスキリング支援事業（研修実施支援）」はチラシで「AI、IoT、ビッグデータ等のデジタル技術の向上を目的とした研修」を対象に挙げる（製造業・情報サービス業・映像音声制作業・デザイン業等のみ、1/2〔小規模2/3〕・上限10万円、随時）
# 市独自のDX・IT導入・研修で受付中のもの: 小松市 経営モデルチェンジ支援事業（デジタル化支援事業、ISICOのデジタル分野専門家派遣の利用が条件、1/2・50万円、2027-02-26まで随時）、小松市 イノベーション人材育成支援事業（いしかわビジネススクール ITリーダ育成コース等の受講料1/2）、野々市市 中小企業振興事業補助金（企業人材育成事業＝IT人材育成研修1/2・10万円、経営強化等支援事業1/2・20万円は10/30まで）、金沢市・白山市の先端設備等導入計画に連動した設備補助（ソフトウェア単体は金沢市では対象外）
# 市独自のAI・IT導入向けの補助がない市: 七尾市（DX推進状況調査・セミナー・伴走支援を市の委託事業〔運営 株式会社フォーバル〕で無料実施）、輪島市、珠洲市、加賀市（Udemy Business のライセンス無償配布〔補助金ではない〕）、羽咋市、かほく市、能美市。確認したページは subsidy_a_areas.md
# 国の補助金への上乗せ（addon）: 該当なし。国のデジタル化・AI導入補助金・省力化投資補助金・ものづくり補助金・働き方改革推進支援助成金・人材開発支援助成金への県・11市の上乗せは見つからない。県の業務改善奨励金（業務改善助成金への上乗せ）と七尾市 小規模事業者持続化補助金（国の持続化補助金〈一般型〉への上乗せ）は、上乗せ先が national.yml にないため addon にせず note・md に書いた。白山市 育児休業代替要員確保等助成金（両立支援等助成金の新規雇用〔育児休業〕の支給決定が条件、月5万円の定額）は定額で addon で表せず、AI 向けでもないため yml に入れず md に書いた
# 能登半島地震・奥能登豪雨の支援制度（なりわい再建支援補助金、営業再開支援補助金、チャレンジ支援補助金、持続化補助金の災害支援枠への上乗せ、市の上乗せなど）は AI 導入向けではないため yml に入れず、subsidy_a_areas.md の「能登半島地震・奥能登豪雨の支援制度（AI導入向けとは別）」の節に書いた
# 期間の status は data/subsidies/README.md の値（open / closed / rolling / unknown）を使う。随時受付は rolling

