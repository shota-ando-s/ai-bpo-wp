# 石川県 8町（川北町・津幡町・内灘町・志賀町・宝達志水町・中能登町・穴水町・能登町〔鳳珠郡〕）2026年度
# 確認日 2026-10-27。根拠は subsidy_b_areas.md
# 生成AI・AI導入・AI研修を名指しで補助する町独自の制度は、8町とも確認できなかった
# IT・デジタル化に使える町独自の制度
#   - 穴水町 小規模事業者応援事業補助金のデジタル機器導入（キャッシュレス決済・Wi-Fi整備など「事業のデジタル化を推進する機器の購入及び設置に要する初期費用」。維持・運用の費用は対象外＝月額利用料は対象外と読める）。2/3・上限50万円、最低額なし。町内で同一事業を5年以上営む小規模事業者で穴水町商工会の会員、商工会の支援で作った経営計画が要る。要綱の実施期間は令和7年4月1日〜令和12年3月31日（2025-04-01施行の改正）。受付期間の定めはなく、年度の3月31日までに支払まで完了する事業
# 国の補助金への上乗せ（addon）: 該当なし。穴水町の上の制度と中小企業等再構築補助金は「補助対象費用を重複して、他の公的な補助金…の交付を受けていないもの」が要件で、国の補助金と同じ経費には使えない。国のデジタル化・AI導入補助金・省力化投資補助金・ものづくり補助金に町が上乗せする制度は8町とも見つからない
# 町の上乗せは、能登半島地震・奥能登豪雨の県・国の支援制度（なりわい再建支援補助金・持続化補助金〔災害支援枠〕・営業再開支援補助金・チャレンジ支援補助金・起業促進補助金）に対するものだけ（能登町・穴水町・志賀町・津幡町・内灘町）。AI導入向けではないため yml に入れず、subsidy_b_areas.md の「能登半島地震・奥能登豪雨の支援制度（AI導入向けとは別）」の節に書いた。県のチャレンジ支援補助金（対象経費に「システム構築費」）への町の上乗せは能登町（自己負担の2/3・上限100万円、2027-03-31まで）と穴水町（自己負担の1/2・上限50万円）にあり、志賀町は見つからない
# 創業向けで、ホームページ作成・広告宣伝・備品が対象になる制度: 中能登町（3/4・上限300万円、HP等立ち上げ費・研修費も対象）、志賀町（HP作成費・インターネット環境等整備費も対象、上限300万円）、宝達志水町（HP作成費も対象、上限175万円）、能登町（備品・広告宣伝費、上限250万円）、内灘町（設備・器具・備品・広告宣伝費、上限50万円）、川北町（機械器具、上限50万円）。どれもパソコン・ソフトウェアが対象になるかは書かれていない（中能登町は汎用性が高い備品を除くと要綱に明記）
# 研修: 中能登町の創業支援補助金の開業費に「研修費」がある（創業者だけ）。既存の事業者の研修を補助する町独自の制度は8町とも見つからない
# 県の制度・県域の機関（ISICO など）・国の制度は別担当（subsidy_a）のため入れていない。融資・利子補給・信用保証料・企業立地／設備貸与の助成（志賀町・川北町の中小企業設備投資促進助成金はリース料の利子相当分）・雇用の奨励金・空き店舗・商店街・見本市出展・採用PR動画・スマート農業・中退共・地域資源の商品開発は YAML に入れていない（subsidy_b_areas.md の「IT向けではない制度」に記した）
# 期間の status は data/subsidies/README.md の値（open / closed / rolling / unknown）

