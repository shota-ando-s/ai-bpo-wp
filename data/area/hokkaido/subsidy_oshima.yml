# 渡島総合振興局の11市町村（函館市・北斗市・松前町・福島町・知内町・木古内町・七飯町・鹿部町・森町・八雲町・長万部町）と、渡島の公益財団法人函館地域産業振興財団（函館市・北斗市・七飯町）の AI・デジタル化・IT・研修・人材育成に使える独自の制度（2026年度）。2026-11-11 に各市町の公式ページ（商工担当の記事一覧・事業者向けの分類ページ）と財団のサイト・要綱・募集要項・チラシで確認（担当 oshima-A）
# 2026-11-11 時点で受付中（open）: 函館市 DX・生産性向上支援事業の専門家派遣（無料、〜2026-12-25）
# 随時（rolling）: 函館地域産業振興財団の技術者研修助成（2/3）・起業化コーディネート（専門家の招聘経費の一部）
# 今年度は終了（closed）: 函館市 DX・生産性向上補助金（1/2・上限1,000万円〔DX推進支援型は250万円〕、6/30。令和7年度までに専門家派遣を受けた企業だけ）、知内町 先進技術導入等による省力化・省エネ化・DX化支援事業（30%・上限100万円〔共同150万円〕、8/14）、八雲町 中小企業等設備導入支援事業（1/2・上限300万円、5/15）、函館地域産業振興財団 研究開発助成（2/3・上限300万円〔ソフトウェア業150万円〕、5/15）
# 国の補助金への上乗せ（addon）: ない。函館市 DX・生産性向上補助金は募集要項で「国・道・市などの他の補助金の交付対象となっている経費」が対象外、知内町の DX化支援事業は交付規則の別表で「国費・道費補助と併用不可」（パンフレットは「国又は北海道の補助対象となる場合は、その額を控除」と書き、食い違う。規則に従い exclusive_with）。八雲町の設備導入支援事業は「国及び北海道補助に該当する場合でも対象となる可能性があります」で、経費比の上乗せの形（remaining・cost_ratio）の記載がないため addon・addon_to は書いていない（note に記載）
