# 上川総合振興局の23市町村（旭川市・士別市・名寄市・富良野市・鷹栖町・東神楽町・当麻町・比布町・愛別町・上川町・東川町・美瑛町・上富良野町・中富良野町・南富良野町・占冠村・和寒町・剣淵町・下川町・美深町・音威子府村・中川町・幌加内町）と、一般財団法人旭川産業創造プラザ（旭川市。人材育成助成は道北地域〔上川・留萌・宗谷〕が対象）の AI・デジタル化・IT・研修・人材育成に使える独自の制度（2026年度）。2026-11-11 に各市町村の公式ページ（商工担当の記事・事業者向けの分類ページ・手引き・パンフレット）と旭川産業創造プラザのサイト・募集要領で確認（担当 kamikawa-A）
# 2026-11-11 時点で受付中（open）: 旭川産業創造プラザ 人材育成助成事業（1/2・10万円、道北地域、〜2026-12-29。募集要領の対象例に「AI、IOT、ロボティクス分野…の技能取得のための研修等」）
# 随時（rolling。予算に達し次第終了）: 富良野市 IT導入支援事業【パワーアップ補助金】（3/4・60万円、令和8年度限定）、富良野市 人材育成促進事業（団体のセミナー等 2/3・20万円）、下川町 中小企業振興事業の施設整備・機械設備等導入（デジタル技術の導入は1/2・上限1,000万円）、下川町 人材育成事業（資格取得・研修 1/2・50万円）
# 受付状況が分からない（unknown）: 名寄市 生産性向上・省力化補助金（「予算額に達した時点で交付申請の受付は終了」。補助率・上限はページに書かれていない）
# 今年度は終了（closed）: 旭川市（旭川産業創造プラザが事務局）デジタルツール導入支援補助金（3/4・上限200万円〔小規模枠60万円〕、3次募集 7/3〜8/3 で終了。AI ツール・SaaS の利用料・研修費・DX専門家の運用支援費が対象）
# 国の補助金への上乗せ（addon）: ない。旭川市のデジタルツール導入支援補助金は「同一の申請内容で他の機関（国、地方自治体、公益財団法人等）から補助金を受けておらず、かつ今後受ける予定もないこと」、富良野市 IT導入支援事業は「同事業で他の補助金を受けている（受ける予定である）経費」が対象外、プラザの人材育成助成は国等の補助を重複利用する事業が対象外（いずれも exclusive_with）。下川町はパンフレットの1/3の行に「（国・北海道の補助がない場合）」とあるが、上乗せの計算方法は書かれていない（addon にしていない。note に記載）
# 独自の AI・IT 向けの補助が見つからない: 士別市・鷹栖町・東神楽町・当麻町・比布町・愛別町・上川町・東川町・美瑛町・上富良野町・中富良野町・南富良野町・占冠村・和寒町・剣淵町・美深町・音威子府村・中川町・幌加内町（確かめたページは subsidy_kamikawa_areas.md）。旭川産業創造プラザの人材育成助成は23市町村すべてが対象
