  conditions: ニセコ町商工会の会員、商工会会員を主な構成とする団体など。商工会や金融機関のサポートを受けて実施することが要件。事前審査→申請→選考（予算の範囲内）。対象期間は令和6年度から3か年（申請・採択は毎年度）
