# 釧路総合振興局の8市町村（釧路市・釧路町・厚岸町・浜中町・標茶町・弟子屈町・鶴居村・白糠町）と根室振興局の5市町（根室市・別海町・中標津町・標津町・羅臼町）の AI・デジタル化・IT・研修・人材育成に使える独自の制度（2026年度）。2026-11-13 に各市町村の公式ページ（商工担当の記事・事業者向けの分類ページ・補助制度の一覧）と地域の支援機関（釧路工業技術センター・釧路地域DX推進協会）のサイトで確認（担当 kushiro_nemuro-A）
# 2026-11-13 時点で受付中（open）: なし
# 随時（rolling。予算がなくなり次第終了）: 弟子屈町 人材育成支援事業補助金（従業員の資格・免許の取得費用、1/2・1人年5万円）
# 受付状況がページに書かれていない（unknown）: 根室市 中小企業者等人材確保支援補助金（講師招へいの研修・採用ページつきのホームページ作成など、1/2・100万円）、根室市 中小企業等人材育成事業補助金（中小企業大学校旭川校の受講料、1人5万円まで）、根室市 中小企業者等資格取得費支援制度（国家資格・公的資格、1/2・10万円など）、別海町 中小企業担い手育成事業（人材育成事業）補助金（中小機構の研修の受講 1人7万円・開催 1回20万円）
# 今年度は終了（closed）: yml には入れていない（根室市 地域水産加工業生産基盤強化支援補助金〔生産機器、6/30 まで〕は AI・IT・研修の補助ではない。subsidy_kushiro_nemuro_areas.md）
# 国の補助金への上乗せ（addon）: なし。根室市の人材確保支援は「他の補助金の対象となる経費」を除く、別海町の担い手育成は「同一の研修に係る他の補助金の交付がある場合は、補助対象外」
