# 2026-11-13 時点で受付中（open）: 由仁町 商工業経営強化促進事業補助金（ICT化事業 1/2・200万円、〜2026-11-27 必着）、滝川市産業活性化協議会 産業創造支援事業補助金（事業拡大のシステム構築・登録利用費 1/2・30万円、〜2027-02-26）、栗山町 中小企業等資格取得支援事業補助金（1/2・1事業者10万円、〜2027-02-01）
# 随時（rolling。予算に達し次第終了）: 芦別市 企業振興事業補助金のデジタル技術導入診断支援事業（9/10・50万円、市内情報サービス業者の診断に限る）と人材育成事業（1/2・1人10万円）、砂川市 人材の育成事業（中小企業大学校旭川校の受講料の全額）と資格等取得支援事業（1/2・1資格5万円）、新十津川町 中小企業者応援制度（従業員の講習会の受講料等 1/2・1人15万円、生産性向上の設備 1/2・50万円。商工会の会員事業所）
# 受付状況が不明（unknown）: 美唄市 人材育成事業（中小企業大学校の研修の受講料1/2・1名10万円。同じページの他の事業は事前申請の受付停止中）
# 国の補助金への上乗せ（addon）: yml にはない。北竜町 商工業元気支援応援事業の経営力向上支援事業（国の小規模事業者持続化補助金を使った設備導入の自己負担の1/2・50万円）は上乗せの制度だが、持続化補助金が national.yml にないため入れていない（広尾町と同じ扱い。subsidy_sorachi_areas.md）。滝川市の産業創造支援事業補助金は「国、道又は滝川市等から補助金等の交付を受けていない事業であること」（exclusive_with）、由仁町は同じ経費に国・道の補助を受けるとその分を控除（併用不可とは書かれていない）
# 独自の AI・IT 向けの補助が見つからない: 夕張市・岩見沢市（立地の補助だけ）・赤平市・三笠市・深川市・歌志内市・南幌町・奈井江町・上砂川町・長沼町・月形町・浦臼町・妹背牛町・雨竜町・北竜町（上乗せを除く）・沼田町（メニューに人材育成はあるが額が書かれていない）。秩父別町はサイトが 503 で確かめられない。確かめたページは subsidy_sorachi_areas.md
