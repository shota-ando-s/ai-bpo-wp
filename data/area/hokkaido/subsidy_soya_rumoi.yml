# 2026-11-13 時点で受付中（open）: 旭川産業創造プラザ 人材育成助成事業（1/2・10万円、道北地域、〜2026-12-29。18市町村に写した）、稚内市 宿泊税システム整備費補助金（宿泊業のレジ・会計、10/10・50万円、〜2027-02-01）、礼文町 雇用機会拡充事業（事業費の3/4、〜2026-11-18）、利尻富士町 雇用機会拡充事業（事業費の3/4、2026-11-11〜12-11）
# 随時（rolling。予算がなくなり次第終了）: 稚内市 IoT等導入促進支援事業助成金（IoT・ロボット 2/3・30万円）、留萌市 地元企業応援上乗せ助成金（国等の補助の自己負担の1/2・300万円）、留萌市 補助金等取得サポート助成金（専門家の申請サポート 1/2・30万円）
# 受付状況がページに書かれていない（unknown）: 中頓別町 従業員のリスキリング教育に対する支援（受講費用の10割、1人5万円・年20万円）、留萌市 人材育成支援助成金（公的機関の研修 1/2・1人3万円、資格 1/2・1人2万円）、羽幌町 人材育成支援事業補助金（資格取得の講習 1/2・10万円）
