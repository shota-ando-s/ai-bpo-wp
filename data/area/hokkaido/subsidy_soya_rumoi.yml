  note: 【天塩町の企業向けに写した行（元は subsidy_kamikawa.yml の hokkaido-arc-jinzai-ikusei）】2026-11-13 にプラザのページを curl と WebFetch で開き直し、「募集期間 2026年7月13日（月）から2026年12月29日（火）まで ※予算がなくなり次第、終了となります」「道北地域（上川・留萌・宗谷）」「助成率 対象経費の1/2以内 助成限度額 10万円以内」と、募集終了・予算到達の告知がないことを確かめた（open）。プラザのページ（2026-07-14 掲載）「道北地域（上川・留萌・宗谷）における地域企業が行う派遣研修事業及び自主研修事業に対し、その経費の一部を助成します」「募集期間 2026年7月13日（月）から2026年12月29日（火）まで ※予算がなくなり次第、終了」「過去の実施例 …プログラミングの講師の招聘（自主研修）」。募集要領（https://www.arc-net.or.jp/data/jin/jin_72_boshuyoryo_2026.pdf 、2026年7月）p.2「期間内随時受付、随時審査」、p.3「【助成対象となる場合の例】AI、IOT、ロボティクス分野、又はそれらに係るものづくり・セキュリティ関連の技能取得のための研修等」「同一内容の事業で、国等が補助（国以外の機関が、国から受けた補助金等により実施する場合を含む）する他の制度（補助金、委託費等）を重複して利用する事業については対象外」（exclusive_with jinzai-reskilling）。問い合わせ 企業支援グループ 0166-73-9210、kigyoshien@arc-net.or.jp。対象は上川・留萌・宗谷の市町村（宗谷・留萌の18市町村も）。プラザの所在地は旭川市で、派遣研修・講師の招へいの経費が対象。研修の中身が「ものづくり技術に係わらない」と判断されると対象外になるため、生成AIの事務向け研修が当たるかは事前にプラザに確かめる
  fuenn_note: 上川・留萌・宗谷に事業所のある中小企業が、社員をAI・IoT・セキュリティなどの技術研修に派遣したり、講師を招いて社内研修をしたりする費用の1/2（最大10万円）を、旭川産業創造プラザが助成する制度です。2026年12月29日まで随時受け付けています（予算がなくなり次第終了、事業開始の1か月前までに申請）。国の助成金と同じ研修には使えません。
