    - {code: hokkaido/nanae, name: 七飯町, note: 亀田郡七飯町の事業者向けのページで確かめた範囲で、町独自のAI・IT導入の補助金は見つかりませんでした（2026-11-11確認）。町内の企業は、公益財団法人函館地域産業振興財団の技術者研修助成（2/3）などを随時使えます。七飯町商工会（0138-65-7111）にも相談できます}
    - {code: hokkaido/shikabe, name: 鹿部町, none: true, note: 茅部郡鹿部町の事業者向けのページで確かめた範囲で、町独自のAI・IT導入や研修の補助金は見つかりませんでした（2026-11-11確認）。町の水産経済課 商工労働係（01372-7-5298）か鹿部商工会（01372-7-3344）に確認してください}
