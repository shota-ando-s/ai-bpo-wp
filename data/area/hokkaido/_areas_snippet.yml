# areas.yml に足す北海道の行（段階1: 石狩振興局の8市町村。2026-11-06）。段階2以降で振興局ごとに cities を足す
# none: true は data/subsidies/hokkaido.yml にその市町村の制度が1件もない市町村（段階1: 江別市・石狩市・当別町・新篠津村、段階2の胆振: 豊浦町・壮瞥町・白老町・洞爺湖町）。千歳市・恵庭市は2026-11-11に道央産業振興財団の助成を写したので none を外した。市町村の公式サイトの事業者向け・商工業のページで確かめた（subsidy_a_areas.md）
# 恵庭市の「中小企業者等DX推進・労働環境改善支援事業補助金」は二次情報だけなので入れていない（note で触れない）
# 道の制度（副業・兼業人材、HSC の事業、賃上げ環境整備）は hokkaido の行で全地域に出るので、市町村の note には書いていない
# 取り違えの注意: 北広島市（kitahiroshima-city）は広島県北広島町と別。札幌市の制度は市内に本社（DX の2制度）か事業所（先端設備）が要件で、近隣の市町村の事業者は使えない
- code: hokkaido
  name: 北海道
  cities:
    - {code: hokkaido/sapporo, name: 札幌市, note: 札幌市デジタル化・AI導入促進補助金は、国のデジタル化・AI導入補助金を使う市内に本社がある中小企業等に、国の補助を引いた自己負担の1/2（上限225万円）を上乗せします。市の無料の伴走支援でDX推進計画を作ることが要件で、市への交付申請は2027年1月末までです（2026-11-05確認）。札幌市DX・賃上げ加速化補助金は予定の枠が埋まり受付を一時停止しています。北海道の制度とは別の市の制度です。窓口は市の経済観光局イノベーション推進課（011-211-2379）}
    - {code: hokkaido/ebetsu, name: 江別市, none: true, note: 江別市の企業立地課「補助金」と商工労働課「商工業支援」のページで確かめた範囲で、市独自のAI・IT導入や研修の補助金は見つかりませんでした（2026-11-05確認。市の制度は企業立地・商店街・特産品開発の支援です）。江別商工会議所か市の商工労働課に確認してください}
    - {code: hokkaido/chitose, name: 千歳市, note: 千歳市の「補助金等」のページで確かめた範囲で、市独自のAI・IT導入や研修の補助金は見つかりませんでした（2026-11-05確認）。市内に事業所がある中小企業は、公益財団法人道央産業振興財団（苫小牧市）の研修・専門家派遣の助成（10/10・上限10万〜15万円、随時）も使えます（2026-11-11確認）。千歳商工会議所に確認してください}
    - {code: hokkaido/eniwa, name: 恵庭市, note: 恵庭市の商工労働課の「商業・中小企業」「労働」のページで確かめた範囲で、市独自のAI・IT導入の補助金は見つかりませんでした（2026-11-05確認）。市内に事業所がある中小企業は、公益財団法人道央産業振興財団（苫小牧市）の研修・専門家派遣の助成（10/10・上限10万〜15万円、随時）も使えます（2026-11-11確認）。恵庭商工会議所か市の商工労働課に確認してください}
    - {code: hokkaido/kitahiroshima-city, name: 北広島市, note: 北海道北広島市（広島県の北広島町とは別）でシステムに使える市の制度は、宿泊事業者向けの北広島市宿泊税システム整備費補助金だけです。市の宿泊税の導入に合わせたレジ・会計システムの構築・改修の費用を10/10（1施設100万円まで）補助し、申請は2026-12-24までです（2026-11-06確認）。宿泊業以外の会社のAI・IT導入に使える市の補助金は見つかりませんでした。窓口は市の経済部観光振興課（011-372-3311〔代表〕）。北広島商工会にも相談できます}
    - {code: hokkaido/ishikari, name: 石狩市, none: true, note: 石狩市の「融資・助成・補助」のページで確かめた範囲で、市独自のAI・IT導入や研修の補助金は見つかりませんでした（2026-11-05確認。市の制度は融資・利子補助・空き家の活用です）。石狩商工会議所か石狩北商工会に確認してください}
    - {code: hokkaido/tobetsu, name: 当別町, none: true, note: 石狩郡当別町の商工の記事一覧で確かめた範囲で、町独自のAI・IT導入や研修の補助金は見つかりませんでした（2026-11-05確認。町の制度は空き店舗の活用・企業立地・融資です）。当別町商工会に確認してください}
    - {code: hokkaido/shinshinotsu, name: 新篠津村, none: true, note: 石狩郡新篠津村の「商工業」のページで確かめた範囲で、村独自のAI・IT導入や研修の補助金は見つかりませんでした（2026-11-05確認）。新篠津村商工会に確認してください}
    - {code: hokkaido/muroran, name: 室蘭市, note: 室蘭市のロボット・IoT導入促進補助金（AIを含む、3/4・50万円）は2026年度の公募（4/1〜5/22）を終えています。受付中の市の制度は、国・北海道の賃上げを要件とする補助金に採択されて賃上げした企業への中小企業等賃上げ対応資金助成金（従業員1人3万円・上限200万円、2026-12-28まで）です（2026-11-11確認）。事務局は公益財団法人室蘭テクノセンター（0143-45-1188）。室蘭商工会議所にも相談できます}
    - {code: hokkaido/tomakomai, name: 苫小牧市, note: 苫小牧市の技術開発・実証支援事業（3/4・200万円）は2026年度の募集を終えています。随時受け付けているのは、中小機構の研修の受講料を補助する中小企業人材育成補助金と、公益財団法人道央産業振興財団の研修・専門家派遣の助成（10/10・上限10万〜15万円）です（2026-11-11確認）。窓口は市の工業雇用政策課（0144-32-6432）、道央産業振興財団（0144-51-2770）、苫小牧商工会議所}
    - {code: hokkaido/noboribetsu, name: 登別市, note: 登別市デジタル化促進補助金は、ソフトウェア・クラウドサービス・ホームページ・POSレジなどの導入費を1/2（上限30万円）補助し、2027-01-29まで先着順で受け付けています（2026-11-11確認）。国・北海道などのほかの補助金を受ける事業は対象外なので、国のデジタル化・AI導入補助金と同じ事業には使えません。窓口は市の観光経済部 商工労政グループ、登別商工会議所（0143-85-4111）}
    - {code: hokkaido/date-city, name: 伊達市, note: 北海道伊達市（福島県伊達市とは別）の事業者向けのページで確かめた範囲で、市独自のAI・IT導入や研修の補助金は見つかりませんでした（2026-11-11確認。室蘭テクノセンターと連携するものづくり創出支援事業は受付を終えています）。伊達商工会議所（0142-23-2222）か室蘭テクノセンターに確認してください}
    - {code: hokkaido/toyoura, name: 豊浦町, none: true, note: 虻田郡豊浦町の事業者向けのページで確かめた範囲で、町独自のAI・IT導入や研修の補助金は見つかりませんでした（2026-11-11確認）。豊浦町商工会（0142-83-2221）に確認してください}
    - {code: hokkaido/sobetsu, name: 壮瞥町, none: true, note: 有珠郡壮瞥町の事業者向けのページで確かめた範囲で、町独自のAI・IT導入や研修の補助金は見つかりませんでした（2026-11-11確認）。町の商工観光課（0142-66-4200）か壮瞥町商工会（0142-66-2151）に確認してください}
    - {code: hokkaido/shiraoi, name: 白老町, none: true, note: 白老郡白老町の事業者向けのページで確かめた範囲で、町独自のAI・IT導入や研修の補助金は見つかりませんでした（2026-11-11確認）。白老町商工会（0144-82-2775）か町の産業経済課に確認してください}
    - {code: hokkaido/atsuma, name: 厚真町, note: 勇払郡厚真町のデジタル関連の町の補助は、ECサイトの開設・運用を補助する厚真町ECサイト運用支援事業補助金（2027-01-31まで）とキャッシュレスの支援で、AI・業務の効率化を名指しした補助は見つかりませんでした（2026-11-11確認）。窓口は町の産業経済課 経済グループ（0145-27-2486）、厚真町商工会（0145-27-2456）}
