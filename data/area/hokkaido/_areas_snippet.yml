    - {code: hokkaido/abira, name: 安平町, note: 勇払郡安平町独自のAI・IT導入の補助金は見つかりませんでした（2026-11-11確認）。町内に事業所がある中小企業は、公益財団法人道央産業振興財団（苫小牧市、0144-51-2770）の研修・専門家派遣の助成（10/10・上限10万〜15万円、随時）を使えます。安平町商工会（0145-22-2789）にも相談できます}
    - {code: hokkaido/mukawa, name: むかわ町, note: 勇払郡むかわ町の地域産業活性化支援事業（商工会の伴走つき、1/2・50万円）は2026-08-31で受付を終えています。AI・ITを名指しした町の補助金は見つかりませんでした（2026-11-11確認）。窓口は町の総合政策課 商工観光グループ（0145-42-2416）、むかわ町商工会（0145-42-2276）}
    - {code: hokkaido/hakodate, name: 函館市, note: 函館市のDX・生産性向上支援事業の補助金（ITツール向けのDX推進支援型は1/2・上限250万円）は2026年度の受付を6月30日で終えています。受付中なのは無料の専門家派遣（DX戦略の策定・生産性の診断助言、2026-12-25まで）で、この派遣を受けることが翌年度以降の市の補助金の要件です（2026-11-11確認）。公益財団法人函館地域産業振興財団の技術者研修助成なども随時受け付けています。窓口は市の経済部 工業振興課（0138-21-3316）、函館商工会議所}
    - {code: hokkaido/hokuto-city, name: 北斗市, note: 北海道北斗市（山梨県北杜市とは別）の事業者向けのページで確かめた範囲で、市独自のAI・IT導入の補助金は見つかりませんでした（2026-11-11確認）。市内の企業は、公益財団法人函館地域産業振興財団の技術者研修助成（2/3）などを随時使えます。窓口は市の経済部 水産商工労働課（0138-73-3111）、北斗市商工会（0138-73-2408）}
    - {code: hokkaido/matsumae, name: 松前町, none: true, note: 松前郡松前町の事業者向けのページで確かめた範囲で、町独自のAI・IT導入や研修の補助金は見つかりませんでした（2026-11-11確認）。松前商工会（0139-42-2339）に確認してください}
