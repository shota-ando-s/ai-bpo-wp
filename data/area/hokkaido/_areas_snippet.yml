# areas.yml に足す北海道の行（段階1: 石狩振興局の8市町村。2026-11-06）。段階2以降で振興局ごとに cities を足す
# none: true は data/subsidies/hokkaido.yml にその市町村の制度が1件もない市町村（段階1: 江別市・石狩市・当別町・新篠津村、段階2の胆振: 豊浦町・壮瞥町・白老町・洞爺湖町）。千歳市・恵庭市は2026-11-11に道央産業振興財団の助成を写したので none を外した。市町村の公式サイトの事業者向け・商工業のページで確かめた（subsidy_a_areas.md）
# 恵庭市の「中小企業者等DX推進・労働環境改善支援事業補助金」は二次情報だけなので入れていない（note で触れない）
# 道の制度（副業・兼業人材、HSC の事業、賃上げ環境整備）は hokkaido の行で全地域に出るので、市町村の note には書いていない
# 取り違えの注意: 北広島市（kitahiroshima-city）は広島県北広島町と別。札幌市の制度は市内に本社（DX の2制度）か事業所（先端設備）が要件で、近隣の市町村の事業者は使えない
- code: hokkaido
  name: 北海道
  cities:
    - {code: hokkaido/sapporo, name: 札幌市, note: 札幌市デジタル化・AI導入促進補助金は、国のデジタル化・AI導入補助金を使う市内に本社がある中小企業等に、国の補助を引いた自己負担の1/2（上限225万円）を上乗せします。市の無料の伴走支援でDX推進計画を作ることが要件で、市への交付申請は2027年1月末までです（2026-11-05確認）。札幌市DX・賃上げ加速化補助金は予定の枠が埋まり受付を一時停止しています。北海道の制度とは別の市の制度です。窓口は市の経済観光局イノベーション推進課（011-211-2379）}
    - {code: hokkaido/ebetsu, name: 江別市, none: true, note: 江別市の企業立地課「補助金」と商工労働課「商工業支援」のページで確かめた範囲で、市独自のAI・IT導入や研修の補助金は見つかりませんでした（2026-11-05確認。市の制度は企業立地・商店街・特産品開発の支援です）。江別商工会議所か市の商工労働課に確認してください}
