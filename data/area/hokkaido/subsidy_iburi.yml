# 胆振総合振興局の11市町村（室蘭市・苫小牧市・登別市・伊達市・豊浦町・壮瞥町・白老町・厚真町・洞爺湖町・安平町・むかわ町）と、胆振の公益財団法人（室蘭テクノセンター〔室蘭市・登別市・伊達市〕、道央産業振興財団〔苫小牧市・千歳市・恵庭市・安平町〕）の AI・デジタル化・IT・研修・人材育成に使える独自の制度（2026年度）。2026-11-11 に各市町村の公式ページ（商工担当の記事一覧・事業者向けの分類ページ）と両財団のサイト・要綱・案内 PDF で確認（担当 iburi-A）
# 2026-11-11 時点で受付中（open）: 登別市デジタル化促進補助金（1/2・30万円、〜2027-01-29）、室蘭市中小企業等賃上げ対応資金助成金（国・道の賃上げ要件の補助金に採択された企業に従業員1人3万円・上限200万円、〜2026-12-28）、厚真町ECサイト運用支援事業補助金（〜2027-01-31）
# 随時（rolling）: 道央産業振興財団の技術研修助成（受講料）・技術者等人材研修助成（10/10・10万円）・工場等社内研修助成（講師招聘 10/10・10万円）・専門家派遣助成（10/10・15万円）、苫小牧市中小企業人材育成補助金（中小機構の研修の受講料、1人1.5万〜2万円）、苫小牧市地域イノベコミュ支援事業（4/5・20万/50万円）
# 今年度は終了（closed）: 室蘭市ロボット・IoT導入促進補助金（AI を含む、3/4・50万円×2事業、5/22）、苫小牧技術開発・実証支援事業（3/4・200万円、8/7）、登別市中小企業生産性向上支援補助金（5/15）、ものづくり創出支援事業（室蘭テクノセンター。伊達市分 5/22、室蘭市の3次は見出しが「終了しました」）、道央産業振興財団の技術開発の芽育成助成（2次 7/8）、むかわ町地域産業活性化支援事業（8/31）
# 国の補助金への上乗せ（addon）: ない。室蘭市の賃上げ対応資金助成金は「国や道などの賃上げを伴う補助事業の採択を受け、賃上げを行う」企業に従業員数×3万円を出す制度で、経費に対する上乗せの形（remaining・cost_ratio）にならないため addon・addon_to は書いていない（note に記載）。登別市デジタル化促進補助金は「国、北海道又は市の他の補助金等の交付の決定を受けている事業」は対象外（conditions と exclusive_with に記載）
# 独自の AI・IT 向けの補助が見つからない: 豊浦町・壮瞥町・白老町・洞爺湖町・安平町（安平町は道央産業振興財団の対象）。厚真町はEC・キャッシュレスだけ（キャッシュレスは AI に当たらないので yml に入れず subsidy_iburi_areas.md に記載）。確かめたページは subsidy_iburi_areas.md
# 複数の市町が対象の制度（道央産業振興財団・室蘭テクノセンター）は area を本部のある市（苫小牧市・室蘭市）にし、対象の市町を conditions と note に書いた。診断で千歳市・恵庭市・安平町（道央）、登別市・伊達市（室蘭テクノ）にも出すなら、親が行を写すか areas.yml で扱う
