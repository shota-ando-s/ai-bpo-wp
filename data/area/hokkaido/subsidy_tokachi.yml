# 十勝総合振興局の19市町村（帯広市・音更町・士幌町・上士幌町・鹿追町・新得町・清水町・芽室町・中札内村・更別村・大樹町・広尾町・幕別町・池田町・豊頃町・本別町・足寄町・陸別町・浦幌町）と、公益財団法人とかち財団（帯広市。十勝の事業者が対象）の AI・デジタル化・IT・研修・人材育成に使える独自の制度（2026年度）。2026-11-12 に各市町村の公式ページ（商工担当の記事・事業者向けの分類ページ・要綱・手引き）ととかち財団のサイト・公募要領で確認（担当 tokachi-A）
# 2026-11-12 時点で受付中（open）: 音更町 中小企業者等新チャレンジ補助金（販路開拓等とあわせた業務効率化、1/2・30万円、〜2027-02-10）、公益財団法人北海道銀行中小企業人材育成基金 中小企業人材育成助成金（道全域、DX人材育成 20万円まで、〜2026-12-30。帯広市のページが紹介）
# 随時（rolling。予算に達し次第終了）: 音更町 宿泊施設DX化等支援事業補助金（宿泊業の予約・自動チェックイン・精算システム等、1/2・宿泊定員に応じ20万〜100万円）、池田町 産業活性化事業補助金の人材育成支援事業（業務に必要な新技術・知識・資格 1/2・1人5万円、講習会の開催 1/2・10万円）
# 今年度は終了（closed）: とかち財団 とかちビジネスチャレンジ補助金（アーリー3/4・300万円、グロース2/3・400万円、ファーストステップ10/10・100万円、町村版10/10・50万円。令和8年度は採択まで終了）
# 国の補助金への上乗せ（addon）: yml にはない。広尾町 小規模事業者持続化補助金（国の持続化補助金の自己負担分の1/2・上限50万円）は上乗せの制度だが、持続化補助金が national.yml にないため入れていない（福岡県の段と同じ扱い。subsidy_tokachi_areas.md）。音更町の新チャレンジは「他の補助事業の補助金と併用することはできない」、宿泊施設DX化は「国等が交付するほかの補助金等の交付対象となった経費」が対象外、道銀基金は記載なし
# 独自の AI・IT 向けの補助が見つからない: 帯広市・士幌町・上士幌町・鹿追町・新得町・清水町・芽室町・中札内村・更別村・大樹町・豊頃町・本別町・足寄町・陸別町、浦幌町（サイトが 503 で確かめられない）。確かめたページは subsidy_tokachi_areas.md
# とかち財団の制度は area を財団のある帯広市にし、対象（十勝管内。町村版は帯広市を除く十勝管内町村）を conditions と note に書いた。道銀基金は道全域なので area: hokkaido（親が hokkaido.yml にあるか照らす。段階1の subsidy_a.yml にはない）
# 期間の status は data/subsidies/README.md の値（open / closed / rolling / unknown）。closed には next_expected を書かない

