# 2026-11-13 時点で受付中（open）: なし
# 随時（rolling。予算に達し次第終了）: 北見市 地域産業競争力強化支援補助金（中小機構のハンズオン支援〔専門家派遣〕の費用 1/2・17万5,000円。デジタル化・生産性向上を例に挙げる）
# 受付状況がページに書かれていない（unknown）: 網走市 中小企業人材育成補助金（中小企業大学校旭川校の受講料、1人5万円まで）、紋別市 中小企業大学校派遣助成金（紋別商工会議所の会員、受講料の全額。2020年のページ）、斜里町 ビジネスサポートフォローアップ事業（IT関係導入・人材育成など、1/2〜2/3・50万円）、滝上町 後継者・担い手スキルアップ研修事業補助金（資格・技術取得、1/2・10万円）
# 今年度は終了（closed）: yml には入れていない（北見市 共同研究開発補助金〔6/12 まで〕・網走市 新製品創出支援〔第1次 6/30 まで〕・興部町 経営持続化応援〔6/30 まで〕・オホーツク財団 食に関するミニ補助事業〔4/17 まで〕はいずれも AI・IT・研修の補助ではない。subsidy_okhotsk_areas.md）
