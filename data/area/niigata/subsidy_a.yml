# 新潟県（県・公益財団法人にいがた産業創造機構〔NICO〕）と新潟市・長岡市・三条市・柏崎市・新発田市・上越市・燕市・見附市・村上市・南魚沼市（2026年度）。2026-10-24に公式ページ・申請要領・公募要領・交付要綱で確認
# 県のデジタル化向け補助金で今受付中なのは「ビジネス変革応援事業補助金」（産業労働部 地域産業振興課。事務局は株式会社JTB新潟支店内）。第2回の受付は2026-09-28〜10-29（必着、事務局へのメール到着順、予算額に達したら締切）。DX対応枠（2/3・33.3万〜100万円）と生産性向上枠（1/2・25万〜100万円）がAI・IT向け。申請前に商工会・商工会議所の確認が必須（締切の概ね10日前までに相談）。財源は国の物価高騰対応重点支援地方創生臨時交付金
# 県・NICOでAIを名指しした補助金は2つあるが、どちらも今年度の受付が終わっている。NICO「DX先端技術活用サービス等開発支援事業」（先端技術の例の一つ目が生成AI、1/2・上限200万円、二次募集2026-06-08〜06-19で終了。三次募集の掲載はない）と、県の「AI活用推進ラボ事業補助金」（申請者はAI開発者、1/2・300万〜1,000万円、二次公募2026-09-30締切）。ビジネス変革応援事業のQ&A ver2（p24）にはDX対応枠の例として「AI機能の追加による販売促進の強化」がある
# 市でAIを名指しした制度は2つ。燕市 スマートファクトリー加速化補助金（国の「デジタル化・AI導入補助金」「省力化投資補助金」の交付決定事業への上乗せ。一般型の対象設備の説明に「ICTやIoT、AI、ロボット、センサー等を活用」）と、新潟市 人材育成助成金（対象研修の例に「マナビDX…AI・デジタル基礎講座」）。新潟市の無料の業務効率化サポーター（専門家派遣）も「生成AI活用」を相談内容に挙げている
# 柏崎市・南魚沼市・村上市は市独自のAI・IT導入補助金なし（研修・販路の補助はある。subsidy_a_areas.md に確認したページ）
# 国の補助金への上乗せ（addon）: 燕市 スマートファクトリー加速化補助金だけ。（国補助金の補助対象経費−国補助金額）×（スマートファクトリー化に資する経費÷国補助金の補助対象経費）×1/2、上限200万円＝ remaining ratio 0.5 の形（申請要領 p2）。県のビジネス変革応援事業（申請要領 p5・p8）、新潟市 省力化・省エネ化補助金（交付要綱 第3条）、三条市 デジタル化推進補助金（手引き p1）、新発田市 市内産業DX推進補助金（交付要綱 第3条）は、国・県などの他の補助金を受ける事業・経費を対象外にしている
# 20件すべて confidence: official（ビジネス変革応援事業の第1回の期間だけは二次情報の補助金ポータルで見た値で、note に分けて書いた）
