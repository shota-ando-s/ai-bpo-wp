# 新潟県10市（小千谷・加茂・十日町・糸魚川・妙高・五泉・阿賀野・佐渡・魚沼・胎内）と10町村（聖籠・田上・阿賀・出雲崎・湯沢〔南魚沼郡〕・津南・弥彦・刈羽・関川・粟島浦）2026年度
# 確認日 2026-10-24。根拠は subsidy_b_areas.md
# AI を名指しする市町村独自の制度は2つ（どちらも研修の補助）
#   - 十日町市 デジタル人材育成支援事業補助金（研修要件に「IoT、AI、クラウド、ビッグデータ、RPA」。2/3・上限1万円）
#   - 阿賀野市 中小企業人材育成支援事業補助金（DXに資する研修の例に中小企業大学校の生成AI講座を列挙。1/2・1人2万円・年5万円、〜2027-03-31）
#   十日町市 デジタル技術導入支援事業補助金はチラシの活用例に「AI-OCRを導入し、手書き伝票をデータ化」とある（要領・ページにAIの語はない）
# デジタル化・DX・システム導入に使える市町村独自の制度
#   - 受付中・随時: 十日町市 デジタル技術導入支援（2/3・30万円）、妙高市 がんばる企業応援（IT利活用・ECサイト構築など10区分。1/2・30万円、〜2026-11-30）、魚沼市 働きやすい職場環境づくり推進のデジタル活用支援（1/2・10万円、予算残23.1万円＝2026-09-25時点）、刈羽村 生産性向上促進（ソフトウェア製品購入費を含む。2/3・100万円）
#   - 2026年度の受付終了: 糸魚川市 DX推進補助金（1/2・50万円。2026-07-01〜08-31）、加茂市 収益力向上支援（ソフトウェア・クラウド・システム導入。1/2・50万円、予算到達）、阿賀野市 地域ビジネス継続サポート（デジタル化対応設備。予算到達で2026-06-10受付終了）
# ホームページ・EC・キャッシュレスに使える制度: 小千谷市 EC活用支援（2026年度のみ3/4・20万円）、田上町 販路開拓支援（HP新規作成・リニューアル 1/2・20万円）、魚沼市 がんばる地元のお店支援（ウェブサイト構築費。〜2026-12-18）・企業魅力発信（HP。受付終了）、胎内市 キャッシュレス 3/4・5万円、出雲崎町 キャッシュレス（2025年度のページのまま）
# 国の補助金への上乗せ（addon）は書いていない。国のデジタル化・AI導入補助金・省力化投資補助金への上乗せを明記した制度は20市町村とも見つからなかった。十日町市の2制度は「他の公的な補助金の交付を受けている場合は、その金額を除いた額」を対象にする（併用時は（経費−国の補助額）×2/3 になる）が、上乗せの制度とは書かれていないため addon・addon_to は付けていない。刈羽村 生産性向上促進は国・県の補助を受ける事業を対象外にしている
# 受付期間の記載がなく「予算の範囲内」「予算額に達するまで」とある制度は period.status を rolling にした。ページが2025年度以前のままで2026年度の実施を判断できない制度は unknown にした
# 県・県域の機関（NICO など）・国の制度は subsidy_a 担当のため入れていない。融資・利子補給・保証料補給・企業立地・雇用奨励・省エネ設備・店舗改修・移住支援・個人向けの資格取得助成、団体向けの制度は YAML に入れていない（subsidy_b_areas.md の「IT向けではない制度」に記した）
# 相談窓口（十日町市 デジタル化・DXなんでも相談窓口、小千谷市 DXスキルアップセミナー・個別DX相談会）は補助金ではないため YAML に入れず、subsidy_b_areas.md に記した

