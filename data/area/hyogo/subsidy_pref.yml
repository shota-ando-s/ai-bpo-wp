# 兵庫県（県・公益財団法人 ひょうご産業活性化センター・県域の機関）の2026年度の中小企業向け補助金。2026-11-11に県のサイト（web.pref.hyogo.lg.jp）の「しごと・産業 > 経営 > 中小企業支援」「経営支援」の一覧、産業労働部 地域経済課・新産業課・地域産業立地課の組織のページ、土木部の「ひょうご建設業環境整備支援事業」、ひょうご産業活性化センターのサイト（web.hyogo-iic.ne.jp。www. は接続できず）の助成金の一覧で確認
# 県で今申請できる、IT・AIの導入費を補助する中小企業向けの補助金はない。今年度の柱だった「稼ぐ力の強化に向けた設備投資支援事業費補助金」（地域経済課。専用ソフトウェア・情報システムの購入・構築も対象、1/2〔小規模事業者は2/3〕・上限500万円・下限25万円、商工会・商工会議所の経営指導が要件）は第1期 2026-06-08〜07-07・第2期 09-01〜09-30 で受付を終えた
# 「ひょうご建設業環境整備支援事業」（土木部。県の入札参加資格のある建設業・測量設計業の中小企業のICT機器等、1/2・200万円〔ICT機器分は50万円〕）も第2弾 2026-10-16 で終了。ソフトウェアライセンス（サブスクリプション含む）は対象外
# 県域の無料・低額の支援（補助金ではない。yml に入れていない。subsidy_pref_areas.md・gov_ai.md）: ひょうご産業活性化センターの「ものづくり環境高度化等専門家派遣事業」（AI・IoT、無料、年3回まで、随時・20社で終了）、NIRO ものづくり支援センターの生産性向上・デジタル実装支援（無料）、兵庫県よろず支援拠点（無料）、県立工業技術センターの技術相談（無料）
# 国の補助金への上乗せ（addon）: 県・ひょうご産業活性化センターとも、国のデジタル化・AI導入補助金・省力化投資補助金・ものづくり補助金への上乗せは見つからない。稼ぐ力の2事業は公募要領で「国・都道府県・市区町村等が補助する他の制度…と重複する事業は、補助対象外」（併用できない）
# 市町の補助金は govsub_1〜4 の subsidy_1〜4.yml
# 期間の status は data/subsidies/README.md の値（open / closed / rolling / unknown）を使う

- id: hyogo-kaseguchikara-setsubi
  name: 令和8年度 稼ぐ力の強化に向けた設備投資支援事業費補助金
  org: 兵庫県（産業労働部 地域経済課。事務局は 稼ぐ力の強化に向けた設備投資支援事業費補助金事務局）
  area: hyogo
  max_yen: 5000000
  rate: 補助対象経費の1/2以内（小規模事業者は2/3以内）。上限500万円、下限25万円
  rate_num: 0.5
  rate_small_num: 0.667
  targets: {efficiency: ○, consulting: ×, training: ×}
  expenses: 収益力の向上につながると認められる設備等の導入。専ら補助事業のために使用し所有権が補助事業者に帰属する設備等の、機械装置等の購入・製作・改良、専用ソフトウェア・情報システム等の購入・構築、運搬・据付の経費。対象の機械装置等・専用ソフトウェア等は単価50万円（税抜）以上。設備の単なる更新、汎用的に使用可能な機械（自動車・電話機・スマートフォン・事務用プリンター・複合機等）、自社でのシステム構築、保守料・管理料は対象外。交付決定日以降に発生し事業期間中に支払いを終えた経費（第1期は2026-11-30まで、第2期は2027-01-31まで）
  conditions: 兵庫県内に本補助事業を実施する事業所を有する中小企業者等。商工会・商工会議所による経営指導を受け、本補助事業の実施が賃上げの促進につながると認められること（公募期限の1週間前までを目安に依頼）。県税の滞納がないこと。同一事業者の申請は1件まで、第1期の採択者は第2期に申請できない。国・都道府県・市区町村等の他の補助制度と重複する事業は対象外
  period: {status: closed, start: 2026-09-01, end: 2026-09-30}
  next_expected: 2027-06
  url: https://web.pref.hyogo.lg.jp/sr07/kaseguchikara.html
  checked: 2026-11-11
  confidence: official
  note: 県のページ（curl）で「第2期申請受付は、令和8年9月30日をもって終了しました。」「想定を上回る数のお申込みをいただいており」。公募期間は第1期 2026-06-08〜07-07、第2期 2026-09-01〜09-30（period は第2期）。公募要領 https://web.pref.hyogo.lg.jp/sr07/documents/kouboyouryou0819-2.pdf （PDF p.3「国等が補助する他の制度と重複する事業は補助対象とはなりません」、PDF p.11〔印刷 9〕対象経費・単価50万円以上、PDF p.12〔印刷 10〕対象外経費）。申請は事務局へ電子メール。補助金交付事務の委託の公募型プロポーザル（2026-05-01 記者発表 https://web.pref.hyogo.lg.jp/sr07/press/20260430-2.html 、委託費 79,880,786円以内）。AIの語はページ・要領の抜き出した範囲にない。next_expected は2026年度の第1期の時期からの推測（来年度の実施は未発表）。事務局 0120-850-271、地域経済課 078-362-3313
  fuenn_note: 兵庫県内の中小企業が、商工会・商工会議所の経営指導を受けて、収益力を高める機械や専用ソフトウェア・情報システムを入れる費用を1/2（小規模事業者は2/3）、最大500万円補助する県の制度でした。2026年度の申請は9月30日で終わりました。

- id: hyogo-kaseguchikara-kaikaku
  name: 令和8年度 稼ぐ力の強化に向けた経営構造改革支援事業費補助金
  org: 兵庫県（産業労働部 地域経済課。事務局は 稼ぐ力の強化に向けた経営構造改革支援事業費補助金事務局）
  area: hyogo
  max_yen: 1000000
  rate: 補助対象経費の1/2以内（小規模事業者は2/3以内）。上限100万円
  rate_num: 0.5
  rate_small_num: 0.667
  targets: {efficiency: ×, consulting: △, training: △}
  expenses: 将来を見据えた経営構造改革につながる取組（販路開拓・拠点設立・調達先開拓・新商品開発等）の、展示会出展費、外部専門家コンサルタント費・講師謝金、旅費・宿泊費、通訳費・翻訳費、技術習得費、原材料購入費（新商品開発分）、広告宣伝費など。汎用的に使用可能な機械等（パソコン・電話機・スマートフォン・事務用プリンター・複合機・一般事務用ソフトウェア等）、システム等の単なる更新は対象外
  conditions: 兵庫県内に本補助事業を実施する事業所を有する中小企業者等。商工会・商工会議所による経営指導が必要。国・都道府県・市区町村等の他の補助制度の交付決定を受けている事業と重複する経費は対象外
  period: {status: closed, start: 2026-09-02, end: 2026-09-30}
  url: https://web.pref.hyogo.lg.jp/sr07/kaseguchikarakaikaku.html
  checked: 2026-11-11
  confidence: official
  note: 県のページ（curl）で「申請受付は、令和8年9月30日をもって終了しました。」。公募要領 https://web.pref.hyogo.lg.jp/sr07/documents/keieikouzoukaikakukouboyouryou0901.pdf （PDF p.11〔印刷 9〕対象経費、PDF p.12〔印刷 10〕対象外経費）。事業実施期間は交付決定日〜2027-01-31、実績報告は2027-02-10まで。ITツール・AIの導入費は対象経費の費目にない（外部専門家コンサルタント費・技術習得費は経営構造改革の取組に必要なものに限る）。事務局 0120-202-083
  fuenn_note: 兵庫県内の中小企業が、商工会・商工会議所の経営指導を受けて販路開拓や新商品開発などの経営構造改革に取り組むとき、専門家への相談費や展示会出展費などを1/2（小規模事業者は2/3）、最大100万円補助する県の制度でした。2026年度の申請は9月30日で終わりました。

- id: hyogo-kensetsu-ict
  name: 令和8年度 ひょうご建設業環境整備支援事業（ICT機器等導入支援）
  org: 兵庫県（土木部 技術企画課 技術管理班〔インフラDX担当〕）
  area: hyogo
  max_yen: 2000000
  rate: 補助対象経費の1/2以内。ICT機器等導入支援は上限200万円（うちICT機器分は上限50万円）。別にスマートシフト支援（職場環境整備）1/2・上限50万円
  rate_num: 0.5
  targets: {efficiency: △, consulting: ×, training: ×}
  expenses: 建設業の生産性向上のための機器・建設機械等の導入経費。測量機器（地上型レーザースキャナー、自動追尾機能付き測量機器、ドローンなど）、建設機械（マシンガイダンス搭載ショベル、チルトローテータ、油圧ショベル等への装着システムなど）、ICT機器（ウェアラブルカメラ、定点カメラ、CCUS現場運用支援機器、電熱式防寒服など）。賃借又はソフトウェアライセンス（サブスクリプション含む）に要する経費、個人支給のものは対象外。交付決定前の契約・購入・着手は対象外
  conditions: 兵庫県の建設工事及び測量・建設コンサルタント等業務の入札参加資格者で、兵庫県内に主たる営業所を有する中小企業（中小企業基本法第2条第1項）。先着順、予算額（ICT機器等導入支援の支援総額2億5千万円）を超えた時点で受付終了
  period: {status: closed, start: 2026-09-01, end: 2026-10-16}
  url: https://web.pref.hyogo.lg.jp/ks04/hyogo_const_support.html
  checked: 2026-11-11
  confidence: official
  note: 県のページ（curl）で「第2弾について、10月16日24時で申請受付期間を終了しました。（令和8年10月17日）」。第1弾は2026-07-01 9時開始・申請多数で同日15時に受付停止。補助金交付要綱及び別表 https://web.pref.hyogo.lg.jp/ks04/documents/0-1_const_supoort_youkou2026.pdf の別表で補助率「1/2以内」、上限200万円・うちICT機器分50万円。国の重点支援地方交付金を活用。実績報告は事業完了後30日以内又は2027-01-29のいずれか早い日。ソフトウェアライセンスが対象外なので、AIの業務効率化ツールの導入には使えない（記事ではAI向けとして書かない）。問い合わせ 078-362-9282
  fuenn_note: 兵庫県の入札参加資格を持つ県内の中小建設業・測量設計業者が、ドローンや3Dスキャナー、ICT建機などを入れる費用を1/2、最大200万円補助する県の制度でした。2026年度の受付は10月16日で終わりました。ソフトウェアのライセンス料は対象外です。
