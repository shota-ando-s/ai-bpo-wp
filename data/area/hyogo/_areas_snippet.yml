# 案（D34、2026-11-11 のデータ）。data/subsidies/areas.yml の末尾に足す兵庫県の部分。親が最後に areas.yml に入れる（data/subsidies/hyogo.yml〔案は data/area/hyogo/_subsidies_hyogo.yml〕と同じコミット。areas.yml は直接編集していない）
# none: true は _subsidies_hyogo.yml にその市町の制度が1件もない24市町（芦屋市・伊丹市・宝塚市・三田市・猪名川町・加古川市・稲美町・播磨町・小野市・加東市・多可町・市川町・相生市・赤穂市・たつの市・太子町・上郡町・佐用町・朝来市・新温泉町・丹波篠山市・洲本市・南あわじ市・淡路市）。どれも市町の公式サイトの事業者向けの補助金・支援の一覧で確かめて見つからなかった（subsidy_1〜4_areas.md）。多可町だけはサイトが開けず（curl の証明書エラー・WebFetch 503）、note に「町に確かめて」を入れた
# 尼崎市・明石市・西脇市・宍粟市・豊岡市は今年度の受付を終えた制度しかないが、yml に制度があるので none にせず、note の一文目で状況を書いた（奈良県桜井市・茨城県水戸市と同じ）
# 並びは県の10の県民局・県民センターの所管地域の順（stats.md の kenmin。県の統計の「地域」と同じ10区分）: 神戸（1）→ 阪神南（3）→ 阪神北（5）→ 東播磨（5）→ 北播磨（6）→ 中播磨（4）→ 西播磨（7）→ 但馬（5）→ 丹波（2）→ 淡路（3）。区分の中は市→町（自治体コード順）。判断 D4-9
# none の callout は「AI・IT導入向けの独自の補助金が見つかりませんでした」と出るので、none の note は確かめたページ・相談先（商工会議所・商工会は gov_ai.md の名簿）・無料と資料にある窓口・取り違えの注意を書く
# 「無料」と書いたのは資料に無料とあるものだけ: 兵庫県よろず支援拠点（「何度でも無料の経営相談所」。本部は神戸市産業振興センター、サテライトのある市の note にだけ書いた）、西宮商工会議所の専門家派遣（「AI活用のプロを無料で派遣。」）、三木市中小企業サポートセンター（「相談料 無料」）、豊岡市 IPPO TOYOOKA（「無料」）、丹波篠山市のよろず支援拠点サテライト相談会（市のページ「料金 無料」）
# 取り違えの注意: 芦屋市（福岡県芦屋町と別）・豊岡市（長野県豊丘村と別）・三木市（香川県三木町と別）・川西市（山形県・奈良県の川西町と別）・小野市（福井県大野市と別）・たつの市（長野県辰野町と別）・稲美町（和歌山県印南町と別）・香美町（高知県香美市・宮城県加美町と別）・太子町（大阪府太子町と別）・丹波市と丹波篠山市・淡路市と淡路島を note に入れた
