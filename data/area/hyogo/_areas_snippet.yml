    - {code: hyogo/shiso, name: 宍粟市, note: 宍粟市の収益力向上支援事業（DX推進のためのソフトウェア・システム導入や業務改善の調査・設計の費用 2/3、上限100万円）は、2026年度は第1期・第2期とも受付を終えました（2026-11-11確認）。窓口は市の商工観光課 商工係（0790-63-3127）。宍粟市商工会（0790-62-2365）にも相談できます。市内の宍粟防災センターでは兵庫県よろず支援拠点のサテライト相談（無料）が開かれます}
    - {code: hyogo/taishi, name: 太子町, none: true, note: 兵庫県揖保郡太子町の「商工・農林業」のページで確かめた範囲で、町独自のAI・IT導入や研修の補助金は見つかりませんでした（2026-11-11確認。創業者融資の保証料補助など）。太子町商工会（079-277-2566）に相談できます。大阪府南河内郡の太子町とは別の町です}
    - {code: hyogo/kamigori, name: 上郡町, none: true, note: 兵庫県赤穂郡上郡町の「産業振興」と「補助金・助成金」のページで確かめた範囲で、町独自のAI・IT導入や研修の補助金は見つかりませんでした（2026-11-11確認）。上郡町商工会（0791-52-3710）に相談できます}
    - {code: hyogo/sayo, name: 佐用町, none: true, note: 兵庫県佐用郡佐用町の「商工業」のページで確かめた範囲で、町独自のAI・IT導入や研修の補助金は見つかりませんでした（2026-11-11確認。融資の利子補給など）。窓口は町の商工観光課 商工振興室（0790-82-0670）。佐用町商工会（0790-82-2218）にも相談できます}
    - {code: hyogo/toyooka-city, name: 豊岡市, note: 豊岡市の成長投資促進補助金（600万円以上の設備・システム投資 1/2、300万〜500万円）と経営革新支援補助金（省力化・クラウド利用料・専門家経費も対象、1/2・50万〜150万円）は、2026年度の公募をどちらも春に終えました（2026-11-11確認）。市のビジネス総合相談窓口 IPPO TOYOOKA でIT活用の相談が無料でできます（要予約、環境経済課 0796-23-4480）。豊岡商工会議所・豊岡市商工会にも相談できます。長野県の豊丘村とは別の市です}
    - {code: hyogo/yabu, name: 養父市, note: 養父市の訪日インバウンド受入環境整備促進補助金は、市内の店舗・宿泊施設などが翻訳機能のある音声機器やキャッシュレス決済の端末、外国語の案内を整える費用を1/2（上限50万円）補助します（随時、予算がなくなり次第終了。2026-11-11確認）。AIツールの月額利用料は対象外で、AI・IT導入の費用を補助する市の制度は見つかりませんでした。窓口は市の商工観光課（079-664-0285）。養父市商工会（079-662-7127）にも相談できます}
    - {code: hyogo/asago, name: 朝来市, none: true, note: 朝来市の「起業・経営・中小企業支援」「商工業」のページで確かめた範囲で、市独自のAI・IT導入や研修の補助金は見つかりませんでした（2026-11-11確認。人材確保支援補助金は求人掲載の費用です）。窓口は市の経済振興課（079-672-2816）。朝来市商工会（079-672-2362）にも相談できます}
    - {code: hyogo/kami-town-hyogo, name: 香美町, note: 香美町の人材育成・職場環境改善支援事業は、町内に本店がある事業者が講師を招いて社員研修を開く費用を1/2（1事業10万円まで）、社員を外部の研修・資格取得・通信講座に出す費用を1/2（1人2万円まで）補助します（1事業者 年度20万円まで、研修の10日前までに申請。2026-11-11確認）。AIの研修に使えるかは町の観光商工課（0796-36-3355）に確かめてください。香美町商工会（0796-36-0123）にも相談できます。高知県の香美市・宮城県の加美町とは別の町です}
    - {code: hyogo/shinonsen, name: 新温泉町, none: true, note: 兵庫県美方郡新温泉町の「産業振興・雇用確保」のページで確かめた範囲で、町独自のAI・IT導入や研修の補助金は見つかりませんでした（2026-11-11確認。働きやすい職場づくりの施設整備・新商品開発の補助など）。窓口は町の商工観光課（0796-82-5625）。新温泉町商工会（0796-82-1152）にも相談できます}
    - {code: hyogo/tambasasayama, name: 丹波篠山市, none: true, note: 丹波篠山市の「事業者の方へ」と商工観光課の補助金のページで確かめた範囲で、市独自のAI・IT導入や研修の補助金は見つかりませんでした（2026-11-11確認）。丹波篠山市民センターで毎月第2木曜に兵庫県よろず支援拠点のサテライト相談会（無料・要予約、078-977-9085）があります。丹波篠山市商工会（079-554-1678）にも相談できます。丹波市とは別の市です}
    - {code: hyogo/tamba, name: 丹波市, note: 丹波市の設備投資支援事業補助金は、市内で1年以上事業を営む中小企業が1台（1本）税抜30万円以上の業務用ソフトウェアや機械を新しく入れる費用の10%（市内の業者に発注すると20%）を、上限30万〜70万円補助します（2027-02-26まで、予算に達し次第終了。発注・契約の前に申請。2026-11-11確認）。国・県の補助と同じ事業には使えません。窓口は市の商工観光課 商工係（0795-74-1464）。丹波市商工会（0795-82-3476）・BIZステーションたんば（0795-86-7888）にも相談できます。丹波篠山市とは別の市です}
    - {code: hyogo/sumoto, name: 洲本市, none: true, note: 洲本市の「起業・経営支援」「商工業」のページで確かめた範囲で、市内の中小企業のAI・IT導入や研修の補助金は見つかりませんでした（2026-11-11確認。IT関連事業振興補助制度はITの事業所を市内に開く事業者向けです）。窓口は市の商工観光課 商工労政係（0799-24-7613）。洲本商工会議所（0799-22-2571）・五色町商工会（0799-33-0450）にも相談できます。市内の淡路県民局では兵庫県よろず支援拠点のサテライト相談（無料）が開かれます}
    - {code: hyogo/minamiawaji, name: 南あわじ市, none: true, note: 南あわじ市の「補助・助成」と商工観光課のページで確かめた範囲で、市内の中小企業のAI・IT導入や研修の補助金は見つかりませんでした（2026-11-11確認。イノベーション拠点開設支援事業補助金はITの事業所を市内に開く事業者向けです）。窓口は市の商工観光課（0799-43-5221）。南あわじ市商工会（0799-42-4721）にも相談できます}
    - {code: hyogo/awaji, name: 淡路市, none: true, note: 淡路市の「融資・助成」と商工観光課のページで確かめた範囲で、市独自のAI・IT導入や研修の補助金は見つかりませんでした（2026-11-11確認。事業承継支援事業補助金は事業承継のときの制度です）。淡路市ビジネスサポートセンター（淡路市商工会内）で経営の相談ができます。窓口は市の商工観光課（0799-64-2542）。淡路市商工会（0799-62-3066）にも相談できます。淡路島全体ではなく島の北部の市です}
