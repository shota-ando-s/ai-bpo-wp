# 兵庫県 中播磨・西播磨の11市町（姫路市・市川町・福崎町・神河町・相生市・赤穂市・たつの市・宍粟市・太子町・上郡町・佐用町）の AI・IT・DX・研修・省力化・生産性向上に使える市町独自の補助金（2026年度）。2026-11-11に11市町の公式サイトの事業者向けの分類ページ・補助金のページ・要綱を開いて確認（すべて curl で原文）
# 受付状況は 2026-11-11 時点。期間の status は data/subsidies/README.md の値（open / closed / rolling / unknown）を使う
# AI を名指しした市町独自の補助金は姫路市の産業デジタル化活用促進補助金だけ（受付終了）。DX・システム導入も対象の宍粟市 収益力向上支援事業も終了。2026-11-11 に申請できるのは研修の補助（姫路市・福崎町）と神河町の事業継続支援（業務効率化も対象）
# 国の補助金への上乗せ（addon）は11市町にない（姫路市・宍粟市・神河町は国・県の補助金と同じ事業・経費に使えない）
# 県と合わせて新規の事業所の開設を支援する「イノベーション拠点開設支援」（姫路市・たつの市・宍粟市。備品・ソフトウェア取得費も対象）は既存の中小企業の IT 導入向けではないので入れていない（subsidy_3_areas.md）
# 市町ごとの確認したページ・制度がない市町は subsidy_3_areas.md

