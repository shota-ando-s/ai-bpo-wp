  fuenn_note: 豊岡市内の中小企業が、商工会議所・商工会の計画認定を受けて省力化や新サービス開発に取り組む費用（クラウド利用料・専門家経費を含む）を1/2（50万〜150万円）補助する市の制度です。2026年度の公募は6月3日で終わりました。
