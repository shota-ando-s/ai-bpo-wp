# 兵庫県 但馬・丹波・淡路の10市町（豊岡市・養父市・朝来市・香美町・新温泉町・丹波篠山市・丹波市・洲本市・南あわじ市・淡路市）の AI・IT・DX・研修・省力化・生産性向上に使える市町独自の補助金（2026年度）。2026-11-11に10市町の公式サイトの事業者向けの分類ページ・補助金のページ・商工担当課の記事一覧を開いて確認（curl で原文）
# 受付状況は 2026-11-11 時点。期間の status は data/subsidies/README.md の値（open / closed / rolling / unknown）を使う
# DX・AI を名指しした市町独自の補助金は10市町とも見つからない。ソフトウェア・クラウド・研修に使える一般の制度を5件入れた（受付中・随時3件: 丹波市 設備投資支援〔ソフトウエアの新規導入〕・香美町 人材育成・職場環境改善〔研修〕・養父市 訪日インバウンド受入環境整備〔翻訳機器・キャッシュレス〕、受付終了2件: 豊岡市 成長投資促進・経営革新支援）
# 国の補助金への上乗せ（addon）は10市町とも見つからない。丹波市・豊岡市は国・県の補助金と同じ事業・経費には使えない（exclusive_with）
# IT 企業の事業所開設（企業誘致）の制度（洲本市 IT関連事業振興補助制度・南あわじ市 イノベーション拠点開設支援事業補助金）は、市内の中小企業の AI 導入に使えないので入れていない（subsidy_4_areas.md）
# 市町ごとの確認したページ・制度がない市町は subsidy_4_areas.md

