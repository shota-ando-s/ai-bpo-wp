  note: 町のページ（最終更新日2026-03-26）。受付期間の記載はない（交付要綱〔令和4年4月1日施行〕 https://www.town.okuizumo.shimane.jp/www/contents/1707460117885/simple/%E4%BA%A4%E4%BB%98%E8%A6%81%E7%B6%B1.pdf は「予算の範囲内」）。対象が販売業務の効率化に限られ、AI・クラウド利用料の扱いは書かれていない。同じ補助金の販路拡大支援事業（1/2・20万円）、新事業展開支援事業（1/2・30万円）と合わせて「この告示による補助金の交付を受けていない者」が対象で、実質1者1回。町の商工事業者向け補助金の一覧 https://www.town.okuizumo.shimane.jp/jigyosha/kigyoshien/1624348257755.html 。問い合わせは商工観光課 0854-54-2524、まず奥出雲町商工会に相談
