# 島根県の10町1村（奥出雲町・飯南町・川本町・美郷町〔邑智郡〕・邑南町・津和野町・吉賀町・海士町・西ノ島町・隠岐の島町・知夫村）の AI・IT・DX・研修向けの補助金（2026年度）。2026-10-31に町村の公式サイト（事業者向け・商工の補助金のページ、要綱）で確認
# 11町村とも、AI・生成AI を名指しした町村独自の補助金はない
# IT に使える町独自の制度は、奥出雲町 地域商業重点支援事業費補助金の「販売業務効率化IT推進支援事業」（IT 導入による販売業務効率化の機器導入費・システム構築費、1/2・上限20万円・下限2.5万円、奥出雲町商工会経由で申請、同補助金は1者1回）だけ。専門家の指導・助言の費用は飯南町 経営改善等支援事業費補助金（経営支援、新分野進出アドバイザー等派遣事業、10/10・15万円、年1回・3年まで）
# 研修に使える町独自の制度で内容まで確かめられたものはない。津和野町の「個別商業包括的支援事業補助金」（町の一覧で対象経費に「人材育成等に要する経費」）と「IT系企業誘致促進補助金」の人材育成補助金（町内に新たに IT 系事業所を開設した企業、1/2・年10万円）は、要綱（g-reiki.net）が404で中身を確かめられず、yml に入れていない（subsidy_b_areas.md）
# 隠岐の4町村（海士町・西ノ島町・隠岐の島町・知夫村）の雇用機会拡充事業補助金（有人国境離島法、国1/2・地方1/4・事業者1/4）は雇用増を伴う創業・事業拡大の資金で、AI・IT 導入向けではないので入れていない。海士町の令和9年度分は本申請が2026-10-23で終了
# 国の補助金への上乗せ（addon）: 該当なし
# 期間の status は data/subsidies/README.md の値（open / closed / rolling / unknown）を使う。受付期間の明記がなく予算の範囲内で受け付けるものは rolling、ページが古く今年度の実施が確かめられないものは unknown

